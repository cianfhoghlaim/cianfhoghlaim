# MotherDuck Flights — BIEP v1 + future flights registry
#
# Cron schedule + flight definitions for the MotherDuck Flights
# running on the oideachais MotherDuck database.
#
# Each flight is a Python module (under `flights/<flight_name>.py`)
# that implements a `main()` function returning 0 on success.
#
# Reference: openspec/changes/2026-07-06-british-isles-education-pipeline-v1/
# openspec/specs/british-isles-education-pipeline/spec.md

# ============================================================================
# Top-level config
# ============================================================================

motherduck_database: md:oideachais
default_secrets_source: infisical://dev-baile/motherduck
compute:
  region: eu-west-1
  size: small  # S = 1 Duckling, 4 GB RAM
log_level: info


# ============================================================================
# Flights (scheduled Python jobs on MotherDuck compute)
# ============================================================================

flights:

  # --------------------------------------------------------------------------
  # lc_pdf_sync_flight — the BIEP v1 daily Flight.
  #
  # Runs at 04:00 UTC every day. Re-embeds the 6 LC subject
  # CocoIndex Apps + the gov.ie circulars App, then materialises
  # the 42 lc5/lc6 Dagster assets, then writes a status row to
  # `md:oideachais.lc_ops.daily_sync_status`.
  # --------------------------------------------------------------------------
  - name: lc_pdf_sync_flight
    description: |
      BIEP v1 daily sync — re-embeds the 7 v1 CocoIndex Apps
      (6 LC subjects + gov.ie circulars) + materialises the
      42 lc5/lc6 Dagster assets + writes a status row to
      `oideachais.lc_ops.daily_sync_status`.
    module: flights.lc_pdf_sync_flight
    schedule:
      cron: "0 4 * * *"
      timezone: UTC
    timeout_seconds: 3600  # 1 hour ceiling
    retry_policy:
      max_retries: 2
      backoff:
        type: exponential
        delay_seconds: 300
        multiplier: 2
    alerts:
      on_failure: true
      notify:
        - n8n.cianfhoghlaim.ie/webhook/flight-failure
        - langfuse.cianfhoghlaim.ie/trace/flight-status
    tags:
      - biep
      - lc6
      - daily
      - sync
    metadata:
      openspec_change: 2026-07-06-british-isles-education-pipeline-v1
      spec: british-isles-education-pipeline
      openspec_archetype: scheduled-batch
      kcg_pattern: motherduck-flight-v1

  # --------------------------------------------------------------------------
  # Future flight placeholder (v2; per BIEP v1 scope, cross-nation
  # extension is deferred to v2).
  # --------------------------------------------------------------------------
  - name: lc_gov_circulars_hourly_flight
    description: |
      Hourly gov.ie circulars ingester (deferred to v2).
      Scrapes gov.ie/en/circulars + gov.ie/ga/ciorcláin, routes
      through `b.ExtractCircular`, writes to
      `md:oideachais.government.circulars`.
    module: flights.gov_circulars_hourly
    schedule:
      cron: "0 * * * *"
      timezone: UTC
    enabled: false  # v1 leaves this disabled
    timeout_seconds: 600
    retry_policy:
      max_retries: 3
      backoff:
        type: exponential
        delay_seconds: 60
        multiplier: 2
    tags:
      - biep
      - gov-circulars
      - hourly
    metadata:
      openspec_change: 2026-07-06-british-isles-education-pipeline-v1
      spec: british-isles-education-pipeline
      status: deferred-to-v2


# ============================================================================
# Per-flight environment (overrides for MotherDuck compute)
# ============================================================================

environments:
  production:
    motherduck_database: md:oideachais
    compute:
      region: eu-west-1
      size: small
  staging:
    motherduck_database: md:oideachais_staging
    compute:
      region: eu-west-1
      size: nano
