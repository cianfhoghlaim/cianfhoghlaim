# bonneagar/komodo/schedules/secrets-env-refresh-15min.toml
#
# Komodo schedule that triggers the `secrets_env_refresh_job` Dagster job
# every 15 minutes. Re-hydrates the local .env from OCI Infisical, bounding
# the drift window to ~15 min (per the env-var fallback pattern introduced
# by the 2026-08-21-pangolin-infisical-komodo-core-24-7-redeploy-v1 change).
#
# Spec: openspec/changes/2026-08-21-pangolin-infisical-komodo-core-24-7-redeploy-v1/
# =============================================================================

[schedule]
name = "secrets-env-refresh-15min"
description = "Re-hydrate the local .env from OCI Infisical every 15 min. Bounds the drift window between OCI (source-of-truth) and the local .env mirror (used by Locket as LOCKET_FALLBACK_FILE)."
cron = "*/15 * * * *"
timezone = "UTC"
enabled = true

# The Komodo procedure to execute. This is the canonical hook to trigger
# the Dagster asset materialization via the bons-iac procedure bridge.
procedure = "bons-iac/secrets-env-refresh"

# Audit metadata
tags = ["secrets", "iac", "host:bunchloch", "tier:core-24-7"]
owner = "bons-iac@cianfhoghlaim.ie"

# Webhook for Komodo notifications (the operator receives a Komodo UI alert
# on every successful run + on every failure)
[notification]
on_success = ["komodo-ui-banner"]
on_failure = ["komodo-ui-banner", "email:bons-iac@cianfhoghlaim.ie"]
webhook_url = ""  # the bons-iac bridge handles the bridge to Dagster directly

# Audit: the schedule writes to /tmp/komodo-schedule-secrets-env-refresh-{ts}.json
# on every run, capturing the job_id + the .env SHA returned by Dagster.
[audit]
log_path = "/tmp/komodo-schedule-secrets-env-refresh.json"
retention_days = 30
