# =============================================================================
# TINYAUTH-BUNCHLOCH - Hand-curated komodo stack
# =============================================================================
# Hand-curated komodo stack for the Tinyauth ForwardAuth middleware on
# bunchloch. The auto-generated `tinyauth-bunchloch.toml` (in this
# directory) covers the 6-file GOLD_STANDARD contract; this file adds
# the Komodo-specific runtime config.
#
# This stack FIXES the persistent tinyauth crash loop (the entrypoint
# sources /run/secrets/locket/secrets.env on startup; without Locket
# that file is empty → crash loop). The 6-file GOLD_STANDARD stack at
# `bonneagar/stacks/tinyauth/` includes the Locket sidecar.
#
# Generated by scripts/generate-komodo-stacks.ts on 2026-07-14.
# Spec: openspec/changes/2026-07-14-tightly-knit-auth-stack-v1
# =============================================================================

[[stack]]
name = "tinyauth-bunchloch"
description = "Tinyauth v4 ForwardAuth middleware on bunchloch — the 6th cross-cutting prerequisite (after Pocket ID, before newt)"
tags = [
  "host:bunchloch",
  "tier:application",
  "type:forward-auth",
  "type:auth",
]

[stack.config]
server_id = "bunchloch"
run_directory = "/etc/komodo/tinyauth"
file_paths = [
  "bonneagar/stacks/tinyauth/compose.yaml",
  "bonneagar/stacks/tinyauth/sidecar.yaml",
  "bonneagar/stacks/tinyauth/secrets.env",
  "bonneagar/stacks/tinyauth/pangolin.yaml",
  "bonneagar/stacks/tinyauth/blueprint.yaml",
]

[stack.config.environment]
APP_URL = "https://tinyauth.cianfhoghlaim.ie"
SECURE_COOKIE = "true"
INFISICAL_URL = "https://infisical.cianfhoghlaim.ie"
INFISICAL_PROJECT_ID = "f3cff583-b74b-4804-b9d3-db8b68885236"
INFISICAL_ENVIRONMENT = "dev"
POCKETID_AUTH_URL = "https://auth.cianfhoghlaim.ie/authorize"
POCKETID_TOKEN_URL = "https://auth.cianfhoghlaim.ie/api/oidc/token"
POCKETID_USER_INFO_URL = "https://auth.cianfhoghlaim.ie/api/oidc/userinfo"

# Stack stats: limit CPU + memory
[stack.stats]
cpu_usage = 0.25
memory_usage = 128
