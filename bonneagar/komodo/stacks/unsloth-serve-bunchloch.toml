# Komodo stack registration: unsloth-serve (bunchloch / Apple Silicon M4 Max)
# Per the 2026-08-21-unsloth-v5-integration-v1 change (corrected in the
# 2026-08-21 hotfix commit): bunchloch is the M4 Max GPU host.
# The base compose.yaml is shared; the override file `compose.m4-max.yaml`
# flips image + ngl + memory limits + MLX/Metal platform marker.
[[stack]]
name = "unsloth-serve"
server_id = "bunchloch"
run_directory = "/etc/komodo/sruth/bonneagar/stacks/unsloth-serve"
file_paths = [
  "compose.yaml",
  "compose.m4-max.yaml",
  "sidecar.yaml",
  "pangolin.yaml",
  "blueprint.yaml",
]
tags = ["host:bunchloch", "tier:agent-platform", "type:inference-server", "domain:unsloth.cianfhoghlaim.ie", "stack:unsloth-serve", "gpu:apple-silicon"]

[stack.environment]
LOCKET_MODE = "watch"
INFISICAL_CLIENT_ID = "${INFISICAL_CLIENT_ID}"
INFISICAL_SECRET_FILE = "${INFISICAL_SECRET_FILE}"
# The M4 Max override reads these via env override
UNSLOTH_IMAGE = "unsloth/unsloth:latest"
UNSLOTH_PLATFORM = "macos"
UNSLOTH_BIND_HOST = "127.0.0.1"
