# =============================================================================
# ARCHIVE-AGENT-PLATFORM-CLUSTER-ARM1-OCI PROCEDURE (AUTO-ARCHIVE)
# =============================================================================
# Idempotent auto-archive: when all 3 health endpoints return 200, archive
# the 5 openspec changes that close the agent-platform-cluster deployment.
#
# The 5 changes to archive:
#   1. 2026-07-13-backfill-server-id-on-12-procedures
#   2. 2026-07-13-arm-oci-deploy-preflight-hard-gate-v1
#   3. 2026-07-13-agent-platform-cluster-arm1-oci-bootstrap-procedure-v1
#   4. 2026-07-13-archive-agent-platform-cluster-arm1-oci-automation-v1 (self)
#   5. 2026-07-13-deploy-agent-platform-cluster-arm1-oci-and-remote-dev-workflow
#
# If any of the 3 endpoints returns non-200, abort at Stage 1.
# All 5 archive commands are idempotent (|| true) — already-archived is
# treated as success.
#
# Spec: openspec/changes/2026-07-13-archive-agent-platform-cluster-arm1-oci-automation-v1
#
# Usage:
#   km run procedure archive-agent-platform-cluster-arm1-oci
# =============================================================================

[[procedure.config]]
name = "archive-agent-platform-cluster-arm1-oci"
description = "Auto-archive the 5 openspec changes when ALL 3 health endpoints return 200. Idempotent."
server_id = "arm1-oci"

# =============================================================================
# STAGE 1: 3 health checks (gates the archive)
# =============================================================================

[[procedure.config.stages]]
name = "health-checks"

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "curl -ksSf -o /dev/null -w 'hermes: %{http_code}\\n' https://hermes.cianfhoghlaim.ie/api/health", timeout_s = 30, description = "Probe hermes /api/health (must be 200)", require_success = true } }

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "curl -ksSf -o /dev/null -w 'openclaw: %{http_code}\\n' https://openclaw.cianfhoghlaim.ie/api/health", timeout_s = 30, description = "Probe openclaw /api/health (must be 200)", require_success = true } }

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "curl -ksSf -o /dev/null -w 'openchamber: %{http_code}\\n' https://openchamber.cianfhoghlaim.ie/api/health", timeout_s = 30, description = "Probe openchamber /api/health (must be 200)", require_success = true } }

# =============================================================================
# STAGE 2: Archive the 5 openspec changes (idempotent)
# =============================================================================

[[procedure.config.stages]]
name = "archive-changes"

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "cd kings_college_galway && openspec archive 2026-07-13-backfill-server-id-on-12-procedures --yes 2>&1 | tail -3 || true", timeout_s = 60, description = "Archive 1/5: backfill server_id" } }

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "cd kings_college_galway && openspec archive 2026-07-13-arm-oci-deploy-preflight-hard-gate-v1 --yes 2>&1 | tail -3 || true", timeout_s = 60, description = "Archive 2/5: preflight hard-gate" } }

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "cd kings_college_galway && openspec archive 2026-07-13-agent-platform-cluster-arm1-oci-bootstrap-procedure-v1 --yes 2>&1 | tail -3 || true", timeout_s = 60, description = "Archive 3/5: bootstrap procedure" } }

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "cd kings_college_galway && openspec archive 2026-07-13-archive-agent-platform-cluster-arm1-oci-automation-v1 --yes 2>&1 | tail -3 || true", timeout_s = 60, description = "Archive 4/5: self (this change)" } }

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "cd kings_college_galway && openspec archive 2026-07-13-deploy-agent-platform-cluster-arm1-oci-and-remote-dev-workflow --yes 2>&1 | tail -3 || true", timeout_s = 60, description = "Archive 5/5: parent deploy change" } }

# =============================================================================
# STAGE 3: Emit success artifact (JSON)
# =============================================================================

[[procedure.config.stages]]
name = "emit-success-artifact"

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "mkdir -p /tmp/agent-platform-cluster && ts=$(date -u +%Y%m%dT%H%M%SZ); jq -n --arg ts \"$ts\" --arg cluster 'agent-platform-cluster-arm1-oci' '{ts: $ts, cluster: $cluster, archived: [\"backfill-server-id-on-12-procedures\", \"arm-oci-deploy-preflight-hard-gate-v1\", \"agent-platform-cluster-arm1-oci-bootstrap-procedure-v1\", \"archive-agent-platform-cluster-arm1-oci-automation-v1\", \"deploy-agent-platform-cluster-arm1-oci-and-remote-dev-workflow\"]}' > /tmp/agent-platform-cluster/archived-on-$ts.json; ls -1 /tmp/agent-platform-cluster/archived-on-$ts.json", timeout_s = 30, description = "Emit success artifact with the 5 archived change IDs" } }