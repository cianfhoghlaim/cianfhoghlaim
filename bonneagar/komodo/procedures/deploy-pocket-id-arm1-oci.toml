# =============================================================================
# DEPLOY POCKET-ID-ARM1-OCI PROCEDURE (for the arm1-oci migration)
# =============================================================================
# Deploys the Pocket ID OIDC identity provider (v2.9.0) on arm1-oci
# (the canonical control plane per the bons AGENTS.md architecture).
#
# This is the migration target — the same 6-file GOLD_STANDARD stack
# that runs on bunchloch, but on arm1-oci via SSH + docker compose.
#
# Why this procedure exists (not just "do the same as bunchloch"):
#   - The bons IaC's server_id convention routes procedures to the right
#     host. Procedures with `server_id = "arm1-oci"` only show up in
#     the arm1-oci Komodo UI (and in the Periphery agent on arm1-oci).
#   - The arm1-oci host has its own docker daemon + Locket sidecar.
#   - The Pocket ID ENCRYPTION_KEY on arm1-oci may be DIFFERENT from
#     bunchloch's (it's stored in arm1-oci's Infisical path).
#
# 5 stages (mirrors deploy-pocket-id-bunchloch exactly):
#   0. preflight  (3 checks: OIDC discovery + ENCRYPTION_KEY + docker volume)
#   1. stackup    (docker compose up -d)
#   2. health     (4 verifications)
#   3. probe      (curl the OIDC discovery + verify the bons-iac client)
#   4. finalize
#
# Spec: openspec/changes/2026-07-14-tightly-knit-auth-stack-v1
# (The arm1-oci migration is a follow-up — for now, this procedure is
#  declared but not yet invoked. The bunchloch procedure is the
#  working deployment.)
# =============================================================================

[[procedure.config]]
name = "deploy-pocket-id-arm1-oci"
description = "Deploy Pocket ID (v2.9.0) on arm1-oci — the canonical control-plane host per the bons AGENTS.md architecture"
server_id = "arm1-oci"

# =============================================================================
# STAGE 0: Pre-flight
# =============================================================================

[[procedure.config.stages]]
name = "preflight"

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "command -v docker && docker --version", timeout_s = 10, description = "Verify docker is available on arm1-oci" } }

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "docker volume inspect pangolin_pocket-id-data > /dev/null && echo 'volume present' || docker volume create pangolin_pocket-id-data", timeout_s = 10, description = "Ensure the Pocket ID data volume exists" } }

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "echo $POCKETID_ENCRYPTION_KEY | head -c 64 | wc -c | grep -q 64", timeout_s = 5, name = "encryption-key-present", description = "Verify POCKETID_ENCRYPTION_KEY is 64 hex chars (arm1-oci has its own Locket-resolved value)" } }

# =============================================================================
# STAGE 1: StackUp
# =============================================================================

[[procedure.config.stages]]
name = "stackup"

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "cd /etc/komodo/pocket-id && docker compose -f compose.yaml up -d 2>&1 | tail -20", timeout_s = 120, description = "Start pocket-id via the bons 6-file GOLD_STANDARD stack (compose.yaml + sidecar.yaml)", require_success = true } }

# =============================================================================
# STAGE 2: Health verification (mirrors bunchloch procedure)
# =============================================================================

[[procedure.config.stages]]
name = "health"

[[procedure.config.stages.executions]]
execution = { type = "HttpCheck", params = { url = "https://auth.cianfhoghlaim.ie/.well-known/openid-configuration", expected_status = 200, timeout_s = 15, name = "oidc-discovery", description = "Pocket ID OIDC discovery must return 200 (same canonical URL — Pangolin routes the request to whichever host is running pocket-id)" } }

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "for i in {1..12}; do docker exec pocket-id sh -c 'ls -la /app/data/pocket-id.db' 2>/dev/null | grep -q rw && break; sleep 5; done; docker exec pocket-id ls -la /app/data/ 2>&1 | head -3", timeout_s = 90, name = "db-writable", description = "Pocket ID SQLite DB is readable + writable on arm1-oci" } }

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "docker logs pocket-id --tail 20 2>&1 | grep -E 'Starting|listening' | head -3", timeout_s = 5, name = "logs-clean", description = "Pocket ID logs show successful startup on arm1-oci" } }

# =============================================================================
# STAGE 3: Probe
# =============================================================================

[[procedure.config.stages]]
name = "probe"

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "curl -ksS https://auth.cianfhoghlaim.ie/api/v1/oidc/.well-known/openid-configuration 2>&1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(\"issuer:\", d.get(\"issuer\"))' 2>&1", timeout_s = 10, name = "api-discovery", description = "Pocket ID admin API at /api/v1/oidc/ is reachable" } }

# =============================================================================
# STAGE 4: Finalize
# =============================================================================

[[procedure.config.stages]]
name = "finalize"

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "TS=$(date -u +%Y%m%dT%H%M%SZ); cat > /tmp/pocket-id-arm1-oci-deploy-$TS.json <<EOF\n{\n  \"ts\": \"$TS\",\n  \"action\": \"deploy-pocket-id-arm1-oci\",\n  \"host\": \"arm1-oci\",\n  \"stack\": \"pocket-id\",\n  \"image\": \"$(docker exec pocket-id /app/pocket-id version 2>/dev/null)\",\n  \"oidc_issuer\": \"https://auth.cianfhoghlaim.ie\",\n  \"komodo_procedure\": \"deploy-pocket-id-arm1-oci\",\n  \"note\": \"This procedure is the migration target — for now pocket-id runs on bunchloch via deploy-pocket-id-bunchloch. When arm1-oci is fully bootstrapped, this procedure is the canonical deploy.\"\n}\nEOF\necho \"wrote audit record: /tmp/pocket-id-arm1-oci-deploy-$TS.json\"", timeout_s = 10, description = "Write a JSON audit record to /tmp" } }
