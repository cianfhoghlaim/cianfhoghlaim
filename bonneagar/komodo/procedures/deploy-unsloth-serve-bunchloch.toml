# Komodo procedure: deploy unsloth-serve (bunchloch / Apple Silicon M4 Max)
# Per the 2026-08-21-unsloth-v5-integration-v1 change (corrected in the
# 2026-08-21 hotfix commit): bunchloch is the M4 Max GPU host.
# The Apple Silicon MLX variant for dev mode + the marimo 10-way
# comparison notebook + the Studio UI. The arm1-oci variant is
# deployed via deploy-unsloth-serve-arm1-oci.toml.

# Stage 0: pre-reqs
[[stage.action]]
type = "CheckEnvVar"
name = "check-prereqs"
vars = ["INFISICAL_CLIENT_ID", "INFISICAL_SECRET_FILE", "UNSLOTH_API_KEY", "UNSLOTH_MODEL_ID"]

[[stage.action]]
type = "CheckResourceCeiling"
name = "check-bunchloch-utilization"
server_id = "bunchloch"
max_cpu_pct = 80
max_memory_pct = 80

# Stage 1: dependency services — the unsloth-serve container joins the
# cianfhoghlaim + lakehouse networks, so the litellm + langfuse stacks
# must be reachable.
[[stage.action]]
type = "RunProcedure"
name = "deploy-litellm-bunchloch"
procedure = "deploy-litellm-bunchloch"

[[stage.action]]
type = "RunProcedure"
name = "deploy-langfuse-bunchloch"
procedure = "deploy-langfuse-bunchloch"

[[stage.action]]
type = "RunProcedure"
name = "deploy-lakehouse-bunchloch"
procedure = "deploy-lakehouse-bunchloch"

# Stage 2: deploy the unsloth-serve stack (M4 Max / MLX variant)
[[stage.action]]
type = "DeployStack"
name = "deploy-unsloth-serve"
stack = "unsloth-serve"
server_id = "bunchloch"

# Stage 3: pangolin routes (private on bunchloch; the public route is
# wired on arm1-oci via deploy-unsloth-serve-arm1-oci.toml)
[[stage.action]]
type = "ApplyBlueprint"
name = "apply-pangolin-blueprint"
blueprint = "unsloth-serve/blueprint.yaml"

# Stage 4: health verification
# /v1/models is the lightweight OpenAI-compatible liveness check
# (returns the model ID without invoking the model).
[[stage.action]]
type = "HttpCheck"
name = "health-check-models-endpoint"
url = "http://unsloth-serve:8889/v1/models"
expected_status = 200
timeout_s = 60

[[stage.action]]
type = "HttpCheck"
name = "health-check-with-auth"
url = "http://unsloth-serve:8889/v1/models"
headers = { Authorization = "Bearer ${UNSLOTH_API_KEY}" }
expected_status = 200
expected_body_contains = "\"data\""
timeout_s = 60

# Stage 5: verify the loaded model — the upstream `unsloth run` prints
# the model ID to stdout at startup; the LLM client confirms via /v1/models
[[stage.action]]
type = "HttpCheck"
name = "verify-loaded-model"
url = "http://unsloth-serve:8889/v1/models"
headers = { Authorization = "Bearer ${UNSLOTH_API_KEY}" }
expected_body_contains = "Qwen3.8"
timeout_s = 60
