# =============================================================================
# MLFLOW - ML Experiment Tracking and Model Registry
# =============================================================================
# Updated for the `centralise-data-plane` rewrite (2026-07-30):
# - The standalone `postgres` (postgres:16-alpine) container is removed.
#   MLflow now uses the centralised lakehouse-postgres (db=mlflow).
# - The standalone `minio` + `minio-init` containers are removed.
#   MLflow now uses the centralised lakehouse-garage
#   (bucket=mlflow-artifacts, auto-created by the lakehouse `garage-init`).
# - The custom image bakes psycopg2-binary + boto3 so the cold-start
#   install no longer delays the server boot.
# - Updated 2026-07-28: switched to ghcr.io/cianfhoghlaim/locket-shim sidecar (sidecar.yaml).
#   Port mapping changed to 127.0.0.1:5050:5000 (was 0.0.0.0:5000:5000)
#   to dodge macOS AirPlay Receiver which reserves port 5000.
#
# USAGE:
#   Production:  docker compose -f compose.yaml -f sidecar.yaml \
#                  --env-file .env.local.deploy up -d
#   Development: docker compose -f compose.yaml -f compose.dev.yaml \
#                  -f sidecar.yaml --env-file .env.local.deploy up -d
# =============================================================================

name: mlflow

services:
  # ---------------------------------------------------------------------------
  # MLFLOW - Tracking Server (centralised data plane)
  # ---------------------------------------------------------------------------
  # Custom build wraps upstream ghcr.io/mlflow/mlflow with psycopg2-binary
  # + boto3 baked in, eliminating the 30s pip-install on first boot.
  # ---------------------------------------------------------------------------
  mlflow:
    # Bumped 2026-08-22 (lakehouse-observability-stacks-modernization-v1):
    # ghcr.io/mlflow/mlflow:v3.12.0 → v3.15.1 (latest stable; the
    # 3.15.0 release added MCP Registry + proxy-less presigned artifact
    # upload + multi-modal attachments in judges). The 3.5.0+ security
    # middleware is enforced via env vars below (canonical form, not
    # CLI flags).
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: mlflow
    restart: unless-stopped
    ports:
      # 127.0.0.1 binding -- port 5000 on macOS is reserved by AirPlay
      # Receiver (ControlCe / commplex-main). Use MLFLOW_PORT to override
      # (5050 in the dev .env.local.deploy). Public exposure is via the
      # Pangolin private-resource mlflow.cianfhoghlaim.ie -> mlflow:5000.
      - "127.0.0.1:${MLFLOW_PORT:-5050}:5000"
    environment:
      # Centralised lakehouse-postgres (db=mlflow)
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:-devpassword}@lakehouse-postgres:5432/mlflow
      # Centralised lakehouse-garage (bucket=mlflow-artifacts)
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://lakehouse-garage:3900}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-s3://mlflow-artifacts/}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-GK1601dev}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dev-secret-key-not-for-prod}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-garage}
      MLFLOW_S3_IGNORE_TLS: "true"
      # v3.5.0+ security middleware (mandatory when binding 0.0.0.0)
      MLFLOW_ALLOWED_HOSTS: "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow.cianfhoghlaim.ie"
      MLFLOW_CORS_ALLOWED_ORIGINS: "https://cianfhoghlaim.cianfhoghlaim.ie,http://localhost:3335"
      # mlflow 3.13+ requires this for legacy mlruns/ SQLite fallback support
      # (per the 2026-08-21-mlflow-3.12-to-3.15.1-v1 openspec change)
      MLFLOW_ALLOW_FILE_STORE: "true"
      # OpenTelemetry → logfire collector (fans out to BOTH logfire cloud
      # AND langfuse). mlflow 3.x exposes native OTel via `mlflow.tracing`.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://logfire-otel:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: mlflow
      # Langfuse SDK-side traces (cost + prompt metadata for tracking URLs
      # served by mlflow). The mlflow UI shows "Trace in Langfuse" links that
      # require LANGFUSE_HOST + PUBLIC_KEY + SECRET_KEY to resolve.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # ADDED 2026-08-22 (lakehouse-observability-stacks-modernization-v1):
      # MLflow v3.5.0+ security middleware — canonical env var form
      # (supersedes the --allowed-hosts / --cors-allowed-origins CLI flags).
      # When bound to 0.0.0.0, the server locks to these hostnames + origins.
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow.cianfhoghlaim.ie}
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: ${MLFLOW_SERVER_CORS_ALLOWED_ORIGINS:-https://cianfhoghlaim.cianfhoghlaim.ie,http://localhost:3335}
      MLFLOW_SERVER_X_FRAME_OPTIONS: ${MLFLOW_SERVER_X_FRAME_OPTIONS:-SAMEORIGIN}
      # MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE must NEVER be true in prod
      # (we default to false explicitly so operators can audit).
      MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE: ${MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE:-false}
      # Native OTLP /v1/traces endpoint — MLflow 3.15.1 exposes this for fan-in
      # from OTel-instrumented services (Java/Go/Rust/etc). Also used as the
      # MLFLOW tracing backend for the mlflow.tracing module.
      MLFLOW_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${MLFLOW_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4317/v1/traces}
      # Tracing tunables (per MLflow 3.15+ docs)
      MLFLOW_TRACE_SAMPLING_RATIO: ${MLFLOW_TRACE_SAMPLING_RATIO:-1.0}
      MLFLOW_ENABLE_ASYNC_TRACE_LOGGING: ${MLFLOW_ENABLE_ASYNC_TRACE_LOGGING:-true}
      MLFLOW_ASYNC_TRACE_LOGGING_MAX_WORKERS: ${MLFLOW_ASYNC_TRACE_LOGGING_MAX_WORKERS:-10}
      MLFLOW_ASYNC_TRACE_LOGGING_MAX_QUEUE_SIZE: ${MLFLOW_ASYNC_TRACE_LOGGING_MAX_QUEUE_SIZE:-1000}
      MLFLOW_ASYNC_TRACE_LOGGING_RETRY_TIMEOUT: ${MLFLOW_ASYNC_TRACE_LOGGING_RETRY_TIMEOUT:-500}
      # Combine OTel SDK + MLflow spans in the same app
      MLFLOW_USE_DEFAULT_TRACER_PROVIDER: ${MLFLOW_USE_DEFAULT_TRACER_PROVIDER:-false}
    command:
      - mlflow
      - server
      - --backend-store-uri
      - "${MLFLOW_BACKEND_STORE_URI}"
      - --default-artifact-root
      - "${MLFLOW_DEFAULT_ARTIFACT_ROOT}"
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
    # Cross-project deps are managed by Komodo's [stack.depends_on] in
    # deploy-mlflow-bunchloch.toml -- see the file header.
    depends_on: []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - mlflow
      - lakehouse

  # ---------------------------------------------------------------------------
  # (postgres + minio + minio-init REMOVED 2026-07-30 -- uses centralised
  # lakehouse-postgres + lakehouse-garage. The `mlflow` database and the
  # `mlflow-artifacts` bucket are auto-created by the lakehouse stack's
  # init-db.sql and garage-init respectively.)
  # ---------------------------------------------------------------------------

networks:
  mlflow:
    driver: bridge
  lakehouse:
    name: lakehouse_lakehouse
    external: true