# Langfuse — local dev override
# ----------------------------------------------------------------------------
# Mirrors the litellm/cognee dev override pattern:
#   1. No-op locket sidecar (alpine) so `depends_on: locket: service_healthy`
#      resolves without booting the real Infisical-injection sidecar.
#   2. `env_file: .env.dev` (this stack) provides all the dev secrets
#      pointing at the lakehouse services (postgres db=langfuse,
#      redis, clickhouse, garage 3 buckets).
#   3. The image is `langfuse/langfuse:3` (public Docker Hub).
#
# Usage:
#   docker compose \
#     -f stacks/langfuse/compose.yaml \
#     -f stacks/langfuse/sidecar.yaml \
#     -f stacks/langfuse/compose.dev.yaml \
#     up -d
# ----------------------------------------------------------------------------

services:
  locket:
    image: alpine:3.20
    container_name: langfuse-locket-dev
    restart: "no"
    command:
      - sh
      - -c
      - "echo '[dev] no-op langfuse locket — secrets from .env.dev'; sleep infinity"
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default

  # Langfuse web (UI + API)
  langfuse-web:
    depends_on:
      locket:
        condition: service_started
    env_file:
      - .env.dev
    environment:
      # The base compose's `${POSTGRES_PASSWORD:?must be set}` is evaluated
      # at parse time — the dev .env.dev must include this so the interpolation
      # succeeds. (The env_file already sets POSTGRES_PASSWORD=devpassword, so
      # this is a belt-and-suspenders override.)
      POSTGRES_PASSWORD: devpassword
      POSTGRES_USER: lakekeeper
      # Dev override: lakehouse-redis is in Created state (port 6379 conflict with
      # dragonfly). Use the running dragonfly container as the Redis backend.
      # env_file is loaded first, but environment overrides env_file — so we
      # need to set this explicitly here to win against the base compose's
      # `REDIS_HOST: lakehouse-redis` hardcoded.
      REDIS_HOST: dragonfly
      REDIS_AUTH: devpassword
      REDIS_PASSWORD: devpassword
    networks:
      - default
      - cianfhoghlaim
      - lakehouse

  # Langfuse worker (ingestion queue + trace processor)
  langfuse-worker:
    depends_on:
      locket:
        condition: service_started
    env_file:
      - .env.dev
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_USER: lakekeeper
      REDIS_HOST: dragonfly
      REDIS_AUTH: devpassword
      REDIS_PASSWORD: devpassword
    networks:
      - default
      - cianfhoghlaim
      - lakehouse

# Top-level secrets: block from sidecar.yaml references the production
# Infisical secret file (../../infisical_secret). Override with /dev/null
# so the locket sidecar doesn't fail to mount a missing file.
secrets:
  infisical_secret:
    file: /dev/null

# Top-level networks: block in the base compose declares `cianfhoghlaim`
# as external. In dev mode on bunchloch, this network IS created (by the
# lakehouse/litellm/etc. cold-boot), so we keep it external. The previous
# "external: false" override broke DNS for sibling services like dragonfly.
networks:
  cianfhoghlaim:
    external: true
    name: cianfhoghlaim
