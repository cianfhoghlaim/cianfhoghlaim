services:
  gcp-bigquery-mirror-service:
    image: ghcr.io/cianfhoghlaim/gcp-bigquery-mirror-service:v1
    container_name: ${COMPOSE_PROJECT_NAME:-gcp-bigquery-mirror}-service
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - OTEL_SERVICE_NAME=gcp-bigquery-mirror-service
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
      - GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY=true
    networks:
      - stack
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  stack:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-gcp-bigquery-mirror}_stack
