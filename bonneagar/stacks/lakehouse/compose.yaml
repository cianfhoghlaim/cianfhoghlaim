# =============================================================================
# LAKEHOUSE - Unified Data Plane + Graph DB Stack (2026-08-15 consolidation)
# =============================================================================
# The unified 16-service data plane for the whole Cianfhoghlaim platform.
# Hosts the S3-compatible object store (Garage), the columnar Postgres
# with 13 databases (12 + cognee_cianfhoghlaim), the clickhouse columnar
# engine, the Redis queue, the Iceberg REST catalog (Lakekeeper), the
# Lance vector namespace, the 3 secondary services (Nimtable UI, Olake
# CDC, LanceDB Viewer), and the 5 graph DB backends (Cognee + Graphiti +
# FalkorDB + Memgraph + Memgraph Lab).
#
# Planetscale PostgreSQL is supported as an OPTIONAL override via the
# PLANETSCALE_DATABASE_URL env var — but the default (and recommended)
# for both dev and prod (on bunchloch) is the local lakehouse-postgres
# container.
#
# Downstream consumers (langfuse / litellm / mlflow) use the same
# Postgres + Garage + ClickHouse + Redis via Docker DNS names. See
# stedding/docs/stacks/lakehouse.md for the full contract.
#
# USAGE:
#   Development:  docker compose --env-file ../../.env.local up -d
#   Production:   locket exec --env-file secrets.env -- docker compose up -d
#   Standalone:   docker compose up -d  (uses defaults)
#   ONE COMMAND:  mise run lakehouse:up  (canonical entry-point)
#
# SERVICES (16 total — added 5 graph DB backends 2026-08-15):
#   - garage:             S3-compatible storage (7 buckets total)
#   - garage-init:        Bucket initialization (iceberg, lance, ducklake,
#                         langfuse-events, langfuse-media, langfuse-exports,
#                         mlflow-artifacts) [centralise-data-plane 2026-07]
#   - postgres:           Centralised Postgres with 13 databases (ducklake_*,
#                         dagster_local, olake_state, nimtable, langfuse,
#                         mlflow, litellm, cognee_cianfhoghlaim)
#                         [centralise-data-plane 2026-07]
#   - clickhouse:         Centralised columnar engine (consumed by langfuse)
#                         [centralise-data-plane 2026-07]
#   - redis:              Centralised queue (consumed by langfuse)
#                         [centralise-data-plane 2026-07]
#   - lakekeeper-migrate: Database migrations
#   - lakekeeper:         Iceberg REST Catalog (port 8181)
#   - lance-namespace:    Lance table registration sidecar (port 8182)
#   - nimtable:           Iceberg catalog UI (port 3018) [extend-lakehouse-with-nimtable-olake-lancedb]
#   - olake:              CDC engine (ephemeral admin) [extend-lakehouse-with-nimtable-olake-lancedb]
#   - lancedb-viewer:     LanceDB table viewer (port 8081) [extend-lakehouse-with-nimtable-olake-lancedb]
#   - cognee:             Knowledge graph builder (port 8000) [lakehouse-unified-data-plane 2026-08-15]
#                         - uses shared lakehouse-postgres at cognee_cianfhoghlaim
#                         - LLM via LiteLLM at http://litellm:4000/v1
#                         - vectors via Lance Namespace at rest://lakehouse-lance-namespace:8182
#   - graphiti:           Bi-temporal KG API (port 8000) [lakehouse-unified-data-plane 2026-08-15]
#                         - uses shared falkordb at falkordb:6379
#   - falkordb:           Graph DB + vector.so hybrid (port 6379, UI 3000)
#                         [lakehouse-unified-data-plane 2026-08-15]
#                         - --appendonly yes --appendfsync everysec (AOF persistence)
#                         - FALKORDB_ARGS=THREAD_COUNT 8 CACHE_SIZE 50 TIMEOUT_MAX 60000
#                         - --loadmodule /etc/falkordb/vector.so (hybrid queries)
#   - memgraph:           Bolt graph DB + MAGE algorithms (port 7687, HTTP 7444)
#                         [lakehouse-unified-data-plane 2026-08-15]
#   - memgraph-lab:       Memgraph Web UI (port 3000) [lakehouse-unified-data-plane 2026-08-15]
# =============================================================================

name: lakehouse

services:
  # ---------------------------------------------------------------------------
  # GARAGE - Enhanced S3-Compatible Storage with Virtual-Host DNS
  # ---------------------------------------------------------------------------
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: lakehouse-garage
    restart: unless-stopped
    ports:
      - "${GARAGE_RPC_PORT:-3901}:3901"
      - "${GARAGE_S3_API_PORT:-3900}:3900"
      - "${GARAGE_K2V_API_PORT:-3902}:3902"
      - "${GARAGE_WEB_PORT:-3903}:3903"
      - "${GARAGE_ADMIN_PORT:-3904}:3904"
    environment:
      RUST_LOG: ${RUST_LOG:-garage=info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-1}
      # Secrets injected via Locket or env
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET must be set via Locket/Infisical}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN must be set via Locket/Infisical}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - lakehouse-garage-meta:/var/lib/garage/meta
      - lakehouse-garage-data:/var/lib/garage/data
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    healthcheck:
      # Garage distroless image has no curl - use /garage status instead
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "node", "id"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lakehouse
      - pangolin
  # ---------------------------------------------------------------------------
  # GARAGE INIT - Create Buckets for Lakehouse via Admin API (Python rewrite)
  # ---------------------------------------------------------------------------
  # CHANGED 2026-08-24 (lakehouse-stack-doctor-and-env-var-cleanup-v1):
  # Replaced the 50-line bash entrypoint with the Python garage_init.py
  # script (using boto3). The image is now python:3.11-slim + boto3.
  # Easier to test + maintain + integrate with Locket than raw curl.
  # ---------------------------------------------------------------------------
  # CHANGED 2026-08-24 (lakehouse-stack-doctor-and-env-var-cleanup-v1):
  # Replaced the 50-line bash entrypoint with the Python garage_init.py
  # script (using boto3). The image is now python:3.11-slim + boto3
  # (mounted from the lance-sidecar/requirements.txt pattern).
  garage-init:
    image: python:3.11-slim
    container_name: lakehouse-garage-init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN must be set via Locket/Infisical}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?GARAGE_ACCESS_KEY_ID must be set via Locket/Infisical}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY must be set via Locket/Infisical}
      GARAGE_ADMIN_URL: ${GARAGE_ADMIN_URL:-http://garage:3904}
      GARAGE_S3_ENDPOINT: ${GARAGE_S3_ENDPOINT:-http://garage:3900}
      GARAGE_REGION: ${GARAGE_REGION:-garage}
    volumes:
      - ./garage_init.py:/app/garage_init.py:ro
    working_dir: /app
    entrypoint: ["python", "/app/garage_init.py"]
    command: []
    restart: "no"
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # POSTGRESQL - Centralised Database (14 databases)
  # ---------------------------------------------------------------------------
  # Hosts 14 databases shared across the platform (added 2026-08-22):
  #   6 DuckLake (ducklake_cianfhoghlaim, _crypteolas, _aleyum, _croilar, _tuath,
  #              _meaisinfhoghlaim)
  #   dagster_local, olake_state, nimtable, langfuse, mlflow, litellm
  #   cognee_cianfhoghlaim  (cognee knowledge graph builder — added 2026-08-15)
  #   olake_source          (Olake CDC source DB — added 2026-08-22)
  # See init-db.sql for the complete list.
  # POSTGRES_PASSWORD must be set via Infisical (never hardcode).
  # IMAGE: pgvector/pgvector:pg17 (was postgres:16-alpine — 2026-08-22 hardening).
  # Includes pgvector (for Cognee vector storage) + postgresql-contrib (for
  # Lakekeeper migrations — uuid-ossp/pgcrypto/pg_trgm/btree_gin/btree_gist).
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lakehouse-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set via Locket/Infisical}
      POSTGRES_DB: ${POSTGRES_DB:-lakekeeper}
      # CHANGED 2026-08-23: COGNEE_POSTGRES_PASSWORD is read by init-cognee-user.sh
      # (mounted below at /docker-entrypoint-initdb.d/) which runs after
      # init-db.sql to set the cognee user's password.
      COGNEE_POSTGRES_PASSWORD: ${COGNEE_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-no-key-needed}}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - lakehouse-postgres:/var/lib/postgresql/data
      # ADDED 2026-08-23: post-init script for the dedicated cognee user
      - ./init-cognee-user.sh:/docker-entrypoint-initdb.d/02-init-cognee-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # CLICKHOUSE - Centralised Columnar Engine
  # ---------------------------------------------------------------------------
  # Consumed by the langfuse stack for trace analytics (langfuse_s3_event_upload
  # analytics + LANGFUSE_S3_BATCH_EXPORT).
  # Tight resource caps — ClickHouse is memory-hungry.
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: lakehouse-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set via Locket/Infisical}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - lakehouse-clickhouse-data:/var/lib/clickhouse
      - lakehouse-clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # REDIS - Centralised Queue / Cache
  # ---------------------------------------------------------------------------
  # Consumed by the langfuse stack (REDIS_HOST=lakehouse-redis, REDIS_AUTH).
  # Tight resource caps; bind direct port to 127.0.0.1 only (internal use).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lakehouse-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set via Locket/Infisical}"
      - "--maxmemory-policy"
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    volumes:
      - lakehouse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # LAKEKEEPER MIGRATE - Database Migrations
  # ---------------------------------------------------------------------------
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.1
    container_name: lakehouse-lakekeeper-migrate
    command: migrate
    environment:
      LAKEKEEPER__PG_DATABASE_URL_WRITE: ${PLANETSCALE_DATABASE_URL:-postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:?must be set}@postgres:5432/${POSTGRES_DB:-lakekeeper}}
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?LAKEKEEPER_ENCRYPTION_KEY must be set via Locket/Infisical}
      LAKEKEEPER__PG_SSL_MODE: ${LAKEKEEPER_SSL_MODE:-prefer}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      # Note: Removed garage-init dependency - service_completed_successfully
      # condition is unreliable with remote Komodo deployments
    restart: "no"


  # ---------------------------------------------------------------------------
  # LAKEKEEPER - Iceberg REST Catalog
  # ---------------------------------------------------------------------------
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.1
    container_name: lakehouse-lakekeeper
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "${LAKEKEEPER_PORT:-8181}:8181"
      - "${LAKEKEEPER_METRICS_PORT:-9100}:9000"
    environment:
      # PostgreSQL Connection — defaults to local lakehouse-postgres; can
      # be overridden by PLANETSCALE_DATABASE_URL for managed deployments.
      LAKEKEEPER__PG_DATABASE_URL_READ: ${PLANETSCALE_DATABASE_URL:-postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:?must be set}@postgres:5432/${POSTGRES_DB:-lakekeeper}}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: ${PLANETSCALE_DATABASE_URL:-postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:?must be set}@postgres:5432/${POSTGRES_DB:-lakekeeper}}
      # CHANGED 2026-08-23 (lakehouse-production-config-and-lance-sidecar-modernization-v1):
      # Per official Lakekeeper config docs (https://docs.lakekeeper.io/docs/latest/configuration/).
      # Production env vars for read replica routing + metrics + pagination + caches.
      LAKEKEEPER__PG_HOST_R: ${LAKEKEEPER__PG_HOST_R:-postgres}
      LAKEKEEPER__PG_HOST_W: ${LAKEKEEPER__PG_HOST_W:-postgres}
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?LAKEKEEPER_ENCRYPTION_KEY must be set via Locket/Infisical}
      LAKEKEEPER__PG_SSL_MODE: ${LAKEKEEPER_SSL_MODE:-prefer}
      LAKEKEEPER__METRICS__PORT: ${LAKEKEEPER_METRICS_PORT:-9100}
      # Pagination (sensible defaults for BIEP v3 read-heavy workloads)
      LAKEKEEPER__PAGINATION_SIZE_DEFAULT: ${LAKEKEEPER_PAGINATION_SIZE_DEFAULT:-1024}
      LAKEKEEPER__PAGINATION_SIZE_MAX: ${LAKEKEEPER_PAGINATION_SIZE_MAX:-2048}
      # Pangolin reverse proxy — let Lakekeeper trust X-Forwarded-* headers
      LAKEKEEPER__USE_X_FORWARDED_HEADERS: "true"
      # Caching (short-term credentials + warehouse metadata)
      LAKEKEEPER__CACHE__STC__ENABLED: "true"
      LAKEKEEPER__CACHE__WAREHOUSE__ENABLED: "true"
      LAKEKEEPER__CACHE__WAREHOUSE__CAPACITY: "1000"
      # Server Configuration
      LAKEKEEPER__LISTEN_PORT: "8181"
      LAKEKEEPER__BASE_URI: ${LAKEKEEPER_BASE_URI:-http://lakekeeper.cianfhoghlaim.ie}
      LAKEKEEPER__SERVE_SWAGGER_UI: "true"
      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      # Garage S3 credentials — Lakekeeper validates warehouses by writing a
      # test metadata file to S3; without credentials it gets 403. Injected
      # from .env (Locket-resolved) or dev fallback.
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?GARAGE_ACCESS_KEY_ID must be set}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY must be set}
      AWS_REGION: ${AWS_REGION:-garage}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://garage:3900}
      # OpenTelemetry → logfire collector (fans out to logfire cloud + langfuse)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: lakekeeper
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      # Note: Removed lakekeeper-migrate dependency - service_completed_successfully
      # condition is unreliable with remote Komodo deployments. Migrations run independently.
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - lakehouse
      - pangolin
  # ---------------------------------------------------------------------------
  # LANCE-NAMESPACE - Iceberg Adapter Sidecar for Lance Tables
  # ---------------------------------------------------------------------------
  # CHANGED 2026-08-23 (lakehouse-production-config-and-lance-sidecar-modernization-v1):
  # Pinned to the published image ghcr.io/cianfhoghlaim/lance-namespace-sidecar:v0.3.0
  # (built by .github/workflows/build-lance-namespace-sidecar.yml). Falls back to
  # local build context if the pinned image isn't pulled. The sidecar now uses
  # the official `lance-namespace-impls[iceberg]` library under the hood.
  # ---------------------------------------------------------------------------
  lance-namespace:
    # Pinned image (published by build-lance-namespace-sidecar.yml workflow)
    image: ghcr.io/cianfhoghlaim/lance-namespace-sidecar:v0.3.0
    # Local dev fallback — built from ./lance-sidecar/Dockerfile
    build:
      context: ./lance-sidecar
      dockerfile: Dockerfile
    pull_policy: if_not_present
    container_name: lakehouse-lance-namespace
    restart: unless-stopped
    ports:
      - "${LANCE_NAMESPACE_PORT:-8182}:8182"
    environment:
      # Lakekeeper Connection (internal Docker network)
      ICEBERG_ENDPOINT: http://lakekeeper:8181
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-lakehouse}
      ICEBERG_PREFIX: ""
      ICEBERG_AUTH_TOKEN: ${LANCE_ICEBERG_AUTH_TOKEN:-}
      # Lance Storage Root (Garage S3)
      LANCE_ROOT: s3://lance/
      # Garage S3 Credentials
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?GARAGE_ACCESS_KEY_ID must be set via Locket/Infisical}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY must be set via Locket/Infisical}
      AWS_ENDPOINT_URL: http://garage:3900
      AWS_REGION: garage
      # Timeouts
      ICEBERG_CONNECT_TIMEOUT_MILLIS: "10000"
      ICEBERG_READ_TIMEOUT_MILLIS: "30000"
      ICEBERG_MAX_RETRIES: "3"
      # Server Configuration
      SIDECAR_HOST: "0.0.0.0"
      SIDECAR_PORT: "8182"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # OpenTelemetry → logfire collector (fans out to logfire cloud + langfuse)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: lance-namespace
    depends_on:
      lakekeeper:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8182/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - lakehouse
      - pangolin
  # ---------------------------------------------------------------------------
  # NIMTABLE - Iceberg Catalog UI (Spring Boot + JDBC)
  # ---------------------------------------------------------------------------
  # Surfaces all Iceberg tables registered in Lakekeeper via a web UI.
  # Persists dashboard state + user preferences in the `nimtable` Postgres DB.
  # ---------------------------------------------------------------------------
  nimtable:
    # Pinned 2026-07-06 (was `nimtable/nimtable:latest` — forbidden by Image
    # Pinning Policy; GitHub issue #238 confirms only nightly tags are
    # published as of 2026-07-06 — the upstream needs to start publishing
    # semver tags). Using `:latest` here is a documented exception per the
    # change's README.
    image: nimtable/nimtable:latest
    container_name: lakehouse-nimtable
    restart: unless-stopped
    ports:
      - "${NIMTABLE_PORT:-3018}:3000"
    environment:
      # Spring Boot JDBC connection to shared Postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nimtable
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lakekeeper}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set via Locket/Infisical}
      # Lakekeeper catalog endpoint (internal Docker network)
      NIMTABLE_CATALOG_URI: http://lakekeeper:8181
      NIMTABLE_CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-lakehouse}
      # S3 endpoint (Garage)
      NIMTABLE_S3_ENDPOINT: http://garage:3900
      NIMTABLE_S3_REGION: garage
      NIMTABLE_S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:-lakehouse}
      NIMTABLE_S3_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY must be set via Locket/Infisical}
      # Server
      SERVER_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # ADDED 2026-08-25 (lakehouse-observability-and-cross-stack-integration-v1):
      # OpenTelemetry → otel collector (fans out to Langfuse + Logfire + MLflow)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: nimtable
    volumes:
      - nimtable_data:/var/lib/nimtable
    depends_on:
      postgres:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - lakehouse
      - pangolin
  # ---------------------------------------------------------------------------
  # Open-source CDC engine from olake-io. Persists checkpoint state to the
  # `olake_state` Postgres DB + named volume. Admin via `docker exec`.
  # ---------------------------------------------------------------------------
  olake:
    image: ghcr.io/olake-io/olake:v0.8.0
    container_name: lakehouse-olake
    restart: unless-stopped
    environment:
      # Source connector config (Postgres sample)
      OLAKE_CONFIG_PATH: /mnt/config
      JDBC_URL: jdbc:postgresql://postgres:5432/olake_state
      JDBC_USERNAME: ${POSTGRES_USER:-lakekeeper}
      JDBC_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set via Locket/Infisical}
      # Source Postgres (for the source connector — separate from state DB)
      SOURCE_DB_HOST: ${OLAKE_SOURCE_HOST:-postgres}
      SOURCE_DB_PORT: ${OLAKE_SOURCE_PORT:-5432}
      # CHANGED 2026-08-22 (lakehouse-config-and-env-var-hardening-v1):
      # olake_source is now created by lakehouse/init-db.sql so Olake CDC
      # jobs have a real source DB to connect to (was the placeholder
      # `staging_pg` which never existed).
      SOURCE_DB_NAME: ${OLAKE_SOURCE_DB:-olake_source}
      SOURCE_DB_USER: ${OLAKE_SOURCE_USER:-lakekeeper}
      SOURCE_DB_PASSWORD: ${OLAKE_SOURCE_PASSWORD:-devpassword}
      SOURCE_DB_SSLMODE: ${OLAKE_SOURCE_SSLMODE:-prefer}
      # Iceberg writer S3 credentials
      WRITER_S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:-lakehouse}
      WRITER_S3_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:?GARAGE_SECRET_ACCESS_KEY must be set via Locket/Infisical}
      WRITER_S3_ENDPOINT: http://garage:3900
      WRITER_S3_REGION: garage
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # ADDED 2026-08-25 (lakehouse-observability-and-cross-stack-integration-v1):
      # OpenTelemetry → otel collector (fans out to Langfuse + Logfire + MLflow)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: olake
    volumes:
      - ./olake/config.json:/mnt/config/config.json:ro
      - ./olake/catalog.json:/mnt/config/catalog.json:ro
      - ./olake/writer.json:/mnt/config/writer.json:ro
      - olake_state:/var/lib/olake
    depends_on:
      postgres:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/olake/.health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - lakehouse
  # ---------------------------------------------------------------------------
  # LANCEDB-VIEWER - LanceDB Table Viewer
  # ---------------------------------------------------------------------------
  # Web UI for browsing LanceDB tables. Connects to the Lance namespace
  # sidecar at :8182 (the canonical rest:// endpoint). No published port
  # mapping required for internal use; the host port :8081 is for debugging.
  # ---------------------------------------------------------------------------
  lancedb-viewer:
    image: ghcr.io/gordonmurray/lance-data-viewer:lancedb-0.24.3
    container_name: lakehouse-lancedb-viewer
    restart: unless-stopped
    ports:
      - "${LANCEDB_VIEWER_PORT:-8081}:8080"
    environment:
      LANCEDB_URI: rest://lakehouse-lance-namespace:8182
      ADMIN_TOKEN: ${LANCEDB_VIEWER_ADMIN_TOKEN:?LANCEDB_VIEWER_ADMIN_TOKEN must be set via Locket/Infisical}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      lance-namespace:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - lakehouse
      - pangolin

  # ---------------------------------------------------------------------------
  # COGNEE - Knowledge Graph Builder (uses shared lakehouse-postgres)
  # ---------------------------------------------------------------------------
  # ADDED 2026-08-15 (lakehouse-unified-data-plane-v1). The 6-dataset
  # knowledge graph builder for the BIEP v3 cognify stage. Connects to:
  #   - shared lakehouse-postgres at database `cognee_cianfhoghlaim`
  #     (NO separate cognee-postgres container — closed by this change)
  #   - LiteLLM gateway at http://litellm:4000/v1 (LLM + embeddings)
  #   - Lance Namespace at rest://lakehouse-lance-namespace:8182 (vectors)
  #   - Logfire collector at http://logfire-otel:4317 (OTel traces)
  #   - Langfuse at http://langfuse:3000 (LLM cost + prompt metadata)
  # CHANGED 2026-08-23 (lakehouse-production-config-and-lance-sidecar-modernization-v1):
  # Modernized to the new Dataset Database Handlers pattern (per official Cognee
  # docs at https://docs.cognee.ai/setup-configuration/overview). The legacy
  # USE_UNIFIED_PROVIDER=pghybrid is REMOVED in favor of explicit per-provider
  # configuration. Cognee now connects as the dedicated `cognee` user (created
  # in init-db.sql) instead of the shared `lakekeeper` superuser.
  # ---------------------------------------------------------------------------
  cognee:
    # Pinned 2026-07-02 (was :latest; 1.2.2 = current Docker Hub stable)
    image: cognee/cognee:1.2.2
    container_name: lakehouse-cognee
    restart: unless-stopped
    ports:
      - "${COGNEE_PORT:-8000}:8000"
    environment:
      # The cognee LLM client adds `Authorization: Bearer <LLM_API_KEY>` to
      # every request. If LLM_API_KEY is the LiteLLM master key, litellm
      # forwards it as the upstream DeepSeek key (which DeepSeek rejects).
      # Solution: set LLM_API_KEY to a placeholder so litellm falls back to
      # its own configured DEEPSEEK_API_KEY env var.
      LLM_API_KEY: ${COGNEE_LLM_API_KEY:-no-key-needed}
      LLM_PROVIDER: openai
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_MODEL: ${COGNEE_LLM_MODEL:-deepseek/deepseek-chat}
      EMBEDDING_API_KEY: ${COGNEE_EMBEDDING_API_KEY:-no-key-needed}
      EMBEDDING_PROVIDER: openai
      EMBEDDING_BASE_URL: http://litellm:4000/v1
      # Use the full litellm model path so tiktoken can auto-detect the
      # tokenizer (cognee validates EMBEDDING_MODEL against tiktoken at
      # startup).
      EMBEDDING_MODEL: ${COGNEE_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      COGNEE_DATABASES: ${COGNEE_DATABASES:-cianfhoghlaim.education.aistear,cianfhoghlaim.education.primary,cianfhoghlaim.education.junior_cycle,cianfhoghlaim.education.senior_cycle,cianfhoghlaim.education.tertiary,cianfhoghlaim.education.cross_stage}
      COGNEE_STORAGE: postgresql
      # Shared lakehouse-postgres at cognee_cianfhoghlaim database (added
      # to init-db.sql). Cognee connects as the dedicated `cognee` user
      # (created in init-db.sql) instead of the shared `lakekeeper`
      # superuser (security best-practice per Lakekeeper docs).
      COGNEE_POSTGRES_HOST: postgres
      COGNEE_POSTGRES_PORT: "5432"
      COGNEE_POSTGRES_USER: ${COGNEE_POSTGRES_USER:-cognee}
      COGNEE_POSTGRES_PASSWORD: ${COGNEE_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      COGNEE_POSTGRES_DB: cognee_cianfhoghlaim
      # CHANGED 2026-08-23: new Dataset Database Handlers pattern (per
      # https://docs.cognee.ai/setup-configuration/overview). Legacy
      # USE_UNIFIED_PROVIDER=pghybrid is REMOVED.
      VECTOR_DB_PROVIDER: pgvector
      DB_PROVIDER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: cognee_cianfhoghlaim
      DB_USERNAME: ${COGNEE_POSTGRES_USER:-cognee}
      DB_PASSWORD: ${COGNEE_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      GRAPH_DATABASE_PROVIDER: postgres
      # Use Lance Namespace as the vector backend (via the lance-namespace-impls)
      LANCEDB_PROVIDER: lancedb
      LANCEDB_URI: rest://lakehouse-lance-namespace:8182
      LANCEDB_API_KEY: ${LANCEDB_API_KEY:-devtoken}
      LANCEDB_NAMESPACE_TOKEN: ${LANCEDB_NAMESPACE_TOKEN:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUIRE_AUTHENTICATION: ${REQUIRE_AUTHENTICATION:-false}
      ENABLE_BACKEND_ACCESS_CONTROL: ${ENABLE_BACKEND_ACCESS_CONTROL:-false}
      # OpenTelemetry → logfire collector (fans out to logfire cloud + langfuse)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: cognee
      # Langfuse SDK-side traces
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # PlanetScale PG override (optional; opt-in to managed PG)
      PLANETSCALE_DATABASE_URL: ${PLANETSCALE_DATABASE_URL:-}
      # Galileo AI observability (optional)
      GALILEO_API_KEY: ${GALILEO_API_KEY:-}
    healthcheck:
      # Healthcheck runs INSIDE the container on port 8000
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    depends_on:
      postgres:
        condition: service_healthy
      lance-namespace:
        condition: service_healthy  # ADDED 2026-08-22 — cognee writes vectors via Lance Namespace
      # locket injected via -f sidecar.yaml
    networks:
      - lakehouse
      - pangolin

  # ---------------------------------------------------------------------------
  # GRAPHITI - Bi-temporal Knowledge Graph API
  # ---------------------------------------------------------------------------
  # ADDED 2026-08-15 (lakehouse-unified-data-plane-v1). Uses the unified
  # falkordb container (port 6379) as its graph backend. The Neo4j
  # backend was REMOVED (no Neo4j stack exists in KCG).
  # ---------------------------------------------------------------------------
  graphiti:
    build:
      context: .
    image: graphiti:local
    container_name: lakehouse-graphiti
    restart: unless-stopped
    ports:
      - "${GRAPHITI_PORT:-8001}:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      # FalkorDB backend (unified with the lakehouse stack)
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      FALKORDB_DATABASE: ${FALKORDB_GRAPHITI_DB:-default_db}
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:?FALKORDB_PASSWORD must be set via Locket/Infisical}
      GRAPHITI_BACKEND: falkordb
      PORT: 8000
      db_backend: falkordb
      # LLM API key (canonical backbone is LiteLLM at http://litellm:4000/v1)
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set via Locket/Infisical}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://litellm:4000/v1}
      # OpenTelemetry → otel collector (CHANGED 2026-08-23)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: graphiti
      # Langfuse SDK-side traces
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # FALKORDB - Graph DB + vector.so hybrid (consumed by Graphiti + standalone)
  # ---------------------------------------------------------------------------
  # ADDED 2026-08-15 (lakehouse-unified-data-plane-v1). Redis-protocol
  # graph DB with vector-search capability (the `db.idx.vector.queryNodes`
  # procedure used by Graphiti's hybrid queries). Production-tuned per
  # the official FalkorDB Docker best practices (verified 2026-08-15):
  #   --appendonly yes --appendfsync everysec   (AOF persistence)
  #   FALKORDB_ARGS=THREAD_COUNT 8 CACHE_SIZE 50 TIMEOUT_MAX 60000
  #   --loadmodule /etc/falkordb/vector.so     (hybrid vector+graph)
  #   --cluster-enabled no                      (single-node dev default)
  # ---------------------------------------------------------------------------
  falkordb:
    # Pinned 2026-08-15 (was :latest; v4.18.11 = upstream stable)
    image: falkordb/falkordb:v4.18.11
    container_name: lakehouse-falkordb
    restart: unless-stopped
    # CHANGED 2026-08-23 (lakehouse-production-config-and-lance-sidecar-modernization-v1):
    # All FalkorDB args now passed via REDIS_ARGS + FALKORDB_ARGS env vars
    # (per the official FalkorDB Docker docs at
    # https://docs.falkordb.com/operations/docker/). Removed: --loadmodule,
    # --requirepass, --appendonly, --appendfsync, --cluster-enabled, --port
    # (all now in REDIS_ARGS). The vector.so module is loaded via the
    # MODULE directive in REDIS_ARGS.
    command: ["falkordb"]
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
      - "127.0.0.1:${FALKORDB_UI_PORT:-3000}:3000"
    environment:
      # REDIS_ARGS — Redis server args (auth, persistence, memory)
      # per official FalkorDB Docker docs
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD:?FALKORDB_PASSWORD must be set via Locket/Infisical} --appendonly yes --appendfsync everysec --maxmemory 2gb --maxmemory-policy allkeys-lru --loadmodule /etc/falkordb/vector.so"
      # FALKORDB_ARGS — FalkorDB module args (threads, caches, timeouts)
      # per official FalkorDB docs
      FALKORDB_ARGS: "THREAD_COUNT 8 CACHE_SIZE 50 TIMEOUT_MAX 60000 TIMEOUT_DEFAULT 30000 QUERY_MEM_CAPACITY 104857600"
      BROWSER: "1"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:?FALKORDB_PASSWORD must be set via Locket/Infisical}
      VECTOR_MODULE_URL: ${VECTOR_MODULE_URL:-/etc/falkordb/vector.so}
      CLUSTER_MODE: ${CLUSTER_MODE:-no}
      # OpenTelemetry → logfire collector
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: falkordb
    volumes:
      - lakehouse-falkordb-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -p
        - "6379"
        - -a
        - "${FALKORDB_PASSWORD}"
        - --no-auth-warning
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lakehouse
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ---------------------------------------------------------------------------
  # MEMGRAPH - In-Memory Graph DB with MAGE Algorithms
  # ---------------------------------------------------------------------------
  # ADDED 2026-08-15 (lakehouse-unified-data-plane-v1). Bolt protocol
  # + in-memory storage + MAGE graph algorithms. NO Postgres needed
  # (Memgraph is self-contained; the Bolt protocol uses TCP/7687).
  # ---------------------------------------------------------------------------
  memgraph:
    # Pinned 2026-08-15 (was :latest; 3.6.0 = canonical 3.x release line)
    image: memgraph/memgraph-mage:3.6.0
    container_name: lakehouse-memgraph
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEMGRAPH_BOLT_PORT:-7687}:7687"
      - "127.0.0.1:${MEMGRAPH_HTTP_PORT:-7444}:7444"
    environment:
      MEMGRAPH_USER: ${MEMGRAPH_USER:-memgraph}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD:-devpassword}
      MEMGRAPH_LICENSE_FILE_PATH: ${MEMGRAPH_LICENSE_FILE_PATH:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: memgraph
    volumes:
      - lakehouse-memgraph-lib:/var/lib/memgraph
      - lakehouse-memgraph-log:/var/log/memgraph
    command: ["--log-level=${MEMGRAPH_LOG_LEVEL:-WARNING}"]
    healthcheck:
      # CHANGED 2026-08-22: HTTP /status probe via the :7444 endpoint
      # (the previous /dev/tcp probe only verified port reachability, not
      # that the Bolt protocol was actually responsive).
      test: ["CMD-SHELL", "curl -sf http://localhost:7444/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - lakehouse
      - pangolin

  # ---------------------------------------------------------------------------
  # MEMGRAPH-LAB - Web UI for Memgraph
  # ---------------------------------------------------------------------------
  # ADDED 2026-08-15 (lakehouse-unified-data-plane-v1). Browser-based
  # Cypher query IDE + graph visualisation. Connects to memgraph:7687
  # via QUICK_CONNECT_MG_HOST/MG_PORT.
  # ---------------------------------------------------------------------------
  memgraph-lab:
    # Pinned 2026-08-15 (was :latest; 3.6.0 = matches memgraph-mage)
    image: memgraph/lab:3.6.0
    container_name: lakehouse-memgraph-lab
    restart: unless-stopped
    ports:
      - "${MEMGRAPH_LAB_PORT:-3001}:3000"
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: "7687"
    depends_on:
      memgraph:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - lakehouse
      - pangolin

  # ---------------------------------------------------------------------------
  # OTEL COLLECTOR (optional profile — COMPLETED 2026-08-25)
  # ---------------------------------------------------------------------------
  # CHANGED 2026-08-25 (lakehouse-observability-and-cross-stack-integration-v1):
  # The full collector config (otel-collector.yaml) lands now. Receives OTLP
  # from cognee + graphiti + falkordb + memgraph + lance-namespace +
  # clickhouse + lakekeeper. Fans out to:
  #   1. Logfire cloud (SaaS) via `logfire` exporter + LOGFIRE_TOKEN
  #   2. Langfuse (self-hosted) via `otlphttp/langfuse` exporter + LANGFUSE_PUBLIC_KEY/SECRET_KEY
  #   3. MLflow (local) via `otlphttp/mlflow` exporter + MLFLOW_TRACKING_URI
  #
  # Production deployments can also use the CROSS-STACK `logfire-otel`
  # collector (set LAKEHOUSE_OTLP_ENDPOINT=http://logfire-otel:4317 in
  # .env.local). To enable this local fan-out:
  #   docker compose --profile otel up -d
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: lakehouse-otel-collector
    restart: unless-stopped
    profiles: ["otel"]
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:8888:8888"   # Collector health
      - "127.0.0.1:8889:8889"   # Collector metrics
    environment:
      # CHANGED 2026-08-25 (lakehouse-observability-and-cross-stack-integration-v1):
      # Full env vars for the otel-collector fan-out to Logfire + Langfuse + MLflow
      # (per otel-collector.yaml). These env vars are referenced by the
      # collector config via ${env:VAR_NAME} substitution.
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      LOGFIRE_PROJECT_NAME: ${LOGFIRE_PROJECT_NAME:-oideachas-celtic-education}
      LOGFIRE_ENVIRONMENT: ${LOGFIRE_ENVIRONMENT:-development}
      # Langfuse Basic auth header (base64-encoded "PUBLIC_KEY:SECRET_KEY")
      # Constructed by Locket sidecar from LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY.
      LANGFUSE_AUTH_HEADER: ${LANGFUSE_AUTH_HEADER:-}
      # Fallback raw keys (for collectors that compose the header themselves)
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # MLflow tracking URI (so otelhttp/mlflow exporter can fan out)
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    volumes:
      # Mount the collector config (added in PR #4)
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - lakehouse
# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  lakehouse-garage-meta:
  lakehouse-garage-data:
  lakehouse-postgres:
  lakehouse-clickhouse-data:
  lakehouse-clickhouse-logs:
  lakehouse-redis-data:
  # otel-collector.yaml volume mount (PR #4 will add the actual config file)
  # This is a placeholder so the otel-collector service can start even before
  # the config lands (Docker creates an empty file at the mount target).
  olake_state:
  nimtable_data:
  lakehouse-falkordb-data:        # ADDED 2026-08-15 (lakehouse-unified-data-plane-v1)
  lakehouse-memgraph-lib:         # ADDED 2026-08-15 (lakehouse-unified-data-plane-v1)
  lakehouse-memgraph-log:         # ADDED 2026-08-15 (lakehouse-unified-data-plane-v1)

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  # CHANGED 2026-08-01 (lakehouse-and-reproducible-deploy-v1):
  # Was `driver: bridge` (a LOCAL bridge that no downstream stack could reach).
  # Now declared as `external: true, name: lakehouse_lakehouse` so it
  # matches the declaration in langfuse, mlflow, litellm, cognee, dagster,
  # marimo, oideachais, graphiti, agent-os (all 9 downstream stacks that
  # declare `lakehouse: name: lakehouse_lakehouse, external: true`).
  # This unblocks them all to resolve lakehouse-postgres / lakehouse-garage
  # / lakehouse-redis etc. by name (the #1 critical gap per the
  # 2026-07-29 full-tree audit).
  lakehouse:
    name: lakehouse_lakehouse
    external: true
  # Pangolin network for production ingress - external in production
  # For local development, this will be created if it doesn't exist
  pangolin:
    driver: bridge
