# Lakehouse — local dev override
# ----------------------------------------------------------------------------
# Mirrors the langfuse/litellm/cognee dev override pattern (post
# centralise-data-plane):
#   1. Replace the production locket sidecar with a no-op alpine
#      container that passes healthcheck. The locket service from the
#      base sidecar.yaml expects `/locket healthcheck` to succeed; alpine
#      doesn't have `/locket`, so we override the healthcheck to `true`
#      (always healthy) and use `sleep infinity` as the main command.
#   2. `.env.dev` is loaded as a SHELL-LIKE source so the env variables
#      are available to satisfy the base compose's `${VAR:?...}` checks
#      at parse time. The base compose's `?` syntax is evaluated at parse
#      time and CANNOT be satisfied by an `environment:` override — only
#      by a shell env var or env_file.
#   3. The 9 required dev secrets (POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD,
#      REDIS_PASSWORD, GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN,
#      GARAGE_ACCESS_KEY_ID, GARAGE_SECRET_ACCESS_KEY,
#      LAKEKEEPER_ENCRYPTION_KEY, LANCEDB_VIEWER_ADMIN_TOKEN) live in
#      .env.dev. None of these are sensitive in dev (the lakehouse stack
#      is dev-only on bunchloch; production uses Locket + Infisical).
#
# Usage:
#   docker compose -f compose.yaml -f compose.dev.yaml -f sidecar.yaml up -d
# ----------------------------------------------------------------------------

services:
  # Replace the production locket sidecar with a no-op that passes health.
  # All security settings (user, security_opt, cap_drop, read_only, tmpfs)
  # are inherited from sidecar.yaml — we only override the command,
  # healthcheck, container_name, and image (the production locket
  # image is private and the binary doesn't exist in alpine, so the
  # healthcheck must be replaced too).
  locket:
    image: alpine:3.20
    container_name: lakehouse-locket-dev
    environment:
      INFISICAL_CLIENT_ID: ${INFISICAL_LOCKET_CLIENT_ID:-placeholder}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_LOCKET_CLIENT_SECRET:-placeholder}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-placeholder}
      LOCKET_MODE: watch
    command:
      - sh
      - -c
      - "echo '[dev] no-op locket — secrets from .env.dev'; sleep infinity"
    healthcheck:
      test: ["CMD-SHELL", "true"]

  garage:
    env_file:
      - .env.dev

  garage-init:
    env_file:
      - .env.dev

  postgres:
    env_file:
      - .env.dev

  clickhouse:
    env_file:
      - .env.dev

  redis:
    env_file:
      - .env.dev

  lakekeeper:
    env_file:
      - .env.dev

  lakekeeper-migrate:
    env_file:
      - .env.dev
    # lakekeeper-migrate in the base compose is missing the `networks:`
    # block, so Compose puts it in the default network and it can't
    # reach the `postgres` host (which lives on the `lakehouse` network).
    # Add the network here so the migration can connect.
    networks:
      - lakehouse

  lance-namespace:
    env_file:
      - .env.dev

  lancedb-viewer:
    env_file:
      - .env.dev

# The olake CDC engine is disabled in the dev overlay because the
# upstream `ghcr.io/olake-io/olake:0.1.5` image is private (401 on GHCR)
# and the source build (https://github.com/datazip-inc/olake@v0.1.5)
# requires a pre-built Maven JAR (`olake-iceberg-java-writer-0.0.1-SNAPSHOT.jar`)
# + Java 17 + Maven + Go 1.25.11 — none of which are available in this
# environment. The olake service is documented as "ephemeral admin"
# (a CDC tool, not a core data plane service), so it can be safely
# disabled in dev mode. To re-enable, either (a) add credentials for
# `ghcr.io/olake-io/olake` and remove this override, or (b) build the
# image locally and push to a local registry.
#
# Approach: override the olake service with a no-op alpine image AND
# add a `profiles: ["never-active"]` filter. By default, services with
# any `profiles:` are excluded from `docker compose up` unless the
# profile is explicitly selected. The dev override + this filter
# means the olake service is never pulled or started in dev mode.
# The unused `olake_state` named volume (declared in the base
# compose.yaml) sits harmlessly on disk.
  olake:
    image: alpine:3.20
    container_name: lakehouse-olake-dev
    profiles: ["never-active"]
    command: ["sh", "-c", "echo '[dev] olake disabled — see compose.dev.yaml'; sleep infinity"]
    healthcheck:
      disable: true

  # nimtable needs a config.yaml file that the lakehouse compose doesn't
  # mount; it crashes immediately on startup. The nimtable service is a
  # "nice to have" Iceberg catalog UI (not core data plane), so we
  # disable it in dev mode the same way as olake.
  nimtable:
    image: alpine:3.20
    container_name: lakehouse-nimtable-dev
    profiles: ["never-active"]
    command: ["sh", "-c", "echo '[dev] nimtable disabled (config.yaml missing)'; sleep infinity"]
    healthcheck:
      disable: true

# Top-level secrets: block from sidecar.yaml references the production
# Infisical secret file (../../infisical_secret). The base compose has
# `name: lakehouse` so docker compose prefixes the secret as
# `lakehouse_infisical_secret`. We override BOTH names to ensure docker
# finds them — using /dev/null for the no-op dev case.
secrets:
  infisical_secret:
    file: /dev/null
  lakehouse_infisical_secret:
    file: /dev/null
