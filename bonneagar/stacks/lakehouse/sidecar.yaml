# =============================================================================
# LAKEHOUSE - Locket Sidecar Configuration
# =============================================================================
# Docker Compose overlay for production deployments with Locket secrets.
#
# USAGE:
#   docker compose -f compose.yaml -f sidecar.yaml up -d
#
# Or via locket exec (preferred):
#   LOCKET_ENABLED=1 ./scripts/stack.sh lakehouse up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # LOCKET - Secret Management Sidecar
  # ---------------------------------------------------------------------------
  locket:
    image: ghcr.io/cianfhoghlaim/locket-shim:infisical-0.2.1
    environment:
      LOCKET_FALLBACK_FILE: /run/secrets/locket/env-fallback.env
    container_name: lakehouse-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "--provider=infisical"
      - "--infisical-client-id=$${INFISICAL_CLIENT_ID}"
      - "--infisical-client-secret=file:/run/secrets/infisical_secret"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=${LOCKET_MODE:-watch}"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      # INFISICAL_FALLBACK_FILE is optional — only mount when set.
      # Use ./secrets.env as the source when unset (acts as a no-op since
      # `env-fallback.env` doesn't get overwritten).
      - ${INFISICAL_FALLBACK_FILE:-./secrets.env}:/run/secrets/locket/env-fallback.env:ro
      - lakehouse-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "/locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Service Overrides - Add Locket Dependency
  # ---------------------------------------------------------------------------
  garage:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

  lakekeeper-migrate:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

  lakekeeper:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

  lance-namespace:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

  # ClickHouse (centralised columnar engine; consumed by langfuse)
  clickhouse:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

  # Redis (centralised queue; consumed by langfuse)
  redis:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

  # ---------------------------------------------------------------------------
  # Graph DB Service Overrides - Add Locket Dependency
  # ---------------------------------------------------------------------------
  # Added 2026-08-15 (lakehouse-unified-data-plane-v1). The 5 graph DB
  # services join the shared lakehouse_lakehouse network and consume
  # secrets from the single unified Locket sidecar (no Locket per stack).
  cognee:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

  graphiti:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

  falkordb:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

  memgraph:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

  memgraph-lab:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - lakehouse-secrets:/run/secrets/locket:ro

# =============================================================================
# SECRETS
# =============================================================================
# The infisical_secret file is mounted into the Locket sidecar. The path
# is parameterised via the INFISICAL_SECRET_FILE env var (default: ./infisical_secret)
# so the stack is portable across CI runners + Komodo prod deploys + other
# developer laptops (was hardcoded to /Users/cianmacandeisigh/... which only
# worked on the original developer's machine).
#
# The dev override (`compose.dev.yaml`) replaces this with `/dev/null` so the
# sidecar healthcheck passes even without the real secret file present.
secrets:
  infisical_secret:
    file: ${INFISICAL_SECRET_FILE:-./infisical_secret}

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  lakehouse-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=700
