# =============================================================================
# Drop - Gaming Library (Drop-OSS)
# =============================================================================
# Self-hosted personal gaming library / collection manager.
# Source: https://github.com/Drop-OSS/drop
#
# Phase 0 of the `retro-educational-game-asset-pipeline-v1` change:
# this stack was previously pinned to the wrong upstream image
# (`getcatch/drop` — a marketing dashboard). Replaced with the
# canonical Drop-OSS drop. The retro pipeline reads entries from
# Drop via `meaisinfhoghlaim/dlt/retro/library.py`.
# =============================================================================

name: drop

services:
  drop:
    image: ghcr.io/drop-oss/drop:latest
    container_name: drop
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "${DROP_PORT:-3000}:3000"

    volumes:
      - drop-data:/app/data

    environment:
      - TZ=${TZ:-UTC}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tools

volumes:
  drop-data:

networks:
  tools:
    external: true
