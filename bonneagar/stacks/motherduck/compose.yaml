# =============================================================================
# MOTHERDUCK - Managed DuckLake Lakehouse (SaaS reference)
# =============================================================================
# MotherDuck (https://motherduck.com) is a **managed** DuckDB lakehouse
# delivered as a cloud SaaS — there is **no container** to deploy
# locally. The Bunchloch workload host connects to
# `md:oideachais` (the shared MotherDuck database) over the public
# HTTPS API using a per-user service-account token.
#
# This directory exists so the `bun run validate-stacks` GOLD_STANDARD
# gate (every `bonneagar/stacks/<name>/` subdirectory must contain at
# least one `.yaml` file) reports a clean PASS for the motherduck
# "stack reference", and so future work has a place to land:
#
#   - MotherDuck Dives (`*.py` or `*.sql` — saved in `dives/`)
#   - MotherDuck Flights (`*.py` — saved in `flights/`)
#   - MotherDuck REST API client (`*.py`)
#   - per-subject DLT pipelines that fan-out to MotherDuck + LanceDB
#
# The `dives/` + `flights/` subtrees are the canonical
# (already-existing) v4 stores — preserved here.
#
# Bring-up is "token round-trip", not container:
#   1. Provision a MotherDuck service account at
#      https://app.motherduck.com/settings/service-accounts
#   2. Add `MOTHERDUCK_TOKEN=...` to the `dev-baile` Infisical vault
#      under the `motherduck/` folder
#   3. Test the connection:
#      duckdb.connect("md:oideachais?motherduck_token=$MOTHERDUCK_TOKEN")
#   4. Run a canonical BIEP Flight (see `flights/`).
#
# KCG integration surface:
#   - BIEP Dives: 4 saved MotherDuck Dives under `dives/`
#     (lc_syllabus_topics + lc_exam_difficulty + lc_marking_complexity +
#     gov_circulars_archive) — the 4 BIEP MotherDuck Flights
#   - BIEP Flights: scheduled Python jobs that backfill BAML rows
#     onto the `oideachais.lc.*` MotherDuck schemas
#   - CocoIndex vector targets: 7 v1 CocoIndex Apps fan out to both
#     MotherDuck (BIEP structured tables) AND LanceDB (vector embeddings)
# -----------------------------------------------------------------------------
name: motherduck
services: {}
