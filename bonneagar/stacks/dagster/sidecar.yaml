services:
  locket:
    image: ghcr.io/cianfhoghlaim/locket-shim:infisical-0.2.1
    environment:
      LOCKET_FALLBACK_FILE: /run/secrets/locket/env-fallback.env
    container_name: dagster-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "--provider=infisical"
      - "--infisical-client-id=$${INFISICAL_CLIENT_ID}"
      - "--infisical-client-secret=file:/run/secrets/infisical_secret"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=${LOCKET_MODE:-watch}"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - ${INFISICAL_FALLBACK_FILE}:/run/secrets/locket/env-fallback.env:ro
      - stack-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "/locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stack

  # dagster webserver needs the secrets
  # Note: the `env_file: /run/secrets/locket/secrets.env` was removed for
  # dev mode compatibility (the no-op alpine locket doesn't create that
  # tmpfs; in production the real locket + tmpfs would be in place). The
  # dev overlay's compose.dev.yaml provides the env vars directly via
  # `env_file: .env.dev` + `environment:` overrides.
  dagster:
    depends_on:
      locket:
        condition: service_healthy

  # dagster-daemon (schedules, sensors, run queue)
  # Note: env_file removed for dev mode (see comment on dagster webserver).
  dagster-daemon:
    depends_on:
      locket:
        condition: service_healthy

secrets:
  infisical_secret:
    file: $${INFISICAL_SECRET_FILE:-../../infisical_secret}

volumes:
  stack-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=700

networks:
  stack:
    driver: bridge
