# =============================================================================
# DAGSTER UNIFIED - Production Stack
# =============================================================================
# Runs the unified Dagster instance for the cianfhoghlaim data platform.
# Connects to the lakehouse for DuckLake / Garage S3 storage.
#
# USAGE:
#   Development:  docker compose --env-file .env.local up -d
#   Production:   docker compose -f compose.yaml -f sidecar.yaml up -d
#                 (Locket resolves secrets from Infisical at runtime)
# =============================================================================

name: dagster

services:
  # ---------------------------------------------------------------------------
  # DAGSTER WEBSERVER
  # ---------------------------------------------------------------------------
  dagster:
    # CHANGED 2026-08-22 (lakehouse-observability-stacks-modernization-v1):
    # Pinned to the OFFICIAL `dagster/dagster-webserver:1.13.18` (latest
    # stable). Replaces the locally-built `dagster-local:latest` image (which
    # required a separate Dockerfile build step). Dagster 1.13+ ships:
    # - Components scaffolding pattern (per
    #   https://docs.dagster.io/concepts/components)
    # - Declarative Automation (per
    #   https://docs.dagster.io/concepts/automation)
    # - Improved OTel support
    image: dagster/dagster-webserver:1.13.18
    container_name: dagster-unified
    restart: unless-stopped
    # ADDED 2026-08-22 (lakehouse-observability-stacks-modernization-v1):
    # Dagster 1.13+ image runs as non-root (uid 1000). The dagster-home volume
    # is mounted with matching ownership. Removed the dev-only `user: "0:0"`
    # workaround that was needed for the locally-built `dagster-local` image.
    # Note: Dagster daemon is OFFICIALLY SINGLETON (1 replica max).
    ports:
      - "${DAGSTER_PORT:-3335}:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/home
      # ADDED 2026-08-22: Point Dagster at the lakehouse otel-collector for
      # OTel fan-out (was previously the logfire stack, now the unified collector).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      # DuckLake (via the cianfhoghlaim DLT destinations factory)
      USE_DUCKLAKE: ${USE_DUCKLAKE:-true}
      DUCKLAKE_POSTGRES_HOST: ${DUCKLAKE_POSTGRES_HOST:-lakehouse-postgres}
      DUCKLAKE_POSTGRES_PORT: ${DUCKLAKE_POSTGRES_PORT:-5432}
      DUCKLAKE_POSTGRES_USER: ${DUCKLAKE_POSTGRES_USER:-lakekeeper}
      DUCKLAKE_POSTGRES_PASSWORD: ${DUCKLAKE_POSTGRES_PASSWORD:-devpassword}
      DLT_ENVIRONMENT: ${DLT_ENVIRONMENT:-development}
      # Garage S3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-GK1601dev}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dev-secret-key-not-for-prod}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://lakehouse-garage:3900}
      AWS_REGION: ${AWS_REGION:-garage}
      # LLM (consumed by BAML + agents that Dagster orchestrates)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-needed-in-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-1234}
      # LiteLLM gateway (the canonical LLM chokepoint)
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
      # Langfuse Observability
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://langfuse.cianfhoghlaim.ie}
      # LanceDB (the lakehouse-lance-namespace REST adapter)
      LANCEDB_URI: ${LANCEDB_URI:-rest://lakehouse-lance-namespace:8182}
    volumes:
      - dagster-storage:/opt/dagster/storage
      - dagster-home:/opt/dagster/home
      # ADDED 2026-08-22: Mount declarative config files
      - ./dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./workspace.yaml:/opt/dagster/home/workspace.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/server_info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    networks:
      - cianfhoghlaim
      - lakehouse

  # ---------------------------------------------------------------------------
  # DAGSTER DAEMON - Schedules, Sensors, Run Queue
  # ---------------------------------------------------------------------------
  # CHANGED 2026-08-22 (lakehouse-observability-stacks-modernization-v1):
  # Pinned to OFFICIAL `dagster/dagster-daemon:1.13.18`. Dagster daemon is
  # OFFICIALLY SINGLETON (1 replica max). deploy.replicas: 1 is implicit.
  dagster-daemon:
    image: dagster/dagster-daemon:1.13.18
    container_name: dagster-daemon
    restart: unless-stopped
    command: ["dagster-daemon", "run"]
    environment:
      DAGSTER_HOME: /opt/dagster/home
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      USE_DUCKLAKE: ${USE_DUCKLAKE:-true}
      DUCKLAKE_POSTGRES_HOST: ${DUCKLAKE_POSTGRES_HOST:-lakehouse-postgres}
      DUCKLAKE_POSTGRES_PORT: ${DUCKLAKE_POSTGRES_PORT:-5432}
      DUCKLAKE_POSTGRES_USER: ${DUCKLAKE_POSTGRES_USER:-lakekeeper}
      DUCKLAKE_POSTGRES_PASSWORD: ${DUCKLAKE_POSTGRES_PASSWORD:-devpassword}
      DLT_ENVIRONMENT: ${DLT_ENVIRONMENT:-development}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-GK1601dev}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dev-secret-key-not-for-prod}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://lakehouse-garage:3900}
      AWS_REGION: ${AWS_REGION:-garage}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-needed-in-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-1234}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
      LANCEDB_URI: ${LANCEDB_URI:-rest://lakehouse-lance-namespace:8182}
    volumes:
      - dagster-storage:/opt/dagster/storage
      - dagster-home:/opt/dagster/home
      # ADDED 2026-08-22: Mount daemon-specific config + workspace config
      - ./dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./dagster-daemon.yaml:/opt/dagster/home/dagster-daemon.yaml:ro
      - ./workspace.yaml:/opt/dagster/home/workspace.yaml:ro
    depends_on:
      dagster:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dagster-daemon"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
      # Dagster daemon is officially SINGLETON (1 replica max)
      replicas: 1
    networks:
      - cianfhoghlaim
      - lakehouse

volumes:
  dagster-storage:
  dagster-home:

networks:
  cianfhoghlaim:
    driver: bridge
  lakehouse:
    name: lakehouse_lakehouse
    external: true
