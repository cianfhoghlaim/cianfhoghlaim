# =============================================================================
# UNSTRACT - Locket Sidecar
# =============================================================================
# Mirrors the canonical GOLD_STANDARD Locket sidecar pattern
# (per infrastructure-stacks/spec.md §"Locket Sidecar Contract"):
#   - user 65532:65532 (nobody:nogroup)
#   - no-new-privileges: true
#   - cap_drop: ALL
#   - read_only: true
#   - tmpfs mode 700 uid=65532 gid=65532
#   - secrets mounted at /run/secrets/locket (root-only)
#
# This sidecar reads `secrets.env` (canonical Locket-format
# `infisical://dev-baile/<key>` URIs) and materializes them at
# `/run/secrets/locket/secrets.env` so the 15 Unstract services can
# `env_file: /run/secrets/locket/secrets.env` without ever seeing plaintext.
#
# USAGE:
#   docker compose -f compose.yaml -f sidecar.yaml up -d
# =============================================================================

services:
  locket:
    image: ghcr.io/cianfhoghlaim/locket-shim:infisical-0.2.1
    environment:
      LOCKET_FALLBACK_FILE: /run/secrets/locket/env-fallback.env
    container_name: unstract-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /run/secrets/locket:size=1m,mode=0700,uid=65532,gid=65532
    command:
      - "--provider=infisical"
      - "--infisical-client-id=$${INFISICAL_CLIENT_ID}"
      - "--infisical-client-secret=file:/run/secrets/infisical_secret"
      - "--infisical-default-environment=$${INFISICAL_ENVIRONMENT:-dev}"
      - "--infisical-default-project-id=$${INFISICAL_PROJECT_ID:-}"
      - "--infisical-url=$${INFISICAL_URL:-http://infisical-backend:8080}"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=$${LOCKET_MODE:-watch}"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - ${INFISICAL_FALLBACK_FILE}:/run/secrets/locket/env-fallback.env:ro
    healthcheck:
      test: ["CMD", "/locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - bunchloch-infra

  # All Unstract services inherit the locket-secrets volume
  backend:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  worker-metrics:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  worker-ide-callback:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  celery-beat:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  celery-flower:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  frontend:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  platform-service:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  x2text-service:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  runner:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  worker-api-deployment-v2:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  worker-callback-v2:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  worker-file-processing-v2:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  worker-general-v2:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  worker-notification-v2:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
  worker-log-consumer-v2:
