name: uo-portal-vault

# =============================================================================
# UO-PORTAL-VAULT — Per-User Credential Vault for regexam.nuigalway.ie + Canvas
# =============================================================================
# Per openspec/changes/2026-09-23-consolidate-uog-tertiary-pipeline-v1/.
#
# The per-user credential vault daemon. Stores the per-user M365
# AppProxy cookies + the Canvas PAT (where available) encrypted on
# the bunchloch filesystem at
# /stedding/user_profiles/<user_id>/{regexam,canvas}/.
#
# The 1-time manual unlock procedure
# (`komodo run unlock-uo-portal --user <u> --service {regexam,canvas}`)
# opens Chromium + drives the M365 login + MFA + captures the cookies
# + writes them to the persistent profile.
#
# Subsequent DLT runs (regexam_papers.py + canvas_materials.py) read
# the cookies / tokens from this vault.
#
# Per-user Infisical secret paths:
#   infisical://dev-baile/cianfhoghlaim/regexam-nuig/<user_id>/{username,password}
#   infisical://dev-baile/cianfhoghlaim/canvas-nuig/<user_id>/{username,password,pat}
# =============================================================================

services:
  uo-portal-vault:
    # Pinned 2026-09-23 (per the umbrella openspec change)
    image: ghcr.io/cianfhoghlaim/uo-portal-vault:2026.09.23
    container_name: uo-portal-vault
    restart: unless-stopped
    command:
      - "uvicorn"
      - "uo_portal_vault.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8765"
    env_file:
      - secrets.env
    volumes:
      # The per-user cookie/token state lives on the bunchloch host
      # filesystem (NOT bind-mounted from a transient container dir).
      - /stedding/user_profiles:/var/lib/uo-portal-vault:rw
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - uo-portal-vault-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  uo-portal-vault-net:
    driver: bridge
    name: uo-portal-vault-net
