name: uo-portal-vault-sidecar

# =============================================================================
# UO-PORTAL-VAULT SIDECAR — Locket + Pangolin
# =============================================================================
# Per the 6-file GOLD_STANDARD pattern. Locket reads the per-user
# Infisical secrets at startup; Pangolin exposes the vault's
# internal API to the agent runtime.
# =============================================================================

services:
  uo-portal-vault:
    labels:
      locket.inficorn: "true"
      locket.inficorn.project: "cianfhoghlaim"
      locket.inficorn.environment: "dev-baile"
      locket.inficorn.secret-prefix: "uo-portal"
    environment:
      # The per-user credentials are resolved at runtime from
      # /stedding/user_profiles/<user>/credentials.json (written by
      # the unlock procedure). The Infisical secret path is templated:
      REGEXAM_NUIG_USERNAME: "${infisical://dev-baile/cianfhoghlaim/regexam-nuig/${UO_PORTAL_USER}/username}"
      REGEXAM_NUIG_PASSWORD: "${infisical://dev-baile/cianfhoghlaim/regexam-nuig/${UO_PORTAL_USER}/password}"
      CANVAS_NUIG_USERNAME: "${infisical://dev-baile/cianfhoghlaim/canvas-nuig/${UO_PORTAL_USER}/username}"
      CANVAS_NUIG_PASSWORD: "${infisical://dev-baile/cianfhoghlaim/canvas-nuig/${UO_PORTAL_USER}/password}"
      CANVAS_NUIG_PAT: "${infisical://dev-baile/cianfhoghlaim/canvas-nuig/${UO_PORTAL_USER}/pat}"
    networks:
      - uo-portal-vault-net
      - pangolin-private

networks:
  uo-portal-vault-net:
    external: true
    name: uo-portal-vault-net
  pangolin-private:
    external: true
    name: pangolin-private
