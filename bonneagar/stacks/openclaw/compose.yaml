# =============================================================================
# OPENCLAW — Channel-Fanout Gateway (arm1-oci)
# =============================================================================
# Long-running gateway that exposes the meaisínfhoghlaim 12-agent fleet
# through 8 channels (Telegram, Slack, Discord, WhatsApp, WebChat, MS Teams
# in v1; Signal/iMessage/Matrix scaffolded but disabled).
#
# USAGE:
#   Development:  docker compose --env-file ../../.env.local up -d
#   Production:   docker compose -f compose.yaml -f sidecar.yaml up -d
#
# Security model (3-layer):
#   1. Pangolin TinyAuth (Pocket ID OIDC) at the Traefik layer
#   2. openclaw dmPolicy="pairing" at the gateway layer
#   3. openclaw allowFrom allowlist (per-channel) at the routing layer
#
# Image pinning: ghcr.io/openclaw/openclaw:<semver>@sha256:<digest>
# (no :latest). Update on the monthly renovate cycle.
# =============================================================================

name: openclaw

services:
  # ---------------------------------------------------------------------------
  # OPENCLAW GATEWAY
  # ---------------------------------------------------------------------------
  openclaw:
    # Pinned 2026-07-30 (per the 2026-07-30-pre-deploy-blockers-resolution-v1
    # openspec change — closes GitHub issue #81). The SHA256 digest was
    # fetched via `bash scripts/fetch-image-digest.sh
    # ghcr.io/openclaw/openclaw:2026.2.6` (docker buildx imagetools inspect).
    # Pin format: `ghcr.io/<org>/<repo>:<tag>@sha256:<64-hex>`.
    # Update on the monthly renovate cycle (re-run the fetch script).
    image: ghcr.io/openclaw/openclaw:2026.2.6@sha256:4efc318a6570e4aac66d8ce0ab94c9a577c2f5d4afe914aa73e9678f82799e26
    container_name: openclaw
    # NOTE: the gateway MUST be started with `--bind lan`. The default binds
    # container loopback, which Docker cannot port-forward to: the port appears
    # published on the host while every connection is refused, and the Pangolin
    # private resource 502s. The host-side publish below is still 127.0.0.1
    # only, so `lan` does not expose anything on the local network.
    #
    # The effective command lives in sidecar.yaml (it wraps this to source the
    # Locket secrets first) and that overlay WINS. Change it there, not here.
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--allow-unconfigured"]
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    ports:
      # WebSocket RPC — exposed to Pangolin (Traefik routes 18789)
      - "127.0.0.1:18789:18789"
      # Bridge — internal only (used by the gateway itself)
      - "127.0.0.1:18790:18790"
      # MS Teams bridge — internal only (Azure Bot Framework outbound webhook)
      - "127.0.0.1:3978:3978"
    environment:
      # State directory (workaround for upstream issue #77436: host-path leak
      # into container-side OPENCLAW_STATE_DIR causing EACCES)
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG: /home/node/.openclaw/config/openclaw.json
      OPENCLAW_PORT: "18789"
      OPENCLAW_BRIDGE_PORT: "18790"
      OPENCLAW_LOG_LEVEL: ${OPENCLAW_LOG_LEVEL:-info}
      OPENCLAW_DM_POLICY: ${OPENCLAW_DM_POLICY:-pairing}
      # LLM provider — LiteLLM is the only path (M3 chokepoint)
      # OPENAI_BASE_URL + OPENAI_API_KEY are injected by Locket from secrets.env
      # Observability
      OTEL_SERVICE_NAME: openclaw-gateway
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # Langfuse OTLP endpoint is injected by Locket (secrets.env)
    volumes:
      - openclaw-state:/home/node/.openclaw/state
      - ./config:/home/node/.openclaw/config:ro
      - ./skills-curated:/home/node/.openclaw/workspace/skills:ro
    # depends_on locket is declared in sidecar.yaml (canonical pattern)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:18789/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - cianfhoghlaim

volumes:
  openclaw-state:
    driver: local

networks:
  cianfhoghlaim:
    external: true
    name: cianfhoghlaim