# OpenClaw — local dev override (mirrors langfuse/litellm dev pattern)
# ----------------------------------------------------------------------------
# Mirrors the langfuse/cognee/litellm dev override pattern:
#   1. No-op locket sidecar (alpine) so `depends_on: locket: service_healthy`
#      resolves without booting the real Infisical-injection sidecar.
#   2. `env_file: ../../../.env` (mise-hydrated local .env) is mounted
#      so secrets reach the containers directly.
#   3. The 6 channels (Telegram/Slack/Discord/WhatsApp/WebChat/Teams) boot
#      even with empty tokens — the gateway logs "missing token" for each
#      disabled channel but the WebChat UI is reachable.
#
# Usage:
#   docker compose \
#     --env-file ../../../.env \
#     -f stacks/openclaw/compose.yaml \
#     -f stacks/openclaw/sidecar.yaml \
#     -f stacks/openclaw/compose.dev.yaml \
#     up -d
# ----------------------------------------------------------------------------

services:
  locket:
    image: alpine:3.20
    container_name: openclaw-locket-dev
    restart: "no"
    command:
      - sh
      - -c
      - "echo '[dev] no-op openclaw locket — secrets from .env via env_file'; sleep infinity"
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default

  # OpenClaw gateway — dev override of compose.yaml's environment block
  openclaw:
    depends_on:
      locket:
        condition: service_started
    env_file:
      - ../../../.env
    environment:
      # State dir (matches the compose.yaml's workaround)
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG: /home/node/.openclaw/config/openclaw.json
      OPENCLAW_PORT: "18789"
      OPENCLAW_BRIDGE_PORT: "18790"
      OPENCLAW_LOG_LEVEL: ${OPENCLAW_LOG_LEVEL:-info}
      OPENCLAW_DM_POLICY: ${OPENCLAW_DM_POLICY:-pairing}
      # LLM provider — LiteLLM chokepoint
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-2026-xxx}
      # Gateway admin token
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      # Channel tokens (all empty in dev — channels will report "missing token")
      TELEGRAM_BOT_TOKEN: ${OPENCLAW_TELEGRAM_BOT_TOKEN:-}
      SLACK_BOT_TOKEN: ${OPENCLAW_SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${OPENCLAW_SLACK_APP_TOKEN:-}
      DISCORD_BOT_TOKEN: ${OPENCLAW_DISCORD_BOT_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${OPENCLAW_WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${OPENCLAW_WHATSAPP_PHONE_NUMBER_ID:-}
      TEAMS_BOT_TOKEN: ${OPENCLAW_TEAMS_BOT_TOKEN:-}
      # Observability
      OTEL_SERVICE_NAME: openclaw-gateway
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://langfuse-web:3000/api/public/otel}
    networks:
      - default
      - cianfhoghlaim

# Top-level secrets: block from sidecar.yaml references the production
# Infisical secret file (../../infisical_secret). Override with /dev/null
# so the locket sidecar doesn't fail to mount a missing file.
secrets:
  infisical_secret:
    file: /dev/null

# Top-level networks: block in the base compose declares `cianfhoghlaim`
# as external. In dev mode on bunchloch, this network IS created (by the
# lakehouse/litellm/etc. cold-boot), so we keep it external. The previous
# "external: false" override broke DNS for sibling services like dragonfly.
networks:
  cianfhoghlaim:
    external: true
    name: cianfhoghlaim