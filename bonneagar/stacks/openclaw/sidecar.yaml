services:
  locket:
    image: ghcr.io/bpbradley/locket:infisical
    container_name: openclaw-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # The 4 runtime-configurable values (INFISICAL_URL, INFISICAL_CLIENT_ID,
    # INFISICAL_PROJECT_ID, INFISICAL_ENV) are passed via `environment:` below
    # so locket picks them up from the container env. The 2 static values
    # (INFISICAL_DEFAULT_PATH, INFISICAL_CLIENT_SECRET) are baked into the
    # command. The LOCKET_MODE is also env-driven.
    environment:
      INFISICAL_URL: ${INFISICAL_URL}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      # Locket uses the `INFISICAL_DEFAULT_*` prefix for project + env defaults
      # (the `--infisical-default-project-id` / `--infisical-default-environment`
      # CLI flags read these env vars). The `INFISICAL_PROJECT_ID` / `INFISICAL_ENV`
      # env vars are kept for other consumers (e.g. the openclaw container itself).
      INFISICAL_DEFAULT_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_DEFAULT_ENVIRONMENT: ${INFISICAL_ENV}
    command:
      - "--provider=infisical"
      - "--infisical-client-secret=file:/run/secrets/infisical_secret"
      # NOTE: --infisical-default-project-id and --infisical-default-environment
      # are intentionally NOT passed as CLI flags — locket reads them from the
      # INFISICAL_PROJECT_ID + INFISICAL_ENV env vars (declared in the
      # `environment:` block above). This keeps the sidecar.yaml portable
      # across the OCI vault (project f3cff583-...) and the bunchloch-local
      # fallback vault (project d900f50a-...) — the value flows from
      # .env.local, NOT from a hardcoded UUID in compose.
      - "--infisical-default-path=/openclaw"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=${LOCKET_MODE:-watch}"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - stack-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stack

  openclaw:
    depends_on:
      locket:
        condition: service_healthy
    # No user: override — the upstream Dockerfile sets USER 1000:1000.
    # Overriding to 65532:65532 (nobody) breaks Docker's tmpfs mode:1777
    # security policy under no-new-privileges (docker daemon refuses
    # the world-writable tmpfs for an unprivileged user). The tmpfs
    # mode:1777 is required by the openclaw binary for its /tmp scratch
    # space. The locket stack-secrets volume is world-readable (mode
    # 755 in the volumes: driver_opts below) so user 1000 can still
    # read /run/secrets/locket/secrets.env.
    volumes:
      - stack-secrets:/run/secrets/locket:ro
    # The /run/secrets/locket/secrets.env file is materialized by the locket
    # sidecar at container start. We source it via a shell wrapper around the
    # upstream `node openclaw.mjs gateway` CMD (Dockerfile line 67-68). This
    # sidesteps docker compose's parse-time env_file validation (which would
    # reject /run/secrets/* even though it's a runtime path).
    command:
      - /bin/sh
      - -c
      - |
        set -a
        . /run/secrets/locket/secrets.env
        set +a
        exec node openclaw.mjs gateway --allow-unconfigured

  # Locket chmod init — runs once, after the locket sidecar is healthy.
  # The locket binary (uid 65532) writes /run/secrets/locket/secrets.env
  # with mode 600 (user-only). This init container chmod's the file to
  # mode 644 so the consumer (openclaw, user 1000) can read it.
  openclaw-chmod-init:
    image: alpine:3.20
    user: "0:0"
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /run/secrets/locket/secrets.env ]; then
          chmod 644 /run/secrets/locket/secrets.env
          echo "OK: /run/secrets/locket/secrets.env chmod'd to 644"
        else
          echo "ERROR: /run/secrets/locket/secrets.env not found"
          exit 1
        fi
    restart: "no"
    networks:
      - stack

secrets:
  infisical_secret:
    file: ${INFISICAL_SECRET_FILE:-../../infisical_secret}

volumes:
  stack-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      # mode 755 (not 700) so the openclaw container (uid 1000) can read
      # /run/secrets/locket/secrets.env. The locket sidecar (uid 65532)
      # is the only writer; the openclaw container mounts the volume
      # read-only.
      o: uid=65532,gid=65532,mode=755

networks:
  stack:
    driver: bridge