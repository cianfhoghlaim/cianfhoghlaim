# Marimo — local dev override
# ----------------------------------------------------------------------------
# Mirrors the dagster/mlflow dev override pattern:
#   1. `env_file: .env.dev` (this stack) provides all the dev secrets
#      pointing at the lakehouse services (DUCKLAKE_POSTGRES_HOST,
#      LANCEDB_URI, COGNEE_BASE, etc.) so the marimo notebooks in
#      cianfhoghlaim/notebooks/dashboards/duckdb/ can query the lakehouse
#      end-to-end.
#   2. The marimo service already joins the `cianfhoghlaim` and
#      `lakehouse` external networks (per the base compose), so it can
#      reach `lakehouse-postgres`, `lakehouse-lance-namespace`, etc. via
#      docker DNS.
#   3. No locket sidecar is required (marimo has no LLM auth in the
#      base compose).
#
# Usage:
#   docker compose \
#     -f stacks/marimo/compose.yaml \
#     -f stacks/marimo/compose.dev.yaml \
#     up -d
# ----------------------------------------------------------------------------

services:
  marimo:
    # Inject the dev env so the marimo container can resolve
    # DUCKLAKE_POSTGRES_HOST=lakehouse-postgres (not the container's
    # own localhost, which is the marimo container itself).
    env_file:
      - .env.dev
    # Keep the existing notebooks volume mount + port mapping.
    networks:
      - cianfhoghlaim
      - lakehouse
