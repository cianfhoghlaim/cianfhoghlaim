name: marimo
services:
  marimo:
    # Pinned + fixed registry path 2026-07-02 (was `marimo/marimo:latest` — that
    # image does NOT exist on Docker Hub; the upstream publishes to
    # `ghcr.io/marimo-team/marimo`; latest available GHCR tag is 0.11.19, which
    # lags the marimo GitHub release 0.23.12 by several minor versions because
    # marimo-team does not auto-publish every release to GHCR).
    image: ghcr.io/marimo-team/marimo:0.11.19
    container_name: marimo
    restart: unless-stopped
    ports: ["2718:2718"]
    command: ["edit", "/notebooks/dashboards/mmo/mission_control.py", "--host=0.0.0.0", "--port=2718", "--headless"]
    volumes:
      # Fixed volume path 2026-07-02 (was `../../oideachais/notebooks` — that
      # path no longer exists after the 2026-06-28 v4 consolidation moved
      # all 4 quadrants into the single `cianfhoghlaim/` package; canonical
      # notebooks directory is now `../../cianfhoghlaim/notebooks/`).
      - ../../cianfhoghlaim/notebooks:/notebooks:ro
      - marimo_data:/home/marimo
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2718/api/health || exit 1"]
      interval: 30s; timeout: 10s; retries: 3; start_period: 15s
    deploy:
      resources:
        limits: {memory: 2G, cpus: '2'}
    networks: [cianfhoghlaim, lakehouse]
volumes:
  marimo_data: {driver: local}
networks:
  cianfhoghlaim: {driver: bridge}
  lakehouse: {name: lakehouse_lakehouse, external: true}
