# =============================================================================
# LITELLM — Pangolin Traefik Routing Overlay
# =============================================================================
# Routes litellm.cianfhoghlaim.ie → litellm container at port 4000.
# TinyAuth (Pocket ID OIDC) + secure-headers middlewares are applied at
# the Traefik layer; the Pangolin blueprint (blueprint.yaml) declares
# RBAC roles only.

http:
  routers:
    litellm:
      entryPoints:
        - https
      rule: "Host(`litellm.cianfhoghlaim.ie`)"
      service: litellm
      tls:
        certResolver: letsencrypt
      middlewares:
        - tinyauth
        - secure-headers
      priority: 100

  services:
    litellm:
      loadBalancer:
        servers:
          - url: "http://litellm:4000"
        healthCheck:
          path: /health/liveliness
          interval: 30s
          timeout: 3s