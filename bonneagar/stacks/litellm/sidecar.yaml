services:
  locket:
    image: ghcr.io/bpbradley/locket:infisical
    container_name: litellm-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      INFISICAL_URL: ${INFISICAL_URL}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_DEFAULT_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_DEFAULT_ENVIRONMENT: ${INFISICAL_ENV}
    command:
      - "--provider=infisical"
      - "--infisical-client-secret=file:/run/secrets/infisical_secret"
      - "--infisical-default-path=/litellm"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=${LOCKET_MODE:-watch}"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - stack-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stack

  # litellm service — receives resolved secrets via the .env file at
  # ~/.komodo-stacks/litellm/.env (auto-loaded by docker compose). The
  # locket sidecar is also mounted (read-only) for the future when the
  # litellm service is upgraded to source /run/secrets/locket/secrets.env.
  litellm:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro

secrets:
  infisical_secret:
    file: ${INFISICAL_SECRET_FILE:-/Users/cianmacandeisigh/.locket/infisical_secret}

volumes:
  stack-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=755

networks:
  stack:
    driver: bridge