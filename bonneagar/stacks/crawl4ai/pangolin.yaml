# =============================================================================
# crawl4ai — Pangolin Traefik Routing Overlay (post-v0.9 MCP integration)
# =============================================================================
# Per openspec/changes/2026-08-21-complete-browserbase-archive-and-crawl4ai-mcp-v1
# Exposes the native crawl4ai v0.9.x MCP server (port 11235) via 3 private
# resources for SSE, WebSocket, and schema introspection.
#
# TinyAuth protects the route; the JWT bearer token in CRAWL4AI_JWT_SECRET
# (sourced from Infisical) provides the second auth layer.

pangolin:
  private-resources:
    crawl4ai-mcp-sse:
      name: crawl4ai-mcp-sse
      mode: http
      full-domain: crawl4ai-mcp.cianfhoghlaim.ie
      destination-port: 11235
      protocol: http
      roles[0]: tinyauth@file
    crawl4ai-mcp-ws:
      name: crawl4ai-mcp-ws
      mode: http
      full-domain: crawl4ai-mcp.cianfhoghlaim.ie
      destination-port: 11235
      protocol: http
      roles[0]: tinyauth@file
    crawl4ai-mcp-schema:
      name: crawl4ai-mcp-schema
      mode: http
      full-domain: crawl4ai-mcp.cianfhoghlaim.ie
      destination-port: 11235
      protocol: http
      roles[0]: tinyauth@file