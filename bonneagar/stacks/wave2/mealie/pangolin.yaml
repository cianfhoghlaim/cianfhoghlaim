# Mealie — Pangolin private-resource route
# Routes mealie.cianfhoghlaim.ie → mealie container at port 9925.
# TinyAuth Member role required.
pangolin:
  private-resources:
    mealie:
      name: mealie
      mode: http
      full-domain: mealie.cianfhoghlaim.ie
      destination-port: 9925
      protocol: http
      roles[0]: secure-headers@file
