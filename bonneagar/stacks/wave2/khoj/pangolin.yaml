# Khoj — Pangolin private-resource route
# Routes khoj.cianfhoghlaim.ie → khoj container at port 42110.
# TinyAuth Member role required.
pangolin:
  private-resources:
    khoj:
      name: khoj
      mode: http
      full-domain: khoj.cianfhoghlaim.ie
      destination-port: 42110
      protocol: http
      roles[0]: secure-headers@file
