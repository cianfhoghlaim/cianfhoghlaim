# Khoj — local dev override
# ----------------------------------------------------------------------------
# No-op locket sidecar (alpine) so `depends_on: locket: service_healthy`
# resolves without booting the real Infisical-injection sidecar.
# ----------------------------------------------------------------------------

services:
  locket:
    image: alpine:3.20
    container_name: khoj-locket-dev
    restart: "no"
    command: ["sh", "-c", "echo '[dev] no-op khoj locket'; sleep infinity"]
    environment:
      INFISICAL_CLIENT_ID: ${INFISICAL_LOCKET_CLIENT_ID:-placeholder}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_LOCKET_CLIENT_SECRET:-placeholder}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-placeholder}
      LOCKET_MODE: watch
    networks:
      - cianfhoghlaim
      - lakehouse

  khoj:
    depends_on:
      locket:
        condition: service_started
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
      POSTGRES_HOST: lakehouse-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: khoj
      DATABASE_URL: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:?must be set}@lakehouse-postgres:5432/khoj
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-1234}
    networks:
      - cianfhoghlaim
      - lakehouse

secrets:
  infisical_secret:
    file: /dev/null
  khoj_infisical_secret:
    file: /dev/null
