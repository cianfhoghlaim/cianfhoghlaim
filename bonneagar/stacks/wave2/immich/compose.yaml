# =============================================================================
# IMMICH - Self-hosted Photo Management (bunchloch)
# =============================================================================
# Self-hosted Google Photos replacement. Immich provides photo +
# video backup, ML-powered face/object recognition, and timeline
# browsing.
#
# Architecture:
#   bunchloch (MacBook M4) — immich-server + immich-machine-learning
#     - 2283 — Web UI (Immich)
#
# Immich is referenced in the `apple-photos-ingestion` skill as the
# downstream consumer of the Apple Photos library extraction (via
# the `oideachais-mcp-filesystem` MCP server).
#
# USAGE:
#   Production:  docker compose -f compose.yaml -f sidecar.yaml up -d
#   Development: docker compose -f compose.yaml -f compose.dev.yaml \
#                                -f sidecar.yaml up -d
# =============================================================================

name: immich

services:
  # ---------------------------------------------------------------------------
  # IMMICH SERVER
  # ---------------------------------------------------------------------------
  immich-server:
    # Pinned 2026-07-08 (ghcr.io/immich-app/immich-server:release-1.111.0
    # on GHCR — public upstream image, no org-private image used).
    # Multi-arch supported.
    image: ghcr.io/immich-app/immich-server:release-1.111.0
    container_name: immich-server
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    environment:
      DB_HOSTNAME: lakehouse-postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-lakekeeper}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: lakehouse-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
    depends_on: []
    volumes:
      - immich-upload:/usr/src/app/upload
      - immich-profile:/usr/src/app/profile
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://localhost:2283/api/server/ping || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - cianfhoghlaim
      - lakehouse

  # ---------------------------------------------------------------------------
  # IMMICH MACHINE LEARNING
  # ---------------------------------------------------------------------------
  immich-machine-learning:
    # Pinned 2026-07-08 (ghcr.io/immich-app/immich-machine-learning:release-1.111.0)
    # Multi-arch supported (linux/amd64,linux/arm64).
    image: ghcr.io/immich-app/immich-machine-learning:release-1.111.0
    container_name: immich-machine-learning
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      MACHINE_LEARNING_WORKERS: "1"
      MACHINE_LEARNING_WORKER_TIMEOUT: "120"
    volumes:
      - immich-model-cache:/cache
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    networks:
      - cianfhoghlaim
      - lakehouse

volumes:
  immich-upload:
    driver: local
  immich-profile:
    driver: local
  immich-model-cache:
    driver: local

networks:
  cianfhoghlaim:
    external: true
    name: cianchoghlaim
  lakehouse:
    name: lakehouse_lakehouse
    external: true
