# =============================================================================
# KAVITA - Ebook + Manga Reader (bunchloch)
# =============================================================================
# Self-hosted ebook + manga reader. Kavita is a fast, lightweight
# reader with OPDS support for cross-device sync (iOS/Android/Kobo).
#
# Architecture:
#   bunchloch (MacBook M4) — kavita (jvmouse/kavita:0.8.6 on :5000)
#     - 5000 — Web UI (Kavita reader)
#
# The Kavita image is multi-arch (linux/amd64,linux/arm64) on
# Docker Hub.
#
# USAGE:
#   Production:  docker compose -f compose.yaml -f sidecar.yaml up -d
#   Development: docker compose -f compose.yaml -f compose.dev.yaml \
#                                -f sidecar.yaml up -d
# =============================================================================

name: kavita

services:
  kavita:
    # Pinned 2026-07-08 (jvmouse/kavita:0.8.6 on Docker Hub — public
    # upstream image, no org-private image used). Multi-arch supported.
    image: jvmouse/kavita:0.8.6
    container_name: kavita
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${KAVITA_PORT:-5000}:5000"
    environment:
      KAVITA_PORT: "5000"
    volumes:
      - kavita-data:/data
      - kavita-config:/config
      - /stedding/library:/library:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-verbose --tries=1 --spider http://localhost:5000/api/Health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - cianfhoghlaim

volumes:
  kavita-data:
    driver: local
  kavita-config:
    driver: local

networks:
  cianfhoghlaim:
    external: true
    name: cianchoghlaim
