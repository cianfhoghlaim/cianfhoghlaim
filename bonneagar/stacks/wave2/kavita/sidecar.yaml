services:
  locket:
    image: ghcr.io/cianfhoghlaim/locket-shim:infisical-0.2.1
    environment:
      LOCKET_FALLBACK_FILE: /run/secrets/locket/env-fallback.env

    container_name: kavita-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "--provider=infisical"
      - "--infisical-client-id=$${INFISICAL_CLIENT_ID}"
      - "--infisical-secret=file:/run/secrets/infisical_secret"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=${LOCKET_MODE:-watch}"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - stack-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "/locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stack

# TODO[2026-08-22-lakehouse-config-and-env-var-hardening-v1]:
# infisical_secret path now reads ${CIANFHOGHLAIM_INFISICAL_SECRET_PATH:-<fallback>}
# (default fallback still pins /Users/cianmacandeisigh/dev/cianfhoghlaim).
# Track the env-var rollout in the 2026-08-22 openspec change tasks.md before
# dropping the hardcoded fallback.
secrets:
  infisical_secret:
    file: ${CIANFHOGHLAIM_INFISICAL_SECRET_PATH:-/Users/cianmacandeisigh/dev/cianfhoghlaim/bonneagar/stacks/infisical/infisical_secret}

volumes:
  stack-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=700

networks:
  stack:
    driver: bridge
