# Kavita — Pangolin private-resource route
# Routes kavita.cianfhoghlaim.ie → kavita container at port 5000.
# TinyAuth Member role required.
pangolin:
  private-resources:
    kavita:
      name: kavita
      mode: http
      full-domain: kavita.cianfhoghlaim.ie
      destination-port: 5000
      protocol: http
      roles[0]: secure-headers@file
