# =============================================================================
# OUTLINE - Team Wiki + Knowledge Base (bunchloch)
# =============================================================================
# Outline is a fast, collaborative knowledge base for your team. It
# supports Markdown editing, nested collections, public sharing,
# and a Slack-style editor.
#
# Architecture:
#   bunchloch (MacBook M4) — outline (outlinewiki/outline:0.78.0 on :3000)
#     - 3000 — Web UI (Outline)
#
# The Outline image is multi-arch (linux/amd64,linux/arm64) on
# Docker Hub.
#
# USAGE:
#   Production:  docker compose -f compose.yaml -f sidecar.yaml up -d
#   Development: docker compose -f compose.yaml -f compose.dev.yaml \
#                                -f sidecar.yaml up -d
# =============================================================================

name: outline

services:
  outline:
    # Pinned 2026-07-08 (outlinewiki/outline:0.78.0 on Docker Hub —
    # public upstream image, no org-private image used). Multi-arch
    # supported.
    image: outlinewiki/outline:0.78.0
    container_name: outline
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${OUTLINE_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:-devpassword}@lakehouse-postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@lakehouse-redis:6379
      NODE_ENV: production
      URL: ${OUTLINE_URL:-https://outline.cianfhoghlaim.ie}
      PORT: "3000"
      SECRET_KEY: ${OUTLINE_SECRET_KEY:?must be set}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:?must be set}
      OIDC_CLIENT_ID: ${OUTLINE_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET}
      OIDC_AUTH_URI: ${OUTLINE_OIDC_AUTH_URI:-https://auth.cianfhoghlaim.ie}
      OIDC_TOKEN_URI: ${OUTLINE_OIDC_TOKEN_URI}
      OIDC_USERINFO_URI: ${OUTLINE_OIDC_USERINFO_URI}
    volumes:
      - outline-data:/var/lib/outline
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-verbose --tries=1 --spider http://localhost:3000/_health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - cianfhoghlaim
      - lakehouse

volumes:
  outline-data:
    driver: local

networks:
  cianfhoghlaim:
    external: true
    name: cianchoghlaim
  lakehouse:
    name: lakehouse_lakehouse
    external: true
