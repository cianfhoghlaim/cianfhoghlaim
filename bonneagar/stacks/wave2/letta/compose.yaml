# =============================================================================
# LETTA - Stateful Agent Memory Layer (bunchloch)
# =============================================================================
# The Letta memory layer backs the 3 agent-facing surfaces
# (OpenClaw + OpenChamber + Hermes) so user-level memory persists
# across sessions — per the `agent-platform-cluster` spec
# Requirement: Letta memory layer.
#
# Architecture:
#   bunchloch (MacBook M4) — letta-server (letta/letta:v0.5.4 on :8283)
#     - 8283 — Letta REST API + WebSocket + ADE (Agent Development Environment) UI
#
# Letta v0.5+ bundles its own embedded Postgres (PGlite) but for
# production we point it at the centralised lakehouse-postgres
# (db=letta) so the user-level memory survives container restarts.
#
# USAGE:
#   Production:  docker compose -f compose.yaml -f sidecar.yaml up -d
#   Development: docker compose -f compose.yaml -f compose.dev.yaml \
#                                -f sidecar.yaml up -d
# =============================================================================

name: letta

services:
  # ---------------------------------------------------------------------------
  # LETTA SERVER
  # ---------------------------------------------------------------------------
  letta:
    # Pinned 2026-07-08 (letta/letta:v0.5.4 on Docker Hub — public
    # upstream image; no org-private image used). Multi-arch
    # (linux/amd64,linux/arm64) supported by the upstream image.
    image: letta/letta:v0.5.4
    container_name: letta
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    ports:
      - "${LETTA_PORT:-8283}:8283"
    environment:
      # Centralised lakehouse-postgres (db=letta)
      LETTA_PG_URI: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:-devpassword}@lakehouse-postgres:5432/letta
      # LLM (LiteLLM is the M3 chokepoint)
      LETTA_LLM_MODEL: ${LETTA_LLM_MODEL:-minimax-m3}
      LETTA_LLM_API_BASE: ${LETTA_LLM_API_BASE:-http://litellm:4000/v1}
      LETTA_LLM_API_KEY: ${LETTA_LLM_API_KEY:-sk-1234}
      # Embedding model
      LETTA_EMBEDDING_MODEL: ${LETTA_EMBEDDING_MODEL:-text-embedding-3-small}
      LETTA_EMBEDDING_API_BASE: ${LETTA_EMBEDDING_API_BASE:-http://litellm:4000/v1}
      LETTA_EMBEDDING_API_KEY: ${LETTA_EMBEDDING_API_KEY:-sk-1234}
      # Observability
      OTEL_SERVICE_NAME: letta-server
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://logfire:4317}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
    volumes:
      - letta-data:/home/letta/.letta
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 -c 'import urllib.request, sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8283/v1/health\", timeout=3).status == 200 else 1)'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - cianfhoghlaim
      - lakehouse

volumes:
  letta-data:
    driver: local

networks:
  cianfhoghlaim:
    external: true
    name: cianchoghlaim
  lakehouse:
    name: lakehouse_lakehouse
    external: true
