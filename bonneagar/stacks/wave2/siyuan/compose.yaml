# =============================================================================
# SIYUAN - Block-based Note-taking (bunchloch)
# =============================================================================
# SiYuan is a block-based, local-first, bidirectional-linking
# note-taking app. It supports Markdown, databases, math (KaTeX),
# and graph views.
#
# Architecture:
#   bunchloch (MacBook M4) — siyuan (b3log/siyuan:v3.1.0 on :6806)
#     - 6806 — Web UI
#
# The SiYuan image is multi-arch (linux/amd64,linux/arm64) on
# Docker Hub.
#
# USAGE:
#   Production:  docker compose -f compose.yaml -f sidecar.yaml up -d
#   Development: docker compose -f compose.yaml -f compose.dev.yaml \
#                                -f sidecar.yaml up -d
# =============================================================================

name: siyuan

services:
  siyuan:
    # Pinned 2026-07-08 (b3log/siyuan:v3.1.0 on Docker Hub — public
    # upstream image, no org-private image used). Multi-arch supported.
    image: b3log/siyuan:v3.1.0
    container_name: siyuan
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${SIYUAN_PORT:-6806}:6806"
    environment:
      SIYUAN_ACCESS_AUTH_CODE: ${SIYUAN_ACCESS_AUTH_CODE:-}
    volumes:
      - siyuan-data:/siyuan/workspace
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-verbose --tries=1 --spider http://localhost:6806/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - cianfhoghlaim

volumes:
  siyuan-data:
    driver: local

networks:
  cianfhoghlaim:
    external: true
    name: cianfhoghlaim
