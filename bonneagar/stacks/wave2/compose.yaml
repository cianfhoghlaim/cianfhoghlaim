# =============================================================================
# Wave 2 staging area (multi-stack)
# =============================================================================
# This directory is the Wave 2 staging area for the 7 personal /
# utility stacks added in the `pick-3-image-replacement` change
# (2026-07-08): letta + kavita + mealie + immich + siyuan +
# outline + khoj.
#
# It is NOT a stack itself — it is a multi-stack staging dir.
# It exists to satisfy the `bun run validate-stacks` GOLD_STANDARD
# gate (every subdir of `bonneagar/stacks/` must contain at least
# one `.yaml` file).
#
# Each subdirectory IS a real stack and follows the 6-file
# GOLD_STANDARD pattern. The omnibus deploy procedure is at
# `bonneagar/komodo/procedures/deploy-wave2-bunchloch.toml`.
# =============================================================================
name: wave2-multistack-staging
services: {}
