# =============================================================================
# LAKEKEEPER - Apache Iceberg REST Catalog (PlanetScale PG migration)
# =============================================================================
# Per openspec/changes/2026-07-19-planetscale-postgres-migration-phase-b0-v1/
#
# Phase B.0 ships Lakekeeper's Postgres migration as a HARD SWITCH:
#   - The local `lakekeeper-postgres` container is removed
#   - The `lakekeeper-migrate` companion container is removed
#     (migrations become idempotent on first start)
#   - The `lakekeeper` service uses `infisical://dev-baile/lakekeeper/database_url`
#
# Pre-requisites (operator, before this PR merges):
#   1. Create the PlanetScale PG branch (e.g. bunchloch-prod)
#   2. Create the `lakekeeper` database on that branch
#   3. Create the Infisical secret `dev-baile/lakekeeper/database_url`
#      (postgresql://<user>:<pwd>@<host>.pg.psdb.cloud/lakekeeper?sslmode=verify-full)
#   4. Create the Infisical secret `dev-baile/lakekeeper/encryption_key`
#      (a 64-char hex key — see lakekeeper docs)
#
# Usage:
#   Development:  docker compose --env-file ../../.env.local up -d
#   Production:   locket exec --env-file secrets.env -- docker compose up -d
#   Standalone:   docker compose up -d  (uses defaults — needs the Infisical secrets)
# =============================================================================

name: lakekeeper

services:
  # ---------------------------------------------------------------------------
  # LAKEKEEPER - Iceberg REST Catalog (PlanetScale PG-backed)
  # ---------------------------------------------------------------------------
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest
    container_name: lakekeeper
    restart: unless-stopped
    ports:
      - "${LAKEKEEPER_PORT:-8181}:8181"
      - "${LAKEKEEPER_METRICS_PORT:-9100}:9000"
    environment:
      # PlanetScale PG via Locket-injected Infisical secret
      LAKEKEEPER__PG_DATABASE_URL_READ: infisical://dev-baile/lakekeeper/database_url
      LAKEKEEPER__PG_DATABASE_URL_WRITE: infisical://dev-baile/lakekeeper/database_url
      LAKEKEEPER__PG_ENCRYPTION_KEY: infisical://dev-baile/lakekeeper/encryption_key
      LAKEKEEPER__LISTEN_PORT: "8181"
      LAKEKEEPER__BASE_URI: ${LAKEKEEPER_BASE_URI:-http://localhost:8181}
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - lakekeeper

  # ---------------------------------------------------------------------------
  # MINIO - S3-Compatible Storage (UNCHANGED)
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: lakekeeper-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devpassword}
    command: server /data --console-address ":9001"
    volumes:
      - lakekeeper-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lakekeeper

  # ---------------------------------------------------------------------------
  # MINIO INIT - Create Buckets (UNCHANGED)
  # ---------------------------------------------------------------------------
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: lakekeeper-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-devpassword}
      mc mb --ignore-existing myminio/warehouse
      mc mb --ignore-existing myminio/iceberg
      exit 0
      "
    restart: "no"
    networks:
      - lakekeeper

  # ---------------------------------------------------------------------------
  # JUPYTER - Interactive Data Analysis (UNCHANGED, OPTIONAL)
  # ---------------------------------------------------------------------------
  jupyter:
    image: quay.io/jupyter/pyspark-notebook:latest
    container_name: lakekeeper-jupyter
    restart: unless-stopped
    profiles:
      - jupyter
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-devpassword}
      AWS_REGION: us-east-1
    volumes:
      - lakekeeper-jupyter:/home/jovyan/work
    networks:
      - lakekeeper

volumes:
  lakekeeper-minio:
  lakekeeper-jupyter:

networks:
  lakekeeper:
    driver: bridge