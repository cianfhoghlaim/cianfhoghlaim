# =============================================================================
# OCR-ROUTER - Locket Sidecar Configuration
# =============================================================================
# Uses ghcr.io/cianfhoghlaim/locket-shim:infisical-0.2.1 (the drop-in
# replacement for the broken locket v0.17.3 — snake_case → 422 → passthrough
# bug). See bonneagar/scripts/cianfhoghlaim-locket-shim.py for the shim
# and stacks/openclaw/sidecar.yaml for the canonical pattern.
# =============================================================================

services:
  locket:
    image: ghcr.io/cianfhoghlaim/locket-shim:infisical-0.2.1
    container_name: ocr-router-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID:-f3cff583-b74b-4804-b9d3-db8b68885236}
    command:
      - "--provider=infisical"
      - "--infisical-url=http://infisical-backend:8080"
      - "--infisical-default-environment=dev-baile"
      - "--infisical-default-project-id=f3cff583-b74b-4804-b9d3-db8b68885236"
      - "--infisical-client-id=$${INFISICAL_CLIENT_ID}"
      - "--infisical-client-secret=file:/run/secrets/infisical_secret"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=${LOCKET_MODE:-watch}"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - stack-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "/usr/local/bin/locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cianfhoghlaim

  ocr-router:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket:ro
    env_file:
      - /run/secrets/locket/secrets.env

secrets:
  infisical_secret:
    file: $${INFISICAL_SECRET_FILE:-../../infisical_secret}

volumes:
  stack-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=700

networks:
  cianfhoghlaim:
    name: cianfhoghlaim
    external: true