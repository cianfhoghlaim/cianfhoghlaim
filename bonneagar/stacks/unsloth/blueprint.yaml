# Pangolin private-resource blueprint (generated from pangolin.yaml label form)
# See: https://docs.pangolin.net/manage/blueprints
#
# Per the 2026-08-21-unsloth-v5-architecture-refinement-v1 change. Unsloth
# Studio runs DIRECTLY on the bunchloch host (no Docker container). The
# arm1-oci Pangolin reaches it via the Newt WireGuard tunnel.
#
# Two private resources:
#   • unsloth       → the Studio UI (web chat + settings)
#   • unsloth-api   → the OpenAI/Anthropic-compatible API on /v1/*
# ----------------------------------------------------------------------------

private-resources:
  unsloth:
    name: "Unsloth Studio UI"
    mode: "http"
    destination-port: 8888
    full-domain: "unsloth.cianfhoghlaim.ie"
    protocol: "http"
    roles:
      - "Member"
    destination: "bunchloch"

  unsloth-api:
    name: "Unsloth Studio API (OpenAI/Anthropic-compatible)"
    mode: "http"
    destination-port: 8888
    full-domain: "unsloth-api.cianfhoghlaim.ie"
    protocol: "http"
    roles:
      - "Member"
    destination: "bunchloch"