# =============================================================================
# Sunshine - Locket Sidecar Configuration
# =============================================================================
# Use when you need file-based secrets or hot-reloading.
#
# USAGE:
#   docker compose -f compose.yaml -f pangolin.yaml -f sidecar.yaml up -d
# =============================================================================

services:
  locket:
    image: ghcr.io/bpbradley/locket:infisical
    container_name: sunshine-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      OP_CONNECT_HOST: ${OP_CONNECT_HOST}
    command:
      - "--provider=op-connect"
      - "--connect.host=${OP_CONNECT_HOST}"
      - "--connect.token-file=/run/secrets/op_token"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=${LOCKET_MODE:-watch}"
    secrets:
      - op_token
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - sunshine-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "/locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pangolin

  sunshine:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - sunshine-secrets:/run/secrets/locket:ro
    environment:
      - SUNSHINE_USER_FILE=/run/secrets/locket/SUNSHINE_USER
      - SUNSHINE_PASS_FILE=/run/secrets/locket/SUNSHINE_PASS

secrets:
  op_token:
    file: ${OP_CONNECT_TOKEN_FILE:-../../op_token}

volumes:
  sunshine-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=700

networks:
  pangolin:
    external: true
