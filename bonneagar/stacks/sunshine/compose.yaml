# =============================================================================
# Sunshine - Game Streaming Server
# =============================================================================
# Self-hosted game streaming server compatible with Moonlight clients.
# https://github.com/LizardByte/Sunshine
# =============================================================================

name: sunshine

services:
  sunshine:
    image: lizardbyte/sunshine:latest
    container_name: sunshine
    restart: unless-stopped

    # Network mode host required for game streaming
    network_mode: host

    # GPU access
    privileged: true
    devices:
      - /dev/dri:/dev/dri  # GPU passthrough
      - /dev/uinput:/dev/uinput  # Input devices

    volumes:
      - sunshine-config:/config
      - /dev/shm:/dev/shm  # Shared memory for encoding

    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - SUNSHINE_USER=${SUNSHINE_USER:-admin}
      - SUNSHINE_PASS=${SUNSHINE_PASS:-changeme}

    # Ports (informational when using host network):
    # 47984/tcp - HTTPS web interface
    # 47989/tcp - HTTP web interface
    # 47990/tcp - Web interface
    # 48010/tcp - RTSP
    # 47998-48000/udp - Video/Audio/Control

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sunshine-config:
