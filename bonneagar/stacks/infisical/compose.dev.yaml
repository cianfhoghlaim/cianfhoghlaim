# =============================================================================
# INFISICAL - Local Dev Override (bunchloch)
# =============================================================================
# Mirrors the litellm/mlflow dev override pattern:
#   1. No-op locket sidecar (alpine) so `depends_on: locket: service_healthy`
#      resolves without booting the real Infisical-injection sidecar.
#   2. `env_file: .env.dev` provides the 5 mandated env vars + DB creds
#      with local-only defaults.
#   3. The Infisical backend itself never needs Locket — the secrets are
#      read directly from .env.dev by the db + redis + backend services.
#
# Usage:
#   docker compose -f compose.yaml -f compose.dev.yaml -f sidecar.yaml up -d
# =============================================================================

services:
  locket:
    image: alpine:3.20
    container_name: infisical-locket-dev
    restart: "no"
    command:
      - sh
      - -c
      - "echo '[dev] no-op infisical locket — secrets from .env.dev'; sleep infinity"
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - bunchloch-infra

  backend:
    depends_on:
      locket:
        condition: service_started
    env_file:
      - .env.dev
    networks:
      - bunchloch-infra

  db:
    depends_on:
      locket:
        condition: service_started
    env_file:
      - .env.dev
    networks:
      - bunchloch-infra

  redis:
    depends_on:
      locket:
        condition: service_started
    env_file:
      - .env.dev
    networks:
      - bunchloch-infra