# =============================================================================
# INFISICAL - Pangolin Private Resource (6-label shape)
# =============================================================================
# Per the Pangolin 6-Label Pattern requirement in infrastructure-stacks/spec.md:
# 1. name                - unique slug
# 2. mode                - http / tcp / udp
# 3. full-domain         - the FQDN
# 4. destination-port    - the container port
# 5. protocol            - http / https
# 6. roles[0]            - the Traefik role
#
# NOTE (2026-08-07, verified live): the arm1-oci Infisical IS exposed via
# Pangolin, right now, at infisical.cianfhoghlaim.ie — the comment that
# used to be here ("NOT exposed via Pangolin... committed for parity +
# the future arm1-oci promotion") was stale/aspirational and contradicted
# by the live Pangolin DB. What was actually broken: the private resource
# existed but was bound to the offline "bunchloch" site with a LAN
# destination (192.168.0.206:8081) unreachable from arm1 — hence the
# persistent HTTP 000. `site: oracle` below is the fix (see
# discover-resources.ts's resolveSiteId() and PANGOLIN-SETUP.md for why
# the live site is named "oracle", not "oci.arm1" or "arm1-oci").
# =============================================================================

pangolin:
  site: oracle
  private-resources:
    infisical:
      name: "Infisical Vault"
      mode: "http"
      full-domain: "infisical.cianfhoghlaim.ie"
      destination: "infisical-backend"
      destination-port: 8080
      protocol: "http"
      roles:
        - "Member"
