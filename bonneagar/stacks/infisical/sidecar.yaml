# =============================================================================
# INFISICAL - Locket Sidecar (for the consumer-stack Locket pattern)
# =============================================================================
# The Infisical stack ITSELF does not need a Locket sidecar (the backend
# reads .env directly). However, the consumer stacks (lakehouse, litellm,
# mlflow, unstract) DO need a Locket sidecar pointed at
# `http://infisical-backend:8080` to resolve their `infisical://dev-baile/*`
# URIs. This file is the canonical template — the 4 consumer stacks each
# have their own copy with the same security baseline.
#
# Per the Locket Sidecar Contract in infrastructure-stacks/spec.md:
# - user 65532:65532 (nobody:nogroup)
# - no-new-privileges: true
# - cap_drop: ALL
# - read_only: true
# - tmpfs mode 700 uid=65532 gid=65532
# =============================================================================

services:
  locket:
    image: ghcr.io/cianfhoghlaim/locket-shim:infisical-0.2.1
    environment:
      LOCKET_FALLBACK_FILE: /run/secrets/locket/env-fallback.env
    container_name: infisical-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /run/secrets/locket:size=1m,mode=0700,uid=65532,gid=65532
    command:
      - "--provider=infisical"
      - "--infisical-client-id=$${INFISICAL_CLIENT_ID}"
      - "--infisical-client-secret=file:/run/secrets/infisical_secret"
      - "--infisical-default-environment=$${INFISICAL_ENVIRONMENT:-dev}"
      - "--infisical-default-project-id=$${INFISICAL_PROJECT_ID:-}"
      - "--infisical-url=$${INFISICAL_URL:-http://infisical-backend:8080}"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=$${LOCKET_MODE:-watch}"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - ${INFISICAL_FALLBACK_FILE}:/run/secrets/locket/env-fallback.env:ro
      - stack-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "/locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - bunchloch-infra

secrets:
  infisical_secret:
    file: "$${INFISICAL_SECRET_FILE:-./infisical_secret}"

volumes:
  stack-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=700

networks:
  bunchloch-infra:
    external: true
    name: bunchloch-infra