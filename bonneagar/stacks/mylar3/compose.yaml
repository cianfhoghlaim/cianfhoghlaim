# =============================================================================
# Mylar3 — Comic Book Download Manager (local-first)
# =============================================================================# Automated comic book downloader for usenet and torrents.
# https://github.com/mylar3/mylar3
#
# Co-exists with Kapowarr (`stacks/Kapowarr/`) per the 2026-08-27
# "Mylar3 + Kapowarr side-by-side comparison" decision.
#
# USAGE:
#   Development:  docker compose --env-file .env.local up -d
#   Production:   docker compose -f compose.yaml -f sidecar.yaml up -d
#
# Network:
#   - Joins the canonical `cianfhoghlaim` external bridge network so it can
#     reach qbittorrent-gluetun, kapowarr, komga, and other platform services.
#   - Exposed on 127.0.0.1:8090 only; reaches the world via Pangolin private
#     resource `mylar3.cianfhoghlaim.ie` (pangolin.yaml).
#
# Storage:
#   - `mylar3-config` — persistent config + SQLite (in /config)
#   - `${COMICS_PATH:-./comics}` — final library (consumed by Komga)
#   - `${DOWNLOADS_PATH:-./downloads}` — staging area for in-flight downloads
# =============================================================================

name: mylar3

services:
  mylar3:
    image: lscr.io/linuxserver/mylar3:latest
    container_name: mylar3
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      # 127.0.0.1 only — public access goes through Pangolin/Traefik
      - "127.0.0.1:${MYLAR_PORT:-8090}:8090"

    volumes:
      - mylar3-config:/config
      - ${COMICS_PATH:-./comics}:/comics
      - ${DOWNLOADS_PATH:-./downloads}:/downloads

    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Dublin}
      # UMASK relaxes default file creation mode for downstream consumption
      - UMASK=${UMASK:-022}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - cianfhoghlaim

volumes:
  mylar3-config:

networks:
  cianfhoghlaim:
    external: true
    name: cianfhoghlaim
