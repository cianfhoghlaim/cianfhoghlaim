# =============================================================================
# COGNEE — Pangolin EE root blueprint (private resource)
# =============================================================================
# Generated from the canonical Cianfhoghlaim 6-file stack contract.
# The cognee container listens on 8000 internally; the host maps 8100:8000.
# Roles contain RBAC role names only; middleware references live in
# pangolin.yaml (the Traefik overlay).

private-resources:
  cognee:
    name: Cianfhoghlaim Cognee KG
    mode: http
    sites:
      - bunchloch
    destination: cognee
    destination-port: 8000
    full-domain: cognee.cianfhoghlaim.ie
    ssl: true
    scheme: https
    enabled: true
    roles:
      - Member