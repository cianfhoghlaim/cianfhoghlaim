# =============================================================================
# COGNEE — Pangolin Traefik Routing Overlay
# =============================================================================
# Routes cognee.cianfhoghlaim.ie → cognee container at port 8000.
# The cognee container listens on 8000 internally; the host maps 8100:8000.
# TinyAuth (Pocket ID OIDC) + secure-headers are applied at the Traefik
# layer; the Pangolin blueprint (blueprint.yaml) declares RBAC roles only.

http:
  routers:
    cognee:
      entryPoints:
        - https
      rule: "Host(`cognee.cianfhoghlaim.ie`)"
      service: cognee
      tls:
        certResolver: letsencrypt
      middlewares:
        - secure-headers
      priority: 100

  services:
    cognee:
      loadBalancer:
        servers:
          - url: "http://cognee:8000"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 3s