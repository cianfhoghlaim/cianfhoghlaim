# =============================================================================
# paddleocr - Pangolin auto-discovery labels
# =============================================================================
# Include with: docker compose -f compose.yaml -f pangolin.yaml up -d
#
# UPDATED 2026-07-31 (env-contract-and-observability-fanout-v1 was
# the URI grammar; this update is from the
# 2026-07-31-agentic-mesh-and-ocr-pipeline-coherence-v1 change).
#
# Was previously `noop: true` because the comment said "non-web-facing".
# Now: the blueprint.yaml declares `paddleocr.cianfhoghlaim.ie` and the
# ocr-router (per the agent-mesh change) calls paddleocr in-network.
# The Pangolin route is for operator debugging; it requires Pocket ID
# passkey via TinyAuth + the secure-headers middleware (defence in depth).
#
# If you want to lock this stack down to in-network only, change the
# `noop-reason` below to "internal-only" and delete the route block.
# =============================================================================

services:
  paddleocr:
    labels:
      - "pangolin.resource.name=PaddleOCR"
      - "pangolin.resource.domain=paddleocr.cianfhoghlaim.ie"
      - "pangolin.resource.target=http://paddleocr:8000"
      - "pangolin.resource.middlewares=tinyauth,secure-headers"