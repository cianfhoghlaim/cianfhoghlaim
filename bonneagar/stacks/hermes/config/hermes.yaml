# =============================================================================
# Hermes Agent runtime config
# =============================================================================
# This file is mounted read-only into the Hermes container at
# /home/hermes/.hermes/config/hermes.yaml. The container reads it
# at startup; any change requires a container restart.
#
# The 3-layer auth model:
#   1. Pangolin TinyAuth (Pocket ID OIDC) at the Traefik layer
#      (configured in pangolin.yaml)
#   2. users.allowlist (this file) — populated from day one with the
#      operator's Pocket ID subject (sourced from the
#      HERMES_OPERATOR_POCKET_ID_SUBJECT env var)
#   3. channels.<name>.allow_from (this file) — per-channel sender
#      allowlists; empty by default
# =============================================================================

version: "0.17"

# ---------------------------------------------------------------------------
# LLM provider — LiteLLM is the only path (M3 chokepoint)
# ---------------------------------------------------------------------------
provider:
  name: litellm
  base_url: http://litellm:4000/v1
  model: minimax-m3
  api_key_env: OPENAI_API_KEY  # resolves to LITELLM_MASTER_KEY via Locket

# LiteLLM handles fallback internally to its 70+ model routing
fallback_chain: []

# ---------------------------------------------------------------------------
# 3-layer auth — Layer 2: users.allowlist
# ---------------------------------------------------------------------------
# Populated from day one with the operator's Pocket ID subject.
# The HERMES_OPERATOR_POCKET_ID_SUBJECT env var is read at container start
# and added to the allowlist via the init-allowlist.sh one-shot init
# container. Empty by default would lock the operator out.
users:
  allowlist:
    # The actual value is injected at deploy time from
    # HERMES_OPERATOR_POCKET_ID_SUBJECT. See init-allowlist.sh.
    - "${HERMES_OPERATOR_POCKET_ID_SUBJECT}"

# ---------------------------------------------------------------------------
# 3-layer auth — Layer 3: channels.<name>.allow_from
# ---------------------------------------------------------------------------
# No overlap with OpenClaw's channels. Hermes owns Telegram + Discord +
# WebChat. OpenClaw keeps WhatsApp + Slack + MS Teams.
channels:
  telegram:
    enabled: true
    token_env: TELEGRAM_BOT_TOKEN
    allow_from: []  # populated per-sender as users pair in
    webhook:
      bind: 127.0.0.1
      port: 8443

  discord:
    enabled: true
    token_env: DISCORD_BOT_TOKEN
    allow_from: []

  webchat:
    enabled: true
    bind: 0.0.0.0  # 9119 is exposed to Pangolin
    port: 9119
    allow_from: []

# ---------------------------------------------------------------------------
# MCP servers — the canonical 10 KCG servers + hermes-mcp preview
# ---------------------------------------------------------------------------
mcp_servers:
  # Hermes-as-MCP-server preview (upstream issue #342)
  # Exposes Hermes's session tools to other agents via the AG-UI protocol
  hermes-mcp:
    enabled: true
    bind: 0.0.0.0
    port: 9120
    protocol: mcp
    auth: bearer  # clients pass Authorization: Bearer $HERMES_API_SERVER_KEY

  # The canonical 10 KCG MCP servers
  cocoindex-code:
    enabled: true
    url: http://bunchloch:8765/mcp/cocoindex-code

  cognee:
    enabled: true
    url: http://cognee:8000/mcp

  graphiti:
    enabled: true
    url: http://graphiti:8080/mcp

  langfuse:
    enabled: true
    url: https://langfuse.cianfhoghlaim.ie/mcp
    headers:
      Authorization: "Basic ${LANGFUSE_PUBLIC_KEY}:${LANGFUSE_SECRET_KEY}"

  firecrawl:
    enabled: true
    url: https://mcp.firecrawl.dev

  infisical:
    enabled: true
    url: https://app.infisical.com/api/mcp

  motherduck:
    enabled: true
    url: https://api.motherduck.com/mcp

  chrome:
    enabled: true
    command: ["bunx", "-y", "chrome-devtools-mcp"]

  browserbase:
    enabled: true
    url: https://mcp.browserbase.com/mcp
    headers:
      Authorization: "Bearer ${BROWSERBASE_API_KEY}"

# ---------------------------------------------------------------------------
# Langfuse observability
# ---------------------------------------------------------------------------
langfuse:
  enabled: true
  public_key_env: LANGFUSE_PUBLIC_KEY
  secret_key_env: LANGFUSE_SECRET_KEY
  base_url_env: LANGFUSE_BASE_URL
  env: bunchloch
  release: hermes-0.17.0
  sample_rate: 1.0

# ---------------------------------------------------------------------------
# OpenTelemetry
# ---------------------------------------------------------------------------
otel:
  service_name: hermes-agent
  endpoint_env: OTEL_EXPORTER_OTLP_ENDPOINT
  protocol: http/protobuf

# ---------------------------------------------------------------------------
# Workspace
# ---------------------------------------------------------------------------
workspace:
  state_dir: /home/hermes/.hermes/state
  skills_dir: /home/hermes/.hermes/workspace/skills
  # Curated skills subset (10 of 123) — same as OpenClaw's
  curated_skills:
    - dagster
    - dlt
    - cianfhoghlaim-baml-schemas
    - ccc
    - browser-tools
    - litellm
    - langfuse
    - cognee
    - cocoindex
    - agent-fleet-orchestration
    - apple-photos  # NEW: the 5th leabharlann corpus
