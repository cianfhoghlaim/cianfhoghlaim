services:
  locket:
    image: ghcr.io/bpbradley/locket:infisical
    container_name: hermes-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NOTE: read_only: true causes the locket to fall back to passthrough
    # mode (it can't create the .tmp.<id> atomic-write staging file on a
    # read-only rootfs). The locket DOES NOT NEED read_only for security
    # because it only writes to /run/secrets/locket/* which is a dedicated
    # tmpfs volume (driver_opts mode:755). We keep cap_drop: [ALL] +
    # no-new-privileges for the rest of the hardening.
    read_only: false
    environment:
      INFISICAL_URL: ${INFISICAL_URL}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_DEFAULT_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_DEFAULT_ENVIRONMENT: ${INFISICAL_ENV}
    command:
      - "--provider=infisical"
      - "--infisical-client-secret=file:/run/secrets/infisical_secret"
      # NOTE: --infisical-default-project-id and --infisical-default-environment
      # are intentionally NOT passed as CLI flags — see openclaw/sidecar.yaml
      # for the same comment. The INFISICAL_PROJECT_ID + INFISICAL_ENV env
      # vars (declared in the `environment:` block above) drive these values.
      - "--infisical-default-path=/hermes"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=${LOCKET_MODE:-watch}"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - stack-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stack

  hermes:
    depends_on:
      locket:
        condition: service_healthy
    # No user: override — the upstream NousResearch/hermes-agent image uses
    # s6-overlay which requires running as a specific user (the WORKDIR is
    # owned by root and s6-overlay checks /run ownership at init). Overriding
    # to 65532:65532 (nobody) triggers the `fatal: /run belongs to uid 0
    # instead of 65532` s6-overlay error. The locket stack-secrets volume is
    # world-readable (mode 755 in the volumes: driver_opts below) so the
    # upstream user can read /run/secrets/locket/secrets.env.
    volumes:
      - stack-secrets:/run/secrets/locket:ro
    # The /run/secrets/locket/secrets.env file is materialized by the locket
    # sidecar at container start. We source it via a shell wrapper around the
    # upstream hermes-agent CMD. This sidesteps docker compose's parse-time
    # env_file validation (which would reject /run/secrets/* even though it's
    # a runtime path).
    command:
      - /bin/sh
      - -c
      - |
        set -a
        . /run/secrets/locket/secrets.env
        set +a
        exec hermes-agent gateway

  # Locket chmod init — runs once, after the locket sidecar is healthy.
  # The locket binary (uid 65532) writes /run/secrets/locket/secrets.env
  # with mode 600 (user-only). This init container chmod's the file to
  # mode 644 so the consumer (hermes) can read it.
  hermes-chmod-init:
    image: alpine:3.20
    user: "0:0"
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /run/secrets/locket/secrets.env ]; then
          chmod 644 /run/secrets/locket/secrets.env
          echo "OK: /run/secrets/locket/secrets.env chmod'd to 644"
        else
          echo "ERROR: /run/secrets/locket/secrets.env not found"
          exit 1
        fi
    restart: "no"
    networks:
      - stack

secrets:
  infisical_secret:
    file: ${INFISICAL_SECRET_FILE:-../../infisical_secret}

volumes:
  stack-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=755

networks:
  stack:
    driver: bridge
