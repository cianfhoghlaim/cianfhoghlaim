services:
  locket:
    # NOTE: replaced locket v0.17.3 with ghcr.io/cianfhoghlaim/locket-shim:infisical-0.2.1
    # (see openclaw/sidecar.yaml for full context). Same shim, env-driven.
    image: ghcr.io/cianfhoghlaim/locket-shim:infisical-0.2.1
    container_name: hermes-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NOTE: read_only: false — the shim writes to /run/secrets/locket/*
    # which is a dedicated tmpfs volume (driver_opts mode:755). The shim
    # needs to create temp files in /tmp (which is the container's /tmp
    # tmpfs) during atomic writes. We keep cap_drop: [ALL] +
    # no-new-privileges for the rest of the hardening.
    read_only: false
    environment:
      LOCKET_FALLBACK_FILE: /run/secrets/locket/env-fallback.env
      INFISICAL_URL: ${INFISICAL_URL}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_DEFAULT_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_DEFAULT_ENVIRONMENT: ${INFISICAL_ENV}
      INFISICAL_DEFAULT_PATH: /hermes
      LOCKET_MODE: ${LOCKET_MODE:-watch}
      LOCKET_SRC: /templates/secrets.env
      LOCKET_DST: /run/secrets/locket
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - ${INFISICAL_FALLBACK_FILE}:/run/secrets/locket/env-fallback.env:ro
      - stack-secrets:/run/secrets/locket
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 /app/locket-shim.py --mode one-shot 2>&1 | grep -q 'resolved' || exit 1"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 5s
    networks:
      - cianfhoghlaim

  hermes:
    depends_on:
      locket:
        condition: service_healthy
    # No user: override — see hermes/compose.yaml for the s6-overlay
    # permissions discussion. The internal `hermes` user (uid 10000) is
    # used. The locket stack-secrets volume is world-readable (mode
    # 755) so the hermes user can read /run/secrets/locket/secrets.env.
    volumes:
      - stack-secrets:/run/secrets/locket:ro
    # The /run/secrets/locket/secrets.env file is materialized by the locket
    # sidecar at container start. We source it via a shell wrapper around the
    # upstream hermes-agent CMD. This sidesteps docker compose's parse-time
    # env_file validation (which would reject /run/secrets/* even though it's
    # a runtime path).
    command:
      - /bin/sh
      - -c
      - |
        set -a
        . /run/secrets/locket/secrets.env
        set +a
        exec hermes-agent gateway

  # Locket chmod init — runs once, after the locket sidecar is healthy.
  # The shim writes secrets.env with mode 644 (it uses os.chmod 0o644
  # explicitly in write_atomic). This init is now redundant but kept
  # for defense-in-depth — it ensures the file is readable regardless
  # of the shim's file mode behavior.
  hermes-chmod-init:
    image: alpine:3.20
    user: "0:0"
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - stack-secrets:/run/secrets/locket
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /run/secrets/locket/secrets.env ]; then
          chmod 644 /run/secrets/locket/secrets.env
          echo "OK: /run/secrets/locket/secrets.env chmod'd to 644"
        else
          echo "ERROR: /run/secrets/locket/secrets.env not found"
          exit 1
        fi
    restart: "no"
    networks:
      - cianfhoghlaim

secrets:
  infisical_secret:
    file: ${INFISICAL_SECRET_FILE:-/Users/cianmacandeisigh/.locket/infisical_secret}

volumes:
  stack-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=755
