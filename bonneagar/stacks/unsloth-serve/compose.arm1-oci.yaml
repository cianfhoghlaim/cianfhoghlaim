# =============================================================================
# UNSLOTH-SERVE — arm1-oci CPU Override
# =============================================================================
# CPU-only variant. Used on the Oracle Cloud Free Tier (Frankfurt) arm64
# server, which has NO GPU. Public-facing via Pangolin
# (`unsloth-api.cianfhoghlaim.ie`).
#
# Per the 2026-08-21-unsloth-v5-integration-v1 change (corrected in
# the 2026-08-21 hotfix commit): bunchloch is the M4 Max GPU host,
# arm1-oci is the CPU-only host.
#
# Applied via:
#   docker compose -f compose.yaml -f compose.arm1-oci.yaml up -d
# =============================================================================

services:
  unsloth-serve:
    # Override the base image: CPU-only base (no CUDA)
    image: unsloth/unsloth:latest
    # No GPU offload on arm1-oci (CPU-only Oracle Cloud server)
    environment:
      LLAMA_ARG_NGL: "0"
      LLAMA_ARG_CTX_SIZE: "32768"
      LLAMA_ARG_THREADS: "8"
      # CPU-only platform marker (the upstream unsloth CLI uses this
      # to skip CUDA/CPU offload auto-detection on Linux)
      UNSLOTH_PLATFORM: linux-cpu
    # Public bind on arm1-oci (Pangolin routes)
    ports:
      - "8888:8888"
      - "8889:8889"
    # Memory limit on the CPU host (the model + KV cache requires
    # ~10 GB at Q4_K_M for 27B-class models; arm1-oci has 24 GB RAM)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 10G
    networks:
      - cianfhoghlaim
      - lakehouse
