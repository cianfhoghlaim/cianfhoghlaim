# =============================================================================
# UNSLOTH-SERVE — bunchloch (Apple Silicon M4 Max) Override
# =============================================================================
# Apple Silicon GPU variant. Used on bunchloch (MacBook M4 Max — the
# local dev host). The unsloth CLI auto-detects macOS + Metal and uses
# the MLX backend for unified-memory GPU acceleration.
#
# Per the 2026-08-21-unsloth-v5-integration-v1 change (corrected in
# the 2026-08-21 hotfix commit): bunchloch is the M4 Max GPU host,
# arm1-oci is the CPU-only host.
#
# Applied via:
#   docker compose -f compose.yaml -f compose.m4-max.yaml up -d
# =============================================================================

services:
  unsloth-serve:
    # Override the base image: Apple Silicon base (no CUDA)
    image: unsloth/unsloth:latest
    # Full GPU offload via Metal/MLX (M4 Max has 48 GB unified memory;
    # the upstream unsloth CLI detects macOS and uses MLX). Note:
    # LLAMA_ARG_NGL is irrelevant on MLX (MLX uses unified memory),
    # but we set it to 99 for consistency.
    environment:
      LLAMA_ARG_NGL: "99"
      LLAMA_ARG_CTX_SIZE: "32768"
      LLAMA_ARG_THREADS: "12"
      # Apple Silicon platform marker (the upstream unsloth CLI uses
      # this to select the MLX backend for Metal GPU acceleration)
      UNSLOTH_PLATFORM: macos
      # Disable the server-side web search + code execution tools
      # (Unsloth Studio defaults them ON for 127.0.0.1; the OpenCode
      # + hermes + openclaw agents have their own tool calls)
      UNSLOTH_DISABLE_TOOLS: "true"
    # Local-only bind on bunchloch (the Studio UI + API are reachable
    # via marimo notebook going to ocr-router → unsloth-serve on the
    # cianfhoghlaim Docker network). For production, set
    # UNSLOTH_BIND_HOST=0.0.0.0 via env override.
    ports:
      - "${UNSLOTH_BIND_HOST:-127.0.0.1}:8888:8888"
      - "${UNSLOTH_BIND_HOST:-127.0.0.1}:8889:8889"
    # Memory limit on the M4 Max (the model + KV cache requires
    # ~16 GB at Q4_K_M for 27B-class models; M4 Max has 48 GB)
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
    networks:
      - cianfhoghlaim
      - lakehouse
