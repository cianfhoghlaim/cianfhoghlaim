# =============================================================================
# UNSLOTH-SERVE — Base Compose File (shared by arm1-oci + M4 Max overrides)
# =============================================================================
# Hosts the Unsloth Studio CLI as a headless inference server. Serves BOTH
#   /v1/messages (Anthropic) AND /v1/chat/completions (OpenAI) on :8889
# plus the Studio UI on :8888.
#
# The Unsloth CLI is the third product in Unsloth's 2026-08 lineup:
#   - Unsloth Desktop (native app)
#   - Unsloth Studio (web UI on :8888)
#   - Unsloth Core (Python package — the legacy path)
#
# This stack runs the Docker image that bundles all three. The `unsloth`
# CLI is the entrypoint; the rest is wired in the host-specific override
# files (compose.arm1-oci.yaml + compose.m4-max.yaml).
#
# The 5 Unsloth agent integrations (opencode, openclaw, hermes-agent,
# claude-code, codex) all consume `unsloth run`'s OpenAI/Anthropic-
# compatible endpoint via the `unsloth start <agent>` meta-command.
# The 20 `local/unsloth/*` LiteLLM aliases route through this server.
#
# Secrets:
#   - UNSLOTH_API_KEY is a single shared key. The upstream `unsloth run`
#     mints an ephemeral key per launch; we use a stable vault key for
#     the long-running daemon. The 5 agent stacks (hermes, openclaw,
#     openchamber, cianfhoghlaim, openclaw-arm1-oci) all read the same
#     key via Locket (production) or .env (local dev).
#
# Local-dev fallback (no Infisical required):
#   The container entrypoint sources secrets from EITHER:
#     1. /run/secrets/locket/secrets.env (production, mounted via sidecar.yaml)
#     2. /etc/unsloth/.env (local dev, mounted via compose.local-dev.yaml)
#   The entrypoint prefers Locket; falls back to .env if Locket is empty.
#
# Host-specific overrides:
#   - arm1-oci:  compose.arm1-oci.yaml  (CPU-only, 10 GB, public)
#   - bunchloch: compose.m4-max.yaml   (Apple Silicon M4 Max, MLX, 16 GB, local)
# =============================================================================

name: unsloth-serve

services:
  # ---------------------------------------------------------------------------
  # UNSLOTH STUDIO HEADLESS
  # ---------------------------------------------------------------------------
  unsloth-serve:
    # The upstream `unsloth/unsloth` Docker image bundles the CLI in
    # headless mode. If the image is not yet published on Docker Hub,
    # the fallback is `continuumio/miniconda3:latest` + `pip install
    # unsloth==2026.8.0` (verified live at P0.6).
    image: ${UNSLOTH_IMAGE:-unsloth/unsloth:latest}
    container_name: unsloth-serve
    restart: unless-stopped
    # The unsloth image runs as root for the entrypoint init (similar
    # to the hermes-agent s6-overlay pattern). The actual `unsloth run`
    # process stills drops to a non-root user per upstream design.
    user: "0:0"
    command:
      # The `unsloth run` command is the canonical Unsloth Studio entrypoint.
      # It loads the model, exposes the OpenAI/Anthropic-compatible
      # endpoint on :8889, and prints the API key + model ID to stdout.
      # --disable-tools prevents Unsloth Studio from swallowing the
      # agent's own tool calls (each agent runtime has its own).
      #
      # Secret sourcing order: Locket (prod) → /etc/unsloth/.env (local dev)
      - /bin/sh
      - -c
      - |
        # Try Locket first; fall back to local .env if Locket is empty
        if [ -s /run/secrets/locket/secrets.env ]; then
          set -a
          . /run/secrets/locket/secrets.env
          set +a
          echo "✅ Loaded secrets from Locket sidecar"
        elif [ -s /etc/unsloth/.env ]; then
          set -a
          . /etc/unsloth/.env
          set +a
          echo "✅ Loaded secrets from /etc/unsloth/.env (local dev fallback)"
        else
          echo "❌ FATAL: No secrets found (Locket empty, /etc/unsloth/.env missing)"
          exit 1
        fi

        if [ -z "$$UNSLOTH_API_KEY" ]; then
          echo "❌ FATAL: UNSLOTH_API_KEY not set"
          exit 1
        fi

        exec unsloth run \
          --model "$${UNSLOTH_MODEL_ID:-unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL}" \
          --host 0.0.0.0 --port 8889 \
          --temp 0.7 --top-p 0.95 --top-k 20 \
          --min-p 0.0 \
          --chat-template-kwargs '{"reasoning_effort":"medium"}' \
          --disable-tools
    ports:
      # Studio UI on :8888 (Pangolin-routeable on arm1-oci)
      - "127.0.0.1:8888:8888"
      # OpenAI/Anthropic-compatible API on :8889
      - "127.0.0.1:8889:8889"
    env_file:
      # Local-dev fallback (overridden by Locket in prod). Operators
      # can pass `--env-file .env` to point at any custom file.
      - ./.env
    environment:
      UNSLOTH_HOME: /home/unsloth/.unsloth
      UNSLOTH_STUDIO_URL: http://localhost:8888
      # OpenTelemetry fan-out (per env-contract-and-observability-fanout-v1)
      # Falls back to disabled OTLP if logfire-otel is unreachable
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://logfire-otel:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: unsloth-serve
    volumes:
      - unsloth-state:/home/unsloth/.unsloth
      # GGUF cache — populated by the Dagster `model_conversion` asset
      # Same path as llama-swap (the two servers share the GGUF cache)
      - ../../../stedding/huggingface/unsloth:/models/unsloth:ro
      - ../../../stedding/huggingface/gguf:/models/gguf:ro
    # depends_on locket is declared in sidecar.yaml (canonical pattern).
    # For local-dev (no Infisical), use compose.local-dev.yaml overlay which
    # removes the depends_on locket constraint.
    healthcheck:
      # /v1/models is the lightweight OpenAI-compatible liveness check
      # (returns the model ID and metadata without invoking the model).
      test:
        - CMD-SHELL
        - "curl -fs http://localhost:8889/v1/models -H 'Authorization: Bearer $$UNSLOTH_API_KEY' | grep -q 'data' || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cianfhoghlaim
      - lakehouse

volumes:
  unsloth-state:
    driver: local

networks:
  cianfhoghlaim:
    external: true
    name: cianfhoghlaim
  lakehouse:
    name: lakehouse_lakehouse
    external: true
