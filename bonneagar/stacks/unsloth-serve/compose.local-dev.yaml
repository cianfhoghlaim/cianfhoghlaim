# =============================================================================
# UNSLOTH-SERVE — Local-Dev Overlay (no Infisical / no Locket required)
# =============================================================================
# Apply this overlay on bunchloch (M4 Max) to run unsloth-serve with
# JUST a local .env file (no Infisical login, no Locket sidecar).
# Operators copy .env.example to .env in this stack directory and
# fill in UNSLOTH_API_KEY.
#
# Applied via:
#   cd bonneagar/stacks/unsloth-serve/
#   cp .env.example .env
#   # edit .env to set UNSLOTH_API_KEY
#   docker compose \
#     -f compose.yaml \
#     -f compose.m4-max.yaml \
#     -f compose.local-dev.yaml \
#     --env-file .env \
#     up -d
#
# Per the 2026-08-21 hotfix commit. The Locket sidecar is REMOVED (it
# was the source of the Restarting loop on bunchloch); the .env file
# is mounted at /etc/unsloth/.env (the entrypoint reads this path).
# =============================================================================

services:
  # Remove the Locket sidecar (it's the production secret injector;
  # local dev uses the .env file directly).
  unsloth-serve:
    # Per the 2026-08-21 hotfix commit: on arm64 hosts (bunchloch M4 Max),
    # `unsloth/unsloth:latest` is x86_64-only. Use the locally-built
    # `unsloth-serve-local:latest` image (built via Dockerfile.local —
    # miniconda3 base + unsloth==2026.8.19 pip install). The arm1-oci
    # (Linux x86_64) deploys use the upstream unsloth/unsloth:latest image.
    #
    # Build locally with:
    #   docker build -t unsloth-serve-local:latest \
    #     -f bonneagar/stacks/unsloth-serve/Dockerfile.local \
    #     bonneagar/stacks/unsloth-serve/
    image: unsloth-serve-local:latest
    # Mount the .env file directly into the container.
    volumes:
      # The .env file at the stack directory is mounted into the
      # container at /etc/unsloth/.env (the entrypoint reads this path
      # as the local-dev fallback).
      - ./.env:/etc/unsloth/.env:ro
    # Increase the start_period to allow for the first model load
    # (~81s on M4 Max CPU/MPS, faster with MLX)
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fs http://localhost:8889/v1/models -H 'Authorization: Bearer $$UNSLOTH_API_KEY' | grep -q 'data' || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
