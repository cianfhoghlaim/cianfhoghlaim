# =============================================================================
# UNSLOTH-SERVE — bunchloch CPU/MPS Override
# =============================================================================
# CPU/MPS variant. Local-only (127.0.0.1), used for dev mode + the
# marimo 10-way comparison notebook + the Studio UI.
#
# Applied via:  docker compose -f compose.yaml -f compose.bunchloch.yaml up -d
# =============================================================================

services:
  unsloth-serve:
    # Override the base image: CPU/base image on bunchloch (macOS)
    image: unsloth/unsloth:latest
    # No GPU offload on macOS Docker Desktop (no Metal passthrough)
    environment:
      LLAMA_ARG_NGL: "0"
      LLAMA_ARG_CTX_SIZE: "32768"
      # Apple Silicon fallback uses MLX underneath (handled by the
      # unsloth CLI itself when it detects the Mac platform)
      UNSLOTH_PLATFORM: macos
    # Local-only bind on Mac (the Studio UI + API are reachable via
    # marimo notebook going to ocr-router → unsloth-serve on the
    # cianfhoghlaim Docker network)
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
    # Smaller memory limit on the M4 Max (the model + KV cache
    # requires ~8 GB at Q4_K_M for Qwen3.8-27B on CPU)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
    networks:
      - cianfhoghlaim
      - lakehouse
