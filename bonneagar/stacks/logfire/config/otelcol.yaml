# OpenTelemetry Collector configuration for the Logfire stack.
# ----------------------------------------------------------------------------
# Receives OTLP traces from any KCG service on :4317 (gRPC) / :4318 (HTTP),
# batches them, and forwards to BOTH backends via a fan-out exporter:
#
#   1. Logfire cloud   (SaaS — https://logfire.pydantic.dev)  via logfire exporter + LOGFIRE_TOKEN
#   2. Langfuse         (self-hosted — langfuse-web:3000)      via otlphttp exporter + LANGFUSE_PUBLIC_KEY/SECRET_KEY
#
# Per spec delta openspec/changes/2026-07-30-env-contract-and-observability-fanout-v1/
# specs/agent-observability/spec.md Requirement "Logfire collector fan-out to
# Langfuse + Logfire": every trace MUST reach both backends so the agent
# fleet and the data-plane fleet share a single observability surface.
#
# The langfuse exporter is configured with the HTTP/OTLP endpoint
# http://langfuse-web:3000/api/public/otel (the langfuse v3 OTel/HTTP
# ingestion endpoint). Headers carry basic auth
# (base64-encoded LANGFUSE_PUBLIC_KEY:LANGFUSE_SECRET_KEY).
#
# Note: when LOGFIRE_TOKEN is empty, the logfire exporter fails per OTEL
# convention (no silent data loss). When LANGFUSE_PUBLIC_KEY / SECRET_KEY
# are empty, the langfuse exporter logs a warning and drops traces (the
# collector still forwards to logfire).
#
# Updated 2026-07-30:
#   - Added `langfuse` exporter (otlphttp → langfuse-web:3000/api/public/otel)
#   - Added to the `traces` pipeline as a fan-out (exporters list = [logfire, langfuse, debug])

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  # Resource attributes that let Logfire group traces by service.
  resource/logfire_metadata:
    attributes:
      - key: deployment.environment
        value: ${env:LOGFIRE_ENVIRONMENT}
        action: upsert
      - key: logfire.project_name
        value: ${env:LOGFIRE_PROJECT_NAME}
        action: upsert

exporters:
  # Logfire cloud (SaaS) — requires LOGFIRE_TOKEN env var.
  logfire:
    timeout: 30s
  # Langfuse self-hosted — forwards via OTLP/HTTP to langfuse-web:3000/api/public/otel.
  # Requires LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY env vars; if empty,
  # the exporter logs a warning and drops traces (collector still forwards to logfire).
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    timeout: 30s
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH_HEADER}"
  # Local debug logging so we can see OTEL pipeline activity.
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:8888
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/logfire_metadata, batch]
      # Fan-out: every trace goes to BOTH logfire cloud AND langfuse.
      exporters: [logfire, otlphttp/langfuse, debug]
  telemetry:
    metrics:
      address: 0.0.0.0:8889