# =============================================================================
# Ludusavi - Game Save Manager
# =============================================================================
# Backup tool for PC game saves with cloud sync support.
# https://github.com/mtkennerly/ludusavi
# =============================================================================

name: ludusavi

services:
  ludusavi:
    image: mtkennerly/ludusavi:latest
    container_name: ludusavi
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "${LUDUSAVI_PORT:-8080}:8080"

    volumes:
      - ludusavi-config:/config
      - ludusavi-backups:/backups
      - ${GAME_SAVES_PATH:-./saves}:/saves:ro

    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tools

volumes:
  ludusavi-config:
  ludusavi-backups:

networks:
  tools:
    external: true
