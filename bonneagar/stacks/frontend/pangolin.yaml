# Pangolin Traefik routing for the Frontend stack
#
# Each front-end app gets a public subdomain routed via Traefik with
# Pocket ID OIDC authentication. Service is per-subdomain, not shared.
http:
  routers:
    cianfhoghlaim-web:
      rule: "Host(`cianfhoghlaim.cianfhoghlaim.ie`)"
      service: cianfhoghlaim-web
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - oidc-auth

    cianfhoghlaim-api:
      rule: "Host(`cianfhoghlaim-api.cianfhoghlaim.ie`)"
      service: cianfhoghlaim-api
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - cors-cianchfhoghlaim

    tuatha-ui:
      rule: "Host(`tuath.cianfhoghlaim.ie`)"
      service: tuatha-ui
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - cors-tuatha

    croilar-web:
      rule: "Host(`croilar.cianfhoghlaim.ie`)"
      service: croilar-web
      entryPoints:
        - websecure
      tls: {}

    croilar-portal:
      rule: "Host(`portal.cianfhoghlaim.ie`)"
      service: croilar-portal
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - oidc-auth

  services:
    cianfhoghlaim-web:
      loadBalancer:
        servers:
          - url: "http://cianfhoghlaim-web:3001"
    cianfhoghlaim-api:
      loadBalancer:
        servers:
          - url: "http://cianfhoghlaim-api:8787"
    tuatha-ui:
      loadBalancer:
        servers:
          - url: "http://tuatha-ui:3004"
    croilar-web:
      loadBalancer:
        servers:
          - url: "http://croilar-web:3003"
    croilar-portal:
      loadBalancer:
        servers:
          - url: "http://croilar-portal:3000"

  middlewares:
    oidc-auth:
      forwardAuth:
        address: "http://pocket-id:1411"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Forwarded-User"
          - "X-Forwarded-Groups"
          - "X-Forwarded-Email"
    cors-cianchfhoghlaim:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "*"
        accessControlAllowOriginList:
          - "https://cianfhoghlaim.cianfhoghlaim.ie"
          - "https://cianfhoghlaim-api.cianfhoghlaim.ie"
    cors-tuatha:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "*"
        accessControlAllowOriginList:
          - "https://tuath.cianfhoghlaim.ie"

tcp:
  routers: {}
  services: {}
