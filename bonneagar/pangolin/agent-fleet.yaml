# Agent-Fleet Pangolin private resource definitions
#
# Defines the 12-agent fleet + 8 NCCA subject specialists + 3
# educational agents as Pangolin private resources on the
# `*.cianfhoghlaim.ie` mesh. Mounted at /api/agent/<slug>.
#
# Reference: openspec/changes/2026-08-14-agents-firing-parity-v1

pangolin.private-resources.agent-fleet.curriculum_agent:
  subdomain: curriculum.cianfhoghlaim.ie
  target: hermes:8001
  auth: pocket-id-sso
  labels:
    - "komodo.skip=true"
    - "host:bunchloch"
    - "tier:control-plane"
    - "type:agent-runtime"
    - "domain:curriculum.cianfhoghlaim.ie"
    - "agent:curriculum"

