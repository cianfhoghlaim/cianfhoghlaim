# =============================================================================
# Curriculum LLM Training Configuration - Anyscale ($100 credits)
# =============================================================================
# Irish Curriculum LLM for bilingual education.
#
# Usage:
#   anyscale job submit -f curriculum_config.yaml
#
# Cost Estimate:
#   - 4x A10G GPUs: ~$6/hr
#   - Full training: ~$50-80 ($100 credits ≈ 16 hours)
# =============================================================================

name: irish-curriculum-llm-training

# =============================================================================
# Compute Configuration
# =============================================================================
compute_config:
  cloud: aws
  region: eu-west-1

  head_node_type:
    name: head
    instance_type: m5.2xlarge
    resources:
      CPU: 8

  worker_node_types:
    - name: gpu-workers
      instance_type: g5.2xlarge  # A10G GPU
      min_workers: 2
      max_workers: 4
      resources:
        CPU: 8
        GPU: 1
        accelerator_type:A10G: 1

  idle_timeout_minutes: 10

# =============================================================================
# Runtime Environment
# =============================================================================
runtime_env:
  pip:
    - torch>=2.1.0
    - transformers>=4.36.0
    - datasets>=2.16.0
    - accelerate>=0.25.0
    - deepspeed>=0.12.0
    - ray[train]>=2.9.0
    - unsloth @ git+https://github.com/unslothai/unsloth.git
    - wandb>=0.16.0
    - mlflow>=2.9.0
    - huggingface_hub>=0.20.0
    - peft>=0.7.0
    - trl>=0.7.0

  env_vars:
    HF_TOKEN: ${HF_TOKEN}
    WANDB_API_KEY: ${WANDB_API_KEY}
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    RAY_memory_monitor_refresh_ms: "0"

# =============================================================================
# Job Entry Point
# =============================================================================
entrypoint: python curriculum_anyscale.py

# =============================================================================
# Model Configuration
# =============================================================================
model:
  # Base model (Irish-optimized Llama)
  base_model: ReliableAI/UCCIX-Llama2-13B-Instruct
  max_seq_length: 4096
  load_in_4bit: true

  # LoRA configuration (higher rank for language adaptation)
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

  # Training hyperparameters
  num_epochs: 3
  batch_size_per_device: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler: cosine
  fp16: true
  deepspeed_stage: 2

  # Output
  output_dir: /mnt/cluster_storage/checkpoints/curriculum
  hub_model_id: cianfhoghlaim/irish-curriculum-llm

# =============================================================================
# Data Configuration
# =============================================================================
data:
  # Data sources (R2 paths synced to cluster storage)
  exam_papers_path: /mnt/cluster_storage/data/sec_papers
  marking_schemes_path: /mnt/cluster_storage/data/marking_schemes
  curriculum_specs_path: /mnt/cluster_storage/data/curriculum_specs
  bilingual_pairs_path: /mnt/cluster_storage/data/bilingual_pairs

  # Subject selection (prioritize core subjects)
  subjects:
    # Core subjects
    - mathematics
    - irish
    - english
    # Sciences
    - biology
    - chemistry
    - physics
    - agricultural_science
    # Humanities
    - history
    - geography
    # Languages
    - french
    - german
    - spanish

  # Exam levels
  levels:
    - leaving_cert_higher
    - leaving_cert_ordinary
    - junior_cycle_higher
    - junior_cycle_ordinary

  # Year range
  year_start: 2015
  year_end: 2024

  # Language mix (bilingual training)
  english_ratio: 0.5
  include_bilingual_pairs: true

  # Data splits
  train_ratio: 0.9
  val_ratio: 0.1

  # Limits
  max_seq_length: 4096

# =============================================================================
# Ray Train Configuration
# =============================================================================
ray_train:
  scaling_config:
    num_workers: 4
    use_gpu: true
    resources_per_worker:
      CPU: 8
      GPU: 1

  deepspeed:
    stage: 2
    offload_optimizer: false
    offload_param: false

  checkpoint_config:
    num_to_keep: 3
    checkpoint_frequency: 100

  failure_config:
    max_failures: 3

# =============================================================================
# Output Configuration
# =============================================================================
push_to_hub: true

# =============================================================================
# Evaluation Benchmarks
# =============================================================================
evaluation:
  # Custom Irish curriculum benchmarks
  benchmarks:
    - name: irlbench_math
      description: Irish Leaving Cert Mathematics problems
      weight: 0.3

    - name: irlbench_reading
      description: Irish reading comprehension
      weight: 0.2

    - name: bilingual_translation
      description: English-Irish translation accuracy
      weight: 0.2

    - name: marking_accuracy
      description: Answer evaluation consistency
      weight: 0.3

  # Evaluation frequency
  eval_every_n_steps: 500
