# ML Data Source Catalog
# Registry of datasets for Celtic language model training

sources:
  # Parallel Corpora
  - id: irish-english-parallel
    name: Irish-English Parallel Collection
    type: parallel-corpus
    languages: [irish, english]
    status: available
    huggingface: ReliableAI/Irish-English-Parallel-Collection
    size: "~1M pairs"
    notes: Primary Irish-English parallel data

  - id: cc100-irish
    name: CC-100 Irish
    type: monolingual
    languages: [irish]
    status: available
    size: "108M tokens"
    source: cc100
    notes: Web-crawled Irish text

  - id: culturax-irish
    name: CulturaX Irish
    type: monolingual
    languages: [irish]
    status: available
    size: "Part of 6.3T tokens"
    source: uonlp/CulturaX
    notes: Cleaned web corpus, 167 languages

  # Speech Datasets
  - id: common-voice-irish
    name: Common Voice Irish
    type: speech
    languages: [irish]
    status: available
    versions: ["9.0", "19.0"]
    source: mozilla-foundation/common_voice
    notes: Crowdsourced speech recordings

  - id: abair-corpus
    name: ABAIR Speech Corpus
    type: speech
    languages: [irish]
    status: available
    dialects: [connacht, munster, ulster]
    source: https://www.abair.ie
    notes: Dialect-specific Irish speech

  # Curriculum Data
  - id: ncca-specifications
    name: NCCA Curriculum Specifications
    type: curriculum
    languages: [irish, english]
    status: available
    source: curriculumonline.ie
    notes: Official curriculum documents

  - id: sec-exam-papers
    name: SEC Examination Papers
    type: assessment
    languages: [irish, english]
    status: available
    source: examinations.ie
    years: "2000-2024"
    notes: Leaving Cert and Junior Cert papers

  - id: sec-marking-schemes
    name: SEC Marking Schemes
    type: assessment
    languages: [irish, english]
    status: available
    source: examinations.ie
    notes: Official marking criteria

  # Heritage Collections
  - id: duchas-schools
    name: Dúchas Schools Collection
    type: heritage
    languages: [irish, english]
    status: available
    source: duchas.ie
    api: https://docs.gaois.ie/en/data/duchas/v0.6/api
    notes: 1930s folklore collection

  - id: logainm
    name: Logainm Placenames
    type: lexical
    languages: [irish, english]
    status: available
    source: logainm.ie
    notes: Irish placename database

  # Welsh Datasets
  - id: welsh-text-corpus
    name: Welsh National Corpus
    type: monolingual
    languages: [welsh]
    status: available
    source: techiaith
    notes: Bangor University collection

  - id: common-voice-welsh
    name: Common Voice Welsh
    type: speech
    languages: [welsh]
    status: available
    source: mozilla-foundation/common_voice
    notes: Welsh speech recordings

  # Scottish Gaelic
  - id: gaidhlig-corpus
    name: Scottish Gaelic Corpus
    type: monolingual
    languages: [scottish-gaelic]
    status: limited
    size: "~5M tokens"
    notes: Limited availability

# Dataset mix recommendations
training_mixes:
  irish_llm:
    description: "General Irish language model"
    composition:
      - source: irish-english-parallel
        weight: 0.4
      - source: cc100-irish
        weight: 0.3
      - source: culturax-irish
        weight: 0.3

  leaving_cert_math:
    description: "Leaving Cert math tutor"
    composition:
      - source: sec-exam-papers
        filter: "subject=mathematics"
        weight: 0.6
      - source: sec-marking-schemes
        filter: "subject=mathematics"
        weight: 0.2
      - source: ncca-specifications
        filter: "subject=mathematics"
        weight: 0.2

  irish_asr:
    description: "Irish speech recognition"
    composition:
      - source: common-voice-irish
        weight: 0.7
      - source: abair-corpus
        weight: 0.3
