# =============================================================================
# Croilar — Dagster instance configuration
# =============================================================================
# dagster 1.9.13 supports `storage.postgres` for the run/event/schedule
# storage trio (single `storage:` entry, NOT the legacy
# `run_storage:`/`event_log_storage:`/`schedule_storage:` triplet which
# CompositeStorage.from_config_value mishandles in 1.9.13).
#
# We use the bundled `aleyum-postgres` service in the same compose project
# so the connection is reliable. For prod, swap postgres_url to point at
# a managed Postgres (e.g. the lakehouse-pg stack).
# =============================================================================

storage:
  postgres:
    postgres_url: postgresql://postgres:postgres@aleyum-postgres:5432/postgres
    should_autocreate_tables: true

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/dagster_home/compute_logs

telemetry:
  enabled: false
