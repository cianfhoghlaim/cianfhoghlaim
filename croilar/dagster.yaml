# =============================================================================
# Croilar — Dagster instance configuration
# =============================================================================
# dagster 1.9.13 supports `storage.custom` for non-builtin backends.
# We use Postgres storage (via the existing `croilar-postgres` service) since
# the SQLite CompositeStorage code path is broken in this version.
#
# For dev, fall back to in-memory run storage (lose persistence across
# restarts but unblocks the komodo deploy chain).
# =============================================================================

storage:
  postgres:
    postgres_url: postgresql://postgres:postgres@croilar-postgres:5432/postgres

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/dagster_home/compute_logs

telemetry:
  enabled: false
