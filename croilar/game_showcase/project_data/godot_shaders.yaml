code_samples:
  - title: "Knotwork Shader (GLSL)"
    language: glsl
    code: |
      shader_type spatial;

      uniform vec4 primary_color : source_color = vec4(0.8, 0.6, 0.2, 1.0);
      uniform vec4 secondary_color : source_color = vec4(0.2, 0.5, 0.3, 1.0);
      uniform float animation_speed : hint_range(0.0, 5.0) = 1.0;

      float knot_segment(vec2 p, float r, float w) {
          return abs(length(p) - r) - w;
      }

      void fragment() {
          vec2 uv = UV;
          float pattern = celtic_pattern(uv, TIME * animation_speed);
          float edge = smoothstep(0.0, fwidth(pattern) * 2.0, pattern);
          ALBEDO = mix(primary_color.rgb, secondary_color.rgb, edge);
      }

  - title: "GDExtension Class"
    language: rust
    code: |
      #[derive(GodotClass)]
      #[class(base=Node3D)]
      pub struct CelticZone {
          base: Base<Node3D>,
          #[export]
          zone_id: GString,
          players: Vec<Gd<Player3D>>,
      }

      #[godot_api]
      impl INode3D for CelticZone {
          fn ready(&mut self) {
              self.connect_to_spacetimedb();
          }
      }

