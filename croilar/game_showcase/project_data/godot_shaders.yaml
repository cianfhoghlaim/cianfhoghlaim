# Godot Celtic Shaders
# GDExtension Rust shaders for Celtic visual effects

title: "Celtic Shader Suite"
subtitle: "Godot 4 GDExtension with Rust-Powered Shaders"
category: godot
order: 2

description: |
  Custom shader library for Godot 4 built with gdext (godot-rust). Features
  procedural Celtic patterns including knotwork, spirals, and illuminated
  manuscript effects. All shaders are GPU-accelerated with WGSL and integrate
  with SpacetimeDB for real-time multiplayer sync.

technologies:
  - Godot 4.4
  - Rust (gdext)
  - GDExtension
  - GLSL/WGSL
  - SpacetimeDB SDK

features:
  - SDF-based Celtic knotwork with animation
  - Archimedean spiral/triskele patterns
  - Fire and magic particle effects
  - Terrain shaders with fog and normal mapping
  - GPU compute particle physics
  - Hot-reload support for rapid iteration

shaders:
  - name: Knotwork
    type: fragment
    description: "SDF-based interlacing lines with animation"

  - name: Spiral/Triskele
    type: fragment
    description: "Multi-arm Archimedean spirals with glow"

  - name: Fire/Magic
    type: vertex+fragment
    description: "Billboard particle quads with life fade"

  - name: Particle Compute
    type: compute
    description: "GPU physics: gravity, wind, turbulence"

  - name: Terrain
    type: vertex+fragment
    description: "Fog, normal mapping, diffuse lighting"

