# =============================================================================
# Aleyum Portal - Developer Homelab Dashboard
# =============================================================================
# AG-UI agent chat, MCP tools browser, and Glance-style widgets
# https://aleyum.cianfhoghlaim.ie
# =============================================================================

name: aleyum-portal

services:
  aleyum-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aleyum-portal
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "${PORTAL_PORT:-3000}:3000"

    environment:
      # Node environment
      - NODE_ENV=production
      - PORT=3000

      # Database (Postgres for Better Auth)
      - DATABASE_URL=${DATABASE_URL}

      # Better Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://aleyum.cianfhoghlaim.ie}

      # PocketID OIDC
      - POCKETID_CLIENT_ID=${POCKETID_CLIENT_ID}
      - POCKETID_CLIENT_SECRET=${POCKETID_CLIENT_SECRET}
      - POCKETID_ISSUER=${POCKETID_ISSUER:-https://auth.cianfhoghlaim.ie}

      # Browser Agent backend (optional)
      - BROWSER_AGENT_URL=${BROWSER_AGENT_URL:-http://browser-agent:8002}

      # Komodo API (for stack management)
      - KOMODO_API_URL=${KOMODO_API_URL:-https://komodo.cianfhoghlaim.ie}
      - KOMODO_API_KEY=${KOMODO_API_KEY}
      - KOMODO_API_SECRET=${KOMODO_API_SECRET}

      # Timezone
      - TZ=${TZ:-Europe/Dublin}

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tools

    depends_on:
      aleyum-db:
        condition: service_healthy

  # ==========================================================================
  # PostgreSQL - Auth Database
  # ==========================================================================
  aleyum-db:
    image: postgres:16-alpine
    container_name: aleyum-db
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aleyum}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-aleyum}

    volumes:
      - aleyum-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aleyum} -d ${POSTGRES_DB:-aleyum}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - tools

volumes:
  aleyum-db-data:

networks:
  tools:
    external: true
