      language_pair: "string"
  - code: "EO1"
    strand_id: en-s1
    description: "Analyse the use of language in a literary extract"
    properties:
      blooms_level: "string"
      assessment_weight_pct: "float"
      language_pair: "string"
  - code: "CSO1"
    strand_id: cs-s1
    description: "Decompose a real-world problem into a sequence of algorithmic steps"
    properties:
      blooms_level: "string"
      assessment_weight_pct: "float"
