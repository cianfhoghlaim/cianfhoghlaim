# =============================================================================
# NCCA strand/outcome catalog (representative subset)
# Per openspec/changes/2026-07-12-baml-type-builder-ncca-v1
#
# The 4 NCCA-related BAML classes in
# `baml/education/_shared/strand_outcome.baml` are marked `@@dynamic`:
#   - CurriculumStrand     (~= abstract "Strand")
#   - LearningOutcome      (~= abstract "Outcome")
#   - CurriculumSpecStrand (~= abstract "CurriculumSpecification")
#   - AssessmentComponentStrand (~= abstract "AssessmentComponent")
#
# This YAML is the runtime-source for the per-strand / per-outcome
# properties. The runtime loader at
# `baml/education/_shared/strand_type_builder.py` reads this file
# and uses `baml_client.type_builder.TypeBuilder.add_property(...)`
# to inject the properties into the 4 `@@dynamic` classes above.
#
# The full NCCA tree (yearly-updated canonical tree) lives in the
# `leabharlann/` worktree. This YAML is a representative subset for
# the 6 LC priority subjects (Mathematics, Chemistry, Geography,
# Gaeilge, English, Computer Science) + 10 outcomes — enough to
# exercise the TypeBuilder path end-to-end without dragging in the
# whole ~1.5MB NCCA scrape.
#
# Schema (this file):
#   - `strands:` list of {name, properties: {prop_name: prop_type}}
#     where prop_type is one of: "string", "int", "float", "bool"
#   - `outcomes:` list of {code, properties: {prop_name: prop_type}}
#   - `specifications:` list of {subject_id, properties: ...}
#   - `assessment_components:` list of {name, properties: ...}
#
# Operator workflow (yearly NCCA update):
#   1. Operator pulls the new NCCA scrape into `leabharlann/`
#   2. Operator edits this YAML to add the new strands/outcomes
#      (no BAML regen needed; just restart the pipeline)
#   3. The TypeBuilder reloads the catalog on next extraction call
# =============================================================================

schema_version: "2026-07-12"
catalog_source: "NCCA — represented subset (6 LC priority subjects)"
extraction_helper: baml.education._shared.strand_type_builder.build_ncca_strand_type_builder

# -----------------------------------------------------------------------------
# Strands — the most-likely-to-change yearly NCCA data
# -----------------------------------------------------------------------------
strands:
  # ----- LC Mathematics (8 strands) -----
  - id: math-s1
    name: "LC Mathematics Strand 1: Algebra"
    properties:
      national_code: "S1"
      credit_hours: "int"
      blooms_levels: "string"
  - id: math-s2
    name: "LC Mathematics Strand 2: Functions"
    properties:
      national_code: "S2"
      credit_hours: "int"
      blooms_levels: "string"
  - id: math-s3
    name: "LC Mathematics Strand 3: Calculus"
    properties:
      national_code: "S3"
      credit_hours: "int"
  - id: math-s4
    name: "LC Mathematics Strand 4: Probability & Statistics"
    properties:
      national_code: "S4"
      credit_hours: "int"

  # ----- LC Chemistry (8 strands) -----
  - id: chem-s1
    name: "LC Chemistry Strand 1: Atomic Structure"
    properties:
      national_code: "S1"
      lab_required: "bool"
  - id: chem-s2
    name: "LC Chemistry Strand 2: Bonding"
    properties:
      national_code: "S2"
      lab_required: "bool"
  - id: chem-s3
    name: "LC Chemistry Strand 3: Stoichiometry"
    properties:
      national_code: "S3"
  - id: chem-s4
    name: "LC Chemistry Strand 4: Acids, Bases & Salts"
    properties:
      national_code: "S4"

  # ----- LC Geography (6 strands) -----
  - id: geog-s1
    name: "LC Geography Strand 1: Physical Environment"
    properties:
      national_code: "S1"
      fieldwork_required: "bool"
  - id: geog-s2
    name: "LC Geography Strand 2: Regional Geography"
    properties:
      national_code: "S2"
      fieldwork_required: "bool"
  - id: geog-s3
    name: "LC Geography Strand 3: Human Environment"
    properties:
      national_code: "S3"

  # ----- LC Gaeilge (4 strands) -----
  - id: ga-s1
    name: "LC Gaeilge Strand 1: Éisteacht (Listening)"
    properties:
      national_code: "S1"
      cumulative_assessment: "bool"
  - id: ga-s2
    name: "LC Gaeilge Strand 2: Léamhthuiscint (Reading)"
    properties:
      national_code: "S2"
      cumulative_assessment: "bool"
  - id: ga-s3
    name: "LC Gaeilge Strand 3: Scríbhneoireacht (Writing)"
    properties:
      national_code: "S3"
  - id: ga-s4
    name: "LC Gaeilge Strand 4: Cainteoireacht (Speaking)"
    properties:
      national_code: "S4"

  # ----- LC English (4 strands) -----
  - id: en-s1
    name: "LC English Strand 1: Reading"
    properties:
      national_code: "S1"
  - id: en-s2
    name: "LC English Strand 2: Writing"
    properties:
      national_code: "S2"
  - id: en-s3
    name: "LC English Strand 3: Oral Communication"
    properties:
      national_code: "S3"
  - id: en-s4
    name: "LC English Strand 4: Comprehending"
    properties:
      national_code: "S4"

  # ----- LC Computer Science (6 strands) -----
  - id: cs-s1
    name: "LC Computer Science Strand 1: Computational Thinking"
    properties:
      national_code: "S1"
      practical_pct: "int"
  - id: cs-s2
    name: "LC Computer Science Strand 2: Programming"
    properties:
      national_code: "S2"
      practical_pct: "int"
  - id: cs-s3
    name: "LC Computer Science Strand 3: Data & Algorithms"
    properties:
      national_code: "S3"
  - id: cs-s4
    name: "LC Computer Science Strand 4: Computer Systems"
    properties:
      national_code: "S4"

# -----------------------------------------------------------------------------
# Outcomes — representative subset (10 outcomes across 6 subjects)
# -----------------------------------------------------------------------------
