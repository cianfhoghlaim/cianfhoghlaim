# baml.toml — BAML project config for the cianfhoghlaim package
# Generated per openspec/changes/baml-reorganize-by-cluster
# Discovery: BAML CLI requires this file at ./baml_src/baml_src.toml
# but since we use a 3-cluster taxonomy at ./baml/, this file lives at
# ./baml/baml.toml and is accessed via the ./baml_src → ./baml symlink.
# Source layout (per baml-reorganize-by-cluster change):
#   ./clients.baml                       # canonical LLM clients
#   ./clients_llama_swap.baml            # specialty VL clients
#   ./education/                         # CLUSTER 1 — NCCA education
#   ├── _shared/                          #   cross-stage types + functions
#   ├── stages/                           #   5 NCCA stages
#   ├── pdfs/                             #   3 leaving-cert PDF extraction files
#   ├── subjects/                         #   8 qpack_*.baml (per-subject quest pack generators)
#   ├── cross_nation/                     #   2 British Isles cross-nation files
#   ├── statistics/                       #   1 education_statistics.baml
#   └── university/                       #   1 university_extraction.baml
#   ./celtic/                            # CLUSTER 2 — Celtic / Irish language
#   ├── _shared/                          #   cross-Celtic types
#   ├── gaois/                            #   4 gaois.ie API extraction files
#   ├── curriculum/                       #   Celtic-nation curriculum + mythology
#   ├── grammar_patterns.baml, morphology.baml
#   ├── sources.baml                      #   source-agnostic unified record
#   └── _archive/                         #   archived Celtic BAML files
#   ./processing/                        # CLUSTER 3 — Generic file processing
#   ├── _shared/                          #   cross-processing types
#   ├── email.baml, upstream_monitoring.baml, cv_extraction.baml, etc.
#   └── ...
# Output: ./baml_client/ for Python, ./baml_client_ts/ for TypeScript

[project]
name = "cianfhoghlaim-baml"
version = "0.223.0"
description = "BAML extraction schemas for the Cianfhoghlaim platform (3-cluster taxonomy: education/, celtic/, processing/)"

[generators]

# Python client (Pydantic v2 models — consumed by Dagster + DLT + the Honcho API)
[generators.lang_py]
output_type = "python/pydantic"
output_dir = "baml_client"
version = "0.223.0"
default_client_mode = "async"

# TypeScript client (Zod-compatible — consumed by TanStack AI + oRPC + croilar-portal UI)
[generators.lang_ts]
output_type = "typescript"
output_dir = "baml_client_ts"
version = "0.223.0"
default_client_mode = "async"