# defs.yaml — Per-subject England Edexcel Dagster assets (BIEP v2)
#
# Per the 2026-07-21-biep-v2-england-aqa-ocr-baml-pipeline-v1 change.

type: orchestration.components.EnglandBoardSubjectComponent

attributes:
  exam_board: edexcel
  baml_function: ExtractEdexcelQualSpec
  source_asset: 1_ingestion_curriculum_eng/edexcel/subjects
  partition_strategy: by_board_subject
  asset_check_kind: row_count
  namespace_pattern: "cianfhoghlaim.education.british_isles.england.edexcel.{subject}.{qualification_level}"
  cocoindex_app: england_edexcel_education_embedding
  cognify_dataset: cianfhoghlaim_england_edexcel
  automation_cron: "0 6 * * *"
  dagster_group_name_prefix: "2_materials_curriculum_eng_edexcel"
