# defs.yaml — Per-subject England OCR Dagster assets (BIEP v2)
#
# Per the 2026-07-21-biep-v2-england-aqa-ocr-baml-pipeline-v1 change.

type: cianfhoghlaim.orchestration.components.EnglandBoardSubjectComponent

attributes:
  exam_board: ocr
  baml_function: ExtractOCRQualSpec
  source_asset: 1_ingestion_curriculum_eng/ocr/subjects
  partition_strategy: by_board_subject
  asset_check_kind: row_count
  namespace_pattern: "cianfhoghlaim.education.british_isles.england.ocr.{subject}.{qualification_level}"
  cocoindex_app: england_ocr_education_embedding
  cognify_dataset: cianfhoghlaim_england_ocr
  automation_cron: "0 6 * * *"
  dagster_group_name_prefix: "2_materials_curriculum_eng_ocr"
