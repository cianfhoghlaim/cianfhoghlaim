# defs/2_materials/endpoint_health/defs.yaml
#
# L2 endpoint-health monitoring for the British Isles DLT layer.
# Probes every canonical British Isles endpoint every 6 hours via
# the new `dlt/common/endpoint_recovery.py` helper and posts Slack
# alerts on regressions.
#
# Reference: openspec/changes/2026-07-12-british-isles-endpoint-recovery-v1/
type: cianfhoghlaim.orchestration.components.CelticMaterialsComponent
attributes:
  baml_function: b.classify_endpoint_health
  source_asset: 2_materials/endpoint_health/endpoint_health_sink
  subject: endpoint_health
  partition_strategy: by_nation
  asset_check_kind: row_count
  automation_cron: "0 */6 * * *"
  automation: on_cron
  language: en
