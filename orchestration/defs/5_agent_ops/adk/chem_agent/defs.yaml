# defs/5_agent_ops/adk/chem_agent/defs.yaml
#
# L5 CelticAgentOpsComponent for the chem_agent (ADK) — one of the
# 8 NCCA subject agents for the British Isles Educational MMO.
type: cianfhoghlaim.orchestration.components.CelticAgentOpsComponent
attributes:
  agent_name: chem_agent
  framework: adk
  tools:
    - chem_syllabus_tool
    - chem_past_paper_tool
    - chem_marking_scheme_tool
    - chem_formative_item_tool
    - chem_response_score_tool
  memory_backend: letta
  event_stream: risingwave
  event_stream_endpoint: risingwave.cianfhoghlaim.ie:4566
  langfuse_trace_tag: agent.chem
  langfuse_drop_smoke_spans: true
  cognify:
    dataset: cianfhoghlaim_lc_chemistry
    top_k: 5
    emit_on:
      - response_generated
      - tool_call_completed
  langfuse_callbacks:
    trace_name: agent.chem.explain
    flush_interval: 30s
  routing_keywords:
    - chemistry
    - physical chemistry
    - organic chemistry
    - inorganic chemistry
    - leaving cert chemistry
    - lc chemistry
    - ncca chemistry
    - dian cecht
    - healing
    - titration
    - organic
    - equilibrium
