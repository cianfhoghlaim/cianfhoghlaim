# defs/5_agent_ops/adk/hist_agent/defs.yaml
#
# L5 CelticAgentOpsComponent for the hist_agent (ADK) — one of the
# 8 NCCA subject agents for the British Isles Educational MMO.
type: orchestration.components.CelticAgentOpsComponent
attributes:
  agent_name: hist_agent
  framework: adk
  tools:
    - hist_syllabus_tool
    - hist_past_paper_tool
    - hist_marking_scheme_tool
    - hist_formative_item_tool
    - hist_response_score_tool
  memory_backend: letta
  event_stream: risingwave
  event_stream_endpoint: risingwave.cianfhoghlaim.ie:4566
  langfuse_trace_tag: agent.hist
  langfuse_drop_smoke_spans: true
  cognify:
    dataset: cianfhoghlaim_lc_history
    top_k: 5
    emit_on:
      - response_generated
      - tool_call_completed
  langfuse_callbacks:
    trace_name: agent.hist.explain
    flush_interval: 30s
  routing_keywords:
    - history
    - irish history
    - european history
    - leaving cert history
    - lc history
    - ncca history
    - the morrígan
    - war
    - revolution
    # Quoted: bare 1916/1798 parse as YAML ints, but routing_keywords is a
    # list of search strings.
    - "1916"
    - "1798"
    - brehon law
