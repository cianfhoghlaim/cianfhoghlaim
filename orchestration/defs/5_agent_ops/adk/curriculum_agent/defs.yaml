# defs/5_agent_ops/adk/curriculum_agent/defs.yaml
#
# L5 CelticAgentOpsComponent for the curriculum_agent (adk) agent.
# The Component emits 5 Dagster assets:
# - agent_health_curriculum_agent
# - agent_routing_curriculum_agent
# - agent_memory_curriculum_agent
# - agent_event_curriculum_agent
# - agent_trace_curriculum_agent
type: orchestration.components.CelticAgentOpsComponent
attributes:
  agent_name: curriculum_agent
  framework: adk
  tools: ['search_curriculum_tool', 'get_vocabulary_tool', 'translate_text_tool', 'get_learning_outcomes_tool']
  memory_backend: letta
  event_stream: risingwave
  event_stream_endpoint: risingwave.cianfhoghlaim.ie:4566
  langfuse_trace_tag: agent.curriculum
  langfuse_drop_smoke_spans: true
  routing_keywords: ['curriculum', 'spec', 'learning outcome', 'ncca', 'cfe', 'cfw', 'ccea', 'sqa', 'leaving cert', 'gcse', 'a-level']
