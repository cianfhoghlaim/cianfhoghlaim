# defs/5_agent_ops/meaisinfhoghlaim/academic_history_agent/defs.yaml
#
# L5 CelticAgentOpsComponent for the academic_history_agent
# (the 13th routing bucket introduced by
# openspec/changes/2026-07-11-uog-math-statistics-academic-history-v1/).
# Emits the 5 canonical per-agent assets:
# agent_health, agent_routing, agent_memory, agent_event, agent_trace.
#
# Per the L5 CelticAgentOpsComponent contract:
# - `routing_keywords` are appended to the global `ROUTING_KEYWORDS` dict
#   via `_append_routing_keywords` at scaffold time
# - `tools` are the 10 academic_history_agent tools
# - `cognee_dataset` is `oideachais_history` (per the wire-up)
type: cianfhoghlaim.orchestration.components.CelticAgentOpsComponent
attributes:
  agent_name: academic_history_agent
  framework: custom
  module: cianfhoghlaim.agents.meaisinfhoghlaim.educational.academic_history_agent
  routing_keywords:
    - my history
    - my notes
    - my modules
    - my assignments
    - my exam history
    - my answers
    - my progress
    - summarise my degree
    - what should i revise
    - stair acadúil
    - mo chuid cuntas
    - mo nótaí
    - mo shonraí
    - mo mhodúil
    - mo scrúduithe
    - st311
    - st312
    - ma335
    - ma347
    - numerical analysis
    - nonlinear systems
  tools:
    - list_my_modules
    - list_my_artifacts
    - get_my_notes
    - get_my_assignments
    - get_my_exam_history
    - get_my_answer_scripts
    - summarise_my_progress
    - recommend_next_revision
    - compare_my_answer_to_solution
    - search_my_formulas
  cognee_dataset: oideachais_history
  privacy_gate: "INCLUDE_IDENTITY_RECORDS=false"
  pseudonymous_user: true