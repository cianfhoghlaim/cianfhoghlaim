# orchestration/defs/5_agent_ops/ciancheiltis/en_ga_roi/defs.yaml
#
# L5 CelticAgentOpsComponent for the ciancheiltis Phase 2 (en-ga —
# Republic of Ireland) agent ops surface. Per the ciancheiltis spec
# §"Dagster 5-layer asset graph per phase", every phase MUST have a
# complete 5-layer asset group; this file is Layer 5.
#
# Per the ciancheiltis spec Requirement "MotherDuck Dive + Flight per
# phase" + Scenario "en-cy Dive renders theme coverage" (carried
# verbatim to Phase 2):
#   - The Dive (the marimo quality dashboard at L4) MUST highlight
#     themes where the metadata-language-mismatch rate exceeds 5%.
#   - The Flight (the daily Celery/rq-style synthesis job) MUST run
#     every 24h to synthesise the next batch of bilingual pairs.
#
# Phase 2 differs from Phase 1 in the agent_ops "metadata mismatch"
# interpretation: gov.ie paired pages have a different mismatch
# pattern than `legislation.gov.uk` (see L4 metadata.notes). The
# anomaly sensor still fires at 5% but the `mismatch_reason` taxonomy
# includes `slug_pattern_/_en/` vs `/_ga/` rather than
# `metadata.language` mismatch.
#
# This YAML declares the two phase-ops assets the ciancheiltis spec
# calls for (under the canonical CelticAgentOpsComponent 5-asset
# emission):
#   - `ciancheiltis_en_ga_roi_anomaly_sensor`  — alerts when
#     metadata-language-mismatch rate > 5% (per the Phase 2 Dive
#     Scenario in the ciancheiltis spec). Implemented via the
#     `agent_event_ciancheiltis_en_ga_roi` agent-event asset which
#     publishes `ciancheiltis.en_ga_roi.metadata_mismatch_alert`
#     events to RisingWave at
#     `risingwave.cianfhoghlaim.ie:4566`; a RisingWave materialised
#     view fans out the alert to the L4 marimo dashboard + the
#     deployment-control-panel.
#   - `synthesis_flight`                       — the daily
#     Celery/rq-style job that synthesises the next day's bilingual
#     pairs. Emitted via the `agent_health_ciancheiltis_en_ga_roi`
#     health-check asset which fires on the `*/15 * * * *` cron and
#     dispatches the `ciancheiltis_en_ga_roi_synthesis_flight` task to
#     the rq-style worker at `rq.cianfhoghlaim.ie:6379`.
#
# The 3 sibling canonical assets (`agent_routing_`,
# `agent_memory_`, `agent_trace_`) round out the 5-asset
# CelticAgentOpsComponent contract.
#
# Reference: openspec/specs/ciancheiltis/spec.md — Requirement
# "Dagster 5-layer asset graph per phase" (Phase 2 = en_ga_roi) +
# Requirement "6-phase language-pair staging" + Requirement
# "MotherDuck Dive + Flight per phase".
type: orchestration.components.CelticAgentOpsComponent
attributes:
  agent_name: ciancheiltis_en_ga_roi_phase_ops
  framework: custom
  module: cianfhoghlaim.agents.ciancheiltis.en_ga_roi_phase_ops
  tools:
    - ciancheiltis_en_ga_roi_anomaly_sensor
    - ciancheiltis_en_ga_roi_synthesis_flight
    - ciancheiltis_en_ga_roi_pair_quality_score
    - ciancheiltis_en_ga_roi_metadata_language_audit
    - ciancheiltis_en_ga_roi_phase_gate_summary
  memory_backend: graphiti
  event_stream: risingwave
  event_stream_endpoint: risingwave.cianfhoghlaim.ie:4566
  langfuse_trace_tag: agent.ciancheiltis.en_ga_roi_phase_ops
  langfuse_drop_smoke_spans: true
  health_endpoint: rq.cianfhoghlaim.ie:6379/health
  routing_keywords:
    - ciancheiltis
    - ciancheiltis en-ga-roi
    - ciancheiltis ireland
    - ciancheiltis republic
    - en ga roi
    - english irish
    - bilingual pairs ireland
    - phase 2
    - metadata language mismatch
    - synthesis flight
    - anomaly sensor
    - ga > en
    - en > ga
    - téarma
    - foras na gaeilge
    - irishstatutebook
  cognee_dataset: cianfhoghlaim_ciancheiltis_en_ga_roi
  privacy_gate: "INCLUDE_GOV_IE_PII=false"
  pseudonymous_user: true
  langfuse_callbacks:
    trace_name: agent.ciancheiltis.en_ga_roi_phase_ops
    flush_interval: 30
  cognify:
    enabled: true
    datasets:
      - cianfhoghlaim_ciancheiltis_en_ga_roi
    retrigger: false
  tags:
    - ciancheiltis
    - en-ga-roi
    - phase-2
    - agent-ops
    - anomaly-sensor
    - synthesis-flight
  metadata:
    openspec_change: 2026-09-06-ciancheiltis-v1
    spec: ciancheiltis
    phase: en_ga_roi
    asset_aliases:
      agent_event_ciancheiltis_en_ga_roi_phase_ops: ciancheiltis_en_ga_roi_anomaly_sensor
      agent_health_ciancheiltis_en_ga_roi_phase_ops: ciancheiltis_en_ga_roi_synthesis_flight
    anomaly_sensor:
      name: ciancheiltis_en_ga_roi_anomaly_sensor
      trigger: metadata_language_mismatch_rate
      threshold_pct: 5
      unit: percent
      source: "RisingWave stream `ciancheiltis.en_ga_roi.metadata_mismatch_alert`"
      description: |
        Publishes a `ciancheiltis.en_ga_roi.metadata_mismatch_alert`
        event to RisingWave at
        `risingwave.cianfhoghlaim.ie:4566` whenever the per-theme
        metadata-language-mismatch rate exceeds 5%. The L4 marimo
        quality dashboard (`ciancheiltis_en_ga_roi_quality.py`)
        renders the alert in red so operators can spot the
        regression. The alert feeds the deployment-control-panel
        5-tab UI and the `bilingual_coverage_audit.py` gate (≥ 0.95
        threshold).

        Phase 2 mismatch taxonomy (different from Phase 1 — see L4
        notes):
        - `slug_pattern_/_en/` vs `/_ga/` (gov.ie, ncca.ie canonical
          pair signal — generally the metadata tag is correct)
        - `metadata.language` mismatch (rare on gov.ie; more common
          on irishstatutebook.ie)
        - `body_dual_language` (a page that's mostly EN with a GA
          sidebar / footnote; valid under the Official Languages Act
          2003 but flagged at the `body_dual_language` level)
      cron: "*/5 * * * *"
    synthesis_flight:
      name: ciancheiltis_en_ga_roi_synthesis_flight
      kind: celery_rq_style
      cadence: daily
      cron: "0 5 * * *"
      worker_endpoint: rq.cianfhoghlaim.ie:6379
      queue: ciancheiltis_en_ga_roi
      description: |
        Daily Celery/rq-style synthesis flight for the en-ga-roi
        Phase 2 pipeline. Materialises the next day's bilingual-pair
        batch: ingests the 8 Republic of Ireland public-sector themes
        via the L1 CelticIngestionComponent, runs the BAML extraction
        via the L2 `_assets.py`, refreshes the L3 CocoIndex v1
        embedding, and re-evaluates the L4 asset checks
        (`bilingual_pairs_seeded_check` ≥ 500 +
        `ragas_quality_check` ≥ 0.70). The flight runs at 05:00 UTC,
        one hour after the L1 cron at 04:00 UTC, so the upstream DLT
        loads complete before BAML fires.
    notes: |
      The `framework: custom` choice bypasses the 12-agent fleet
      (root + 8 ADK + 3 Agno) because the en-ga-roi phase ops is a
      vertical-slice surface (Dagster-only), not a horizontal agent.
      The `cognee_dataset: cianfhoghlaim_ciancheiltis_en_ga_roi` is
      the dedicated knowledge graph for Phase 2 — populated by
      `agents.ciancheiltis.en_ga_roi_phase_ops.cognify_themes()` and
      cross-queried by `agents.corpus.corpus_agent` for cross-phase
      comparison (Phase 3 NI will reuse the same `cognee_dataset`
      schema).