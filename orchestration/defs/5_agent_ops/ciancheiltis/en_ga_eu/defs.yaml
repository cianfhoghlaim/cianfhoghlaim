# orchestration/defs/5_agent_ops/ciancheiltis/en_ga_eu/defs.yaml
#
# L5 CelticAgentOpsComponent for the ciancheiltis Phase 6 (en-ga /
# European Union) agent ops surface. Per the ciancheiltis spec
# §"Dagster 5-layer asset graph per phase", every phase MUST have a
# complete 5-layer asset group; this file is Layer 5.
#
# Per the ciancheiltis spec Requirement "MotherDuck Dive + Flight per
# phase" + Scenario "en-cy Dive renders theme coverage" (carried
# verbatim to Phase 6):
#   - The Dive (the marimo quality dashboard at L4) MUST highlight
#     themes where the metadata-language-mismatch rate exceeds 5%.
#   - The Flight (the daily Celery/rq-style synthesis job) MUST run
#     every 24h to synthesise the next batch of bilingual pairs.
#
# Phase 6 differs from Phases 1–5 in the agent_ops "metadata mismatch"
# interpretation: the EU institutional surface (Commission +
# Parliament + Council + ECB + EIB + EIF) uses a `/ga/` infix pattern
# for the Irish-language portal — a SIMILAR but NOT IDENTICAL pattern
# to Phase 2 (gov.ie `/en/` ↔ `/ga/` infix pair signal) and Phase 4
# (gov.scot `/en/` ↔ `/gd/` infix pair signal). The DOMINANT Phase 6
# mismatch pattern is the `language_availability` axis — many EU
# documents have a `summary_only` GA annotation rather than a `full`
# GA body, and the `language_availability` column distinguishes them
# at the schema level (rather than via a `mismatch_reason` flag).
# The anomaly sensor still fires at 5% but the per-theme mismatch
# rate will trend DRAMATICALLY HIGHER than Phases 1–5 because the EU
# partial-coverage landscape means many EU documents exist only in
# English plus a "summary in Irish" — this is documented as a
# CHARACTERISTIC of the Phase 6 surface, NOT a regression.
#
# **Phase 6 is the FINAL phase** of the 6-phase ciancheiltis spine
# (Phase 1 en-cy / Phase 2 en-ga-roi / Phase 3 en-ga-ni / Phase 4
# en-gd / Phase 5 en-gv / Phase 6 en-ga-eu). The Flight scheduled by
# this Component is the final entry in the ciancheiltis Flight
# registry — after this lands, the 6-phase ciancheiltis spine is
# complete.
#
# This YAML declares the two phase-ops assets the ciancheiltis spec
# calls for (under the canonical CelticAgentOpsComponent 5-asset
# emission):
#   - `ciancheiltis_en_ga_eu_anomaly_sensor`  — alerts when
#     metadata-language-mismatch rate > 5% (per the Phase 6 Dive
#     Scenario in the ciancheiltis spec). Implemented via the
#     `agent_event_ciancheiltis_en_ga_eu` agent-event asset which
#     publishes `ciancheiltis.en_ga_eu.metadata_mismatch_alert`
#     events to RisingWave at
#     `risingwave.cianfhoghlaim.ie:4566`; a RisingWave materialised
#     view fans out the alert to the L4 marimo dashboard + the
#     deployment-control-panel.
#   - `synthesis_flight`                   — the daily
#     Celery/rq-style job that synthesises the next day's bilingual
#     pairs. Emitted via the `agent_health_ciancheiltis_en_ga_eu`
#     health-check asset which fires on the `*/15 * * * *` cron and
#     dispatches the `ciancheiltis_en_ga_eu_synthesis_flight` task to
#     the rq-style worker at `rq.cianfhoghlaim.ie:6379`.
#
# The 3 sibling canonical assets (`agent_routing_`,
# `agent_memory_`, `agent_trace_`) round out the 5-asset
# CelticAgentOpsComponent contract.
#
# Reference: openspec/specs/ciancheiltis/spec.md — Requirement
# "Dagster 5-layer asset graph per phase" (Phase 6 = en_ga_eu) +
# Requirement "6-phase language-pair staging" + Requirement
# "MotherDuck Dive + Flight per phase".
type: orchestration.components.CelticAgentOpsComponent
attributes:
  agent_name: ciancheiltis_en_ga_eu_phase_ops
  framework: custom
  module: cianfhoghlaim.agents.ciancheiltis.en_ga_eu_phase_ops
  tools:
    - ciancheiltis_en_ga_eu_anomaly_sensor
    - ciancheiltis_en_ga_eu_synthesis_flight
    - ciancheiltis_en_ga_eu_pair_quality_score
    - ciancheiltis_en_ga_eu_metadata_language_audit
    - ciancheiltis_en_ga_eu_phase_gate_summary
  memory_backend: graphiti
  event_stream: risingwave
  event_stream_endpoint: risingwave.cianfhoghlaim.ie:4566
  langfuse_trace_tag: agent.ciancheiltis.en_ga_eu_phase_ops
  langfuse_drop_smoke_spans: true
  health_endpoint: rq.cianfhoghlaim.ie:6379/health
  routing_keywords:
    - ciancheiltis
    - ciancheiltis en-ga-eu
    - ciancheiltis european union
    - ciancheiltis eu
    - ciancheiltis eur-lex
    - en ga eu
    - english irish european union
    - bilingual pairs european union
    - phase 6
    - phase six
    - final phase
    - umbrella completion
    - language availability
    - metadata language mismatch
    - synthesis flight
    - anomaly sensor
    - en > ga
    - ga > en
    - eur-lex
    - curia
    - europarl
    - ecb
    - council regulation 1/1958
    - article 55 teu
    - council decision 2020/2172
    - partial coverage irish
    - summary only irish
  cognee_dataset: cianfhoghlaim_ciancheiltis_en_ga_eu
  privacy_gate: "INCLUDE_EU_PII=false"
  pseudonymous_user: true
  langfuse_callbacks:
    trace_name: agent.ciancheiltis.en_ga_eu_phase_ops
    flush_interval: 30
  cognify:
    enabled: true
    datasets:
      - cianfhoghlaim_ciancheiltis_en_ga_eu
    retrigger: false
  tags:
    - ciancheiltis
    - en-ga-eu
    - phase-6
    - final-phase
    - agent-ops
    - anomaly-sensor
    - synthesis-flight
    - european-union
  metadata:
    openspec_change: 2026-09-06-ciancheiltis-v1
    spec: ciancheiltis
    phase: en_ga_eu
    is_final_phase: true
    asset_aliases:
      agent_event_ciancheiltis_en_ga_eu_phase_ops: ciancheiltis_en_ga_eu_anomaly_sensor
      agent_health_ciancheiltis_en_ga_eu_phase_ops: ciancheiltis_en_ga_eu_synthesis_flight
    anomaly_sensor:
      name: ciancheiltis_en_ga_eu_anomaly_sensor
      trigger: metadata_language_mismatch_rate
      threshold_pct: 5
      unit: percent
      source: "RisingWave stream `ciancheiltis.en_ga_eu.metadata_mismatch_alert`"
      description: |
        Publishes a `ciancheiltis.en_ga_eu.metadata_mismatch_alert`
        event to RisingWave at
        `risingwave.cianfhoghlaim.ie:4566` whenever the per-theme
        metadata-language-mismatch rate exceeds 5%. The L4 marimo
        quality dashboard (`ciancheiltis_en_ga_eu_quality.py`) renders
        the alert in red so operators can spot the regression. The
        alert feeds the deployment-control-panel 5-tab UI and the
        `bilingual_coverage_audit.py` gate (≥ 0.95 threshold).

        Phase 6 mismatch taxonomy (DIFFERENT from Phases 1–5 — see
        L4 notes):
        - `language_availability_summary_only` (the DOMINANT Phase 6
          reason — many EU documents exist only in English plus a
          "summary in Irish" rather than a full Irish translation;
          this is the documented Council Decision (EU) 2020/2172
          derogation for older acts pre-dating 2022-01-01)
        - `language_availability_partial` (an EU document that has a
          GA section but not a full GA translation — VALID content
          per the EU bilingual mandate but flagged because Phase 6
          enforces ≥ 500 `(en, ga)` PAIRS, not partial-coverage rows)
        - `metadata.language` mismatch (rare on EU sites — the EUR-
          Lex CELEX metadata is reliable)
        - `slug_prefix_or_infix_mismatch` (rare — EU sites use a
          `?uri=CELEX:...` pattern, not a slug-prefix or infix)

        Phase 6 mismatch rates are EXPECTED to trend DRAMATICALLY
        HIGHER than Phases 1–5 because EU-level coverage is
        partial by design: many EU public-sector documents exist
        only in English plus a "summary in Irish" rather than a full
        Irish translation. The 5% threshold is absolute (not
        relative); the high base rate is a known characteristic of
        the en-ga-eu partial-coverage landscape (per
        `dlt_sources/ciancheiltis/en_ga_eu/__init__.py`). The L4
        marimo dashboard renders this in the
        `language_availability_distribution` column with the dominant
        tag `summary_only` for many themes.
      cron: "*/5 * * * *"
    synthesis_flight:
      name: ciancheiltis_en_ga_eu_synthesis_flight
      kind: celery_rq_style
      cadence: daily
      cron: "0 5 * * *"
      worker_endpoint: rq.cianfhoghlaim.ie:6379
      queue: ciancheiltis_en_ga_eu
      description: |
        Daily Celery/rq-style synthesis flight for the en-ga-eu
        Phase 6 pipeline. Materialises the next day's bilingual-pair
        batch: ingests the 8 EU public-sector themes via the L1
        CelticIngestionComponent, runs the BAML extraction via the
        L2 `_assets.py` (using `CiancheiltisGaEuExtract` →
        `ExtractEuTreaty` + `ExtractEuInstitutionPage` +
        `ExtractEuTerm`), refreshes the L3 CocoIndex v1 embedding
        into `lancedb://md:cianfhoghlaim/ciancheiltis/en_ga_eu_chunks`,
        and re-evaluates the L4 asset checks
        (`bilingual_pairs_seeded_check` ≥ 500 +
        `ragas_quality_check` ≥ 0.70). The flight runs at 05:00 UTC,
        one hour after the L1 cron at 04:00 UTC, so the upstream DLT
        loads complete before BAML fires.

        **Phase 6 partial-coverage caveat**: the 500-pair gate will
        frequently FAIL on Phase 6 because the EU-level coverage is
        partial; the flight continues to run daily regardless (the
        gate is ASPIRATIONAL, not blocking — see
        `_assets.py::ciancheiltis_en_ga_eu_bilingual_pairs_seeded_check`
        and the Dive `BILINGUAL_PAIRS_DIVE_GA_EU` description for the
        rationale).

        **Phase 6 is the FINAL flight** of the 6-phase ciancheiltis
        spine — after this flight lands + the L1 ingestion completes
        + the L2 BAML extraction runs + the L3 CocoIndex embedding
        mounts + the L4 asset checks evaluate, the ciancheiltis
        umbrella is complete (all 6 phases: en_cy, en_ga_roi,
        en_ga_ni, en_gd, en_gv, en_ga_eu).
    notes: |
      The `framework: custom` choice bypasses the 12-agent fleet
      (root + 8 ADK + 3 Agno) because the en-ga-eu phase ops is a
      vertical-slice surface (Dagster-only), not a horizontal agent.
      The `cognee_dataset: cianfhoghlaim_ciancheiltis_en_ga_eu` is
      the dedicated knowledge graph for Phase 6 — populated by
      `agents.ciancheiltis.en_ga_eu_phase_ops.cognify_themes()` and
      cross-queried by `agents.corpus.corpus_agent` for cross-phase
      comparison (Phase 6 is the FINAL phase — no successor phase
      will reuse the schema; the cross-phase comparison is the
      umbrella-completion summary in the marimo notebook
      `notebooks/ciancheiltis_en_ga_eu.py`).

      Phase 6 differs from Phases 1–5 in three operational ways:
      1. The EU is a **supranational** institution family (European
         Commission + European Parliament + Council of the European
         Union + European Central Bank + European Investment Bank +
         European Investment Fund + Court of Justice of the European
         Union) — NOT a national jurisdiction (Wales / ROI / NI /
         Scotland / Isle of Man) and NOT a UK constituent country.
         Irish (Gaeilge) is a treaty language under Article 55 of
         the Treaty on European Union (TEU) + Council Regulation No
         1/1958, and a full official EU language since Council
         Decision (EU) 2020/2172 took effect on 2022-01-01. The L1
         ingestion pipeline handles the EU-specific scope:
         `eur-lex.europa.eu/legal-content/GA/TXT/?uri=CELEX:...` for
         the 8 canonical CELEX treaties (T1 legislation), `iate.europa.eu`
         for the IATE terminology database (T6), `curia.europa.eu`
         for the CJEU (T7 courts), and `ecb.europa.eu` +
         `europarl.europa.eu` + `consilium.europa.eu` + `ec.europa.eu`
         for the EU institutions family (T8).
      2. EU-level coverage is **PARTIAL** for Irish per Council
         Decision (EU) 2020/2172 + Council Regulation No 1/1958 +
         Article 55 TEU. Many EU documents exist only in English plus
         a "summary in Irish" rather than a full Irish translation.
         The Phase 6 schema MUST capture `language_availability` ∈
         {"full", "partial", "summary_only"} as a first-class column
         on every per-phase row. The `cognee_dataset` schema uses
         `minority_languages: [ga]` (mirroring Phase 2 + Phase 3).
         The `BAAI/bge-m3` 1024-d embedder handles `en` + `ga`
         natively per the R2 conformance contract.
      3. **Phase 6 is the FINAL phase** of the 6-phase ciancheiltis
         spine. The Flight scheduled by this Component is the FINAL
         entry in the ciancheiltis Flight registry
         (`motherduck/flights/ciancheiltis_en_ga_eu_flight.py`). The
         marimo notebook `notebooks/ciancheiltis_en_ga_eu.py`
         includes a 5th umbrella-completion cell that renders a
         6-row summary table across all 6 phases — this is the
         final-tally dashboard.
