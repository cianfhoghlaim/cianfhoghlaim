# orchestration/defs/5_agent_ops/ciancheiltis/en_gv/defs.yaml
#
# L5 CelticAgentOpsComponent for the ciancheiltis Phase 5 (en-gv —
# Isle of Man) agent ops surface. Per the ciancheiltis spec §"Dagster
# 5-layer asset graph per phase", every phase MUST have a complete
# 5-layer asset group; this file is Layer 5.
#
# Per the ciancheiltis spec Requirement "MotherDuck Dive + Flight per
# phase" + Scenario "en-cy Dive renders theme coverage" (carried
# verbatim to Phase 5):
#   - The Dive (the marimo quality dashboard at L4) MUST highlight
#     themes where the metadata-language-mismatch rate exceeds 5%.
#   - The Flight (the daily Celery/rq-style synthesis job) MUST run
#     every 24h to synthesise the next batch of bilingual pairs.
#
# Phase 5 differs from Phase 1 + Phase 2 + Phase 3 + Phase 4 in the
# agent_ops "metadata mismatch" interpretation: IoM government paired
# pages do NOT use a slug-prefix or a `/gv/` infix — there is
# effectively NO structural pairing. Pairing is corroborated from body
# content via the lingua-py detector. The anomaly sensor still fires
# at 5% but the per-theme mismatch rate will trend DRAMATICALLY HIGHER
# than ROI/NI/Wales/Scotland because Manx is a REVIVAL language with
# NO statutory bilingual framework — most IoM government pages are
# English-only.
#
# This YAML declares the two phase-ops assets the ciancheiltis spec
# calls for (under the canonical CelticAgentOpsComponent 5-asset
# emission):
#   - `ciancheiltis_en_gv_anomaly_sensor`  — alerts when
#     metadata-language-mismatch rate > 5% (per the Phase 5 Dive
#     Scenario in the ciancheiltis spec). Implemented via the
#     `agent_event_ciancheiltis_en_gv` agent-event asset which
#     publishes `ciancheiltis.en_gv.metadata_mismatch_alert`
#     events to RisingWave at
#     `risingwave.cianfhoghlaim.ie:4566`; a RisingWave materialised
#     view fans out the alert to the L4 marimo dashboard + the
#     deployment-control-panel.
#   - `synthesis_flight`                   — the daily
#     Celery/rq-style job that synthesises the next day's bilingual
#     pairs. Emitted via the `agent_health_ciancheiltis_en_gv`
#     health-check asset which fires on the `*/15 * * * *` cron and
#     dispatches the `ciancheiltis_en_gv_synthesis_flight` task to
#     the rq-style worker at `rq.cianfhoghlaim.ie:6379`.
#
# The 3 sibling canonical assets (`agent_routing_`,
# `agent_memory_`, `agent_trace_`) round out the 5-asset
# CelticAgentOpsComponent contract.
#
# Reference: openspec/specs/ciancheiltis/spec.md — Requirement
# "Dagster 5-layer asset graph per phase" (Phase 5 = en_gv) +
# Requirement "6-phase language-pair staging" + Requirement
# "MotherDuck Dive + Flight per phase".
type: orchestration.components.CelticAgentOpsComponent
attributes:
  agent_name: ciancheiltis_en_gv_phase_ops
  framework: custom
  module: cianfhoghlaim.agents.ciancheiltis.en_gv_phase_ops
  tools:
    - ciancheiltis_en_gv_anomaly_sensor
    - ciancheiltis_en_gv_synthesis_flight
    - ciancheiltis_en_gv_pair_quality_score
    - ciancheiltis_en_gv_metadata_language_audit
    - ciancheiltis_en_gv_phase_gate_summary
  memory_backend: graphiti
  event_stream: risingwave
  event_stream_endpoint: risingwave.cianfhoghlaim.ie:4566
  langfuse_trace_tag: agent.ciancheiltis.en_gv_phase_ops
  langfuse_drop_smoke_spans: true
  health_endpoint: rq.cianfhoghlaim.ie:6379/health
  routing_keywords:
    - ciancheiltis
    - ciancheiltis en-gv
    - ciancheiltis isle of man
    - ciancheiltis manx
    - ciancheiltis ellan vannin
    - en gv
    - english manx gaelic
    - bilingual pairs isle of man
    - phase 5
    - metadata language mismatch
    - synthesis flight
    - anomaly sensor
    - en > gv
    - gv > en
    - culture vannin
    - learn manx
    - bunscoill ghaelgagh
    - radio manx
    - manx revival language
  cognee_dataset: cianfhoghlaim_ciancheiltis_en_gv
  privacy_gate: "INCLUDE_ISLE_OF_MAN_PII=false"
  pseudonymous_user: true
  langfuse_callbacks:
    trace_name: agent.ciancheiltis.en_gv_phase_ops
    flush_interval: 30
  cognify:
    enabled: true
    datasets:
      - cianfhoghlaim_ciancheiltis_en_gv
    retrigger: false
  tags:
    - ciancheiltis
    - en-gv
    - phase-5
    - agent-ops
    - anomaly-sensor
    - synthesis-flight
  metadata:
    openspec_change: 2026-09-06-ciancheiltis-v1
    spec: ciancheiltis
    phase: en_gv
    asset_aliases:
      agent_event_ciancheiltis_en_gv_phase_ops: ciancheiltis_en_gv_anomaly_sensor
      agent_health_ciancheiltis_en_gv_phase_ops: ciancheiltis_en_gv_synthesis_flight
    anomaly_sensor:
      name: ciancheiltis_en_gv_anomaly_sensor
      trigger: metadata_language_mismatch_rate
      threshold_pct: 5
      unit: percent
      source: "RisingWave stream `ciancheiltis.en_gv.metadata_mismatch_alert`"
      description: |
        Publishes a `ciancheiltis.en_gv.metadata_mismatch_alert`
        event to RisingWave at
        `risingwave.cianfhoghlaim.ie:4566` whenever the per-theme
        metadata-language-mismatch rate exceeds 5%. The L4 marimo
        quality dashboard (`ciancheiltis_en_gv_quality.py`) renders
        the alert in red so operators can spot the regression. The
        alert feeds the deployment-control-panel 5-tab UI and the
        `bilingual_coverage_audit.py` gate (≥ 0.95 threshold).

        Phase 5 mismatch taxonomy (DIFFERENT from Phase 1 + Phase 2 +
        Phase 3 + Phase 4 — see L4 notes):
        - `en_only_no_pair` (the DOMINANT Phase 5 reason — most IoM
          government pages are English-only because Manx is a REVIVAL
          language with NO statutory bilingual framework)
        - `gv_only_no_pair` (a Manx page that's GV-only with no EN
          mirror — VALID content per the Culture Vannin brief but
          flagged at the `gv_only_no_pair` level because Phase 5
          enforces ≥ 500 `(en, gv)` PAIRS, not GV-only rows)
        - `metadata.language` mismatch (rare on IoM government sites)
        - `slug_prefix_or_infix_mismatch` (rare — IoM sites do not
          use slug prefixes like `legislation.gov.im/<...>` /
          `legislation.gov.im/gv/<...>` because the bilingual
          structure is absent)
        Phase 5 mismatch rates are EXPECTED to trend DRAMATICALLY
        HIGHER than Phase 1 + Phase 2 + Phase 3 + Phase 4 because
        Manx coverage is so sparse: most IoM public-sector pages
        exist in English only, and many themes (T1 legislation, T7
        courts, T8 local government) will land with zero Manx
        content. The 5% threshold is absolute (not relative); the
        high base rate is a known characteristic of the en-gv
        REVIVAL-LANGUAGE landscape (per
        `dlt_sources/ciancheiltis/en_gv/__init__.py`). The L4 marimo
        dashboard renders this in the `mismatch_reason` column with
        the dominant tag `en_only_no_pair`.
      cron: "*/5 * * * *"
    synthesis_flight:
      name: ciancheiltis_en_gv_synthesis_flight
      kind: celery_rq_style
      cadence: daily
      cron: "0 5 * * *"
      worker_endpoint: rq.cianfhoghlaim.ie:6379
      queue: ciancheiltis_en_gv
      description: |
        Daily Celery/rq-style synthesis flight for the en-gv Phase 5
        pipeline. Materialises the next day's bilingual-pair batch:
        ingests the 8 Manx public-sector themes via the L1
        CelticIngestionComponent, runs the BAML extraction via the
        L2 `_assets.py` (using `CiancheiltisGvExtract` →
        `ExtractManxStatute` + `ExtractManxGovPage` +
        `ExtractManxTerm`), refreshes the L3 CocoIndex v1
        embedding into `lancedb://md:cianfhoghlaim/ciancheiltis/en_gv_chunks`,
        and re-evaluates the L4 asset checks
        (`bilingual_pairs_seeded_check` ≥ 500 +
        `ragas_quality_check` ≥ 0.70). The flight runs at 05:00 UTC,
        one hour after the L1 cron at 04:00 UTC, so the upstream DLT
        loads complete before BAML fires.

        **Phase 5 revival-status caveat**: the 500-pair gate will
        frequently FAIL on Phase 5 because Manx is a REVIVAL
        language; the flight continues to run daily regardless
        (the gate is ASPIRATIONAL, not blocking — see
        `_assets.py::ciancheiltis_en_gv_bilingual_pairs_seeded_check`
        and the Dive `BILINGUAL_PAIRS_DIVE_GV` description for the
        rationale).
    notes: |
      The `framework: custom` choice bypasses the 12-agent fleet
      (root + 8 ADK + 3 Agno) because the en-gv phase ops is a
      vertical-slice surface (Dagster-only), not a horizontal agent.
      The `cognee_dataset: cianfhoghlaim_ciancheiltis_en_gv` is the
      dedicated knowledge graph for Phase 5 — populated by
      `agents.ciancheiltis.en_gv_phase_ops.cognify_themes()` and
      cross-queried by `agents.corpus.corpus_agent` for cross-phase
      comparison (Phase 6 will reuse the same `cognee_dataset`
      schema).

      Phase 5 differs from Phase 1 + Phase 2 + Phase 3 + Phase 4 in
      two operational ways:
      1. The Isle of Man is a CROWN DEPENDENCY (Tynwald — the
         bicameral Isle of Man Parliament with the House of Keys +
         the Legislative Council; Tynwald Day 5 July is the oldest
         continuous parliament in the world, dating to AD 979) —
         NOT a UK constituent country (Scotland / Wales / NI), NOT
         a member of the EU, and NOT a Republic (Phase 2 Ireland).
         The L1 ingestion pipeline handles the IoM-specific scope:
         `legislation.gov.im` for Acts of Tynwald,
         `culturevannin.im/learn-gaelg/` as the canonical bilingual
         reference, `gov.im` for central government press releases,
         `learnmanx.com` as the canonical Learn Manx (Ynsee
         Gaelgagh) surface, and `bunscoill.sch.im` for Bunscoill
         Ghaelgagh (the Manx-medium primary school).
      2. Manx (Gaelg) is a REVIVAL language with ONE minority
         language under active restoration — unlike Phase 1
         (Welsh — statutory) Phase 2 (Irish — statutory),
         Phase 3 (Irish + Ulster Scots — statutory), or Phase 4
         (Scottish Gaelic — statutory). The `cognee_dataset`
         schema uses `minority_languages: [gv]` (similar to Phase
         4's `[gd]`). The `BAAI/bge-m3` 1024-d embedder handles
         `en` + `gv` natively per the R2 conformance contract.

