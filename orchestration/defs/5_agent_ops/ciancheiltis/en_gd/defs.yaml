# orchestration/defs/5_agent_ops/ciancheiltis/en_gd/defs.yaml
#
# L5 CelticAgentOpsComponent for the ciancheiltis Phase 4 (en-gd —
# Scotland) agent ops surface. Per the ciancheiltis spec §"Dagster
# 5-layer asset graph per phase", every phase MUST have a complete
# 5-layer asset group; this file is Layer 5.
#
# Per the ciancheiltis spec Requirement "MotherDuck Dive + Flight per
# phase" + Scenario "en-cy Dive renders theme coverage" (carried
# verbatim to Phase 4):
#   - The Dive (the marimo quality dashboard at L4) MUST highlight
#     themes where the metadata-language-mismatch rate exceeds 5%.
#   - The Flight (the daily Celery/rq-style synthesis job) MUST run
#     every 24h to synthesise the next batch of bilingual pairs.
#
# Phase 4 differs from Phase 1 + Phase 2 + Phase 3 in the agent_ops
# "metadata mismatch" interpretation: gov.scot paired pages do NOT
# use a slug-prefix or a `/gd/` infix — the `<html lang="gd">`
# attribute is the canonical pair signal. The anomaly sensor still
# fires at 5% but the per-theme mismatch rate will trend HIGHER than
# ROI/NI/Wales because Scottish Gaelic coverage is partial on most
# government sites (this is expected, not a regression — see L4
# metadata.notes).
#
# This YAML declares the two phase-ops assets the ciancheiltis spec
# calls for (under the canonical CelticAgentOpsComponent 5-asset
# emission):
#   - `ciancheiltis_en_gd_anomaly_sensor`  — alerts when
#     metadata-language-mismatch rate > 5% (per the Phase 4 Dive
#     Scenario in the ciancheiltis spec). Implemented via the
#     `agent_event_ciancheiltis_en_gd` agent-event asset which
#     publishes `ciancheiltis.en_gd.metadata_mismatch_alert`
#     events to RisingWave at
#     `risingwave.cianfhoghlaim.ie:4566`; a RisingWave materialised
#     view fans out the alert to the L4 marimo dashboard + the
#     deployment-control-panel.
#   - `synthesis_flight`                   — the daily
#     Celery/rq-style job that synthesises the next day's bilingual
#     pairs. Emitted via the `agent_health_ciancheiltis_en_gd`
#     health-check asset which fires on the `*/15 * * * *` cron and
#     dispatches the `ciancheiltis_en_gd_synthesis_flight` task to
#     the rq-style worker at `rq.cianfhoghlaim.ie:6379`.
#
# The 3 sibling canonical assets (`agent_routing_`,
# `agent_memory_`, `agent_trace_`) round out the 5-asset
# CelticAgentOpsComponent contract.
#
# Reference: openspec/specs/ciancheiltis/spec.md — Requirement
# "Dagster 5-layer asset graph per phase" (Phase 4 = en_gd) +
# Requirement "6-phase language-pair staging" + Requirement
# "MotherDuck Dive + Flight per phase".
type: orchestration.components.CelticAgentOpsComponent
attributes:
  agent_name: ciancheiltis_en_gd_phase_ops
  framework: custom
  module: cianfhoghlaim.agents.ciancheiltis.en_gd_phase_ops
  tools:
    - ciancheiltis_en_gd_anomaly_sensor
    - ciancheiltis_en_gd_synthesis_flight
    - ciancheiltis_en_gd_pair_quality_score
    - ciancheiltis_en_gd_metadata_language_audit
    - ciancheiltis_en_gd_phase_gate_summary
  memory_backend: graphiti
  event_stream: risingwave
  event_stream_endpoint: risingwave.cianfhoghlaim.ie:4566
  langfuse_trace_tag: agent.ciancheiltis.en_gd_phase_ops
  langfuse_drop_smoke_spans: true
  health_endpoint: rq.cianfhoghlaim.ie:6379/health
  routing_keywords:
    - ciancheiltis
    - ciancheiltis en-gd
    - ciancheiltis scotland
    - ciancheiltis alba
    - en gd
    - english scottish gaelic
    - bilingual pairs scotland
    - phase 4
    - metadata language mismatch
    - synthesis flight
    - anomaly sensor
    - ga > en
    - en > gd
    - bord na gaidhlig
    - storlann naiseanta
    - gaidhlig
    - gaelic language scotland act 2005
  cognee_dataset: cianfhoghlaim_ciancheiltis_en_gd
  privacy_gate: "INCLUDE_SCOTLAND_PII=false"
  pseudonymous_user: true
  langfuse_callbacks:
    trace_name: agent.ciancheiltis.en_gd_phase_ops
    flush_interval: 30
  cognify:
    enabled: true
    datasets:
      - cianfhoghlaim_ciancheiltis_en_gd
    retrigger: false
  tags:
    - ciancheiltis
    - en-gd
    - phase-4
    - agent-ops
    - anomaly-sensor
    - synthesis-flight
  metadata:
    openspec_change: 2026-09-06-ciancheiltis-v1
    spec: ciancheiltis
    phase: en_gd
    asset_aliases:
      agent_event_ciancheiltis_en_gd_phase_ops: ciancheiltis_en_gd_anomaly_sensor
      agent_health_ciancheiltis_en_gd_phase_ops: ciancheiltis_en_gd_synthesis_flight
    anomaly_sensor:
      name: ciancheiltis_en_gd_anomaly_sensor
      trigger: metadata_language_mismatch_rate
      threshold_pct: 5
      unit: percent
      source: "RisingWave stream `ciancheiltis.en_gd.metadata_mismatch_alert`"
      description: |
        Publishes a `ciancheiltis.en_gd.metadata_mismatch_alert`
        event to RisingWave at
        `risingwave.cianfhoghlaim.ie:4566` whenever the per-theme
        metadata-language-mismatch rate exceeds 5%. The L4 marimo
        quality dashboard (`ciancheiltis_en_gd_quality.py`) renders
        the alert in red so operators can spot the regression. The
        alert feeds the deployment-control-panel 5-tab UI and the
        `bilingual_coverage_audit.py` gate (≥ 0.95 threshold).

        Phase 4 mismatch taxonomy (different from Phase 1 + Phase 2 +
        Phase 3 — see L4 notes):
        - `html_lang_attribute_mismatch` (gov.scot canonical pair
          signal — the `<html lang="gd">` attribute is the canonical
          pair signal rather than a slug-prefix or a metadata tag;
          the metadata tag is generally `eng` even when the body is
          partially GD)
        - `metadata.language` mismatch (rare on gov.scot; more common
          on legislation.gov.uk UK-wide Acts + SSI + SDSI where the
          `metadata.language` is `eng` despite partial GD body)
        - `gd_only_no_pair` (a Scottish page that's GD-only with no
          EN mirror — VALID bilingual content per the Gaelic Language
          (Scotland) Act 2005 but flagged at the `gd_only_no_pair`
          level because Phase 4 enforces ≥ 500 `(en, gd)` PAIRS, not
          GD-only rows)
        Phase 4 mismatch rates are EXPECTED to trend higher than
        Phase 1 + Phase 2 + Phase 3 because Scottish Gaelic coverage
        is partial on most government sites. The 5% threshold is
        absolute (not relative); high base rate is a known
        characteristic of the en-gd landscape.
      cron: "*/5 * * * *"
    synthesis_flight:
      name: ciancheiltis_en_gd_synthesis_flight
      kind: celery_rq_style
      cadence: daily
      cron: "0 5 * * *"
      worker_endpoint: rq.cianfhoghlaim.ie:6379
      queue: ciancheiltis_en_gd
      description: |
        Daily Celery/rq-style synthesis flight for the en-gd Phase 4
        pipeline. Materialises the next day's bilingual-pair batch:
        ingests the 8 Scottish public-sector themes via the L1
        CelticIngestionComponent, runs the BAML extraction via the
        L2 `_assets.py` (using `CiancheiltisGdExtract` →
        `ExtractScottishStatute` + `ExtractScottishGovPage` +
        `ExtractGaelicTerm`), refreshes the L3 CocoIndex v1
        embedding into `lancedb://md:cianfhoghlaim/ciancheiltis/en_gd_chunks`,
        and re-evaluates the L4 asset checks
        (`bilingual_pairs_seeded_check` ≥ 500 +
        `ragas_quality_check` ≥ 0.70). The flight runs at 05:00 UTC,
        one hour after the L1 cron at 04:00 UTC, so the upstream DLT
        loads complete before BAML fires.
    notes: |
      The `framework: custom` choice bypasses the 12-agent fleet
      (root + 8 ADK + 3 Agno) because the en-gd phase ops is a
      vertical-slice surface (Dagster-only), not a horizontal agent.
      The `cognee_dataset: cianfhoghlaim_ciancheiltis_en_gd` is the
      dedicated knowledge graph for Phase 4 — populated by
      `agents.ciancheiltis.en_gd_phase_ops.cognify_themes()` and
      cross-queried by `agents.corpus.corpus_agent` for cross-phase
      comparison (Phase 5 will reuse the same `cognee_dataset`
      schema).

      Phase 4 differs from Phase 1 + Phase 2 + Phase 3 in two
      operational ways:
      1. Scottish legislation lives at `legislation.gov.uk/asp/...`,
         `/ssi/...`, `/sdsi/...` (Scotland-specific sub-trees of the
         UK legislation portal) rather than at the Phase 1 / Phase 2
         / Phase 3 jurisdiction-specific portals. The L1 ingestion
         pipeline MUST handle this Scotland-specific scope (the
         canonical bilingual reference is
         `gaidhlig.scot/bord-na-gaidhlig/naidheachdan/`, Bòrd na
         Gàidhlig under the Gaelic Language (Scotland) Act 2005 at
         `legislation.gov.uk/asp/2005/7/contents`).
      2. Scotland has ONE minority language under statute (Scottish
         Gaelic / Gàidhlig) per the Gaelic Language (Scotland) Act
         2005 — unlike Phase 3 (NI) which has TWO (Irish + Ulster
         Scots). The `cognee_dataset` schema uses
         `minority_languages: [gd]` (simpler than Phase 3's
         `[ga, ulster_scots]`). The `BAAI/bge-m3` 1024-d embedder
         handles `en` + `gd` natively per the R2 conformance
         contract.
