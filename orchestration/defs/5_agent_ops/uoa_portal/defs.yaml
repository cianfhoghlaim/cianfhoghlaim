# defs.yaml — L5 ADK agent for the uoa_portal_pipeline (the 14th specialist)
#
# Per openspec/changes/2026-09-23-consolidate-uog-tertiary-pipeline-v1/.
# The 5-stage SequentialAgent (auth → browse → vision → download → embed)
# at agents/uoa_portal/portal_agent.py.
type: orchestration.components.CelticAgentOpComponent
attributes:
  agent_id: uoa_portal_pipeline
  domain: tertiary
  nation: ie
  agent_module: agents.uoa_portal.portal_agent
  agent_function: build_root_agent
  agent_framework: google-adk
  automation: on_demand
  requires_credentials: true
  credential_vault: uo-portal-vault
  framework_priority: 14
  tags: [biep, tertiary, uog, adk, agent_op, authenticated, vision_language, fleet_14th]
