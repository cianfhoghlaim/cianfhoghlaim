# defs.yaml — Pick-8 IE/law L4 (Asset Generation / marimo) component.
#
# Single unified `ie_law_explorer` marimo dashboard that joins across
# all 5 sources (piab, courts, judgements, court_rules, legal_aid) +
# the cross-source statute linkage.
type: orchestration.components.CelticAssetGenerationComponent
attributes:
  dashboard_kind: marimo
  dashboard_path: cianfhoghlaim/notebooks/ie_law_explorer.py
  upstream_assets:
    - 2_materials/ie_law/piab
    - 2_materials/ie_law/courts
    - 2_materials/ie_law/judgements
    - 2_materials/ie_law/court_rules
    - 2_materials/ie_law/legal_aid
    - 2_materials/ie_law/cross_source
    - 3_model_lifecycle/cocoindex_v1/ie_law
  refresh_on:
    - "0 6 * * *"
  slug: ie_law_explorer
