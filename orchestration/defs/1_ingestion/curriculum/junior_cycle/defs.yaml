# defs/1_ingestion/curriculum/junior_cycle/defs.yaml
#
# L1 ingestion cron asset for the Ireland Junior Cycle DLT source.
#
# Per the ireland-primary-jc-dlt-baml spec (Requirement: Junior Cycle
# DLT sources (24 subjects)) — covers the 24 NCCA Junior Cycle
# subjects (English, Gaeilge, Mathematics, History, Geography,
# Science, Business Studies, French, German, Spanish, Italian,
# Russian, Japanese, Arabic, Music, Art, Home Economics, Wood
# Technology, Metalwork, Technical Graphics, Materials Technology
# Wood, Materials Technology Metal, Engineering, Coding) × EN + GA
# (48 partitions) for the 3 JC year levels (Year 1, Year 2, Year 3;
# no TY outcomes in v1).
#
# Reads from the local scrape cache
# (`/stedding/ingest_queue/junior_cycle/`) when USE_LOCAL_SCRAPES=true
# (the default). Live scraping is Phase 2.
#
# Per openspec/changes/2026-07-14-ireland-primary-jc-dlt-baml-v1/
type: orchestration.components.CelticIngestionComponent
attributes:
  source_name: ireland_junior_cycle
  module: cianfhoghlaim.dlt.british_isles.ireland.education.junior_cycle
  schedule:
    cron: "0 0 1 9 *"
    timezone: UTC
  partitions:
    - subject:
        values:
          - english
          - gaeilge
          - mathematics
          - history
          - geography
          - science
          - business_studies
          - french
          - german
          - spanish
          - italian
          - russian
          - japanese
          - arabic
          - music
          - art
          - home_economics
          - wood_technology
          - metalwork
          - technical_graphics
          - materials_technology_wood
          - materials_technology_metal
          - engineering
          - coding
    - language:
        values: ["en", "ga"]
  use_local_scrapes: true
  asset_check: junior_cycle_partition_count_min
  asset_check_min_rows: 1
  tags:
    - ireland_primary_jc
    - junior_cycle
    - curriculum
    - ingestion
  metadata:
    openspec_change: 2026-07-14-ireland-primary-jc-dlt-baml-v1
    spec: ireland-primary-jc-dlt-baml
    stage: junior_cycle
    year_levels:
      - year_1
      - year_2
      - year_3
    notes: "Ireland Junior Cycle DLT source — 24 subjects × EN+GA (48 partitions). Honours USE_LOCAL_SCRAPES=true to read from /stedding/ingest_queue/junior_cycle/. No Transition Year (TY) outcomes in v1."