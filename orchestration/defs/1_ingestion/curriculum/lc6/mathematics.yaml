# defs/1_ingestion/curriculum/lc6/mathematics.yaml
#
# L1 CelticIngestionComponent for the BIEP v1 Mathematics NCCA
# crawl. Per-subject source — Mathematics only (the 1st of 6).
#
# Per the british-isles-education-pipeline spec — the per-subject
# NCCA syllabus ingestion for the 6 BIEP v1 LC subjects. The
# Mathematics variant feeds the Mathematics cocoindex App +
# the Mathematics marimo notebook + the math_agent + the 4
# MotherDuck Dives (lc_syllabus_topics, lc_exam_difficulty,
# lc_marking_complexity, etc.).
#
# Reference: openspec/changes/2026-07-16-biiep-v1-lc-per-subject-syllabus-ingestion-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_id: filesystem.leaving_cert.mathematics
  domain: curriculum
  nation: ie
  subject: mathematics
  subject_label: Mathematics (LC-2015)
  automation: on_cron
  automation_cron: "0 0 1 9 *"
  state_backed: true
  state_refresh_interval: monthly
  asset_check: lc6_mathematics_partition_count_min
  asset_check_min_rows: 1
  tags:
    - biep
    - lc6
    - mathematics
    - ncca
    - ingestion
  metadata:
    openspec_change: 2026-07-16-biiep-v1-lc-per-subject-syllabus-ingestion-v1
    spec: british-isles-education-pipeline
    lc_subject: mathematics
    partitions: subject × language (mathematics × en + ga = 2 partitions)
    dlt_source: cianfhoghlaim.dlt.british_isles.ireland.education.ncca_mathematics
    baml_extractor: b.ExtractLC6Syllabus(subject="mathematics", ...)
    notes: "Per-subject Mathematics NCCA source; yearly 1st September 00:00 UTC cron. Honours USE_LOCAL_SCRAPES=true to read from stedding/ingest_queue/ncca/mathematics/."