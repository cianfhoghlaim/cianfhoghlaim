# defs/1_ingestion/curriculum/lc6/chemistry.yaml
#
# L1 CelticIngestionComponent for the BIEP v1 Chemistry NCCA
# crawl. Per-subject source — Chemistry only (the 2nd of 6).
#
# Per the british-isles-education-pipeline spec — the per-subject
# NCCA syllabus ingestion for the 6 BIEP v1 LC subjects. The
# Chemistry variant feeds the Chemistry cocoindex App + the
# Chemistry marimo notebook + the chem_agent + the 4 MotherDuck
# Dives (lc_syllabus_topics, lc_exam_difficulty,
# lc_marking_complexity, etc.).
#
# Reference: openspec/changes/2026-07-16-biiep-v1-lc-per-subject-syllabus-ingestion-v1/
type: orchestration.components.CelticIngestionComponent
attributes:
  source_id: filesystem.leaving_cert.chemistry
  domain: curriculum
  nation: ie
  subject: chemistry
  subject_label: Chemistry (LC-Chemistry)
  automation: on_cron
  automation_cron: "0 0 1 9 *"
  state_backed: true
  state_refresh_interval: monthly
  asset_check: lc6_chemistry_partition_count_min
  asset_check_min_rows: 1
  tags:
    - biep
    - lc6
    - chemistry
    - ncca
    - ingestion
  metadata:
    openspec_change: 2026-07-16-biiep-v1-lc-per-subject-syllabus-ingestion-v1
    spec: british-isles-education-pipeline
    lc_subject: chemistry
    partitions: subject × language (chemistry × en + ga = 2 partitions)
    dlt_source: cianfhoghlaim.dlt.british_isles.ireland.education.ncca_chemistry
    baml_extractor: b.ExtractLC6Syllabus(subject="chemistry", ...)
    notes: "Per-subject Chemistry NCCA source; yearly 1st September 00:00 UTC cron. Honours USE_LOCAL_SCRAPES=true to read from stedding/ingest_queue/ncca/chemistry/."