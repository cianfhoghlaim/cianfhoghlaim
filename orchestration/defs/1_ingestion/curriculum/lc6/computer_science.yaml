# defs/1_ingestion/curriculum/lc6/computer_science.yaml
#
# L1 CelticIngestionComponent for the BIEP v1 Computer Science
# NCCA crawl. Per-subject source — Computer Science only
# (the 6th of 6).
#
# Per the british-isles-education-pipeline spec — the per-subject
# NCCA syllabus ingestion for the 6 BIEP v1 LC subjects. The
# Computer Science variant is special: CS is the newest LC
# subject (introduced 2020), so the NCCA syllabus corpus is
# smaller than the other 5 LC subjects. The CS variant feeds
# the Computer Science cocoindex App + the CS marimo notebook
# + the comp_agent + the 4 MotherDuck Dives.
#
# Reference: openspec/changes/2026-07-16-biiep-v1-lc-per-subject-syllabus-ingestion-v1/
type: orchestration.components.CelticIngestionComponent
attributes:
  source_id: filesystem.leaving_cert.computer_science
  domain: curriculum
  nation: ie
  subject: computer_science
  subject_label: Computer Science (LC-Computer-Science)
  automation: on_cron
  automation_cron: "0 0 1 9 *"
  state_backed: true
  state_refresh_interval: monthly
  asset_check: lc6_computer_science_partition_count_min
  asset_check_min_rows: 1
  tags:
    - biep
    - lc6
    - computer_science
    - ncca
    - ingestion
  metadata:
    openspec_change: 2026-07-16-biiep-v1-lc-per-subject-syllabus-ingestion-v1
    spec: british-isles-education-pipeline
    lc_subject: computer_science
    partitions: subject × language (computer_science × en + ga = 2 partitions)
    dlt_source: cianfhoghlaim.dlt.british_isles.ireland.education.ncca_computer_science
    baml_extractor: b.ExtractLC6Syllabus(subject="computer_science", ...)
    notes: "Per-subject Computer Science NCCA source; yearly 1st September 00:00 UTC cron. Honours USE_LOCAL_SCRAPES=true to read from stedding/ingest_queue/ncca/computer_science/."