# defs/1_ingestion/curriculum/primary/defs.yaml
#
# L1 ingestion cron asset for the Ireland Primary Curriculum DLT source.
#
# Per the ireland-primary-jc-dlt-baml spec (Requirement: Primary stage
# DLT sources) — covers the 4 Primary curriculum areas (English,
# Gaeilge, Mathematics, SESE) × EN + GA (8 partitions) for the 8 NCCA
# Primary year levels (Junior Infants through 6th Class).
#
# Reads from the local scrape cache
# (`/stedding/ingest_queue/primary/`) when USE_LOCAL_SCRAPES=true
# (the default). Live scraping is Phase 2.
#
# Per openspec/changes/2026-07-14-ireland-primary-jc-dlt-baml-v1/
type: orchestration.components.CelticIngestionComponent
attributes:
  source_name: ireland_primary
  module: cianfhoghlaim.dlt.british_isles.ireland.education.primary
  schedule:
    cron: "0 0 1 9 *"
    timezone: UTC
  partitions:
    - area:
        values:
          - english
          - gaeilge
          - mathematics
          - sese
    - language:
        values: ["en", "ga"]
  use_local_scrapes: true
  asset_check: primary_partition_count_min
  asset_check_min_rows: 1
  tags:
    - ireland_primary_jc
    - primary
    - curriculum
    - ingestion
  metadata:
    openspec_change: 2026-07-14-ireland-primary-jc-dlt-baml-v1
    spec: ireland-primary-jc-dlt-baml
    stage: primary
    year_levels:
      - junior_infants
      - senior_infants
      - first
      - second
      - third
      - fourth
      - fifth
      - sixth
    notes: "Ireland Primary curriculum DLT source — 4 areas × EN+GA (8 partitions). Honours USE_LOCAL_SCRAPES=true to read from /stedding/ingest_queue/primary/."