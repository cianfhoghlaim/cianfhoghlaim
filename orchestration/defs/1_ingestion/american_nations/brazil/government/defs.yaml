# defs/1_ingestion/americas/Brazil/government/defs.yaml
#
# L1 ingestion for the Brazil government DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/americas/Brazil/government/gov_br.py`` with
# ``source_id="americas.Brazil.government.gov_br"`` and lands in the
# DuckLake table ``oideachais.government.americas.Brazil``.
#
# Reference: openspec/changes/2026-07-11-americas-california-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_name: americas_bra_government
  module: cianfhoghlaim.dlt.americas.Brazil.government.gov_br
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["americas"]
    - jurisdiction:
        values: ["Brazil"]
    - language:
        values: ["pt"]
  use_local_scrapes: true
  asset_check: americas_bra_government_partition_min
  asset_check_min_rows: 1
  tags:
    - americas
    - Brazil
    - government
    - ingestion
  metadata:
    openspec_change: 2026-07-11-americas-california-pipeline-v1
    spec: americas-california-pipeline

    country_name: "Brazil"
    official_languages: ['pt']