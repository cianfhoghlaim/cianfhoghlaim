# defs/1_ingestion/americas/Mexico/medicine/defs.yaml
#
# L1 ingestion for the Mexico medicine DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/americas/Mexico/medicine/ssa.py`` with
# ``source_id="americas.Mexico.medicine.ssa"`` and lands in the
# DuckLake table ``cianfhoghlaim.medicine.americas.Mexico``.
#
# Reference: openspec/changes/2026-07-11-americas-california-pipeline-v1/
type: orchestration.components.CelticIngestionComponent
attributes:
  source_name: americas_mex_medicine
  module: cianfhoghlaim.dlt.americas.Mexico.medicine.ssa
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["americas"]
    - jurisdiction:
        values: ["Mexico"]
    - language:
        values: ["es"]
  use_local_scrapes: true
  asset_check: americas_mex_medicine_partition_min
  asset_check_min_rows: 1
  tags:
    - americas
    - Mexico
    - medicine
    - ingestion
  metadata:
    openspec_change: 2026-07-11-americas-california-pipeline-v1
    spec: americas-california-pipeline

    country_name: "Mexico"
    official_languages: ['es']