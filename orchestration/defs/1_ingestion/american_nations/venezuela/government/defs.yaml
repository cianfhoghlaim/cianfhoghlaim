# defs/1_ingestion/americas/Venezuela/government/defs.yaml
#
# L1 ingestion for the Venezuela government DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/americas/Venezuela/government/gov_ve.py`` with
# ``source_id="americas.Venezuela.government.gov_ve"`` and lands in the
# DuckLake table ``cianfhoghlaim.government.americas.Venezuela``.
#
# Reference: openspec/changes/2026-07-11-americas-california-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_name: americas_ven_government
  module: cianfhoghlaim.dlt.americas.Venezuela.government.gov_ve
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["americas"]
    - jurisdiction:
        values: ["Venezuela"]
    - language:
        values: ["es"]
  use_local_scrapes: true
  asset_check: americas_ven_government_partition_min
  asset_check_min_rows: 1
  tags:
    - americas
    - Venezuela
    - government
    - ingestion
  metadata:
    openspec_change: 2026-07-11-americas-california-pipeline-v1
    spec: americas-california-pipeline

    country_name: "Venezuela"
    official_languages: ['es']