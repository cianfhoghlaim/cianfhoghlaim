      notes: "Ireland Tertiary (5 Technological Universities) DLT source — covers TUD, MTU, TUS, ATU, SETU per the Technological Universities Act 2018. The 5 TUs were created via consolidation of the 11 IoTs."

# -----------------------------------------------------------------------------
# Source 3: QQI awards at NFQ 6-10
# -----------------------------------------------------------------------------
- type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
  attributes:
    source_name: ireland_tertiary_qqi
    module: cianfhoghlaim.dlt.british_isles.ireland.university.qqi_awards
    schedule:
      cron: "0 6 * * *"
      timezone: UTC
    partitions:
      - qqi_level:
          values: ["NFQ_6", "NFQ_7", "NFQ_8", "NFQ_9", "NFQ_10"]
      - language:
          values: ["en"]
    use_local_scrapes: true
    asset_check: tertiary_qqi_partition_count_min
    asset_check_min_rows: 10
    tags:
      - biep
      - tertiary
      - university
      - ingestion
      - qqi
      - awards
    metadata:
      openspec_change: 2026-07-15-cianfhoghlaim-university-deep-extraction-v1
      spec: cianfhoghlaim-university-deep-extraction
      nfq_levels:
        - NFQ_6
        - NFQ_7
        - NFQ_8
        - NFQ_9
        - NFQ_10
      notes: "Ireland Tertiary (QQI awards) DLT source — covers the 10 canonical QQI awards at NFQ 6-10 (Higher Certificate, Ord BA, Hons BA, Higher Diploma, Graduate Diploma, PG Cert, PG Dip, Masters, Ph.D., Professional Doctorate). NFQ 1-5 (pre-tertiary) are covered by ireland-primary-jc-dlt-baml + british-isles-education-pipeline."

# -----------------------------------------------------------------------------
# Source 4: CAO Central Applications Office
# -----------------------------------------------------------------------------
- type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
  attributes:
    source_name: ireland_tertiary_cao
    module: cianfhoghlaim.dlt.british_isles.ireland.university.cao
    schedule:
      cron: "0 6 * * *"
      timezone: UTC
    partitions:
      - year:
          values: ["2024", "2025", "2026"]
    use_local_scrapes: true
    asset_check: tertiary_cao_partition_count_min
    asset_check_min_rows: 1
    tags:
      - biep
      - tertiary
      - university
      - ingestion
      - cao
      - applications
    metadata:
      openspec_change: 2026-07-15-cianfhoghlaim-university-deep-extraction-v1
      spec: cianfhoghlaim-university-deep-extraction
      cao_rounds:
        - R1
        - R2
        - R3
        - R4
      notes: "Ireland Tertiary (CAO) DLT source — covers the Central Applications Office undergraduate catalog + the 4 annual application rounds (R1, R2, R3, R4). Phase 1 yields rounds + cache-layer BAML rows; Phase 2 scrapes the live catalog."

# -----------------------------------------------------------------------------
# Source 5: SOLAS Further Education + Training + 16 ETBs
# -----------------------------------------------------------------------------
- type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
  attributes:
    source_name: ireland_tertiary_solas
    module: cianfhoghlaim.dlt.british_isles.ireland.university.solas
    schedule:
      cron: "0 6 * * *"
      timezone: UTC
    partitions:
      - solas_path:
          values:
            - PLC
            - APPRENTICESHIP
            - YOUTHREACH
            - ADULT_LITERACY
            - VTOS
            - COMMUNITY_TRAINING
      - language:
          values: ["en"]
    use_local_scrapes: true
    asset_check: tertiary_solas_partition_count_min
    asset_check_min_rows: 16
    tags:
      - biep
      - tertiary
      - university
      - ingestion
      - solas
      - further_education
      - apprenticeships
    metadata:
      openspec_change: 2026-07-15-cianfhoghlaim-university-deep-extraction-v1
      spec: cianfhoghlaim-university-deep-extraction
      etb_count: 16
      notes: "Ireland Tertiary (SOLAS Further Education) DLT source — covers the 16 Education and Training Boards (ETBs) + the SOLAS pathways (PLC / Apprenticeship / Youthreach / VTOS / Adult Literacy). Complements the 8 universities + 5 TUs by covering the vocational / PLC pathway."