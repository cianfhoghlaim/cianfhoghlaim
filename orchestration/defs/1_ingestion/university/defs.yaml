# defs/1_ingestion/university/defs.yaml
#
# L1 ingestion cron asset for the **Ireland Tertiary 18+** DLT sources.
#
# Per the `cianfhoghlaim-university-deep-extraction` spec — this is the
# canonical Dagster cron asset for the 5 Tertiary DLT sources that
# complete the K-12 → university pipeline:
#
#   - universities.py  (8 universities: TCD, UCD, UCC, UoG, UL, DCU, MU, RCSI)
#   - tus.py           (5 Technological Universities: TUD, MTU, TUS, ATU, SETU)
#   - qqi_awards.py    (QQI L6-10 awards)
#   - cao.py           (CAO Central Applications Office)
#   - solas.py         (SOLAS Further Education + 16 ETBs)
#
# Together with the upstream packages:
#   - primary.py + junior_cycle.py + primary_jc_combined.py ← ireland-primary-jc-dlt-baml
#   - ncca.py + examinations.py + gov_ie_circulars.py      ← british-isles-education-pipeline
#
# these 5 sources complete the full **K-12 → university** pipeline
# (NFQ 1-10) for the Republic of Ireland.
#
# Walks the local `/stedding/ingest_queue/university/<area>/` cache
# for each of the 5 sources. Honors `USE_LOCAL_SCRAPES=true`.
#
# Per openspec/changes/2026-07-15-cianfhoghlaim-university-deep-extraction-v1/

# -----------------------------------------------------------------------------
# Source 1: the 8 universities (TCD, UCD, UCC, UoG, UL, DCU, MU, RCSI)
# -----------------------------------------------------------------------------
- type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
  attributes:
    source_name: ireland_tertiary_universities
    module: cianfhoghlaim.dlt.british_isles.ireland.university.universities
    schedule:
      cron: "0 6 * * *"
      timezone: UTC
    partitions:
      - language:
          values: ["en"]
    use_local_scrapes: true
    asset_check: tertiary_universities_partition_count_min
    asset_check_min_rows: 8
    tags:
      - biep
      - tertiary
      - university
      - ingestion
      - ireland_university
      - institutions
    metadata:
      openspec_change: 2026-07-15-cianfhoghlaim-university-deep-extraction-v1
      spec: cianfhoghlaim-university-deep-extraction
      institutions:
        - ie-university-trinity
        - ie-university-ucd
        - ie-university-ucc
        - ie-university-galway
        - ie-university-limerick
        - ie-university-dcu
        - ie-university-maynooth
        - ie-university-rcsi
      notes: "Ireland Tertiary (8 universities) DLT source — covers TCD, UCD, UCC, UoG, UL, DCU, Maynooth, RCSI per the Universities Act 1997. Registry-of-record view; per-university deep extraction lives in education/university_of_galway_deep.py + _university_deep_factory.py."

# -----------------------------------------------------------------------------
# Source 2: the 5 Technological Universities (TUD, MTU, TUS, ATU, SETU)
# -----------------------------------------------------------------------------
- type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
  attributes:
