    module: cianfhoghlaim.dlt.british_isles.ireland.university.tus
    schedule:
      cron: "0 6 * * *"
      timezone: UTC
    partitions:
      - language:
          values: ["en"]
    use_local_scrapes: true
    asset_check: tertiary_tus_partition_count_min
    asset_check_min_rows: 5
    tags:
      - biep
      - tertiary
      - university
      - ingestion
      - ie_tu
      - technological_universities
    metadata:
      openspec_change: 2026-07-15-cianfhoghlaim-university-deep-extraction-v1
      spec: cianfhoghlaim-university-deep-extraction
      institutions:
        - ie-tu-dublin
        - ie-tu-munster
        - ie-tu-shannon
        - ie-tu-atlantic
