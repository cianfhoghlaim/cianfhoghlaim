# defs/1_ingestion/legal_research/gemini_corpus/defs.yaml
#
# L1 CelticIngestionComponent for the Gemini 6-corpus filesystem source.
# Discovers 224 PDFs across law/medical/politics/culture/technology/other
# sub-corpora and routes each through qwen3-vl-8b (the v4 workhorse
# for text-heavy PDFs).
#
# Per openspec/changes/2026-07-03-gemini-6-corpus-pipeline/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_id: cianfhoghlaim.filesystem.gemini_corpus
  domain: legal_research
  nation: ie
  automation: on_cron
  automation_cron: "0 7 * * 0"   # Weekly on Sunday at 07:00 UTC
  state_backed: true
  state_refresh_interval: weekly
