# defs/1_ingestion/commonwealth/ind/government/defs.yaml
#
# L1 ingestion for the India government DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/commonwealth/ind/government/india_gov.py`` with
# ``source_id="commonwealth.ind.government.india_gov"`` and lands in
# the DuckLake table ``oideachais.government.commonwealth.ind``.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_name: commonwealth_ind_government
  module: cianfhoghlaim.dlt.commonwealth.ind.government.india_gov
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["commonwealth"]
    - country:
        values: ["ind"]
    - language:
        values: ["en", "hi"]
  use_local_scrapes: true
  asset_check: commonwealth_ind_government_partition_min
  asset_check_min_rows: 1
  tags:
    - commonwealth
    - ind
    - government
    - ingestion
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
