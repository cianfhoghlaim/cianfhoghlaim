# defs/1_ingestion/commonwealth/nzl/education/defs.yaml
#
# L1 ingestion for the New Zealand education DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/commonwealth/nzl/education/nzqa.py`` with
# ``source_id="commonwealth.nzl.education.nzqa"`` and lands in
# the DuckLake table ``oideachais.education.commonwealth.nzl``.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: orchestration.components.CelticIngestionComponent
attributes:
  source_name: commonwealth_nzl_education
  module: cianfhoghlaim.dlt.commonwealth.nzl.education.nzqa
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["commonwealth"]
    - country:
        values: ["nzl"]
    - language:
        values: ["en"]
  use_local_scrapes: true
  asset_check: commonwealth_nzl_education_partition_min
  asset_check_min_rows: 1
  tags:
    - commonwealth
    - nzl
    - education
    - ingestion
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
