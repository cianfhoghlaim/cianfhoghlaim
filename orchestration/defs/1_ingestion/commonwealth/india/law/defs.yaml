# defs/1_ingestion/commonwealth/ind/law/defs.yaml
#
# L1 ingestion for the India law DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/commonwealth/ind/law/india_code.py`` with
# ``source_id="commonwealth.ind.law.india_code"`` and lands in
# the DuckLake table ``oideachais.law.commonwealth.ind``.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: orchestration.components.CelticIngestionComponent
attributes:
  source_name: commonwealth_ind_law
  module: cianfhoghlaim.dlt.commonwealth.ind.law.india_code
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["commonwealth"]
    - country:
        values: ["ind"]
    - language:
        values: ["en", "hi"]
  use_local_scrapes: true
  asset_check: commonwealth_ind_law_partition_min
  asset_check_min_rows: 1
  tags:
    - commonwealth
    - ind
    - law
    - ingestion
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
