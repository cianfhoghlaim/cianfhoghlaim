# defs/1_ingestion/commonwealth/can/law/defs.yaml
#
# L1 ingestion for the Canada law DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/commonwealth/can/law/federal_laws.py`` with
# ``source_id="commonwealth.can.law.federal_laws"`` and lands in
# the DuckLake table ``oideachais.law.commonwealth.can``.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: orchestration.components.CelticIngestionComponent
attributes:
  source_name: commonwealth_can_law
  module: cianfhoghlaim.dlt.commonwealth.can.law.federal_laws
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["commonwealth"]
    - country:
        values: ["can"]
    - language:
        values: ["en", "fr"]
  use_local_scrapes: true
  asset_check: commonwealth_can_law_partition_min
  asset_check_min_rows: 1
  tags:
    - commonwealth
    - can
    - law
    - ingestion
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
