# defs/1_ingestion/commonwealth/zaf/education/defs.yaml
#
# L1 ingestion for the South Africa education DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/commonwealth/zaf/education/dbe.py`` with
# ``source_id="commonwealth.zaf.education.dbe"`` and lands in
# the DuckLake table ``oideachais.education.commonwealth.zaf``.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_name: commonwealth_zaf_education
  module: cianfhoghlaim.dlt.commonwealth.zaf.education.dbe
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["commonwealth"]
    - country:
        values: ["zaf"]
    - language:
        values: ["en", "af", "zu", "xh", "nso", "tn", "st", "ts", "ss", "ve", "nr"]
  use_local_scrapes: true
  asset_check: commonwealth_zaf_education_partition_min
  asset_check_min_rows: 1
  tags:
    - commonwealth
    - zaf
    - education
    - ingestion
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
