# defs/1_ingestion/commonwealth/zaf/medicine/defs.yaml
#
# L1 ingestion for the South Africa medicine DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/commonwealth/zaf/medicine/sahpra.py`` with
# ``source_id="commonwealth.zaf.medicine.sahpra"`` and lands in
# the DuckLake table ``oideachais.medicine.commonwealth.zaf``.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_name: commonwealth_zaf_medicine
  module: cianfhoghlaim.dlt.commonwealth.zaf.medicine.sahpra
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["commonwealth"]
    - country:
        values: ["zaf"]
    - language:
        values: ["en", "af", "zu", "xh", "nso", "tn", "st", "ts", "ss", "ve", "nr"]
  use_local_scrapes: true
  asset_check: commonwealth_zaf_medicine_partition_min
  asset_check_min_rows: 1
  tags:
    - commonwealth
    - zaf
    - medicine
    - ingestion
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
