# defs/1_ingestion/commonwealth/aus/education/defs.yaml
#
# L1 ingestion for the Australia education DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/commonwealth/aus/education/acara.py`` with
# ``source_id="commonwealth.aus.education.acara"`` and lands in
# the DuckLake table ``oideachais.education.commonwealth.aus``.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: orchestration.components.CelticIngestionComponent
attributes:
  source_name: commonwealth_aus_education
  module: cianfhoghlaim.dlt.commonwealth.aus.education.acara
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["commonwealth"]
    - country:
        values: ["aus"]
    - language:
        values: ["en"]
  use_local_scrapes: true
  asset_check: commonwealth_aus_education_partition_min
  asset_check_min_rows: 1
  tags:
    - commonwealth
    - aus
    - education
    - ingestion
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
