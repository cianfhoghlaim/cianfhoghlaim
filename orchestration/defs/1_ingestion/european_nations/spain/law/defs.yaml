    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["european_nations"]
    - country:
        values: ["esp"]
    - language:
        values: ["es", "ca", "gl", "eu"]
  use_local_scrapes: true
  asset_check: european_nations_esp_law_partition_min
