# defs/1_ingestion/european_nations/cyp/education/subjects/language/defs.yaml
#
# L1 CelticIngestionComponent for the Cyprus Native language and literature
# per-subject DLT source (EU nations full-depth expansion).
#
# Per the cross-region path contract this source lives at
# `dlt/european_nations/cyp/education/subjects/language.py` with
# `source_id="european_nations.cyp.education.subjects.language"`.
#
# Reference: openspec/changes/2026-07-13-eu-nations-full-depth-expansion-v1/
type: orchestration.components.CelticIngestionComponent
attributes:
  source_name: european_nations_cyp_language
  module: cianfhoghlaim.dlt.european_nations.cyp.education.subjects.language
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["european_nations"]
    - country:
        values: ["cyp"]
    - subject:
        values: ["language"]
    - language:
        values: ["el", "tr"]
  use_local_scrapes: true
  asset_check: european_nations_cyp_language_partition_min
  asset_check_min_rows: 1
  tags:
    - european_nations
    - cyp
    - education
    - language
    - ingestion
  metadata:
    openspec_change: 2026-07-13-eu-nations-full-depth-expansion-v1
    spec: european-nations-ukraine-pipeline
    exam_board: KYSATS
    subject_code: LANG
