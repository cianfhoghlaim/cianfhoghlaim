# Dagster L1 — Celtic curriculum ingestion (monthly)
# Reference: openspec/changes/2026-07-17-gaois-celtic-language-pipeline-v1/

type: dagster.cron
schedule: "0 7 1 * *"  # monthly on the 1st
execution_timezone: "UTC"
description: >
  Monthly Celtic curriculum ingestion — fans out to the 6 Celtic-language
  curriculum sources (Irish, Scottish Gaelic, Welsh, Breton, Manx, Cornish).

partitions:
  - name: language
    type: static
    partition_keys:
      - irish
      - scottish_gaelic
      - welsh
      - breton
      - manx
      - cornish
  - name: education_level
    type: static
    partition_keys:
      - primary
      - secondary
      - higher

assets:
  - name: celtic_curriculum_ingestion
    group_name: language_celtic_curriculum
    compute_kind: local
    deps: []
    config:
      language: "{{ partition['language'] }}"
      education_level: "{{ partition['education_level'] }}"
    config_schema:
      language:
        type: string
      education_level:
        type: string
    metadata:
      layer: 1_ingestion
      stage: language
      source_group: celtic_curriculum
      openspec_change: 2026-07-17-gaois-celtic-language-pipeline-v1