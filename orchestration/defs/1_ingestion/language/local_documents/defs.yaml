# Dagster L1 — Local documents ingestion (on-demand)
# Reference: openspec/changes/2026-07-17-gaois-celtic-language-pipeline-v1/

type: dagster.sensor
description: >
  On-demand local documents ingestion — triggers when files are added
  to the bunchloch subject directories.

partitions:
  - name: subject
    type: static
    partition_keys:
      - comp_science
      - gaeilge
      - mata
      - oideachas

assets:
  - name: local_documents_ingestion
    group_name: language_local_documents
    compute_kind: local
    deps: []
    config:
      subject: "{{ partition['subject'] }}"
    config_schema:
      subject:
        type: string
    metadata:
      layer: 1_ingestion
      stage: language
      source_group: local_documents
      openspec_change: 2026-07-17-gaois-celtic-language-pipeline-v1