# Dagster L1 — Gaois ingestion cron assets (3 sources)
#
# Daily 04:00 UTC cron. Partitions: source_slug × language.
# Schedules the Gaois Téarma + Logainm + Ainm DLT sources to run nightly
# against the GAOIS_API_BASE_URL.
#
# Reference: openspec/changes/2026-07-17-gaois-celtic-language-pipeline-v1/

type: dagster.cron
schedule: "0 4 * * *"
execution_timezone: "UTC"
description: >
  Daily Gaois APIs ingestion (Téarma + Logainm + Ainm) — nightly cron that
  fans out to the 3 Gaois DLT sources and writes the canonical DuckLake
  tables in `oideachais.celtic.gaois.*`.

partitions:
  - name: gaois_source
    type: static
    partition_keys:
      - tearma_terms
      - tearma_education
      - logainm_places
      - ainm_biographies
  - name: language
    type: static
    partition_keys:
      - ga
      - en

assets:
  - name: gaois_ingestion
    group_name: language_gaois
    compute_kind: local
    deps: []
    config:
      source_slug: "{{ partition['gaois_source'] }}"
      language: "{{ partition['language'] }}"
    config_schema:
      source_slug:
        type: string
      language:
        type: string
    metadata:
      layer: 1_ingestion
      stage: language
      source_group: gaois
      openspec_change: 2026-07-17-gaois-celtic-language-pipeline-v1