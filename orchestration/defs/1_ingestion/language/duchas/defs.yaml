# Dagster L1 — Dúchas ingestion cron assets (4 collections)
#
# Daily 03:00 UTC cron. Partitions: 4 collections × max_pages.
# Schedules the 4 Dúchas DLT sources to run nightly.
#
# Reference: openspec/changes/2026-07-17-gaois-celtic-language-pipeline-v1/

type: dagster.cron
schedule: "0 3 * * *"
execution_timezone: "UTC"
description: >
  Daily Dúchas National Folklore Collection ingestion (cbe/cbes/cbeg/cbef) —
  nightly cron that fans out to the 4 Dúchas DLT sources and writes the
  canonical DuckLake tables in `oideachais.celtic.duchas.*`.

partitions:
  - name: duchas_collection
    type: static
    partition_keys:
      - cbe
      - cbes
      - cbeg
      - cbef
  - name: max_pages
    type: static
    partition_keys:
      - "100"
      - "500"
      - "1000"

assets:
  - name: duchas_ingestion
    group_name: language_duchas
    compute_kind: local
    deps: []
    config:
      collection: "{{ partition['duchas_collection'] }}"
      max_pages: "{{ partition['max_pages'] }}"
    config_schema:
      collection:
        type: string
      max_pages:
        type: string
    metadata:
      layer: 1_ingestion
      stage: language
      source_group: duchas
      openspec_change: 2026-07-17-gaois-celtic-language-pipeline-v1