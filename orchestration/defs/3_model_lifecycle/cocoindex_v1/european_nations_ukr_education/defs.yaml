# defs/3_model_lifecycle/cocoindex_v1/european_nations_ukr_education/defs.yaml
#
# L3 CocoIndex v1 App for the Ukraine education pipeline. Embeds
# every per-subject education row into the shared
# `oideachais.european_nations.ukr.education_chunks` LanceDB table.
#
# Reference: openspec/changes/2026-07-15-eu-pilot-upgrade-v1/
type: cianfhoghlaim.orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: european_nations_ukr_education
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  apps:
    - app_name: ukr_UPPER_EDUCATION_EMBEDDING
      module: cianfhoghlaim.cocoindex.european_nations_ukr_education_embedding
      source: european_nations
      lance_table: oideachais.european_nations.ukr.education_chunks
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - european_nations
    - ukr
    - education
    - cocoindex-v1
    - embedding
  metadata:
    openspec_change: 2026-07-15-eu-pilot-upgrade-v1
    spec: european-nations-ukraine-pipeline
    country_name: "Ukraine"
