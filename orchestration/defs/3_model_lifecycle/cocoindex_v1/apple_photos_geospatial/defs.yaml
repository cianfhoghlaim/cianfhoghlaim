# defs/3_model_lifecycle/cocoindex_v1/apple_photos_geospatial/defs.yaml
#
# L3 CelticModelLifecycleComponent for the ApplePhotosGeospatial v1 App.
# Per the apple-photos-ingestion spec — `Apple Photos geospatial GeoParquet
# output` Requirement. The R1–R4 conformance contract is enforced at
# build_defs time by the Component; this App is R4-exempt because it
# emits GeoParquet (no embedding column).
type: cianfhoghlaim.orchestration.components.CelticModelLifecycleComponent
attributes:
  app_name: ApplePhotosGeospatial
  module: cianfhoghlaim.cocoindex.apple_photos_geospatial
  embedding_model: null
  hnsw_index: false
  conformance_required: true
  r4_exempt: true
  r4_exempt_reason: GeoParquet output, no embedding column
  privacy_gate: LEABHARLANN_PHOTOS_INCLUDE_GPS