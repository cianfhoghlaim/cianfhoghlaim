# defs/3_model_lifecycle/cocoindex_v1/european_nations_pol_education/defs.yaml
#
# L3 CocoIndex v1 App for the Poland education pipeline. Embeds
# every per-subject education row into the shared
# `cianfhoghlaim.european_nations.pol.education_chunks` LanceDB table.
#
# Reference: openspec/changes/2026-07-15-eu-pilot-upgrade-v1/
type: orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: european_nations_pol_education
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  apps:
    - app_name: pol_UPPER_EDUCATION_EMBEDDING
      module: cianfhoghlaim.cocoindex_flows.european_nations._factory
      source: european_nations
      lance_table: cianfhoghlaim.european_nations.pol.education_chunks
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - european_nations
    - pol
    - education
    - cocoindex-v1
    - embedding
  metadata:
    openspec_change: 2026-07-15-eu-pilot-upgrade-v1
    spec: european-nations-ukraine-pipeline
    country_name: "Poland"
