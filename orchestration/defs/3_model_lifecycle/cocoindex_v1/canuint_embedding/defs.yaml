# Dagster L3 — Canuint CocoIndex mount
# Reference: openspec/changes/2026-07-17-gaois-celtic-language-pipeline-v1/

type: dagster.schedule
schedule: "@monthly"
execution_timezone: "UTC"
description: >
  Monthly Canuint CocoIndex v1 mount — runs the CanuintEmbeddingApp and mounts
  the LanceDB table at `oideachais.language.canuint_chunks`.

assets:
  - name: canuint_cocoindex_mount
    group_name: language_canuint_embedding
    compute_kind: local
    deps:
      - canuint_ingestion
    metadata:
      layer: 3_model_lifecycle
      stage: language
      source_group: canuint
      lance_table: oideachais.language.canuint_chunks
      embedder: BAAI/bge-m3
      embed_dim: 1024
      openspec_change: 2026-07-17-gaois-celtic-language-pipeline-v1