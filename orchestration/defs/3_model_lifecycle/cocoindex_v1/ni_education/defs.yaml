# defs/3_model_lifecycle/cocoindex_v1/ni_education/defs.yaml
#
# L3 CocoIndex v1 App for the Northern Ireland education pipeline.
# Embeds every Northern Ireland per-subject education row into
# the shared `cianfhoghlaim.lc.ni.education_chunks` LanceDB table.
#
# Reference: openspec/changes/2026-07-12-british-isles-parity-pipeline-v1/
type: orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: ni_education
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  apps:
    - app_name: NorthernIrelandEducationEmbedding
      module: cianfhoghlaim.cocoindex.biep_parity.ni_education_embedding
      source: british_isles
      lance_table: cianfhoghlaim.lc.ni.education_chunks
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - biep
    - parity
    - ni
    - cocoindex-v1
    - embedding
  metadata:
    openspec_change: 2026-07-12-british-isles-parity-pipeline-v1
    spec: british-isles-education-pipeline
