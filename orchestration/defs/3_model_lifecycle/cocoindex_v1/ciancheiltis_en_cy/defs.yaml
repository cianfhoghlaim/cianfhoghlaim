      Phase 1 (en-cy) CocoIndex v1 App for the ciancheiltis umbrella.
      Mirrors the Welsh public-sector 8-theme surface into a single
      `lancedb://md:cianfhoghlaim/ciancheiltis/en_cy_chunks` LanceDB
      table (MotherDuck federated, per the BIEP LanceDB convention).
      The App module (`cocoindex_flows.british_isles.uk.
      ciancheiltis_en_cy_embedding`) MUST satisfy R1-R4 — the
      `cocoindex_v1_conformance` App runs at scaffold time and gates
