type: cianfhoghlaim.orchestration.components.CelticModelLifecycleComponent
attributes:
  app_name: CrossSubjectCompetencyEmbedding
  module: cianfhoghlaim.cocoindex.cross_subject_competency_embedding
  embedding_model: BAAI/bge-large-en-v1.5
  hnsw_index: true
  conformance_required: true
  table_name: cianfhoghlaim.lc.cross_subject.competencies
  total_vectors: 320