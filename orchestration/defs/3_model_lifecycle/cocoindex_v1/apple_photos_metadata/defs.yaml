# defs/3_model_lifecycle/cocoindex_v1/apple_photos_metadata/defs.yaml
#
# L3 CelticModelLifecycleComponent for the ApplePhotosMetadata v1 App.
# Per the apple-photos-ingestion spec — `Apple Photos metadata embedding`
# Requirement. The R1–R4 conformance contract is enforced at build_defs
# time by the Component. is_virtual=True so the LanceDB table mirrors its
# L1 upstream automatically.
type: orchestration.components.CelticModelLifecycleComponent
attributes:
  app_name: ApplePhotosMetadata
  module: cianfhoghlaim.cocoindex.apple_photos_metadata
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  privacy_gate: LEABHARLANN_PHOTOS_INCLUDE_GPS