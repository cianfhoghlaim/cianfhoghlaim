# defs/3_model_lifecycle/cocoindex_v1/nigeria_education/defs.yaml
#
# L3 CocoIndex v1 App for the Nigerian education pipeline. Embeds
# every federal + state education row into the shared
# `cianfhoghlaim.commonwealth.nga.education_chunks` LanceDB table.
#
# Reference: openspec/changes/2026-07-12-commonwealth-nigeria-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: nigeria_education
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  apps:
    - app_name: NigeriaEducationEmbedding
      module: cianfhoghlaim.cocoindex.nigeria_education_embedding
      source: commonwealth
      lance_table: cianfhoghlaim.commonwealth.nga.education_chunks
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - commonwealth
    - nigeria
    - nga
    - cocoindex-v1
    - embedding
  metadata:
    openspec_change: 2026-07-12-commonwealth-nigeria-pipeline-v1
    spec: commonwealth-pipeline
