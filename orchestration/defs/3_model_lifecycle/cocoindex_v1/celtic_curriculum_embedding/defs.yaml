# Dagster L3 — Celtic curriculum CocoIndex mount
# Reference: openspec/changes/2026-07-17-gaois-celtic-language-pipeline-v1/

type: dagster.schedule
schedule: "@monthly"
execution_timezone: "UTC"
description: >
  Monthly Celtic curriculum CocoIndex v1 mount — runs the CelticCurriculumEmbeddingApp
  and mounts the LanceDB table at `oideachais.celtic.curriculum_chunks`.

assets:
  - name: celtic_curriculum_cocoindex_mount
    group_name: language_celtic_curriculum_embedding
    compute_kind: local
    deps:
      - celtic_curriculum_ingestion
    metadata:
      layer: 3_model_lifecycle
      stage: language
      source_group: celtic_curriculum
      languages: [irish, scottish_gaelic, welsh, breton, manx, cornish]
      lance_table: oideachais.celtic.curriculum_chunks
      embedder: BAAI/bge-m3
      embed_dim: 1024
      openspec_change: 2026-07-17-gaois-celtic-language-pipeline-v1