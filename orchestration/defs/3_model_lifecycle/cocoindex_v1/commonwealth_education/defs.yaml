# defs/3_model_lifecycle/cocoindex_v1/commonwealth_education/defs.yaml
#
# L3 CocoIndex v1 App for the Commonwealth of Nations education
# pipeline. Embeds every Commonwealth per-nation education row into
# the shared `oideachais.commonwealth.education_chunks` LanceDB table.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: commonwealth_education
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  apps:
    - app_name: CommonwealthEducationEmbedding
      module: cianfhoghlaim.cocoindex_flows.biep_parity.lc_subject_embedding
      source: commonwealth
      lance_table: oideachais.commonwealth.education_chunks
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - commonwealth
    - education
    - cocoindex-v1
    - embedding
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
