# defs/3_model_lifecycle/cocoindex_v1/guernsey_education/defs.yaml
#
# L3 CocoIndex v1 App for the Government of Guernsey education pipeline.
# Embeds every Government of Guernsey per-subject education row into
# the shared `cianfhoghlaim.lc.guernsey.education_chunks` LanceDB table.
#
# Reference: openspec/changes/2026-07-12-british-isles-parity-pipeline-v1/
type: orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: guernsey_education
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  apps:
    - app_name: GovernmentofGuernseyEducationEmbedding
      module: cianfhoghlaim.cocoindex.biep_parity.guernsey_education_embedding
      source: british_isles
      lance_table: cianfhoghlaim.lc.guernsey.education_chunks
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - biep
    - parity
    - guernsey
    - cocoindex-v1
    - embedding
  metadata:
    openspec_change: 2026-07-12-british-isles-parity-pipeline-v1
    spec: british-isles-education-pipeline
