# defs/3_model_lifecycle/cocoindex_v1/european_nations_lva_education/defs.yaml
#
# L3 CocoIndex v1 App for the Latvia education pipeline.
# Embeds every Latvia per-subject education row into
# the shared `cianfhoghlaim.lc.european_nations.lva.education_chunks` LanceDB table.
#
# Reference: openspec/changes/2026-07-13-eu-nations-full-depth-expansion-v1/
type: orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: european_nations_lva_education
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  apps:
    - app_name: LVAEducationEmbedding
      module: cianfhoghlaim.cocoindex_flows.european_nations._factory
      source: european_nations
      lance_table: cianfhoghlaim.lc.european_nations.lva.education_chunks
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - european_nations
    - lva
    - education
    - cocoindex-v1
    - embedding
  metadata:
    openspec_change: 2026-07-13-eu-nations-full-depth-expansion-v1
    spec: european-nations-ukraine-pipeline
