# Dagster L3 — Heritage CocoIndex mount
# Reference: openspec/changes/2026-07-17-gaois-celtic-language-pipeline-v1/

type: dagster.schedule
schedule: "@weekly"
execution_timezone: "UTC"
description: >
  Weekly heritage CocoIndex v1 mount — runs the HeritageEmbeddingApp and mounts
  the LanceDB table at `oideachais.language.heritage_chunks`.

assets:
  - name: heritage_cocoindex_mount
    group_name: language_heritage_embedding
    compute_kind: local
    deps:
      - heritage_ingestion
    metadata:
      layer: 3_model_lifecycle
      stage: language
      source_group: heritage
      lance_table: oideachais.language.heritage_chunks
      embedder: BAAI/bge-m3
      embed_dim: 1024
      openspec_change: 2026-07-17-gaois-celtic-language-pipeline-v1