# Dagster L3 — Gaois CocoIndex mount (the v1 App mounting)
#
# Mounts the GaoisEmbeddingApp on top of the L2 BAML-extracted rows.
# The App reads the L2 outputs, chunks each row, embeds with BGE-M3
# (multilingual 1024-d), and mounts `oideachais.language.gaois_chunks`
# in LanceDB.
#
# Reference: openspec/changes/2026-07-17-gaois-celtic-language-pipeline-v1/

type: dagster.schedule
schedule: "@daily"
execution_timezone: "UTC"
description: >
  Daily Gaois CocoIndex v1 mount — runs the GaoisEmbeddingApp and mounts
  the LanceDB table at `oideachais.language.gaois_chunks`.

assets:
  - name: gaois_cocoindex_mount
    group_name: language_gaois_embedding
    compute_kind: local
    deps:
      - gaois_ingestion
    metadata:
      layer: 3_model_lifecycle
      stage: language
      source_group: gaois
      lance_table: oideachais.language.gaois_chunks
      embedder: BAAI/bge-m3
      embed_dim: 1024
      openspec_change: 2026-07-17-gaois-celtic-language-pipeline-v1