# defs/3_model_lifecycle/cocoindex_v1/ireland_lc_factory/defs.yaml
#
# L3 CocoIndex v1 component that wires the 11 Irish-LC CocoIndex Apps
# emitted by cocoindex_flows/biep_parity/ireland_lc_factory.py.
#
# Per the `centralized-schema-registry` capability. The 6 hand-written
# CocoIndex Apps at `cocoindex_flows/biep_parity/ireland_lc_<subject>_embedding.py`
# are now 1-line shims that re-export from the factory. This single L3
# component replaces the 6 per-subject components.
#
# The factory module:
#   cocoindex_flows/biep_parity/ireland_lc_factory.py
# exports 11 CocoIndex Apps at module import time (6 subjects × 2
# languages, minus 1 for Gaeilge which is ga-only). The Apps are named
# `<subject>_untiered_<lang>_embedding`.
#
# Reference:
#   openspec/specs/centralized-schema-registry/spec.md
#   openspec/changes/archive/2026-08-15-centralized-model-schema-registry-and-deployment-control-panel-v1/
type: orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: ireland_lc_factory
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  factory_module: cianfhoghlaim.cocoindex_flows.biep_parity.ireland_lc_factory
  factory_pattern: true
  apps:
    # 11 CocoIndex Apps (6 subjects × 2 langs minus Gaeilge-en):
    #   ireland_lc_mathematics_untiered_en_embedding
    #   ireland_lc_mathematics_untiered_ga_embedding
    #   ireland_lc_chemistry_untiered_en_embedding
    #   ireland_lc_chemistry_untiered_ga_embedding
    #   ireland_lc_computer_science_untiered_en_embedding
    #   ireland_lc_computer_science_untiered_ga_embedding
    #   ireland_lc_english_untiered_en_embedding
    #   ireland_lc_english_untiered_ga_embedding
    #   ireland_lc_geography_untiered_en_embedding
    #   ireland_lc_geography_untiered_ga_embedding
    #   ireland_lc_gaeilge_untiered_ga_embedding
    - app_name: ireland_lc_factory
      module: cianfhoghlaim.cocoindex_flows.biep_parity.ireland_lc_factory
      source: ireland_lc
      description: |
        The 11 CocoIndex Apps from cocoindex_flows/biep_parity/ireland_lc_factory.py.
        Each App writes to
        `cianhoghlaim.ireland.leaving_cycle.<subject>.untiered_<lang>_chunks`.
        The factory pattern collapsed ~765 LOC into 254 LOC (-67%).
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - ireland_lc
    - factory_pattern
    - cocoindex-v1
    - embedding
    - centralized-schema-registry
  metadata:
    openspec_change: 2026-08-15-centralized-model-schema-registry-and-deployment-control-panel-v1
    spec: centralized-schema-registry
    factory_module: cocoindex_flows.biep_parity.ireland_lc_factory
    subject_count: 6
    language_count: 2
    original_loc: 765
    factory_loc: 176
