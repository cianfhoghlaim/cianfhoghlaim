# defs/3_model_lifecycle/cocoindex_v1/en_education/defs.yaml
#
# L3 CocoIndex v1 App for the England education pipeline.
# Embeds every England per-subject education row into
# the shared `cianfhoghlaim.lc.en.education_chunks` LanceDB table.
#
# Reference: openspec/changes/2026-07-12-british-isles-parity-pipeline-v1/
type: orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: en_education
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  apps:
    - app_name: EnglandEducationEmbedding
      module: cianfhoghlaim.cocoindex_flows.biep_parity.en_education_embedding
      source: british_isles
      lance_table: cianfhoghlaim.lc.en.education_chunks
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - biep
    - parity
    - en
    - cocoindex-v1
    - embedding
  metadata:
    openspec_change: 2026-07-12-british-isles-parity-pipeline-v1
    spec: british-isles-education-pipeline
