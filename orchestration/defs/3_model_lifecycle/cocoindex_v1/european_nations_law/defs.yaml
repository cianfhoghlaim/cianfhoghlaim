# defs/3_model_lifecycle/cocoindex_v1/european_nations_law/defs.yaml
#
# L3 CocoIndex v1 App for the EU nations + Ukraine law pipeline.
# Embeds every per-nation law row into the shared
# `cianfhoghlaim.eu_nations.law_chunks` LanceDB table using the
# canonical BGE-M3 1024-d multilingual embedder.
#
# Reference: openspec/changes/2026-07-11-european-nations-ukraine-pipeline-v1/
type: orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: european_nations_law
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  apps:
    - app_name: EuropeanNationsLawEmbedding
      module: cianfhoghlaim.cocoindex_flows.european_nations_cross.law_embedding
      source: european_nations
      lance_table: cianfhoghlaim.eu_nations.law_chunks
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - european_nations
    - law
    - cocoindex-v1
    - embedding
  metadata:
    openspec_change: 2026-07-11-european-nations-ukraine-pipeline-v1
    spec: european-nations-ukraine-pipeline
