# orchestration/pipelines/education/tertiary/uog/personal_archive/defs.yaml
#
# L3 PipelineFactoryComponent for the University of Galway personal
# archive (assignments + notes + transcripts).
#
# Pipeline kind: personal_archive — content extraction + figure
# extraction. The legacy flat file was `uog_personal_archive.py` +
# `uog_personal_archive_figures.py`; this vertical pipeline unifies them.
#
# Reference: openspec/changes/2026-08-24-wave-2-orchestration-vertical-pipelines-v1/
type: orchestration.components.PipelineFactoryComponent
attributes:
  dlt_source: dlt_sources.education.tertiary.uog.personal_archive
  pipeline_kind: personal_archive
  embedding_model: BAAI/bge-large-en-v1.5
  hnsw_index: true
  conformance_required: true
  destinations:
    - ducklake_cianfhoghlaim
  processing:
    - baml_extraction
    - cocoindex_live_update
    - marimo_dashboard
  schedules:
    - cron: "0 4 * * *"
      timezone: UTC
  sensors:
    - upstream_change
  tags:
    - tertiary
    - uog
    - personal_archive
    - assignments
    - notes
    - transcripts
    - figures
  metadata:
    openspec_change: 2026-08-24-wave-2-orchestration-vertical-pipelines-v1
    spec: orchestration-vertical-pipelines
    kind: personal_archive
    institution: university_of_galway
    legacy_files:
      - orchestration/defs/uog_personal_archive.py
      - orchestration/defs/uog_personal_archive_figures.py
