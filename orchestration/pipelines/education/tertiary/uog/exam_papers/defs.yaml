# orchestration/pipelines/education/tertiary/uog/exam_papers/defs.yaml
#
# L3 PipelineFactoryComponent for the University of Galway exam papers
# pipeline (the FIRST tertiary education example, per the master plan).
#
# Pipeline kind: exam_papers — generates VLM-extracted exam paper
# assets + BAML structured-field extraction. Mirrors the dlt source
# at dlt_sources/education/tertiary/uog/exam_papers/.
#
# Reference: openspec/changes/2026-08-24-wave-2-orchestration-vertical-pipelines-v1/
type: orchestration.components.PipelineFactoryComponent
attributes:
  dlt_source: dlt_sources.education.tertiary.uog.exam_papers
  pipeline_kind: exam_papers
  embedding_model: BAAI/bge-large-en-v1.5
  hnsw_index: true
  conformance_required: true
  destinations:
    - ducklake_cianfhoghlaim
  processing:
    - baml_extraction
    - cocoindex_live_update
    - marimo_dashboard
    - ag_ui_auto_gen
  schedules:
    - cron: "0 3 * * *"
      timezone: UTC
  sensors:
    - upstream_change
  tags:
    - tertiary
    - uog
    - exam_papers
    - vlm
    - cocoindex-v1
    - baml
  metadata:
    openspec_change: 2026-08-24-wave-2-orchestration-vertical-pipelines-v1
    spec: orchestration-vertical-pipelines
    kind: exam_papers
    institution: university_of_galway
