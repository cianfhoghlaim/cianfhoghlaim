# orchestration/pipelines/media_intel/defs.yaml
#
# Per-pipeline Component (Wave 2 of the 2026-08-24 master refactor).
#
# Migrated from the legacy `PipelineFactoryComponent` to the canonical
# `dagster_dlt.DltLoadCollectionComponent` per master plan §3.3 + the
# canonical `dagster-pipeline-components` spec. The Cianfhoghlaim customisation
# (the canonical group_name + tags + the StateBackedComponent pattern)
# is wired via the shared helpers at
# `orchestration.pipelines._shared.dagster_dlt_integration` +
# `orchestration.pipelines._shared.state_helpers`.
#
# Mirrors the `dlt_sources.media_intel` source.
# Pipeline kind: media
# Group name: 1_ingestion_media_intel_cross_media
type: dagster_dlt.DltLoadCollectionComponent
attributes:
  loads:
    - pipeline: orchestration.pipelines._shared.dagster_dlt_integration:build_dlt_pipeline|dlt_sources.media_intel
      source: dlt_sources.media_intel
      translation: orchestration.pipelines._shared.dagster_dlt_integration.kcg_default_translation
