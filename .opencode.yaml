# OpenCode MCP Server Configuration
# =================================
# Centralized MCP configuration for OpenCode AI assistant
# Mirrors .mcp.json and .roo/mcp.json for consistent access

mcp:
  servers:
    # --- Document Processing ---
    docling:
      command: "uvx"
      args: ["--from", "mac-docling", "docling-mcp"]
      
    marker:
      command: "uvx"
      args: ["marker-mcp"]

    # --- Knowledge Graph ---
    graphiti:
      command: "uvx"
      args: ["graphiti-mcp"]
      env:
        NEO4J_URI: "bolt://localhost:7687"

    # --- Letta Agent Memory ---
    letta:
      command: "uvx"
      args: ["letta-mcp"]
      env:
        LETTA_BASE_URL: "https://api.letta.ai/v1"
        LETTA_API_KEY: "${LETTA_API_KEY}"

    # --- Browser Automation ---
    skyvern:
      command: "uvx"
      args: ["skyvern-mcp"]

    # --- Code Search ---
    chunkhound:
      command: "uv"
      args: ["run", "chunkhound", "mcp", "stdio"]
      env:
        CHUNKHOUND_CONFIG: "/Users/cianmacandeisigh/dev/kings_college_galway/.chunkhound.json"
