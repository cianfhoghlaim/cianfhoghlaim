[package]
name = "tuath-api"
description = "Tuath Celtic MMO API with x402 micropayments"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Async Runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Web Framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# x402 Protocol
x402-rs = { workspace = true }
x402-axum = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error Handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP
url = { workspace = true }

# Environment
dotenvy = "0.15"

# Utilities
chrono = { workspace = true }

# Shared Types
cianfhoghlaim-shared-types = { path = "../../../crates/stdb-modules/shared-types" }

[features]
default = []
telemetry = ["x402-rs/telemetry", "x402-axum/telemetry"]
