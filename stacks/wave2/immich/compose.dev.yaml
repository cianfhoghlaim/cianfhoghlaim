# Immich — local dev override
# ----------------------------------------------------------------------------
# No-op locket sidecar (alpine) so `depends_on: locket: service_healthy`
# resolves without booting the real Infisical-injection sidecar.
# ----------------------------------------------------------------------------

services:
  locket:
    image: alpine:3.20
    container_name: immich-locket-dev
    restart: "no"
    command: ["sh", "-c", "echo '[dev] no-op immich locket'; sleep infinity"]
    environment:
      INFISICAL_CLIENT_ID: ${INFISICAL_LOCKET_CLIENT_ID:-placeholder}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_LOCKET_CLIENT_SECRET:-placeholder}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-placeholder}
      LOCKET_MODE: watch
    networks:
      - cianfhoghlaim
      - lakehouse

  immich-server:
    depends_on:
      locket:
        condition: service_started
    env_file:
      - .env.dev
    environment:
      DB_HOSTNAME: lakehouse-postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-lakekeeper}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: lakehouse-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
    networks:
      - cianfhoghlaim
      - lakehouse

  immich-machine-learning:
    networks:
      - cianfhoghlaim
      - lakehouse

secrets:
  infisical_secret:
    file: /dev/null
  immich_infisical_secret:
    file: /dev/null
