# Letta — local dev override
# ----------------------------------------------------------------------------
# No-op locket sidecar (alpine) so `depends_on: locket: service_healthy`
# resolves without booting the real Infisical-injection sidecar.
# ----------------------------------------------------------------------------

services:
  locket:
    image: alpine:3.20
    container_name: letta-locket-dev
    restart: "no"
    command: ["sh", "-c", "echo '[dev] no-op letta locket — secrets from .env.dev'; sleep infinity"]
    environment:
      INFISICAL_CLIENT_ID: ${INFISICAL_LOCKET_CLIENT_ID:-placeholder}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_LOCKET_CLIENT_SECRET:-placeholder}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-placeholder}
      LOCKET_MODE: watch
    networks:
      - cianfhoghlaim
      - lakehouse

  letta:
    depends_on:
      locket:
        condition: service_started
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
      LETTA_PG_URI: postgresql://${POSTGRES_USER:-lakekeeper}:${POSTGRES_PASSWORD:?must be set}@lakehouse-postgres:5432/letta
      LETTA_LLM_API_KEY: ${LETTA_LLM_API_KEY:-sk-1234}
      LETTA_EMBEDDING_API_KEY: ${LETTA_EMBEDDING_API_KEY:-sk-1234}
    networks:
      - cianfhoghlaim
      - lakehouse

secrets:
  infisical_secret:
    file: /dev/null
  letta_infisical_secret:
    file: /dev/null
