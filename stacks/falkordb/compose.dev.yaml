# FalkorDB — local dev override
# ----------------------------------------------------------------------------
# Mirrors the langfuse/litellm/cognee dev override pattern:
#   1. Replace the production locket sidecar with a no-op alpine
#      container that passes healthcheck. The production locket expects
#      the `infisical_secret` Docker secret file and the `/locket`
#      binary, neither of which exist in dev mode.
#   2. The dev overlay re-declares the falkordb service's `volumes` to
#      drop the `/run/secrets/locket:ro` mount (the production mount
#      that depends on the locket tmpfs volume).
#   3. `.env.dev` is loaded via `--env-file` to satisfy the base
#      compose's `${FALKORDB_PASSWORD:?...}` check at parse time.
#
# Usage:
#   docker compose \
#     --env-file .env.dev \
#     -f compose.yaml -f compose.dev.yaml -f sidecar.yaml \
#     up -d
#
# (Note: the invocation order is compose.yaml + sidecar.yaml +
# compose.dev.yaml — the dev overlay must come LAST so its locket
# replacement wins the merge.)
# ----------------------------------------------------------------------------

services:
  locket:
    image: alpine:3.20
    container_name: falkordb-locket-dev
    restart: "no"
    command:
      - sh
      - -c
      - "echo '[dev] no-op locket — secrets from .env.dev'; sleep infinity"
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - falkordb

  falkordb:
    depends_on:
      locket:
        condition: service_started
    volumes:
      - falkordb-data:/data

# Top-level secrets block from sidecar.yaml references the production
# Infisical secret file (../../infisical_secret). Override it with a
# no-op file (/dev/null) so the locket sidecar doesn't fail to mount a
# missing file. The locket itself is replaced above with a no-op alpine
# container that doesn't read this secret.
secrets:
  infisical_secret:
    file: /dev/null