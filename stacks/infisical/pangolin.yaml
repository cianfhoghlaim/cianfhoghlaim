# =============================================================================
# INFISICAL - Pangolin Private Resource (6-label shape)
# =============================================================================
# Per the Pangolin 6-Label Pattern requirement in infrastructure-stacks/spec.md:
# 1. name                - unique slug
# 2. mode                - http / tcp / udp
# 3. full-domain         - the FQDN
# 4. destination-port    - the container port
# 5. protocol            - http / https
# 6. roles[0]            - the Traefik role
#
# NOTE: The local Infisical on bunchloch is NOT exposed via Pangolin
# (it stays on host port 8081 only — Locket sidecars reach it over the
# `bunchloch-infra` Docker network at http://infisical-backend:8080).
# This file is committed for parity + the future arm1-oci promotion.
# =============================================================================

pangolin:
  private-resources:
    infisical:
      name: "Infisical Vault"
      mode: "http"
      full-domain: "infisical.cianfhoghlaim.ie"
      destination: "infisical-backend"
      destination-port: 8080
      protocol: "http"
      roles:
        - "Member"