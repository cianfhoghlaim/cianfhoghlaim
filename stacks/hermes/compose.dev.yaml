# Hermes — local dev override (mirrors langfuse/litellm dev pattern)
# ----------------------------------------------------------------------------
# Mirrors the langfuse/cognee/litellm dev override pattern:
#   1. No-op locket sidecar (alpine) so `depends_on: locket: service_healthy`
#      resolves without booting the real Infisical-injection sidecar.
#   2. `env_file: ../../../.env` (mise-hydrated local .env) is mounted
#      so secrets reach the containers directly.
#   3. The container runs as `1000:1000` (matches the existing compose.yaml
#      `user:` setting — the no-op locket runs as root which is fine).
#
# Usage:
#   docker compose \
#     --env-file ../../../.env \
#     -f stacks/hermes/compose.yaml \
#     -f stacks/hermes/sidecar.yaml \
#     -f stacks/hermes/compose.dev.yaml \
#     up -d
# ----------------------------------------------------------------------------

services:
  locket:
    image: alpine:3.20
    container_name: hermes-locket-dev
    restart: "no"
    command:
      - sh
      - -c
      - "echo '[dev] no-op hermes locket — secrets from .env via env_file'; sleep infinity"
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default

  # Hermes runtime — dev override of compose.yaml's environment block
  hermes:
    depends_on:
      locket:
        condition: service_started
    # Dev override: the upstream hermes image uses s6-overlay which needs
    # /run to be writable + the user to match /run's owner. On Linux that
    # works, but on macOS (OrbStack) /run is owned by root + read-only
    # filesystem breaks s6's preinit. Drop both security constraints for
    # dev — production must keep `user: "1000:1000"` + `read_only: true`.
    user: "0:0"
    read_only: false
    # Dev override: drop the prod hardening (no-new-privileges + cap_drop) —
    # the upstream hermes image's s6-overlay preinit fails on macOS/OrbStack
    # when these are set. Verified empirically: `docker run --user 0:0
    # nousresearch/hermes-agent:v2026.7.1` works; same image with
    # `--security-opt no-new-privileges --cap-drop ALL` does not.
    # NOTE: compose MERGES list fields by default; use `!reset` to replace.
    security_opt: !reset []
    cap_drop: !reset []
    # Hermes is a TTY-bound CLI; without tty+stdin_open it exits with
    # "Goodbye!" on first SIGTERM (Docker's "not a TTY" detection).
    tty: true
    stdin_open: true
    # tmpfs at /run so s6-overlay can write its init socket (DON'T mount /run/s6
    # separately — it makes the image's own /run/s6 "Resource busy")
    tmpfs: !reset
      - /tmp:size=128m,mode=1777
      - /run:size=64m,mode=777
    env_file:
      - ../../../.env
    environment:
      # Dev-mode auth + LiteLLM chokepoint
      HERMES_API_SERVER_KEY: ${HERMES_API_SERVER_KEY}
      HERMES_OPERATOR_POCKET_ID_SUBJECT: ${HERMES_OPERATOR_POCKET_ID_SUBJECT:-oidc-dev-operator-placeholder}
      HERMES_PORT: "9119"
      HERMES_MCP_PORT: "9120"
      # Enable the dashboard s6 service (otherwise the port isn't bound)
      HERMES_DASHBOARD: "1"
      # Bind dashboard to loopback (auth gate requires loopback OR a real
      # auth provider — we use loopback + basic-auth below for dev)
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      # Basic auth for the dashboard (bundled dashboard_auth/basic provider;
      # plain password — gets hashed by the plugin at first start)
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "admin"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "dev-dashboard-password"
      # Light up MCP server in dev
      HERMES_MCP_SERVER: "1"
      HERMES_LOG_LEVEL: ${HERMES_LOG_LEVEL:-info}
      # LLM provider — LiteLLM chokepoint
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-2026-xxx}
      # Langfuse OTLP — use the local langfuse-web (on :13001 internally :3000)
      LANGFUSE_BASE_URL: ${HERMES_LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: pk-lf-dev-public-key
      LANGFUSE_SECRET_KEY: sk-lf-dev-secret-key
      OTEL_SERVICE_NAME: hermes-agent
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://langfuse-web:3000/api/public/otel}
      # Channel tokens (all empty in dev — channels will report "missing token")
      TELEGRAM_BOT_TOKEN: ${HERMES_TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${HERMES_DISCORD_BOT_TOKEN:-}
    networks:
      - default
      - cianfhoghlaim

# Top-level secrets: block from sidecar.yaml references the production
# Infisical secret file (../../infisical_secret). Override with /dev/null
# so the locket sidecar doesn't fail to mount a missing file.
secrets:
  infisical_secret:
    file: /dev/null

# Top-level networks: block in the base compose declares `cianchoghlaim`
# as external. In dev mode on bunchloch, this network IS created (by the
# lakehouse/litellm/etc. cold-boot), so we keep it external. The previous
# "external: false" override broke DNS for sibling services like dragonfly.
networks:
  cianfhoghlaim:
    external: true
    name: cianchoghlaim