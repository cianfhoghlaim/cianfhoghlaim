# =============================================================================
# HERMES — Pangolin Traefik Routing
# =============================================================================
# Routes hermes.cianfhoghlaim.ie to the hermes container at dashboard
# port 9119. TinyAuth enforces Pocket ID OIDC at the Traefik layer;
# the Hermes users.allowlist (in config/hermes.yaml) enforces a 2nd
# layer at the gateway. The webhook ports (8443/8090/8080/8645)
# and the MCP port (9120) are bound to 127.0.0.1 in compose.yaml
# and are NOT routed here.
#
# Middlewares (canonical Cianfhoghlaim):
#   tinyauth        — Pocket ID OIDC SSO (from the pangolin stack)
#   secure-headers  — HSTS + X-Frame-Options etc. (from the pangolin stack)
# =============================================================================

http:
  routers:
    hermes-dashboard:
      entryPoints:
        - https
      rule: "Host(`hermes.cianfhoghlaim.ie`)"
      service: hermes
      tls:
        certResolver: letsencrypt
      middlewares:
        - tinyauth
        - secure-headers
      priority: 100

  services:
    hermes:
      loadBalancer:
        servers:
          - url: "http://hermes:9119"
        healthCheck:
          path: /api/health
          interval: 30s
          timeout: 3s
