# =============================================================================
# LAKEHOUSE GARAGE - Enhanced S3-Compatible Storage Configuration
# =============================================================================
# Pinned 2026-07-06 to Garage v2.3.0 schema (was v1.0.1 with `replication_mode`
# key — REMOVED in v2). The v2 schema replaces it with two keys:
#   - replication_factor (integer)
#   - consistency_mode   ("consistent" | "available")
#
# Virtual-host style addressing for Lance/Iceberg compatibility.
# This enables bucket-specific subdomains: iceberg.s3.lakehouse.cianfhoghlaim.ie
#
# USAGE:
#   Garage reads this config from /etc/garage.toml in the container.
# =============================================================================

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

# Single-node deployment for development/small deployments
# For production clusters, set replication_factor >= 2 with multiple nodes
replication_factor = 1
consistency_mode = "consistent"

# Compression level (1 = fastest, 9 = best compression)
compression_level = 1

# =============================================================================
# RPC Configuration
# =============================================================================
# NOTE: RPC secret must be 32 bytes (64 hex chars) with high entropy
# Generate with: openssl rand -hex 32
# For production, use Locket secret injection with envsubst
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "a113063123736ef390b51302c98099d2abf08eb0e8a7347e7aba331d10779f0d"

# =============================================================================
# S3 API - Virtual-Host Style (Critical for Lance)
# =============================================================================
[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.lakehouse.cianfhoghlaim.ie"

# =============================================================================
# Web/Static Site Hosting
# =============================================================================
[s3_web]
bind_addr = "[::]:3903"
root_domain = ".web.lakehouse.cianfhoghlaim.ie"
index = "index.html"

# =============================================================================
# Key-Value API (K2V)
# =============================================================================
[k2v_api]
api_bind_addr = "[::]:3902"

# =============================================================================
# Admin API
# =============================================================================
[admin]
api_bind_addr = "[::]:3904"
admin_token = "dev-admin-token-change-in-production"
metrics_token = "dev-metrics-token-change-in-production"