# Docling-serve dev override (minimal: just the locket + no-op)
services:
  locket:
    image: alpine:3.20
    container_name: docling-serve-locket-dev
    restart: "no"
    command: ["sh", "-c", "echo '[dev] no-op locket — secrets from dev overlay'; sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stack

# Top-level secrets: block from sidecar.yaml references the production
# Infisical secret file (../../infisical_secret). Override with /dev/null
# so the locket sidecar doesn't fail to mount a missing file.
secrets:
  infisical_secret:
    file: /dev/null
