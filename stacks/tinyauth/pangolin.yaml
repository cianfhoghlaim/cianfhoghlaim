# =============================================================================
# TINYAUTH - Pangolin private resource (Tinyauth route + Traefik forward-auth)
# =============================================================================
# Generated by scripts/generate-stack-pangolin-yaml.ts on 2026-07-14.
# Adds the Tinyauth URL (https://tinyauth.cianfhoghlaim.ie) as a
# Pangolin-routed private resource, plus the 6-label Traefik config
# so Traefik knows to forward `/api/oauth/callback/pocketid` to Tinyauth.
# =============================================================================

pangolin:
  private-resources:
    tinyauth:
      - name: tinyauth
        mode: http
        full-domain: tinyauth.cianfhoghlaim.ie
        destination-port: 10000
        protocol: https
        roles:
          - "Admin"
        # The OIDC callback route is what Pocket ID redirects to after login
        oauth-callback:
          - name: tinyauth-oauth-callback
            mode: http
            full-domain: tinyauth.cianfhoghlaim.ie
            destination-port: 10000
            protocol: https
            path: /api/oauth/callback/pocketid
            roles:
              - "Admin"
