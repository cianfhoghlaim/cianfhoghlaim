[project]
name = "croilar"
version = "0.1.0"
description = "Croílár — personal portfolio + CV + data engineering"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Cianfhoghlaim Team" },
]
keywords = ["portfolio", "music", "data-engineering", "dlt", "marimo", "cv", "irish"]

dependencies = [
    # Shared utilities (disabled - package doesn't exist yet)
    # "sruth-shared>=0.1.0",
    # Orchestration
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "dagster-dlt>=0.26.0",
    # DLT & Data Pipeline
    "dlt[duckdb,lancedb,parquet]>=1.18.0",
    "pyarrow>=17.0.0",
    "pendulum>=3.0.0",

    # Web Scraping (crawl4ai removed - future scraping via sruth/browser)
    "beautifulsoup4>=4.12.0",
    "yt-dlp>=2024.0.0",

    # Cloud Storage
    "boto3>=1.34.0",

    # Notebooks & Visualization
    "marimo>=0.17.0",
    "altair>=5.3.0",

    # Pydantic settings (used by _shared.config.settings.AleyumSettings)
    "pydantic-settings>=2.0.0",

    # Utilities
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
analytics = [
    # Heavy analytics dependencies - install with: pip install aleyum-portfolio[analytics]
    "ibis-framework[duckdb]>=11.0.0",
    "polars>=1.0.0",
    "vegafusion[embed]>=1.6.0",
]

# [tool.uv.sources]
# sruth-shared = { path = "../shared", editable = true }  # Disabled until package exists

[tool.uv.sources]
oideachais = { workspace = true }
# Per issue #17, install `croilar` as a NON-editable wheel (not
# an editable install). Why: uv's editable install for this
# project layout generates a `_editable_impl_croilar.pth` file
# that has 4 lines, all pointing to the project root, instead
# of a single line pointing to the project root's parent.
# Result: `import croilar` returns None (Python looks for
# `croilar/croilar/` which doesn't exist).
#
# The non-editable install avoids the editable-install code path
# entirely: the wheel is built once and copied to
# `site-packages/croilar/...`, which makes `import croilar`
# resolve through the standard dist-info mechanism. No .pth
# file needed.
#
# Cost: source edits to `croilar/` require
#   uv pip install --reinstall --no-deps .
# (or `uv sync --reinstall-package croilar`) to take effect.
# The `croilar/scripts/dev-rebuild.sh` script automates this.
croilar = { path = ".", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Per https://github.com/cianfhoghlaim/kings_college_galway/issues/17
# (the pre-cleanup layout lost the `_shared` and `dagster_assets`
# packages; declare them explicitly here so the dagster code-location
# at `croilar/definitions.py` can resolve `from croilar._shared.X import ...`).
#
# Strategy: declare ONLY the project root (`.`). The hatch build
# will pick up all the subdirs underneath (those that are
# importable Python packages, i.e. have an `__init__.py`). This
# makes `croilar` itself a real Python package (importable as
# `from croilar.X import Y`).
#
# The sub-packages (`_shared`, `pipelines`, `notebooks`,
# `dagster_assets`) are picked up by hatch's auto-detection
# because they have `__init__.py`. They become sub-packages of
# `croilar` (e.g. `croilar._shared`).
#
# NB: the resulting wheel installs as `site-packages/croilar/`
# (with `_shared/`, `pipelines/`, etc. as subdirs). The .pth file
# that uv's editable install generates is currently broken (it
# has N lines, all pointing to the project root, not to its
# parent). A post-install rewrite via `croilar/scripts/fix-pth.sh`
# puts the parent directory on sys.path, which makes
# `find_spec('croilar')` succeed.
packages = [
    ".",
]

# dg workspace configuration - enables unified workspace loading via dg.toml
[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_assets"
code_location_target_module = "dagster_assets.definitions"
code_location_name = "croilar"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
