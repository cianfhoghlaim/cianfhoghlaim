[project]
name = "codeolas"
version = "0.1.0"
description = "Code analysis and repository intelligence library with semantic search, knowledge graphs, and documentation generation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Cianfhoghlaim", email = "dev@cianfhoghlaim.ie"}
]
keywords = [
    "code-analysis",
    "semantic-search",
    "knowledge-graph",
    "code-intelligence",
    "ast-parsing",
    "rag",
    "embeddings",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "lancedb>=0.8.0",
    "tree-sitter>=0.21.0,<0.22.0", # Pin to 0.21.x for tree_sitter_languages compat
    "tree-sitter-languages>=1.10.0",
    "sentence-transformers>=2.2.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
    "langfuse>=3.11.2",
    "ddtrace>=4.1.1",
]

[project.optional-dependencies]
graph = [
    "neo4j>=5.0.0",  # For Memgraph driver
]
rerank = [
    "tiktoken>=0.5.0",  # For tokenization in reranking
]
dagster = [
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
]
mcp = [
    "mcp>=0.1.0",
]
agents = [
    "agno>=0.1.0",
]
cocoindex = [
    "cocoindex>=0.3.0",  # Requires Python 3.11+
]
all = [
    "codeolas[graph,rerank,dagster,mcp,agents,cocoindex]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://git.cianfhoghlaim.ie/cianfhoghlaim/sruth"
Documentation = "https://docs.cianfhoghlaim.ie/codeolas"
Repository = "https://git.cianfhoghlaim.ie/cianfhoghlaim/sruth"
Issues = "https://git.cianfhoghlaim.ie/cianfhoghlaim/sruth/issues"

[project.scripts]
codeolas = "sruth.shared.codeolas.cli:main"
codeolas-mcp = "sruth.códeolas.mcp_server.server:main"

[project.entry-points."dagster.repositories"]
codeolas = "sruth.códeolas.dagster_assets.definitions:defs"

# Note: This flow no longer builds as a standalone package.
# Core infrastructure is in sruth.shared.codeolas.
# This pyproject.toml is kept for dependency management and CLI entry points.
[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No standalone package - uses shared infrastructure
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
