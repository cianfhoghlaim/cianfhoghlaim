# Unreal Weather Simulation
# Niagara-based weather system with real-time data

title: "Celtic Weather System"
subtitle: "Unreal Engine 5 Niagara Weather Simulation"
category: unreal
order: 4

description: |
  Large-scale weather simulation for Unreal Engine 5 using Niagara VFX.
  Features Grid2D wind field modules, custom HLSL bicubic interpolation,
  Large World Coordinates for precision at Celtic region scales, and
  real-time streaming from meteorological APIs.

technologies:
  - Unreal Engine 5.4
  - Niagara VFX System
  - Grid2D Data Interface
  - HLSL Custom Modules
  - Large World Coordinates
  - SpacetimeDB

features:
  - Grid2D wind field with bicubic sampling
  - Large World Coordinates (Celtic region scale)
  - Custom Niagara modules in HLSL
  - Real-time weather API integration
  - Region-based LOD for particle density
  - Celtic zone atmospheric effects

