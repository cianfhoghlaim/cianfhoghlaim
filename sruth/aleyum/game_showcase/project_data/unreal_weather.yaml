code_samples:
  - title: "Grid2D Wind Module (HLSL)"
    language: hlsl
    code: |
      // Niagara Grid2D custom module for wind sampling
      void SampleWindField(
          in float3 WorldPosition,
          in float Time,
          out float3 WindVelocity,
          out float WindStrength
      ) {
          // Convert world position to grid UV
          float2 gridUV = WorldToGridUV(WorldPosition.xy);

          // Sample wind field with bicubic interpolation
          float3 wind = SampleBicubic(WindFieldTexture, gridUV);

          // Apply Large World Coordinates offset
          wind += LWC_GetTileOffset(WorldPosition);

          WindVelocity = wind;
          WindStrength = length(wind);
      }

  - title: "Weather Zone Blueprint"
    language: cpp
    code: |
      UCLASS()
      class ACelticWeatherZone : public AActor {
          GENERATED_BODY()

          UPROPERTY(EditAnywhere)
          TObjectPtr<UNiagaraComponent> ParticleSystem;

          UPROPERTY(EditAnywhere)
          FString ZoneId;

          UFUNCTION()
          void OnWeatherUpdate(const FWeatherData& Data) {
              ParticleSystem->SetVariableFloat(
                  "WindStrength", Data.WindSpeed
              );
              ParticleSystem->SetVariableVec3(
                  "WindDirection", Data.WindDirection
              );
          }
      };

