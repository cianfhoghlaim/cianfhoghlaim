  entries:
    - headword: "turas"
      part_of_speech: "m. (gs. & npl. -ais, gpl. ~)"
      senses:
        - number: 1
          definition: "Journey"
          examples:
            - irish: "Dul ar turas"
              english: "to go on a journey"
            - irish: "Tá turas fada romhainn"
              english: "we have a long journey ahead of us"

    - headword: "beannacht"
      part_of_speech: "f. (gs. ~a, pl. ~aí)"
      senses:
        - number: 1
          definition: "Blessing"
          examples:
            - irish: "Beannacht Dé"
              english: "the blessing of God"
            - irish: "Beannacht a fháil"
              english: "to receive a blessing"

    - headword: "radharc"
      part_of_speech: "m. (gs. & npl. -airc, gpl. ~)"
      senses:
        - number: 1
          definition: "Sight, Faculty of sight, vision"
          examples:
            - irish: "An radharc a bheith agat"
              english: "to be able to see"
            - irish: "Radharc na súl"
              english: "eyesight"

