# Welsh (Cymraeg) Sample Data
# Examples from major Welsh language resources

metadata:
  language: cy
  language_name: "Welsh (Cymraeg)"
  iso_639_3: cym
  generated: "2025-12-17"

# =============================================================================
# CORCENCC SAMPLES (National Corpus of Contemporary Welsh)
# =============================================================================
corcencc_samples:
  source: "https://corcencc.org/"
  description: "Sample sentences from National Corpus of Contemporary Welsh"

  spoken:
    - id: "CC-S001"
      text: "Dwi'n meddwl bod hynna'n syniad da iawn."
      translation: "I think that's a very good idea."
      register: "Informal conversation"
      region: "North Wales"

    - id: "CC-S002"
      text: "Allet ti basio'r halen i fi, plis?"
      translation: "Could you pass the salt to me, please?"
      register: "Informal"
      region: "South Wales"

    - id: "CC-S003"
      text: "Mae'r plant wedi mynd i'r ysgol yn barod."
      translation: "The children have already gone to school."
      register: "Neutral"

  written:
    - id: "CC-W001"
      text: "Yn ôl yr adroddiad, mae nifer y siaradwyr Cymraeg wedi cynyddu."
      translation: "According to the report, the number of Welsh speakers has increased."
      source: "News"
      register: "Formal"

    - id: "CC-W002"
      text: "Bydd y cyfarfod yn cael ei gynnal ddydd Mawrth nesaf."
      translation: "The meeting will be held next Tuesday."
      source: "Administrative"
      register: "Formal"

# =============================================================================
# GPC SAMPLES (Geiriadur Prifysgol Cymru)
# =============================================================================
gpc_samples:
  source: "https://www.geiriadur.ac.uk/"
  description: "Sample entries from University of Wales Dictionary"

  entries:
    - headword: "hiraeth"
      part_of_speech: "noun, masculine"
      definition: "Longing, yearning, nostalgia, homesickness; grief, sorrow; a yearning for something lost"
      etymology: "hir (long) + -aeth (suffix)"
      examples:
        - welsh: "Mae hiraeth arnaf am fy mamwlad."
          english: "I have hiraeth/longing for my homeland."
      notes: "Often considered untranslatable; a uniquely Welsh concept"

    - headword: "cwtsh"
      part_of_speech: "noun, masculine"
      variants: ["cwtch", "cwts"]
      definitions:
        - number: 1
          text: "A cuddle, hug"
          example: "Dere yma am gwtsh."
          translation: "Come here for a cuddle."
        - number: 2
          text: "A small storage space, cubbyhole"
          example: "Mae'r sgidie yn y cwtsh dan stâr."
          translation: "The shoes are in the cupboard under the stairs."
      regional: "South Wales (most common)"

    - headword: "cariad"
      part_of_speech: "noun, masculine"
      definitions:
        - number: 1
          text: "Love"
          example: "Cariad pur sydd fel y dur."
        - number: 2
          text: "Sweetheart, darling (term of endearment)"
          example: "Sut wyt ti, cariad?"
          translation: "How are you, darling?"

# =============================================================================
# CYSGLIAD SAMPLES (Spelling/Grammar Checker)
# =============================================================================
cysgliad_samples:
  source: "https://www.cysgliad.com/cysill/arlein/"
  description: "Sample corrections from Cysill grammar checker"

  corrections:
    - type: "mutation"
      original: "Mae car mawr gyda fi."
      corrected: "Mae car mawr gyda fi."  # Correct
      note: "No soft mutation needed after 'car' (masculine noun)"

    - type: "mutation"
      original: "Mae ci da gyda fi."
      corrected: "Mae ci da gyda fi."  # ci → gi after feminine?
      note: "Mutation rules are complex in Welsh"

    - type: "spelling"
      original: "llyfrgell"
      corrected: "llyfrgell"
      note: "Correct spelling: library"

    - type: "grammar"
      original: "Dw i wedi mynd i'r siop ddoe."
      corrected: "Es i i'r siop ddoe."
      note: "Past tense should use 'es i' for completed action"

# =============================================================================
# TECHIAITH SAMPLES (Language Technology Portal)
# =============================================================================
techiaith_samples:
  macsen_commands:
    source: "https://techiaith.cymru/products/macsen/"
    description: "Sample voice commands for Macsen Welsh voice assistant"
    examples:
      - command: "Beth yw'r tywydd heddiw?"
        translation: "What is the weather today?"
        response_type: "Weather information"

      - command: "Chwaraea gerddoriaeth."
        translation: "Play music."
        response_type: "Media control"

      - command: "Gosod larwm am saith o'r gloch."
        translation: "Set alarm for seven o'clock."
        response_type: "Alarm setting"

  translation_samples:
    source: "https://cyfieithu.techiaith.cymru/"
    description: "Sample machine translation outputs"
    examples:
      - english: "The meeting will be held tomorrow."
        welsh: "Bydd y cyfarfod yn cael ei gynnal yfory."

      - english: "Please send me the document by email."
        welsh: "Anfonwch y ddogfen ataf drwy e-bost os gwelwch yn dda."

