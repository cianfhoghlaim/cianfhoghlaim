cysemtagger_samples:
  source: "https://github.com/CorCenCC/CySemTagger"
  description: "Sample semantic tagging output"

  tagged_sentences:
    - text: "Roedd y bachgen yn bwyta afal coch."
      translation: "The boy was eating a red apple."
      tokens:
        - token: "bachgen"
          semantic_tag: "S2.2mf"
          category: "People: Male"
        - token: "bwyta"
          semantic_tag: "F1"
          category: "Food"
        - token: "afal"
          semantic_tag: "F1"
          category: "Food: Fruit"
        - token: "coch"
          semantic_tag: "O4.3"
          category: "Colour"
