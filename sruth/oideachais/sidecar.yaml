# =============================================================================
# OIDEACHAIS - Locket Sidecar Configuration
# =============================================================================
# Extends compose.yaml with Locket for secrets management
#
# USAGE:
#   docker compose -f compose.yaml -f sidecar.yaml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # LOCKET - Secrets Management Sidecar
  # ---------------------------------------------------------------------------
  locket:
    image: ghcr.io/bpbradley/locket:latest
    container_name: oideachais-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      OP_CONNECT_HOST: ${OP_CONNECT_HOST:-http://132.145.27.89:8080}
    command:
      - "--provider=op-connect"
      - "--connect.host=${OP_CONNECT_HOST:-http://132.145.27.89:8080}"
      - "--connect.token-file=/run/secrets/op_token"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=${LOCKET_MODE:-watch}"
    secrets:
      - op_token
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - oideachais-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "/locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - oideachais

  # ---------------------------------------------------------------------------
  # Override API to depend on Locket and mount secrets
  # ---------------------------------------------------------------------------
  api:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - oideachais-data:/app/storage/data
      - oideachais-secrets:/run/secrets/locket:ro
    env_file:
      - path: /run/secrets/locket/secrets.env
        required: false

  # ---------------------------------------------------------------------------
  # Override Frontend to depend on Locket
  # ---------------------------------------------------------------------------
  frontend:
    depends_on:
      locket:
        condition: service_healthy
      api:
        condition: service_healthy

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  op_token:
    file: ${OP_CONNECT_TOKEN_FILE:-../../op_token}

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  oideachais-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=700
