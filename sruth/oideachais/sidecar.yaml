# =============================================================================
# OIDEACHAIS - Locket Sidecar Configuration
# =============================================================================
# Extends compose.yaml with Locket for secrets management
#
# USAGE:
#   docker compose -f compose.yaml -f sidecar.yaml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # LOCKET - Secrets Management Sidecar
  # ---------------------------------------------------------------------------
  locket:
    image: ghcr.io/bpbradley/locket:infisical
    container_name: oideachais-locket
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    command:
      - "--provider=infisical"
      - "--infisical-client-id=${INFISICAL_CLIENT_ID}"
      - "--infisical-client-secret=file:/run/secrets/infisical_secret"
      - "--infisical-url=${INFISICAL_URL:-http://host.docker.internal:8081}"
      - "--infisical-default-environment=${INFISICAL_ENVIRONMENT:-dev}"
      - "--infisical-default-project-id=${INFISICAL_PROJECT_ID:-project-id}"
      - "--map=/templates:/run/secrets/locket"
      - "--mode=${LOCKET_MODE:-watch}"
    secrets:
      - infisical_secret
    volumes:
      - ./secrets.env:/templates/secrets.env:ro
      - oideachais-secrets:/run/secrets/locket
    healthcheck:
      test: ["CMD", "locket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - oideachais

  # ---------------------------------------------------------------------------
  # Override Dagster to depend on Locket and mount secrets
  # ---------------------------------------------------------------------------
  dagster:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - oideachais-secrets:/run/secrets/locket:ro
    env_file:
      - path: /run/secrets/locket/secrets.env
        required: false

  # ---------------------------------------------------------------------------
  # Override API to depend on Locket and mount secrets
  # ---------------------------------------------------------------------------
  api:
    depends_on:
      locket:
        condition: service_healthy
    volumes:
      - oideachais-data:/app/storage/data
      - oideachais-secrets:/run/secrets/locket:ro
    env_file:
      - path: /run/secrets/locket/secrets.env
        required: false

  # ---------------------------------------------------------------------------
  # Override Frontend to depend on Locket
  # ---------------------------------------------------------------------------
  frontend:
    depends_on:
      locket:
        condition: service_healthy
      api:
        condition: service_healthy

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  infisical_secret:
    file: ${INFISICAL_SECRET_FILE:-../../infisical_secret}

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  oideachais-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=700
