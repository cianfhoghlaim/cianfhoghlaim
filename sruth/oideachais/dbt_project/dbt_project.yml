# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models.
#
# Mirrors the structure of `spaces/data-engineering/dbt_project/dbt_project.yml`
# (the prior-art reference repo). See `openspec/changes/celtic-data-engineering-patterns/`
# for the rationale.
name: "oideachais_dbt"
version: "0.1.0"
config-version: 2

profile: "oideachais_dbt"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Multi-target: dev = local DuckDB, prod = MotherDuck.
# Per the spec scenario "Prod target materializes incrementally" the 3 models
# become `incremental` when the target is `prod`; dev always materializes as
# a full `table` for fast iteration.
#
# Pattern source: `spaces/data-engineering/dbt_project/dbt_project.yml:31-35`
# (the prior-art project uses the exact same Jinja conditional).
models:
  oideachais_dbt:
    weekly_downloads:
      +materialized: "{{ 'incremental' if target.name == 'prod' else 'table' }}"
      +unique_key: "(download_date, project)"
    language_distribution:
      +materialized: "{{ 'incremental' if target.name == 'prod' else 'table' }}"
      +unique_key: "(language, week_start_date)"
    ocr_confidence_by_model:
      +materialized: "{{ 'incremental' if target.name == 'prod' else 'table' }}"
      +unique_key: "(ocr_model, document_id)"
