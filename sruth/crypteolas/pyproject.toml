[project]
name = "crypteolas"
version = "0.1.0"
description = "GitHub Intelligence + DeFi Analytics Platform - Code search, protocol research, temporal knowledge graphs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Shared utilities (disabled - package doesn't exist yet)
    # "sruth-shared[storage,graph,embeddings,codeolas]>=0.1.0",
    # Data Loading
    "dlt[duckdb,parquet]>=1.0.0",
    "firecrawl-py>=1.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",

    # Orchestration
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "dagster-dlt>=0.26.0",

    # Embeddings & Vector Search
    "cocoindex>=0.3.9",
    "sentence-transformers>=3.0.0",
    "lancedb>=0.15.0",

    # Code Analysis
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-rust>=0.21.0",

    # Knowledge Graphs
    "cognee>=0.1.0",
    "graphiti-core>=0.1.0",
    "neo4j>=5.0.0",
    "falkordb>=1.0.0",

    # AI/ML
    "google-adk>=0.1.0",
    "google-genai>=1.0.0",
    "baml-py>=0.74.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sse-starlette>=2.0.0",

    # Crypto/DeFi
    "python-binance>=1.0.0",
    "gql>=3.5.0",

    # Utilities
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    "faker>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
ui = [
    # UI dependencies managed via package.json in ui/
]

[project.scripts]
crypteolas-dagster = "dagster:cli"

# [tool.uv.sources]
# sruth-shared = { workspace = true }  # Disabled until package exists

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "dlt_sources",
    "dagster_assets",
    "cocoindex_flows",
    "knowledge_graph",
    "agents",
    "api",
    "storage",
]

# dg workspace configuration - enables unified workspace loading via dg.toml
[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_assets"
code_location_target_module = "dagster_assets.definitions"
code_location_name = "crypteolas"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "external: marks tests requiring external services",
]
