# Database Configuration for Crypto Analytics Pipeline
# Matches data-tools compose stack services

# =============================================================================
# DUCKDB - Analytics Warehouse
# =============================================================================
duckdb:
  # Local development
  local:
    database: "./data/crypto_analytics.duckdb"
    dataset_name: "crypto_raw"

  # Production (via environment override)
  production:
    database: "${DUCKDB_DATABASE:-./data/crypto_analytics.duckdb}"
    dataset_name: "${DUCKDB_DATASET:-crypto_raw}"

# =============================================================================
# LANCEDB - Vector Store
# =============================================================================
lancedb:
  # Local development
  local:
    uri: "./data/crypto_vectors.lancedb"

  # Production (S3/R2 via FUSE mount from data-tools)
  production:
    uri: "${LANCEDB_URI:-./data/crypto_vectors.lancedb}"

  # Table configurations
  tables:
    documents:
      name: "crypto_documents"
      embedding_dim: 384  # all-MiniLM-L6-v2
      metric: "cosine"

    code:
      name: "crypto_code"
      embedding_dim: 384
      metric: "cosine"

    market_conditions:
      name: "crypto_market_conditions"
      embedding_dim: 384
      metric: "cosine"

# =============================================================================
# MEMGRAPH - Static Knowledge Graph (via Cognee)
# =============================================================================
memgraph:
  # From data-tools compose stack
  host: "${MEMGRAPH_HOST:-localhost}"
  port: "${MEMGRAPH_PORT:-7687}"
  username: "${MEMGRAPH_USER:-}"
  password: "${MEMGRAPH_PASSWORD:-}"

  # Connection settings
  connection:
    max_pool_size: 10
    acquire_timeout: 30

  # Schema initialization
  init_queries:
    - |
      CREATE INDEX ON :Token(symbol);
    - |
      CREATE INDEX ON :Protocol(name);
    - |
      CREATE INDEX ON :Document(title);
    - |
      CREATE INDEX ON :Exchange(name);

# =============================================================================
# FALKORDB - Temporal/Dynamic Graph (via Graphiti)
# =============================================================================
falkordb:
  # From data-tools compose stack
  host: "${FALKORDB_HOST:-localhost}"
  port: "${FALKORDB_PORT:-6379}"
  password: "${FALKORDB_PASSWORD:-}"
  database: "${FALKORDB_DATABASE:-crypto_temporal}"

  # Graphiti group for namespace isolation
  graphiti_group_id: "crypto_main"

# =============================================================================
# POSTGRESQL - Control Plane
# =============================================================================
postgresql:
  # From data-tools compose stack
  host: "${POSTGRES_HOST:-localhost}"
  port: "${POSTGRES_PORT:-5432}"
  database: "${POSTGRES_DB:-control_plane}"
  username: "${POSTGRES_USER:-postgres}"
  password: "${POSTGRES_PASSWORD}"

  # Pipeline metadata schema
  metadata_schema: "pipeline_metadata"

  # Tables for pipeline tracking
  tables:
    ingestion_runs:
      name: "ingestion_runs"
      columns:
        - "run_id UUID PRIMARY KEY"
        - "source_id VARCHAR NOT NULL"
        - "started_at TIMESTAMPTZ DEFAULT NOW()"
        - "completed_at TIMESTAMPTZ"
        - "status VARCHAR"
        - "records_processed INTEGER"
        - "error_message TEXT"

    source_state:
      name: "source_state"
      columns:
        - "source_id VARCHAR PRIMARY KEY"
        - "last_cursor VARCHAR"
        - "last_run_at TIMESTAMPTZ"
        - "next_run_at TIMESTAMPTZ"

# =============================================================================
# COGNEE - Knowledge Graph Orchestration
# =============================================================================
cognee:
  # From data-tools compose stack (profile: cognee)
  api_url: "${COGNEE_API_URL:-http://localhost:8001}"

  # Backend configuration (passed to Cognee)
  graph_provider: "memgraph"
  vector_provider: "lancedb"

  # LLM configuration
  llm_provider: "${COGNEE_LLM_PROVIDER:-openai}"
  llm_model: "${COGNEE_LLM_MODEL:-gpt-4o-mini}"

# =============================================================================
# GRAPHITI - Temporal Knowledge Graph
# =============================================================================
graphiti:
  # MCP Server (from data-tools compose stack)
  mcp_url: "${GRAPHITI_MCP_URL:-http://localhost:8000}"

  # REST API (from data-tools compose stack)
  api_url: "${GRAPHITI_API_URL:-http://localhost:8003}"

  # Configuration
  group_id: "${GRAPHITI_GROUP_ID:-crypto_main}"

  # LLM for entity extraction
  llm_provider: "openai"
  llm_model: "gpt-4o-mini"

# =============================================================================
# FILESYSTEM - Raw Data Storage
# =============================================================================
filesystem:
  # Local development
  local:
    bucket_url: "file://./data/raw"
    layout: "{table_name}/{load_id}.{file_id}.{ext}"

  # Production (Cloudflare R2)
  production:
    bucket_url: "s3://${S3_BUCKET:-crypto-raw-data}"
    layout: "{table_name}/year={year}/month={month}/{load_id}.{file_id}.{ext}"
    credentials:
      aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
      aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
      endpoint_url: "${AWS_ENDPOINT_URL}"
      region: "${AWS_REGION:-auto}"

# =============================================================================
# DESTINATION SWITCHING
# =============================================================================
# Use environment variable to switch destinations:
# DESTINATION_TYPE=duckdb | filesystem | motherduck

destinations:
  default: "duckdb"

  duckdb:
    type: "duckdb"
    config_key: "duckdb.local"

  filesystem:
    type: "filesystem"
    config_key: "filesystem.local"

  motherduck:
    type: "motherduck"
    database: "${MOTHERDUCK_DATABASE:-crypto_analytics}"
    token: "${MOTHERDUCK_TOKEN}"
