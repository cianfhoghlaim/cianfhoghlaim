[project]
name = "tuath"
version = "0.1.0"
description = "Celtic Educational MMO + Crypto Platform - Language learning, mythology, Babylon.js game engine, x402 micropayments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BUSL-1.1" }

dependencies = [
    # Data Loading
    "dlt[duckdb,parquet]>=1.0.0",
    "firecrawl-py>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",

    # Orchestration
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "dagster-dlt>=0.26.0",

    # Embeddings & Vector Search
    "cocoindex>=0.3.9",
    "sentence-transformers>=3.0.0",
    "lancedb>=0.15.0",

    # Geospatial
    "geopandas>=1.0.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.1.0",
    "h3>=4.0.0",
    "shapely>=2.0.0",

    # Knowledge Graphs
    "cognee>=0.1.0",
    "neo4j>=5.0.0",

    # AI/ML - Celtic Language Support
    "google-adk>=0.1.0",
    "google-genai>=1.0.0",
    "baml-py>=0.74.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sse-starlette>=2.0.0",

    # Authentication & Payments
    "siwe>=4.0.0",
    "eth-account>=0.11.0",
    "web3>=6.0.0",

    # MCP Server
    "mcp>=1.0.0",

    # Utilities
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
ui = [
    # UI dependencies managed via package.json in ui/
]
game = [
    # Game client dependencies managed via package.json in game/client/
]

[project.scripts]
tuath-dagster = "dagster:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ============================================================================
# UV Workspace — this package is a member of the root cianfhoghlaim workspace.
# ============================================================================
[tool.uv]
package = true

[tool.uv.sources]
codeolas = { workspace = true }
sruth-browser = { workspace = true }
oideachais = { workspace = true }
tuath = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = [
    "dlt_sources",
    "dagster_assets",
    "cocoindex_flows",
    "knowledge_graph",
    "agents",
    "api",
    "storage",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
