[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuatha"
version = "0.1.0"
description = "The British Isles Formative Assessment MMO — the canonical implementation of the cianfhoghlaim-educational-mmo spec"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Cian Mac an Déisigh Uí Liatháin", email = "cian@cianfhoghlaim.ie" },
]
keywords = [
    "education",
    "ncca",
    "leaving-certificate",
    "british-isles",
    "formative-assessment",
    "adk",
    "baml",
    "dlt",
    "dagster",
    "cocoindex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
]
dependencies = [
    # The BAML client (auto-generated by the baml:generate codegen step)
    "baml-py>=0.210",
    # The Google ADK framework
    "google-adk>=1.10",
    # The Cognee + Graphiti + LanceDB + Letta memory stack
    "cognee>=0.3",
    "graphiti-core>=0.30",
    "lancedb>=0.20",
    "letta>=0.20",
    # The LiteLLM gateway
    "litellm>=1.50",
    # The DLT + Dagster + CocoIndex pipeline stack
    "dlt>=1.4",
    "dagster>=1.10",
    "cocoindex>=0.3",
    # The Langfuse + MLflow + RAGAS observability stack
    "langfuse>=3.0",
    "mlflow>=2.20",
    "ragas>=0.3",
    # The Hono + Convex + TanStack Start + CopilotKit web stack
    "hono>=4.0",
    "pyconvex>=0.5",
    "copilotkit>=0.10",
    # The Pydantic v2 base models
    "pydantic>=2.10",
    # The dotenv + structlog
    "python-dotenv>=1.0",
    "structlog>=24.0",
    # The websockets + HTTP client
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hatchling>=1.25",
    "build>=1.2",
    "twine>=5.0",
    "pre-commit>=4.0",
]
baml = [
    "baml-py>=0.210",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings>=0.25",
    "mkdocstrings-python>=1.10",
]

[project.urls]
Homepage = "https://github.com/cianmacandeisigh/tuatha"
Documentation = "https://github.com/cianmacandeisigh/tuatha#readme"
Repository = "https://github.com/cianmacandeisigh/tuatha"
Issues = "https://github.com/cianmacandeisigh/tuatha/issues"
Changelog = "https://github.com/cianmacandeisigh/tuatha/releases"

[tool.hatch.build.targets.wheel]
packages = ["tuatha"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tuatha", "tests"]
extend-exclude = [
    "tuatha/old",
    "tuatha/baml/.baml_client",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # do-not-perform-function-calls-in-argument-defaults
    "RUF012",  # mutable-class-default-attribute
    "SIM108",  # use ternary operator
    "SIM117",  # combine-with-statement
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests as integration tests (require a live stack)",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
branch = true
source = ["tuatha"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AssertionError",
    "pass",
]
show_missing = true
fail_under = 80
