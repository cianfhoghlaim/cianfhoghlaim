[profile.default]
src = "."
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false

# Remappings for OpenZeppelin contracts (if used in the future)
# remappings = [
#     "@openzeppelin/=lib/openzeppelin-contracts/",
# ]

[fmt]
line_length = 100
tab_width = 4
quote_style = "double"

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base_mainnet = "https://mainnet.base.org"

# Default profile for Base L2 testnet deployment
[etherscan]
base_sepolia = {key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api"}
base_mainnet = {key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api"}