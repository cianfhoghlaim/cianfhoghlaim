# =============================================================================
# CI WORKFLOW - Validate Infrastructure and Pipeline Configuration
# =============================================================================
# Runs on every push and pull request to validate compose files, configs, and flows

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'bonneagar/**'
      - 'sruth/**'
      - '.forgejo/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'bonneagar/**'
      - 'sruth/**'
      - '.forgejo/workflows/**'

jobs:
  lint-compose:
    name: Validate Docker Compose Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate storage compose files
        run: |
          echo "Validating storage compose files..."
          for dir in bonneagar/storage/*/; do
            if [ -f "$dir/compose.yaml" ]; then
              echo "Validating $dir/compose.yaml"
              docker compose -f "$dir/compose.yaml" config --quiet || echo "Warning: $dir/compose.yaml has issues"
            fi
          done

      - name: Validate uirlisi compose files
        run: |
          echo "Validating uirlisi compose files..."
          for dir in bonneagar/uirlisi/*/; do
            if [ -f "$dir/compose.yaml" ]; then
              echo "Validating $dir/compose.yaml"
              docker compose -f "$dir/compose.yaml" config --quiet || echo "Warning: $dir/compose.yaml has issues"
            fi
          done

  lint-toml:
    name: Validate TOML Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gunzip > taplo
          chmod +x taplo
          sudo mv taplo /usr/local/bin/

      - name: Validate Komodo TOML files
        run: |
          echo "Validating Komodo TOML files..."
          find bonneagar/komodo -name "*.toml" -exec taplo format --check {} \;

  lint-yaml:
    name: Validate YAML Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          echo "Linting YAML files..."
          yamllint -c .yamllint.yml bonneagar/ || true

  validate-sruth-shared:
    name: Validate sruth-shared Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Validate pyproject.toml
        working-directory: sruth/shared
        run: |
          echo "Checking pyproject.toml syntax..."
          python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"

      - name: Build package
        working-directory: sruth/shared
        run: |
          echo "Building sruth-shared package..."
          uv build
          ls -la dist/

      - name: Validate package metadata
        working-directory: sruth/shared
        run: |
          echo "Checking package metadata..."
          uv pip install twine
          twine check dist/*
