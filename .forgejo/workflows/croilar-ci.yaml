# =============================================================================
# CROILAR CI — Forgejo Actions workflow for the croilar monorepo subproject
# =============================================================================
# Triggers on push to main and on pull requests touching the croilar/ tree.
# Runs polyglot validation: TypeScript (bun) + Python (uv) in parallel.
# =============================================================================

name: Croilar CI

on:
  push:
    branches: [main]
    paths:
      - "croilar/**"
      - "pyproject.toml"
      - "package.json"
      - "turbo.json"
  pull_request:
    paths:
      - "croilar/**"

jobs:

  typescript:
    name: TypeScript — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck (croilar web)
        working-directory: croilar
        run: bun run typecheck

      - name: Build (croilar web)
        working-directory: croilar
        run: bun run build

      - name: Typecheck (croilar portal)
        working-directory: croilar/portal
        run: bun run typecheck

  python:
    name: Python — lint + dagster import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check croilar/ --select E,F,I,W

      - name: Verify Dagster definitions load
        working-directory: croilar
        run: uv run python -c "from definitions import defs; print('OK:', len(defs.get_all_asset_keys()), 'assets')"

  docker:
    name: Docker — validate compose configs
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v4

      - name: Validate croilar-web stack
        run: docker compose -f infrastructure/stacks/engineering/croilar-web/compose.yaml -f infrastructure/stacks/engineering/croilar-web/sidecar.yaml --env-file infrastructure/stacks/engineering/croilar-web/.env.example config --quiet

      - name: Validate croilar-dagster stack
        run: docker compose -f infrastructure/stacks/engineering/croilar-dagster/compose.yaml -f infrastructure/stacks/engineering/croilar-dagster/sidecar.yaml --env-file infrastructure/stacks/engineering/croilar-dagster/.env.example config --quiet

      - name: Validate croilar-marimo stack
        run: docker compose -f infrastructure/stacks/engineering/croilar-marimo/compose.yaml -f infrastructure/stacks/engineering/croilar-marimo/sidecar.yaml --env-file infrastructure/stacks/engineering/croilar-marimo/.env.example config --quiet
