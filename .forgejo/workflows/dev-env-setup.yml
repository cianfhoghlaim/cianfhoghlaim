# =============================================================================
# DEV ENVIRONMENT SETUP WORKFLOW
# =============================================================================
# Automates PocketID + Forgejo OIDC configuration for reproducible dev environments.
#
# Modes:
#   - preflight: Check all services are healthy
#   - setup: Create OAuth clients and configure Forgejo (requires tokens)
#   - verify: Test OIDC flow works end-to-end
#   - teardown: Remove OAuth clients and auth sources
#
# First-time setup requires human-in-loop for PocketID passkey registration.
# See: bonneagar/dagger/src/dev-environment.ts for implementation details.

name: Dev Environment Setup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: preflight, setup, verify, or teardown'
        required: true
        type: choice
        options:
          - preflight
          - setup
          - verify
          - teardown
        default: preflight
      domain:
        description: 'Target domain (e.g., cianfhoghlaim.ie)'
        required: true
        type: string
      vault:
        description: '1Password vault name'
        required: false
        type: string
        default: 'dev-baile'
      dry_run:
        description: 'Dry run (no changes made)'
        required: false
        type: boolean
        default: false

env:
  DAGGER_VERSION: "0.15.1"
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # Pre-flight: Health check all services
  # ============================================================================
  preflight:
    name: Pre-flight Health Checks
    runs-on: ubuntu-latest
    if: ${{ inputs.mode == 'preflight' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PocketID health
        run: |
          echo "Checking PocketID at https://auth.${{ inputs.domain }}"
          curl -sf "https://auth.${{ inputs.domain }}/.well-known/openid-configuration" | jq .
        continue-on-error: true

      - name: Check Forgejo health
        run: |
          echo "Checking Forgejo at https://git.${{ inputs.domain }}"
          curl -sf "https://git.${{ inputs.domain }}/api/v1/version" | jq .
        continue-on-error: true

      - name: Check TinyAuth health
        run: |
          echo "Checking TinyAuth at https://tinyauth.${{ inputs.domain }}"
          curl -sf "https://tinyauth.${{ inputs.domain }}/health" || echo "TinyAuth health endpoint not available"
        continue-on-error: true

      - name: Check Komodo health
        run: |
          echo "Checking Komodo at https://komodo.${{ inputs.domain }}"
          curl -sf "https://komodo.${{ inputs.domain }}/health" || echo "Komodo health endpoint not available"
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Pre-flight Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Domain: \`${{ inputs.domain }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If all services are healthy, you can proceed with the \`setup\` mode." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**First-time setup?** Before running setup, you need to:" >> $GITHUB_STEP_SUMMARY
          echo "1. Visit https://auth.${{ inputs.domain }}/setup" >> $GITHUB_STEP_SUMMARY
          echo "2. Create admin account and register passkey" >> $GITHUB_STEP_SUMMARY
          echo "3. Generate API token in PocketID admin UI" >> $GITHUB_STEP_SUMMARY
          echo "4. Store token in 1Password: \`op item create --vault ${{ inputs.vault }} pocketid api_token=<token>\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Setup: Create OAuth clients and configure Forgejo
  # ============================================================================
  setup:
    name: Setup OAuth Clients
    runs-on: ubuntu-latest
    if: ${{ inputs.mode == 'setup' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
          sudo mv ./bin/dagger /usr/local/bin/dagger
          dagger version

      - name: Install Dagger module dependencies
        working-directory: bonneagar/dagger
        run: npm install

      - name: Run DevEnvironment bootstrap
        working-directory: bonneagar/dagger
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
          POCKETID_TOKEN: ${{ secrets.POCKETID_TOKEN }}
          FORGEJO_ADMIN_TOKEN: ${{ secrets.FORGEJO_ADMIN_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run=true"
          else
            DRY_RUN_FLAG="--dry-run=false"
          fi

          dagger call dev-environment \
            --domain="${{ inputs.domain }}" \
            --vault="${{ inputs.vault }}" \
            --op-connect-host="https://op.${{ inputs.domain }}" \
            bootstrap \
            --op-connect-token=env:OP_CONNECT_TOKEN \
            --pocket-id-token=env:POCKETID_TOKEN \
            --forgejo-token=env:FORGEJO_ADMIN_TOKEN \
            $DRY_RUN_FLAG

      - name: Setup Summary
        if: success()
        run: |
          echo "## Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Domain: \`${{ inputs.domain }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Dry run: \`${{ inputs.dry_run }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "OAuth clients created for:" >> $GITHUB_STEP_SUMMARY
          echo "- TinyAuth" >> $GITHUB_STEP_SUMMARY
          echo "- Forgejo" >> $GITHUB_STEP_SUMMARY
          echo "- Komodo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run \`verify\` mode to test the OIDC flow." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Verify: Test OIDC flow
  # ============================================================================
  verify:
    name: Verify OIDC Flow
    runs-on: ubuntu-latest
    if: ${{ inputs.mode == 'verify' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test OIDC Discovery
        run: |
          echo "Testing OIDC discovery endpoint..."
          curl -sf "https://auth.${{ inputs.domain }}/.well-known/openid-configuration" | jq .

      - name: Test Forgejo OAuth Redirect
        run: |
          echo "Testing Forgejo OAuth redirect to PocketID..."
          REDIRECT_URL=$(curl -sf -w "%{redirect_url}" -o /dev/null "https://git.${{ inputs.domain }}/user/oauth2/pocketid")
          echo "Redirect URL: $REDIRECT_URL"
          if echo "$REDIRECT_URL" | grep -q "auth.${{ inputs.domain }}"; then
            echo "✅ Forgejo correctly redirects to PocketID"
          else
            echo "❌ Forgejo does not redirect to PocketID"
            exit 1
          fi

      - name: Test TinyAuth Health
        run: |
          echo "Testing TinyAuth..."
          curl -sf "https://tinyauth.${{ inputs.domain }}/health" || echo "TinyAuth health check unavailable"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
          sudo mv ./bin/dagger /usr/local/bin/dagger

      - name: Install Dagger module dependencies
        working-directory: bonneagar/dagger
        run: npm install

      - name: Run full OIDC verification
        working-directory: bonneagar/dagger
        run: |
          dagger call dev-environment \
            --domain="${{ inputs.domain }}" \
            --vault="${{ inputs.vault }}" \
            --op-connect-host="https://op.${{ inputs.domain }}" \
            verify-oidc-flow \
            --service-url="https://git.${{ inputs.domain }}"

      - name: Verification Summary
        if: success()
        run: |
          echo "## Verification Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Domain: \`${{ inputs.domain }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ OIDC discovery endpoint accessible" >> $GITHUB_STEP_SUMMARY
          echo "✅ Forgejo redirects to PocketID for OAuth" >> $GITHUB_STEP_SUMMARY
          echo "✅ TinyAuth health check passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The dev environment is ready for use!" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Teardown: Remove OAuth clients and auth sources
  # ============================================================================
  teardown:
    name: Teardown OAuth Configuration
    runs-on: ubuntu-latest
    if: ${{ inputs.mode == 'teardown' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
          sudo mv ./bin/dagger /usr/local/bin/dagger

      - name: Install Dagger module dependencies
        working-directory: bonneagar/dagger
        run: npm install

      - name: Confirm teardown
        if: ${{ inputs.dry_run == false }}
        run: |
          echo "⚠️ WARNING: This will remove all OAuth clients and Forgejo auth sources!"
          echo "If you want to preview changes, use dry_run=true"

      - name: Run teardown
        working-directory: bonneagar/dagger
        env:
          POCKETID_TOKEN: ${{ secrets.POCKETID_TOKEN }}
        run: |
          CONFIRM="false"
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            CONFIRM="true"
          fi

          dagger call dev-environment \
            --domain="${{ inputs.domain }}" \
            --vault="${{ inputs.vault }}" \
            --op-connect-host="https://op.${{ inputs.domain }}" \
            teardown \
            --pocket-id-token=env:POCKETID_TOKEN \
            --confirm=$CONFIRM

      - name: Teardown Summary
        run: |
          echo "## Teardown Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Domain: \`${{ inputs.domain }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Dry run: \`${{ inputs.dry_run }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "This was a dry run. No changes were made." >> $GITHUB_STEP_SUMMARY
          else
            echo "OAuth clients and Forgejo auth sources have been removed." >> $GITHUB_STEP_SUMMARY
          fi
