# =============================================================================
# BUILD ANSIBLE EXECUTION ENVIRONMENT - Multi-Architecture
# =============================================================================
# Builds ARM64 + AMD64 compatible Ansible EE for Komodo deployments.
# Pushes to Forgejo container registry at git.cianfhoghlaim.ie
#
# Triggers:
#   - Push to main branch (only ee-builder changes)
#   - Manual workflow dispatch

name: Build Ansible EE

on:
  push:
    branches: [main]
    paths:
      - 'bonneagar/uirlisí/ansible/ee-builder/**'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to registry'
        required: false
        default: 'true'
        type: boolean

env:
  REGISTRY: git.cianfhoghlaim.ie
  IMAGE_NAME: cliste/ansible-komodo-ee

jobs:
  build:
    name: Build Multi-Arch Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Registry
        if: github.event.inputs.push != 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: bonneagar/uirlisí/ansible/ee-builder
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
