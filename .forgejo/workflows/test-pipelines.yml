# =============================================================================
# SRUTH PIPELINE TESTS
# =============================================================================
# Test all sruth data pipelines with MCP integration tests.
#
# Pipelines: oideachais, crypteolas, tuath, códeolas, browser, taighde, aleyum
# =============================================================================

name: Test Sruth Pipelines

on:
  push:
    paths:
      - 'sruth/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'sruth/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline to test (all, oideachais, crypteolas, etc.)'
        required: false
        default: 'all'
      run_mcp_tests:
        description: 'Run MCP integration tests'
        required: false
        default: 'true'

env:
  PYTHON_VERSION: '3.12'
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ---------------------------------------------------------------------------
  # OIDEACHAIS - Education Pipeline
  # ---------------------------------------------------------------------------
  test-oideachais:
    name: Test Oideachais
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'oideachais' || github.event.inputs.pipeline == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('sruth/oideachais/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          cd sruth/oideachais
          uv sync --dev

      - name: Run tests
        run: |
          cd sruth/oideachais
          uv run pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: sruth/oideachais/coverage.xml
          flags: oideachais
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # CRYPTEOLAS - Crypto Pipeline
  # ---------------------------------------------------------------------------
  test-crypteolas:
    name: Test Crypteolas
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'crypteolas' || github.event.inputs.pipeline == '' }}

    services:
      memgraph:
        image: memgraph/memgraph:latest
        ports:
          - 7687:7687
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd sruth/crypteolas
          uv sync --dev

      - name: Run tests
        env:
          MEMGRAPH_URL: bolt://localhost:7687
          DRAGONFLY_URL: redis://localhost:6379
        run: |
          cd sruth/crypteolas
          uv run pytest tests/ -v --cov=. --cov-report=xml

  # ---------------------------------------------------------------------------
  # TUATH - Gaming Pipeline
  # ---------------------------------------------------------------------------
  test-tuath:
    name: Test Tuath
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'tuath' || github.event.inputs.pipeline == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd sruth/tuath
          uv sync --dev

      - name: Run tests
        run: |
          cd sruth/tuath
          uv run pytest tests/ -v --cov=. --cov-report=xml

  # ---------------------------------------------------------------------------
  # CÓDEOLAS - Code Intelligence Pipeline
  # ---------------------------------------------------------------------------
  test-codeolas:
    name: Test Códeolas
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'codeolas' || github.event.inputs.pipeline == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd sruth/códeolas
          uv sync --dev

      - name: Run tests
        run: |
          cd sruth/códeolas
          uv run pytest tests/ -v --cov=. --cov-report=xml

  # ---------------------------------------------------------------------------
  # BROWSER - Web Scraping Pipeline
  # ---------------------------------------------------------------------------
  test-browser:
    name: Test Browser
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'browser' || github.event.inputs.pipeline == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Playwright
        run: |
          cd sruth/browser
          uv sync --dev
          uv run playwright install chromium

      - name: Run tests
        run: |
          cd sruth/browser
          uv run pytest tests/ -v --cov=. --cov-report=xml

  # ---------------------------------------------------------------------------
  # TAIGHDE - Research Pipeline
  # ---------------------------------------------------------------------------
  test-taighde:
    name: Test Taighde
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'taighde' || github.event.inputs.pipeline == '' }}

    services:
      memgraph:
        image: memgraph/memgraph:latest
        ports:
          - 7687:7687

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd sruth/taighde
          uv sync --dev

      - name: Run tests
        env:
          MEMGRAPH_URL: bolt://localhost:7687
        run: |
          cd sruth/taighde
          uv run pytest tests/ -v --cov=. --cov-report=xml

  # ---------------------------------------------------------------------------
  # ALEYUM - Music Pipeline
  # ---------------------------------------------------------------------------
  test-aleyum:
    name: Test Aleyum
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.pipeline == 'all' || github.event.inputs.pipeline == 'aleyum' || github.event.inputs.pipeline == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd sruth/aleyum
          uv sync --dev
          npm install

      - name: Run Python tests
        run: |
          cd sruth/aleyum
          uv run pytest tests/ -v --cov=. --cov-report=xml

      - name: Run TypeScript tests
        run: |
          cd sruth/aleyum
          npm test || true  # Don't fail if no TS tests

  # ---------------------------------------------------------------------------
  # MCP INTEGRATION TESTS
  # ---------------------------------------------------------------------------
  test-mcp-integration:
    name: MCP Integration Tests
    runs-on: ubuntu-latest
    needs:
      - test-oideachais
      - test-crypteolas
      - test-tuath
      - test-codeolas
      - test-browser
      - test-taighde
      - test-aleyum
    if: ${{ always() && github.event.inputs.run_mcp_tests != 'false' }}

    services:
      memgraph:
        image: memgraph/memgraph:latest
        ports:
          - 7687:7687
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install root dependencies
        run: uv sync --dev

      - name: Run MCP health checks
        env:
          MEMGRAPH_BOLT_URL: bolt://localhost:7687
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
        run: |
          uv run python tests/mcp/health_check.py || true

      - name: Run integration tests
        env:
          MEMGRAPH_URL: bolt://localhost:7687
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          DRAGONFLY_URL: redis://localhost:6379
        run: |
          uv run pytest tests/integration/ -v -m "integration" --cov=. --cov-report=xml

      - name: Upload integration coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: integration
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # CROSS-PIPELINE TESTS
  # ---------------------------------------------------------------------------
  test-cross-pipeline:
    name: Cross-Pipeline Tests
    runs-on: ubuntu-latest
    needs: test-mcp-integration
    if: always()

    services:
      memgraph:
        image: memgraph/memgraph:latest
        ports:
          - 7687:7687
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run cross-pipeline tests
        env:
          MEMGRAPH_URL: bolt://localhost:7687
          QDRANT_HOST: localhost
        run: |
          uv run pytest tests/integration/test_cross_pipeline.py -v

  # ---------------------------------------------------------------------------
  # SUMMARY
  # ---------------------------------------------------------------------------
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - test-oideachais
      - test-crypteolas
      - test-tuath
      - test-codeolas
      - test-browser
      - test-taighde
      - test-aleyum
      - test-mcp-integration
      - test-cross-pipeline
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Pipeline Test Results:"
          echo "======================"
          echo "Oideachais: ${{ needs.test-oideachais.result }}"
          echo "Crypteolas: ${{ needs.test-crypteolas.result }}"
          echo "Tuath: ${{ needs.test-tuath.result }}"
          echo "Códeolas: ${{ needs.test-codeolas.result }}"
          echo "Browser: ${{ needs.test-browser.result }}"
          echo "Taighde: ${{ needs.test-taighde.result }}"
          echo "Aleyum: ${{ needs.test-aleyum.result }}"
          echo "MCP Integration: ${{ needs.test-mcp-integration.result }}"
          echo "Cross-Pipeline: ${{ needs.test-cross-pipeline.result }}"

      - name: Fail if any test failed
        if: |
          needs.test-oideachais.result == 'failure' ||
          needs.test-crypteolas.result == 'failure' ||
          needs.test-tuath.result == 'failure' ||
          needs.test-codeolas.result == 'failure' ||
          needs.test-browser.result == 'failure' ||
          needs.test-taighde.result == 'failure' ||
          needs.test-aleyum.result == 'failure'
        run: exit 1
