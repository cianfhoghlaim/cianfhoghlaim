# =============================================================================
# RENOVATE WORKFLOW - Automated Dependency Updates
# =============================================================================
# Runs Renovate Bot to keep Docker images and dependencies up to date

name: Renovate

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run mode'
        required: false
        default: 'false'
        type: boolean

env:
  LOG_LEVEL: info
  RENOVATE_PLATFORM: gitea
  RENOVATE_ENDPOINT: https://git.cianfhoghlaim.ie/api/v1

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v40
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
