name: cognee-ingest

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Cognee domain to ingest (standards, data-platform, agents, ai-ml, web, product, architecture). Leave blank for all."
        type: string
        default: ""
      no_cognify:
        description: "Skip cognify() phase"
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * 0"

jobs:
  ingest:
    name: Ingest canonical docs into Cognee
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"

      - name: Install Python dependencies
        run: |
          uv venv --python 3.12
          uv pip install requests pendulum python-dotenv

      - name: Validate ingestion plan
        run: |
          uv run python infrastructure/scripts/cognee-ingest-docs.py --dry-run --all 2>&1 | head -40

      - name: Run Cognee ingestion
        env:
          COGNEE_API_URL: ${{ secrets.COGNEE_API_URL }}
          COGNEE_API_KEY: ${{ secrets.COGNEE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.domain }}" ]; then
            ARGS+=(--domain "${{ inputs.domain }}")
          else
            ARGS+=(--all)
          fi
          if [ "${{ inputs.no_cognify }}" = "true" ]; then
            ARGS+=(--no-cognify)
          fi
          uv run python infrastructure/scripts/cognee-ingest-docs.py "${ARGS[@]}" 2>&1 | tee cognee-ingest.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognee-ingest-log
          path: cognee-ingest.log
          retention-days: 14
