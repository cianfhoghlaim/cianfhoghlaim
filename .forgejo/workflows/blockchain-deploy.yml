# Blockchain Deployment Workflow
# Manual trigger for deploying to testnets

name: Blockchain Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        options:
          - spacetimedb
          - solana-devnet
          - base-sepolia
          - all
      module:
        description: 'Module to deploy (for SpacetimeDB)'
        required: false
        default: 'tuath-game'
      dry_run:
        description: 'Dry run (build only)'
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    outputs:
      wasm_built: ${{ steps.build-wasm.outcome }}
      solana_built: ${{ steps.build-solana.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.83"
          targets: wasm32-unknown-unknown

      - name: Build SpacetimeDB WASM
        id: build-wasm
        if: inputs.target == 'spacetimedb' || inputs.target == 'all'
        run: |
          cargo build --target wasm32-unknown-unknown --release \
            -p tuath-game \
            -p crypteolas-sync

      - name: Upload WASM
        if: steps.build-wasm.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-modules
          path: target/wasm32-unknown-unknown/release/*.wasm

      # Solana build requires Anchor container
      - name: Build Solana programs
        id: build-solana
        if: inputs.target == 'solana-devnet' || inputs.target == 'all'
        run: |
          echo "Solana build would run in Anchor container"
          # In production, use Docker or Dagger for Anchor builds

  deploy-spacetimedb:
    name: Deploy to SpacetimeDB
    runs-on: ubuntu-latest
    needs: build
    if: (inputs.target == 'spacetimedb' || inputs.target == 'all') && !inputs.dry_run
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm-modules
          path: ./wasm

      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh
          echo "$HOME/.spacetimedb/bin" >> $GITHUB_PATH

      - name: Deploy module
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
        run: |
          spacetime publish \
            --host ${{ vars.SPACETIMEDB_HOST }} \
            --database ${{ inputs.module }} \
            ./wasm/${{ inputs.module }}.wasm

  deploy-solana:
    name: Deploy to Solana Devnet
    runs-on: ubuntu-latest
    needs: build
    if: (inputs.target == 'solana-devnet' || inputs.target == 'all') && !inputs.dry_run
    steps:
      - uses: actions/checkout@v4

      - name: Setup Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_DEPLOY_KEYPAIR }}
        run: |
          mkdir -p ~/.config/solana
          echo "$SOLANA_KEYPAIR" > ~/.config/solana/id.json
          solana config set --url devnet

      - name: Deploy program
        run: |
          echo "Solana deployment would happen here"
          solana balance

  deploy-ethereum:
    name: Deploy to Base Sepolia
    runs-on: ubuntu-latest
    needs: build
    if: (inputs.target == 'base-sepolia' || inputs.target == 'all') && !inputs.dry_run
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Deploy contracts
        env:
          PRIVATE_KEY: ${{ secrets.ETH_DEPLOY_PRIVATE_KEY }}
          RPC_URL: ${{ vars.BASE_SEPOLIA_RPC_URL }}
        run: |
          echo "Ethereum deployment would happen here"
          # forge script script/Deploy.s.sol --rpc-url $RPC_URL --broadcast

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-spacetimedb, deploy-solana, deploy-ethereum]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SpacetimeDB | ${{ needs.deploy-spacetimedb.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Solana Devnet | ${{ needs.deploy-solana.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base Sepolia | ${{ needs.deploy-ethereum.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
