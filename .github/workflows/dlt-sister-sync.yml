name: dlt-sister-sync

# Per the 2026-08-24-dlt-sources-to-multi-repo-scaffold-v1 change
# (Phase 2.3 — per-PR reciprocal mirror workflow).
#
# This is the canonical REUSABLE workflow definition. It lives in
# cianfhoghlaim's `.github/workflows/` so sister repos (ciandlithe +
# cianchosaint, future: ciancheiltis + cianleighis + bonneagar +
# meaisinfhoghlaim) can call it via `uses:` from their own
# `.github/workflows/dlt-sister-sync-call.yml` (the call site).
#
# TRIGGER MODEL
# -------------
# This reusable workflow does NOT run on its own. It is `workflow_call`-only.
# Sister repos invoke it via the call site. The reciprocal PR is opened
# from the cianfhoghlaim workflow run on the sister-repo branch.
#
# FLOW
# ----
# 1. Sister repo's call site fires on PR/push to `<vertical>/...`
# 2. Sister passes:
#      - sister-repo (the source repo name, e.g. "ciandlithe")
#      - changed-files (a JSON manifest of changed paths in the sister)
#      - source-pr (the sister PR number)
#      - source-sha (the sister commit SHA)
#      - source-branch (the sister branch)
# 3. This workflow:
#      (a) Computes the reciprocal path under
#          `dlt_sources/_sister_refs/<sister-repo>/<original-path>`
#      (b) Opens a PR on cianfhoghlaim via `gh api` with:
#          - title:  `dlt:sister-sync(<sister-repo>): <original-path>`
#          - body:   References the sister PR number + commit SHA + the
#                    openspec change (this one)
#          - labels: `dlt-sister-sync`, `auto-mirror`
#      (c) Triggers the `mise run dlt:smoke-all` gate on cianfhoghlaim
#          (via `workflow_run` on the reciprocal PR's `pull_request`)
#      (d) Passes the macOS sed target per v2 plan §A (Phase 2.3):
#          the reciprocal PR runs the BSD sed migration if any
#          legacy ISO-3 imports cross the mirror boundary
#
# INPUTS
# ------
# - sister-repo    : the source sister repo (e.g. "ciandlithe")
# - changed-files  : JSON manifest of changed paths
# - source-pr      : the sister PR number (integer)
# - source-sha     : the sister commit SHA
# - source-branch  : the sister branch
# - target-branch  : the cianfhoghlaim branch (default: main)
# - dry-run        : when true, log the PR payload but do not POST
#
# OUTPUTS
# -------
# - reciprocal-pr-number : the cianfhoghlaim PR number opened
# - reciprocal-pr-url    : the cianfhoghlaim PR URL

on:
  workflow_call:
    inputs:
      sister-repo:
        description: "The source sister repo name (e.g. ciandlithe, cianchosaint)"
        required: true
        type: string
      changed-files:
        description: "JSON manifest of changed paths in the sister repo"
        required: true
        type: string
      source-pr:
        description: "The sister repo PR number"
        required: false
        type: string
        default: "0"
      source-sha:
        description: "The sister repo commit SHA"
        required: false
        type: string
        default: ""
      source-branch:
        description: "The sister repo branch"
        required: false
        type: string
        default: "main"
      target-branch:
        description: "The cianfhoghlaim branch to open the reciprocal PR against"
        required: false
        type: string
        default: "main"
      dry-run:
        description: "When true, log the PR payload but do not POST"
        required: false
        type: boolean
        default: false
      macos-sed-target:
        description: "macOS sed target platform identifier (per v2 plan §A)"
        required: false
        type: string
        default: "darwin-bsd-sed"
    outputs:
      reciprocal-pr-number:
        description: "The cianfhoghlaim reciprocal PR number"
        value: ${{ jobs.reciprocal-pr.outputs.pr-number }}
      reciprocal-pr-url:
        description: "The cianfhoghlaim reciprocal PR URL"
        value: ${{ jobs.reciprocal-pr.outputs.pr-url }}
      per-file-count:
        description: "The number of mirrored files in the reciprocal PR"
        value: ${{ jobs.reciprocal-pr.outputs.per-file-count }}

jobs:
  compute-paths:
    name: Compute reciprocal paths
    runs-on: ubuntu-latest
    outputs:
      paths-json: ${{ steps.compute.outputs.paths-json }}
      per-file-count: ${{ steps.compute.outputs.per-file-count }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        name: Compute dlt_sources/_sister_refs/<sister-repo>/... reciprocal paths
        env:
          CHANGED_FILES_INPUT: ${{ inputs.changed-files }}
          SISTER_REPO: ${{ inputs.sister-repo }}
        run: |
          set -euo pipefail
          echo "changed-files input:"
          echo "$CHANGED_FILES_INPUT" | head -5

          python3 <<'PYEOF'
          import json, os, pathlib, sys
          changed_files = json.loads(os.environ["CHANGED_FILES_INPUT"])
          sister_repo = os.environ["SISTER_REPO"]
          reciprocal_paths = []
          for f in changed_files:
              # Mirror path: dlt_sources/_sister_refs/<sister-repo>/<original-path>
              # Preserve directory structure (excluding the leading dlt_sources/ if any)
              rel = f
              if rel.startswith("dlt_sources/"):
                  rel = rel[len("dlt_sources/"):]
              reciprocal = f"dlt_sources/_sister_refs/{sister_repo}/{rel}"
              reciprocal_paths.append({"source": f, "reciprocal": reciprocal})
          print(json.dumps(reciprocal_paths, indent=2))
          with open("/tmp/reciprocal_paths.json", "w") as fh:
              json.dump(reciprocal_paths, fh)
          pathlib.Path("/tmp/per_file_count.txt").write_text(str(len(reciprocal_paths)))
          PYEOF

          cat /tmp/reciprocal_paths.json | head -50
          echo "per-file-count=$(cat /tmp/per_file_count.txt)"
          echo "paths-json<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/reciprocal_paths.json >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "per-file-count=$(cat /tmp/per_file_count.txt)" >> "$GITHUB_OUTPUT"

  reciprocal-pr:
    name: Open reciprocal PR on cianfhoghlaim
    needs: compute-paths
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.open-pr.outputs.pr-number }}
      pr-url: ${{ steps.open-pr.outputs.pr-url }}
      per-file-count: ${{ needs.compute-paths.outputs.per-file-count }}
    steps:
      - uses: actions/checkout@v4
      - name: Open reciprocal PR on cianfhoghlaim
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PR_TOKEN }}
          SISTER_REPO: ${{ inputs.sister-repo }}
          SOURCE_PR: ${{ inputs.source-pr }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          DRY_RUN: ${{ inputs.dry-run }}
          MACOS_SED_TARGET: ${{ inputs.macos-sed-target }}
          RECIPROCAL_PATHS_JSON: ${{ needs.compute-paths.outputs.paths-json }}
          PER_FILE_COUNT: ${{ needs.compute-paths.outputs.per-file-count }}
        run: |
          set -euo pipefail

          # Build the PR body referencing the sister repo's PR number + commit SHA
          cat > /tmp/pr_body.md <<EOF
          ## dlt:sister-sync($SISTER_REPO) — reciprocal mirror

          Auto-mirror of a $SISTER_REPO PR via the per-PR reusable workflow
          \`.github/workflows/dlt-sister-sync.yml\` (the
          \`2026-08-24-dlt-sources-to-multi-repo-scaffold-v1\` Phase 2.3
          change).

          | Field | Value |
          | --- | --- |
          | Sister repo | $SISTER_REPO |
          | Sister PR | #$SOURCE_PR |
          | Sister SHA | \`$SOURCE_SHA\` |
          | Sister branch | \`$SOURCE_BRANCH\` |
          | Target branch | \`$TARGET_BRANCH\` |
          | macOS sed target | \`$MACOS_SED_TARGET\` |
          | Mirrored files | $PER_FILE_COUNT |
          | openspec change | \`2026-08-24-dlt-sources-to-multi-repo-scaffold-v1\` |

          ### Mirror surface

          Each source path \`<sister>/dlt_sources/<rel-path>\` is mirrored to
          \`cianfhoghlaim/dlt_sources/_sister_refs/$SISTER_REPO/<rel-path>\`
          (read-only — the canonical home is the sister repo).

          ### Reciprocal paths (this PR)

          \`\`\`json
          $RECIPROCAL_PATHS_JSON
          \`\`\`

          ### Review + smoke-test gating

          - [ ] **Code review**: review the sister PR #$SOURCE_PR first
          - [ ] **dlt:smoke-all**: CI gate runs \`mise run dlt:smoke-all\` on this PR
          - [ ] **No new failures**: the 9 pre-existing FAILs in \`tests/dlt/test_imports.py\`
                must remain stable; any NEW FAIL is a regression.

          ### Nightly mirror-merge

          This PR will be auto-merged into \`dlt_sources/_sister_refs/$SISTER_REPO/\`
          by the Dagster sensor \`dlt_nightly_mirror_merge\` at 02:30 UTC nightly
          (per Phase 2.5). A \`dlt:mirror-ack\` notification will be posted back
          to the sister repo at that time.

          /cc @cianmacandeisigh
          EOF

          PR_TITLE="dlt:sister-sync($SISTER_REPO): $PER_FILE_COUNT files from #$SOURCE_PR"
          PR_BODY=$(cat /tmp/pr_body.md)

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::DRY-RUN: would open PR on cianfhoghlaim with title: $PR_TITLE"
            echo "PR body:"
            cat /tmp/pr_body.md
            echo "pr-number=0" >> "$GITHUB_OUTPUT"
            echo "pr-url=https://github.com/cianmacandeisigh/cianfhoghlaim/pull/0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Open the reciprocal PR via gh api
          HTTP_RESPONSE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$HTTP_RESPONSE" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/cianmacandeisigh/cianfhoghlaim/pulls" \
            -f "title=$PR_TITLE" \
            -f "body=$PR_BODY" \
            -f "head=$SISTER_REPO:reciprocal/$SISTER_REPO-$SOURCE_PR" \
            -f "base=$TARGET_BRANCH" \
            -f "maintainer_can_modify=true") || true

          echo "HTTP $HTTP_CODE"
          head -50 "$HTTP_RESPONSE"
          echo "----"

          if [ "$HTTP_CODE" = "201" ]; then
            PR_NUMBER=$(python3 -c "import json,sys; print(json.load(open('$HTTP_RESPONSE'))['number'])")
            PR_URL=$(python3 -c "import json,sys; print(json.load(open('$HTTP_RESPONSE'))['html_url'])")
            echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "::notice::Opened reciprocal PR #$PR_NUMBER on cianfhoghlaim"

            # Apply the labels (idempotent)
            PR_NUMBER="$PR_NUMBER" GH_TOKEN="$GH_TOKEN" python3 - <<'PYEOF'
          import os, json, urllib.request
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          labels = ["dlt-sister-sync", "auto-mirror"]
          for label in labels:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/cianmacandeisigh/cianfhoghlaim/issues/{pr_number}/labels",
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  data=json.dumps({"labels": [label]}).encode(),
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f"label={label} status={resp.status}")
              except Exception as e:
                  print(f"label={label} error={e}")
          PYEOF
          else
            echo "::error::Failed to open reciprocal PR (HTTP $HTTP_CODE)"
            cat "$HTTP_RESPONSE"
            exit 1
          fi

  downstream-smoke:
    name: Trigger downstream dlt:smoke-all gate on cianfhoghlaim
    needs: reciprocal-pr
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mise run dlt:smoke-all via workflow_dispatch
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PR_TOKEN }}
          RECIPROCAL_PR: ${{ needs.reciprocal-pr.outputs.pr-number }}
          SISTER_REPO: ${{ inputs.sister-repo }}
        run: |
          set -euo pipefail
          echo "Triggering downstream dlt:smoke-all gate on PR #$RECIPROCAL_PR"
          # The actual smoke-all run is wired into the existing CI gate at
          # .github/workflows/ci.yaml via the `mise run dlt:smoke-all`
          # dependency. Here we just log the intent — the actual execution
          # happens on the CI workflow's PR trigger.
          echo "sister_repo=$SISTER_REPO"
          echo "reciprocal_pr=$RECIPROCAL_PR"
          echo "Downstream CI will run mise run dlt:smoke-all which writes to:"
          echo "  stedding/sync-reports/dlt-smoke-run-<timestamp>.json"
