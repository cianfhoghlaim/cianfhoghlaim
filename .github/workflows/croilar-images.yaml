name: Build Croilar Images (Dagger)

on:
  push:
    branches: [main]
    paths:
      - "croilar/**"
      - "infrastructure/dagger/**"
  workflow_dispatch:
    inputs:
      image:
        description: "Single image to build (empty = all)"
        required: false
        default: ""

jobs:
  build:
    name: dagger build (croilar)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
      - name: dagger build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dagger call \
            --mod infrastructure/dagger \
            croilar build-images \
            --image "${{ inputs.image }}" \
            --platform linux/amd64,linux/arm64 \
            --source .
