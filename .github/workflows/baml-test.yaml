name: baml-cli test

on:
  pull_request:
    branches: [pick-4-biep-v1, main]
  push:
    branches: [pick-4-biep-v1, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  baml-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install mise
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          cd cianfhoghlaim
          uv sync --extra dlthub-platform

      - name: Run baml-cli test
        run: |
          cd cianfhoghlaim
          mkdir -p baml_client_tests
          set -o pipefail
          mise run baml:test 2>&1 | tee baml_client_tests/baml-test-output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baml-test-results
          path: cianfhoghlaim/baml_client_tests/
          if-no-files-found: warn
          retention-days: 30

      - name: Post PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## baml-cli test — FAILED

            The hard BAML CI gate failed while running `mise run baml:test`
            (`uv run baml-cli test`) against the test blocks in
            `cianfhoghlaim/baml/`.

            See the uploaded artifact `baml-test-results` for the captured
            CLI output.

            ### How to fix

            1. Run the gate locally from the repo root:
               ```bash
               cd cianfhoghlaim
               mise run baml:test
               ```
            2. Fix any BAML parse/type/test failures reported by `baml-cli test`.
            3. Regenerate clients if schema changes require it:
               ```bash
               mise run baml:generate
               ```

            ---

            _Generated by `.github/workflows/baml-test.yaml`_
          edit-mode: replace
