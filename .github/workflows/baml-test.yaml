name: baml-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  baml-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install mise
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Post-v7 flattening (2026-07-17): the Python package is the
      # repo root (was previously at cianfhoghlaim/). All `cd cianfhoghlaim`
      # and `cd <repo>/cianfhoghlaim` references are removed.
      - name: Install dependencies
        run: |
          uv sync --extra dlthub-platform

      - name: Run baml-cli generate (canonical step)
        run: |
          mkdir -p baml_client_tests
          set -o pipefail
          mise run baml:generate 2>&1 | tee baml_client_tests/baml-generate-output.txt

      - name: Drift check (generated client diff)
        run: |
          if ! git diff --exit-code baml_client/; then
            echo "ERROR: baml_client/ has uncommitted drift. Run 'mise run baml:generate' and commit."
            exit 1
          fi

      - name: Run baml-cli test
        run: |
          set -o pipefail
          mise run baml:test 2>&1 | tee baml_client_tests/baml-test-output.txt

      - name: Run baml-cli check (schema validation)
        run: |
          set -o pipefail
          mise run baml:check 2>&1 | tee baml_client_tests/baml-check-output.txt || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baml-ci-results
          path: baml_client_tests/
          if-no-files-found: warn
          retention-days: 30

      - name: Post PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## baml-ci — FAILED

            The hard BAML CI gate failed.

            ### Steps that may have failed
            1. `mise run baml:generate` — client generation
            2. Drift check — committed generated client must match freshly generated
            3. `mise run baml:test` — schema/type/test blocks
            4. `mise run baml:check` — schema validation

            See the uploaded artifact `baml-ci-results` for the captured CLI output.

            ### How to fix
            1. Run the gate locally from the repo root:
               ```bash
               mise run baml:generate && mise run baml:test && mise run baml:check
               ```
            2. Fix any BAML parse/type/test failures reported by `baml-cli test`.
            3. Commit the regenerated baml_client/ if it changed.

            ---

            _Generated by `.github/workflows/baml-test.yaml`_
          edit-mode: replace