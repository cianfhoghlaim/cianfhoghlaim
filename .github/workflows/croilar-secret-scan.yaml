name: Secret Scan (croilar)

on:
  push:
    branches: [main]
    paths:
      - "croilar/**"
      - ".infisical.env"
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
