name: OpenSpec Validate

on:
  push:
    branches: [main]
    paths:
      - "openspec/changes/**"
      - "openspec/specs/**"
  pull_request:
    paths:
      - "openspec/changes/**"
      - "openspec/specs/**"

jobs:
  validate:
    name: openspec validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: List all changes
        run: bunx --yes @fission-ai/openspec@latest list
      - name: List all specs
        run: bunx --yes @fission-ai/openspec@latest list --specs
      - name: Validate all changes (strict)
        run: |
          set -e
          for change in $(bunx --yes @fission-ai/openspec@latest list 2>/dev/null | awk 'NR>1 {print $1}'); do
            echo "=== Validating change: $change ==="
            bunx --yes @fission-ai/openspec@latest validate "$change" --type change --strict
          done
      - name: Validate all specs (strict)
        run: |
          set -e
          for spec in $(bunx --yes @fission-ai/openspec@latest list --specs 2>/dev/null | awk 'NR>1 {print $1}'); do
            echo "=== Validating spec: $spec ==="
            bunx --yes @fission-ai/openspec@latest validate "$spec" --type spec --strict
          done
