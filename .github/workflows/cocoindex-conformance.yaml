name: CocoIndex v1 conformance

on:
  pull_request:
    paths:
      - "cocoindex/**/*.py"
      - "dlt_sources/common/cocoindex_v1_migrate.py"
      - "dlt_sources/common/site_crawler.py"
      - "openspec/changes/2026-07-09-cocoindex-v1-remaining-apps-v1/**"
      - "openspec/changes/2026-07-15-pipeline-architecture-clarity-v1/**"
  push:
    branches: [main, pick-4-biep-v1]
    paths:
      - "cocoindex/**/*.py"
      - "dlt_sources/common/cocoindex_v1_migrate.py"
      - "dlt_sources/common/site_crawler.py"
  workflow_dispatch:

jobs:
  conformance:
    name: cocoindex v1 conformance (R1+R2+R3+R4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install mise + toolchain
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python + uv + bun
        run: mise install

      # Post-v7 flattening (2026-07-17): the CocoIndex v1 Apps live at
      # cocoindex/** (was previously at cianfhoghlaim/cocoindex/**).
      # The R1-R4 linter is at cocoindex_flows/infrastructure/cocoindex_v1_conformance.py.
      # AUDIT_EXIT is captured + propagated so the job fails when the
      # audit finds violations (was previously captured but not propagated,
      # so the job stayed green even when the audit failed).
      - name: Run the cocoindex_v1 conformance audit
        id: audit
        run: |
          set -o pipefail
          AUDIT_EXIT=0
          mise run cocoindex:conformance 2>&1 | tee cocoindex-v1-conformance-report.txt || AUDIT_EXIT=$?
          echo "AUDIT_EXIT=${AUDIT_EXIT:-0}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocoindex-v1-conformance-report
          path: cocoindex-v1-conformance-report.txt
          if-no-files-found: warn

      - name: Propagate audit exit (build is blocked if any R1-R4 violation found)
        if: steps.audit.outputs.AUDIT_EXIT != '0'
        run: |
          echo "::error::cocoindex_v1 conformance audit returned non-zero (R1-R4 violation found)"
          exit 1

      - name: Post PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## CocoIndex v1 conformance check — FAILED

            The `mise run cocoindex:conformance` audit found at least one
            R1 / R2 / R3 / R4 violation. Build is blocked.

            ### Audit report

            See the uploaded artifact `cocoindex-v1-conformance-report`
            for the full per-flow table.

            ### How to fix

            1. Run the audit locally: `mise run cocoindex:conformance`
            2. The report lists every failing flow + the specific
               R1/R2/R3/R4 violation
            3. Reference pattern: `cocoindex_flows/biep_parity/ireland_lc_mathematics_embedding.py`
               (the canonical R1-R4 conforming flow; post-v7 path)
            4. R4-exempt marker for non-LanceDB flows (e.g. GeoParquet):
               ```python
               # R4-exempt: <reason>
               ```
               on a standalone line
            5. not-a-flow marker for non-flow files under `cocoindex/`
               (Phase 0 primitives, colocated test files):
               ```python
               # not-a-flow: <reason>
               ```
               on a standalone line. The marker exempts the file from
               ALL 4 conformance rules.

            ---

            _Generated by `.github/workflows/cocoindex-conformance.yaml`_
          edit-mode: replace

  openspec_validate:
    name: openspec validate --strict (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # informational; v4-drift remediation may need to land first
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install mise + toolchain
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install bun
        run: mise install

      - name: Run openspec validate --strict
        run: |
          set -o pipefail
          mise run -- bunx openspec validate --strict --all 2>&1 | tee openspec-validate-report.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload openspec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openspec-validate-report
          path: openspec-validate-report.txt
          if-no-files-found: warn