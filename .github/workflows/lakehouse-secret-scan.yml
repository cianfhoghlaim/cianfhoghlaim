# =============================================================================
# Lakehouse Secret Scan (CI gate for the 2026-08-22 hardening)
# =============================================================================
# Fails any PR or push to main that adds plaintext secrets to:
#   - bonneagar/stacks/lakehouse/ (compose.yaml, sidecar.yaml, init-db.sql, etc.)
#   - dlt_sources/common/destinations_cianfhoghlaim.py
#   - notebooks/_shared/schema.py
#
# Uses gitleaks (the open-source secret scanner). Runs on every PR + push to
# main. Allowlist includes:
#   - .env.local (gitignored — should never reach CI)
#   - .env.example / .env.local.example (intentional documentation)
#   - .env.dev (empty-value template post-hardening)
#   - openspec/changes/** (historical archives may contain example secrets)
# =============================================================================

name: lakehouse-secret-scan

on:
  pull_request:
    paths:
      - 'bonneagar/stacks/lakehouse/**'
      - 'dlt_sources/common/**'
      - 'notebooks/_shared/**'
      - '.github/workflows/lakehouse-secret-scan.yml'
  push:
    branches: [main, 'token-plan-*', 'feat/*']
    paths:
      - 'bonneagar/stacks/lakehouse/**'
      - 'dlt_sources/common/**'
      - 'notebooks/_shared/**'
      - '.github/workflows/lakehouse-secret-scan.yml'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for plaintext secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download gitleaks
        run: |
          curl -sSL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | bash

      - name: Run gitleaks
        run: |
          gitleaks detect \
            --source . \
            --no-banner \
            --redact \
            --exit-code 1 \
            --config .gitleaks.toml \
            --log-level info

      - name: Post gitleaks summary (informational)
        if: failure()
        run: |
          echo "::error::gitleaks detected plaintext secrets. See the gitleaks output above for line numbers. Move secrets to .env.local (gitignored) or use \${VAR} + Locket resolution."
