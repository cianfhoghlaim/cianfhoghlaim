# =============================================================================
# Build + Publish the Lance Namespace Sidecar (per 2026-08-23 hardening)
# =============================================================================
# Builds the lakehouse/lance-sidecar/ Docker image + pushes it to
# ghcr.io/cianfhoghlaim/lance-namespace-sidecar on every push to main
# (when the sidecar code changes).
#
# Why: the lakehouse compose uses a pinned image for production stability
# (`ghcr.io/cianfhoghlaim/lance-namespace-sidecar:v0.3.0`). Local dev can
# fall back to `build:` context (see compose.yaml).
#
# Versioning: semver tags from the `LANCE_SIDECAR_VERSION` env var
# (default: 0.3.0). Bump this in the workflow file when the sidecar
# interface changes.
# =============================================================================

name: build-lance-namespace-sidecar

on:
  push:
    branches: [main, 'token-plan-*', 'feat/*']
    paths:
      - 'bonneagar/stacks/lakehouse/lance-sidecar/**'
      - '.github/workflows/build-lance-namespace-sidecar.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sidecar semver version'
        required: true
        default: '0.3.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build + Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      LANE_SIDECAR_VERSION: ${{ github.event.inputs.version || '0.3.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./bonneagar/stacks/lakehouse/lance-sidecar
          file: ./bonneagar/stacks/lakehouse/lance-sidecar/Dockerfile
          push: true
          tags: |
            ghcr.io/cianfhoghlaim/lance-namespace-sidecar:${{ env.LANE_SIDECAR_VERSION }}
            ghcr.io/cianfhoghlaim/lance-namespace-sidecar:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Post image digest (informational)
        if: success()
        run: |
          echo "Published ghcr.io/cianfhoghlaim/lance-namespace-sidecar:${{ env.LANE_SIDECAR_VERSION }}"
          echo "Update lakehouse/compose.yaml to reference this version."
