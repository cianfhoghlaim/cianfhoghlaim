name: test-runs-ingest
on:
  workflow_run:
    types: [completed]
    workflows: [".github/workflows/ci.yaml"]

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@v4

      - name: Calculate test counts
        id: counts
        run: |
          PASSED=$(jq '[.jobs[] | .. | objects | select(.outcome == "success") | .name] | length' $GITHUB_EVENT_PATH 2>/dev/null || echo "0")
          FAILED=$(jq '[.jobs[] | .. | objects | select(.outcome == "failure") | .name] | length' $GITHUB_EVENT_PATH 2>/dev/null || echo "0")
          RUNTIME=$(jq '[.jobs[].completed_at] | max - min' $GITHUB_EVENT_PATH 2>/dev/null || echo "0")
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "runtime=$RUNTIME" >> $GITHUB_OUTPUT

      - name: Call testRuns.ingest
        env:
          TEST_RUNS_INGEST_URL: ${{ secrets.TEST_RUNS_INGEST_URL }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REF_NAME: ${{ github.event.workflow_run.head_branch }}
          RUNNER_NAME: ${{ github.runner_name }}
        run: |
          python scripts/test_runs_ingest.py \
            --passed=${{ steps.counts.outputs.passed }} \
            --failed=${{ steps.counts.outputs.failed }} \
            --runtime=${{ steps.counts.outputs.runtime }}
