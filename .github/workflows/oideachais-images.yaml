# =============================================================================
# Build Oideachais Container Images
# =============================================================================
# Builds and pushes the 3 Oideachais container images on push to main.
# Images pushed to ghcr.io/cianfhoghlaim:
#   - oideachais-dagster (Dockerfile.dagster)
#   - oideachais-api (Dockerfile)
#   - oideachais-frontend (web/Dockerfile)
# =============================================================================
name: Build Oideachais Images

on:
  push:
    branches: [main]
    paths:
      - "oideachais/**"
      - "baml_src/**"
      - "baml_client/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "bun.lockb"
  workflow_dispatch:
    inputs:
      image:
        description: "Single image to build (dagster|api|frontend, empty = all)"
        required: false
        default: ""

jobs:
  build:
    name: Build and Push Oideachais Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cianfhoghlaim/oideachais
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dagster image
        if: ${{ inputs.image == '' || inputs.image == 'dagster' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: oideachais/Dockerfile.dagster
          push: true
          platforms: linux/arm64
          tags: ghcr.io/cianfhoghlaim/oideachais-dagster:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api image
        if: ${{ inputs.image == '' || inputs.image == 'api' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: oideachais/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/cianfhoghlaim/oideachais-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        if: ${{ inputs.image == '' || inputs.image == 'frontend' }}
        uses: docker/build-push-action@v6
        with:
          context: oideachais/web
          file: oideachais/web/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/cianfhoghlaim/oideachais-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
