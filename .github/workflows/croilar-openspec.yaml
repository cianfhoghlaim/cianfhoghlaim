name: OpenSpec Validate (croilar)

on:
  push:
    branches: [main]
    paths:
      - "openspec/changes/croilar-*/**"
      - "openspec/specs/croilar-*/**"
  pull_request:
    paths:
      - "openspec/changes/croilar-*/**"
      - "openspec/specs/croilar-*/**"

jobs:
  validate:
    name: openspec validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Validate croilar-revitalisation change
        run: bunx --yes @fission-ai/openspec@latest validate croilar-revitalisation --type change --strict
      - name: Validate croilar-portfolio spec
        run: bunx --yes @fission-ai/openspec@latest validate croilar-portfolio --type spec --strict
      - name: Validate croilar-data-engineering spec
        run: bunx --yes @fission-ai/openspec@latest validate croilar-data-engineering --type spec --strict
      - name: Validate croilar-cv-extraction spec
        run: bunx --yes @fission-ai/openspec@latest validate croilar-cv-extraction --type spec --strict
      - name: Validate croilar-persona-registry spec
        run: bunx --yes @fission-ai/openspec@latest validate croilar-persona-registry --type spec --strict
      - name: Validate croilar-self-hosted-portal spec
        run: bunx --yes @fission-ai/openspec@latest validate croilar-self-hosted-portal --type spec --strict
