name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DAGGER_VERSION: "0.19.2"

jobs:
  test:
    name: Test All Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dagger CLI
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Run Tests
        run: |
          cd bonneagar/dagger
          dagger call ci test-apps --source ../..
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dagger CLI
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Run TypeScript Checks
        run: |
          cd bonneagar/dagger
          dagger call ci test-typescript --source ../..
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dagger CLI
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Run Python Tests
        run: |
          cd bonneagar/dagger
          dagger call ci test-python --source ../..
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [test, typecheck, python]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dagger CLI
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Build and Push Images
        run: |
          cd bonneagar/dagger
          dagger call ci build-images \
            --source ../.. \
            --registry ghcr.io/${{ github.repository_owner }} \
            --tag ${{ github.sha }}
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dagger CLI
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Build and Deploy Docs
        run: |
          cd bonneagar/dagger
          dagger call ci deploy-cloudflare \
            --source ../.. \
            --api-token env:CLOUDFLARE_API_TOKEN \
            --account-id ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
