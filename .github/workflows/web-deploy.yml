name: Web Deployment

on:
  push:
    branches: [main]
    paths:
      - 'education/web/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Web Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'education/web/package-lock.json'

      - name: Install Dependencies
        working-directory: education/web
        run: npm ci || npm install

      - name: Build Web App
        working-directory: education/web
        run: npm run build

      - name: Trigger Deployment Webhook
        run: |
          echo "Triggering deployment webhook..."
          # Deploy step logic can be injected here
          echo "Web app built and ready for deployment"
