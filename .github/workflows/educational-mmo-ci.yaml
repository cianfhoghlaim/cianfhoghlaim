name: CI (Cianfhoghlaim Educational MMO tests)

on:
  pull_request:
    paths:
      - "cianfhoghlaim/badges/**"
      - "cianfhoghlaim/agents/meaisinfhoghlaim/educational/**"
      - "cianfhoghlaim/dlt/subjects/**"
      - "cianfhoghlaim/dagster/assets/{mathematics,applied_mathematics,chemistry,gaeilge,english,history,geography,computer_science}_assets.py"
      - "cianfhoghlaim/cocoindex/{mathematics,applied_mathematics,chemistry,gaeilge,english,history,geography,computer_science}_embedding.py"
      - "cianfhoghlaim/baml/qpack_*.baml"
      - "cianfhoghlaim/tests/_badges/**"
      - "cianfhoghlaim/tests/_educational_mmo/**"
      - "infrastructure/contracts/**"
  push:
    branches: [main]
    paths:
      - "cianfhoghlaim/badges/**"
      - "cianfhoghlaim/agents/meaisinfhoghlaim/educational/**"
      - "cianfhoghlaim/tests/_badges/**"
      - "cianfhoghlaim/tests/_educational_mmo/**"

jobs:
  badges:
    name: Badges module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.5.6
      - name: Install deps
        run: mise install
      - name: Run badges tests
        working-directory: cianfhoghlaim
        run: |
          python -m pytest tests/_badges/ -v

  educational_mmo:
    name: Educational MMO 8-subject scaffold tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.5.6
      - name: Install deps
        run: mise install
      - name: Run 8-subject tests
        working-directory: cianfhoghlaim
        run: |
          python -m pytest tests/_educational_mmo/ -v

  cred_anchor_solidity:
    name: CredAnchor Solidity tests (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          echo "$HOME/.foundry/bin" >> $GITHUB_PATH
          foundryup
      - name: Install forge-std
        working-directory: infrastructure/contracts
        run: |
          mkdir -p lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std
      - name: Run forge tests
        working-directory: infrastructure/contracts
        run: |
          forge test -vv

  web_typecheck:
    name: cianfhoghlaim-mmo 2D client typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.5.6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        working-directory: cianfhoghlaim/web/apps/cianfhoghlaim-mmo
        run: bun install
      - name: Generate TanStack route tree
        working-directory: cianfhoghlaim/web/apps/cianfhoghlaim-mmo
        run: bunx @tanstack/router-cli generate
      - name: Typecheck
        working-directory: cianfhoghlaim/web/apps/cianfhoghlaim-mmo
        run: bunx tsc --noEmit