name: CI (Dagger)

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.toml"
      - "**/*.json"
      - "**/*.baml"
      - "**/*.yaml"
      - "**/*.yml"
      - "infrastructure/dagger/**"
      - "mise.toml"
      - "pyproject.toml"
      - "turbo.json"
      - "dagger.json"
  push:
    branches: [main, develop]
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.toml"
      - "**/*.json"
      - "**/*.baml"
      - "**/*.yaml"
      - "**/*.yml"
      - "infrastructure/dagger/**"
      - "mise.toml"
      - "pyproject.toml"
      - "turbo.json"
      - "dagger.json"
  workflow_dispatch:

jobs:
  dagger-test:
    name: dagger test-all
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install mise + toolchain
        run: |
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python + uv + bun
        run: mise install
      - run: mise run sync

      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          dagger version

      - name: Dagger test-all
        run: |
          cd infrastructure/dagger
          dagger call test-all --source ../..

      - name: Dagger build-images (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u cianfhoghlaim --password-stdin
          cd infrastructure/dagger
          dagger call build-images \
            --source ../.. \
            --registry=ghcr.io/cianfhoghlaim \
            --tag=${{ github.sha }}
