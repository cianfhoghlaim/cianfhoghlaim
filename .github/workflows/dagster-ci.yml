name: Dagster CI

on:
  push:
    branches: [main]
    paths:
      - 'education/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'education/**'
      - 'pyproject.toml'
      - 'uv.lock'

env:
  UV_CACHE_DIR: ~/.cache/uv

jobs:
  lint-test:
    name: Lint & Test Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.10"

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff linting
        run: uv run ruff check education/

      - name: Run Ruff formatting check
        run: uv run ruff format --check education/

      - name: Run type checking
        run: uv run mypy education/ --ignore-missing-imports || true

      - name: Run tests
        run: uv run pytest tests/ -v || true

      - name: Validate Dagster Project
        working-directory: education
        run: |
          if [ -d "dagster_defs" ]; then
            uv run dagster project info
          fi
