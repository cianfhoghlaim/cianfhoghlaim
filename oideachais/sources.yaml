# sources.yaml — Canonical registry for every DLT source in oideachais.
# Loaded by oideachais.dlt_utils.source_factory.SourceFactory.
#
# Contract (v2):
#   - `id`, `name`, `domain`, `nation`           → asset key prefix
#   - `kind`, `urls`, `crawl`                    → DLT source constructor kwargs
#   - `pagination`, `incremental`                → dlt.sources.incremental knobs
#   - `schema` (BAML/Pydantic)                   → typed payload contract
#   - `lakehouse` (DUCKLAKE / ICEBERG / DUCKDB)  → destination config
#   - `embedding` (LanceDB)                      → vector namespace + model
#   - `kg` (Cognee/Graphiti)                      → dataset + edge types
#   - `firecrawl` / `browserbase`                → paid backend override
#   - `tests`                                    → pytest markers
#   - `schedule`                                 → Dagster ScheduleDefinition
#   - `sensors`                                  → change-detection triggers
#   - `compliance`                               → robots.txt, licence, retention

version: 2

defaults:
  destination: ducklake                  # ducklake | iceberg | duckdb
  destination_database: oideachais
  embedding_model: BAAI/bge-m3           # 1024-dim, multilingual
  firecrawl:
    only_main_content: true
    formats: [markdown, links, html]
    max_pages: 200
    max_depth: 3
    include_paths: []
    exclude_paths: []
  browserbase:
    stagehand_model: deepseek/deepseek-chat
    wait_for: networkidle
  schedule:
    cron: "0 4 * * *"
    timezone: Europe/Dublin
  compliance:
    respect_robots_txt: true
    licence: TBD                         # override per source
    retain_raw_snapshots_days: 30
  tests:
    pytest_marker: integration
    uses_local_scrape_cache: true
  sensors:
    sitemap_hash_check: true

nations:
  - { code: ie,  name: "Ireland",            jurisdiction: "euro_eu" }
  - { code: ni,  name: "Northern Ireland",   jurisdiction: "uk" }
  - { code: en,  name: "England",            jurisdiction: "uk" }
  - { code: sct, name: "Scotland",           jurisdiction: "uk" }
  - { code: wls, name: "Wales",              jurisdiction: "uk" }
  - { code: iom, name: "Isle of Man",        jurisdiction: "crown_dependencies" }
  - { code: jey, name: "Jersey",             jurisdiction: "crown_dependencies" }
  - { code: ggy, name: "Guernsey",           jurisdiction: "crown_dependencies" }

kinds:
  - firecrawl_pages
  - stagehand_papers
  - browserbase_extract
  - api_table
  - api_xml
  - filesystem_csv
  - filesystem_parquet

# Each entry below drives:
#   1. A DLT @source (via SourceFactory)
#   2. A Dagster @asset  (via SourceFactory.dagster_asset)
#   3. A LanceDB table    (via SourceFactory.lance_table)
#   4. A Cognee dataset   (via SourceFactory.cognee_dataset)
#   5. A marimo notebook  (via SourceFactory.marimo_path)
#   6. A pytest           (via SourceFactory.tests_path)
#
# `asset_key` is the canonical `{nation}.{domain}.{entity}` key tuple.
sources:

  # ═══════ EDUCATION — IRELAND (existing) ═══════════════════════════════════
  - id: ie.education.ncca
    name: "NCCA — National Council for Curriculum and Assessment"
    domain: education
    nation: ie
    kind: firecrawl_pages
    urls: ["https://www.ncca.ie"]
    crawl: { include_paths: ["/en/**", "/ga/**"], max_pages: 500 }
    schedule: { cron: "0 3 * * 1" }
    sensors: [sitemap_hash]
    asset_key: [ie, education, ncca, pages]
    embedding: { table: oideachais.education.ie.ncca_pages, kind: page_markdown }
    kg:       { dataset: oideachais_education_ie, edges: [prerequisite, strand, level] }
    compliance: { licence: open_government, contact: info@ncca.ie }

  - id: ie.education.examinations
    name: "State Examinations Commission"
    domain: education
    nation: ie
    kind: stagehand_papers
    urls: ["https://www.examinations.ie"]
