    schedule: { cron: "0 2 * * *" }
    asset_key: [ie, education, exam_materials, leaving_certificate]
    embedding: { table: oideachais.education.ie.exam_papers, kind: paper_pdf_docling }
    compliance: { licence: public_service }

  - id: ie.education.oide
