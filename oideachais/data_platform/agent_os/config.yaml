# Oideachais AgentOS Configuration
# Celtic Education Agent Runtime

name: Celtic Education AgentOS
id: oideachais-agent-os
version: "1.0.0"

# Quick prompts for common queries
quick_prompts:
  - name: "Curriculum Search"
    description: "Search NCCA curriculum content"
    prompt: "Search the Irish curriculum for topics about"
    icon: "book-open"

  - name: "Translate to Irish"
    description: "Translate educational content to Irish"
    prompt: "Translate the following to Irish (Gaeilge):"
    icon: "languages"

  - name: "Leaving Cert Help"
    description: "Get Leaving Cert exam guidance"
    prompt: "Help me prepare for the Leaving Certificate exam in"
    icon: "graduation-cap"

  - name: "Folklore Search"
    description: "Search Duchas.ie folklore collection"
    prompt: "Search Irish folklore and oral tradition about"
    icon: "book-bookmark"

  - name: "School Finder"
    description: "Find schools in an area"
    prompt: "Find Irish-medium schools near"
    icon: "map-pin"

  - name: "Education Statistics"
    description: "Get Irish education statistics"
    prompt: "What are the statistics for"
    icon: "chart-bar"

# Agent configuration overrides
agents:
  curriculum-agent:
    enabled: true
    model: gpt-4o
    description: "Searches NCCA curriculum, SEC exam content, and learning outcomes"

  research-agent:
    enabled: true
    model: gemini-2.0-flash
    description: "Discovers academic and Celtic language resources"

  translation-agent:
    enabled: true
    model: claude-sonnet-4-20250514
    description: "Translates between Celtic languages and English"

  corpus-agent:
    enabled: true
    model: gpt-4o
    description: "Searches Duchas.ie, Canuint.ie, and linguistic corpora"

  geospatial-agent:
    enabled: true
    model: gpt-4o
    description: "Handles location-based education queries"

  statistics-agent:
    enabled: true
    model: gpt-4o
    description: "Analyzes Irish education statistics and trends"

# Team configuration
teams:
  education-team:
    enabled: true
    model: gpt-4o
    share_member_interactions: true
    description: "Coordinated team for comprehensive education queries"

# Session configuration
sessions:
  storage: postgresql
  table_name: oideachais_sessions
  ttl_hours: 24

# A2A configuration
a2a:
  enabled: true
  require_service_auth: false  # Allow external A2A calls
  allowed_services:
    - crypteolas
    - browser
    - aleyum
    - croilar

# Observability
observability:
  langfuse_enabled: true
  trace_level: info
