# Celtic Language Data Scraping Configuration
# Discovered URL patterns from Firecrawl/Browserbase MCP exploration
# December 2024
#
# This file documents reproducible scraping patterns for:
# - Dúchas.ie (Schools Collection XML + handwriting images)
# - Canúint.ie (dialect audio tracks + transcriptions)
# - HiddenHeritages.ai (folklore OCR/HTR transcriptions)
# - British Isles census/statistics APIs

# =============================================================================
# CELTIC LANGUAGE FOLKLORE SOURCES
# =============================================================================

sources:
  duchas_ie:
    name: "Dúchas.ie - Schools Collection"
    base_url: "https://www.duchas.ie"
    description: "1930s folklore collection with 740,000 pages of handwritten manuscripts"
    language_support: ["ga", "en"]
    license: "CC BY-NC 4.0"
    contact: "eolas@duchas.ie"

    # URL patterns discovered via firecrawl_map
    endpoints:
      # Main XML API for Schools Collection (CBES)
      xml_api:
        pattern: "/xml/cbes/{volume_id}"
        description: "XML metadata for each volume/story"
        sample_ids: [4606492, 4606493, 4593629]
        content_type: "application/xml"
        rate_limit: "1 request/second recommended"

      # Volume browser
      volumes:
        pattern: "/en/cbes/{volume_id}"
        description: "Web view of individual volumes"
        volume_range: [1, 2400]
        priority: high

      # Geographic browsing
      places:
        pattern: "/en/places"
        endpoints:
          by_county: "/en/places/{county_slug}"
          by_barony: "/en/places/{county_slug}/{barony_slug}"
        sample_urls:
          - "/en/places/galway"
          - "/en/places/galway/ross"

      # Topic-based browsing
      topics:
        pattern: "/en/topics/cbes"
        description: "Thematic classification of folklore topics"

      # Meitheal (crowdsourced transcription)
      meitheal:
        pattern: "/en/meitheal"
        subpaths:
          - "/en/meitheal/start"
          - "/en/meitheal/help"
          - "/en/meitheal/keyboard"
        description: "Community transcription interface"

      # Image access
      images:
        pattern: "https://duchas.ie/img/cbes/{volume_id}/{page_number}.jpg"
        description: "Direct image URLs for handwritten pages"
        resolution: "high (original scans)"

    # XML schema fields (from sample 4606492.xml)
    schema:
      root: "lChapter"
      fields:
        entryID: { type: "string", description: "Unique story identifier" }
        url: { type: "url", description: "Canonical XML URL" }
        volume:
          volumeNumber: { type: "string", format: "0001-2400" }
          volumeStatus: { type: "int", description: "Processing status code" }
        schoolLocation:
          nameGA: { type: "string", description: "Irish placename" }
          nameEN: { type: "string", description: "English placename" }
          lat: { type: "float", precision: 16 }
          lon: { type: "float", precision: 16 }
          county: { type: "string", format: "2-letter code (GA, DO, etc.)" }
        schoolName: { type: "string" }
        schoolRollNumber: { type: "string", format: "5-digit" }
        teacherName:
          pretext: { type: "string", description: "Name prefix" }
          text: { type: "string", description: "Surname" }

  canuint_ie:
    name: "Canúint.ie - Repository of Irish Dialects"
    base_url: "https://www.canuint.ie"
    description: "Audio recordings of traditional Irish dialects with transcriptions"
    language_support: ["ga", "en"]
    license: "Research use only"

    # URL patterns discovered via firecrawl_map + browserbase exploration
    endpoints:
      # Barony pages (main geographic organization)
      baronies:
        pattern: "/en/{barony_id}"
        description: "Geographic browsing by baronial division"
        id_range: [1, 200]
        sample_urls:
          - "/en/55"   # Aran Islands
          - "/en/71"   # Clare
          - "/en/90"   # Galway

      # Individual recordings
      recordings:
        patterns:
          - "/en/{recording_id}"
        id_formats:
          qqtrin: "QQTRIN*"      # Format 1
          od: "OD*"              # Oral Document format
          qac: "QAC*"            # Format 3
        sample_ids:
          - "QQTRIN01_033c1"
          - "OD017119_CD0309_14c1"
          - "OD002558_JAZ01416_1c1"
          - "OD018367_CD1578_nuig1578_07c1"

      # Language toggle
      languages:
        en: "/en/{path}"
        ga: "/ga/{path}"

    # Data fields (from scraped pages)
    schema:
      recording:
        speaker_name: { type: "string", description: "Speaker name (Irish)" }
        location: { type: "string", description: "Townland name" }
        year: { type: "int", description: "Recording year (1970s-1980s)" }
        recording_id: { type: "string", pattern: "(QQTRIN|OD|QAC).*" }
        audio_url: { type: "url", format: "mp3" }
        transcription_status: { type: "enum", values: ["available", "coming_soon"] }

    # Dialect regions mapped to baronies
    dialect_mapping:
      munster:
        baronies: [71, 72, 73, 74, 75]  # Clare, Kerry, Cork, Waterford
        description: "Gaeilge na Mumhan"
      connacht:
        baronies: [55, 56, 57, 90, 91, 92]  # Galway, Mayo, Roscommon
        description: "Gaeilge Chonnacht"
      ulster:
        baronies: [101, 102, 103, 104, 105]  # Donegal
        description: "Gaeilge Uladh"

  hidden_heritages_ai:
    name: "Decoding Hidden Heritages"
    base_url: "https://www.hiddenheritages.ai"
    description: "AI-transcribed folklore from Ireland and Scotland"
    institutions:
      ireland: "National Folklore Collection, UCD"
      scotland: "School of Scottish Studies Archives, University of Edinburgh"
    language_support: ["en", "ga", "gd"]

    # License/copyright
    licensing:
      ireland:
        copyright: "National Folklore Collection, UCD"
        metadata_copyright: "Dublin City University"
        license: "CC BY-NC 4.0"
        contact: "eolas@duchas.ie"
      scotland:
        copyright: "School of Scottish Studies Archives, University of Edinburgh"
        metadata_copyright: "University of Edinburgh"
        license: "Research purposes only"
        contact: "HeritageCollections@ed.ac.uk"

    # URL patterns discovered via firecrawl_scrape
    endpoints:
      # Irish tales (CBES = Schools Collection)
      ireland_tales:
        pattern: "/en/ie/cbe/{id}"
        description: "Irish folklore tales with HTR transcriptions"
        id_format: "numeric (7 digits)"
        sample_ids: [9050014, 9050015, 9050016]
        count: "~100,000+ tales"

      # Scottish tales
      scotland_tales:
        pattern: "/en/sct/{id}"
        description: "Scottish folklore tales"
        id_format: "alphanumeric"
        sample_ids: ["SA1951.055.A1", "SA1952.001.B2"]

      # Browse pages
      browse:
        recent: "/en/tales/recent"
        pagination: "/en/tales?page={n}"

      # About/documentation
      documentation:
        data: "/en/about/data"
        project: "/en/about/project"
        team: "/en/about/team"

    # Tale schema (from scraped tales listing)
    schema:
      tale:
        id: { type: "string", description: "Tale identifier" }
        title: { type: "string", description: "Tale title" }
        collector: { type: "string", description: "Person who collected the tale" }
        informant: { type: "string", description: "Person who told the tale" }
        location: { type: "string", description: "Collection location" }
        date: { type: "string", description: "Collection date" }
        language: { type: "enum", values: ["ga", "gd", "en"] }
        transcription: { type: "string", description: "HTR/OCR text" }
        confidence: { type: "float", description: "HTR confidence score" }

# =============================================================================
# BRITISH ISLES STATISTICS SOURCES
# =============================================================================

  ons_census_2021:
    name: "Office for National Statistics - Census 2021"
    base_url: "https://www.nomisweb.co.uk"
    description: "England and Wales census data including language statistics"
    coverage: ["England", "Wales"]

    endpoints:
      api_base:
        url: "https://www.nomisweb.co.uk/api/v01"
        format: "json"
        auth: "none (public)"

      # Language datasets discovered via firecrawl_search
      language_datasets:
        main_language:
          id: "NM_2073_1"
          name: "TS024 - Main language"
          table: "c2021ts024"
          description: "Main language spoken (detailed)"
          geographies: ["LAD", "LSOA", "OA"]
          url: "https://www.nomisweb.co.uk/datasets/c2021ts024"

        household_language:
          id: "NM_2074_1"
          name: "TS025 - Household language"
          table: "c2021ts025"
          description: "English proficiency in households"
          url: "https://www.nomisweb.co.uk/datasets/c2021ts025"

        welsh_language:
          id: "NM_2075_1"
          name: "TS032 - Welsh language skills"
          description: "Welsh speaking, reading, writing ability"
          geographies: ["LAD", "MSOA", "LSOA"]
          wales_only: true

      # Education datasets
      education_datasets:
        qualifications:
          id: "NM_2087_1"
          name: "TS067 - Highest qualification"
          geographies: ["LAD", "LSOA"]

    # Geographic granularities available
    geographies:
      LAD:
        description: "Local Authority Districts"
        count: 331
        level: "coarse"
      MSOA:
        description: "Middle Layer Super Output Areas"
        count: 7264
        level: "medium"
      LSOA:
        description: "Lower Layer Super Output Areas"
        count: 33755
        level: "fine"
      OA:
        description: "Output Areas"
        count: 188880
        level: "finest"

  nrs_census_2022:
    name: "National Records of Scotland - Census 2022"
    base_url: "https://www.nrscotland.gov.uk"
    description: "Scotland census data including Scottish Gaelic statistics"
    coverage: ["Scotland"]

    endpoints:
      statistics_portal:
        url: "https://www.scotlandscensus.gov.uk"

      gaelic_language:
        description: "Scottish Gaelic language ability"
        table: "UV701SCO"
        geographies: ["Council Area", "Data Zone"]

      education:
        description: "Educational attainment"
        geographies: ["Council Area", "Data Zone"]

    geographies:
      council_area:
        description: "32 council areas"
        count: 32
        level: "coarse"
      intermediate_zone:
        description: "Intermediate Zones"
        count: 1279
        level: "medium"
      data_zone:
        description: "Data Zones (2011)"
        count: 6976
        level: "fine"

  cso_census_2022:
    name: "Central Statistics Office - Census 2022"
    base_url: "https://data.cso.ie"
    description: "Ireland census data including Irish language statistics"
    coverage: ["Ireland"]

    endpoints:
      api:
        url: "https://ws.cso.ie/public/api.restful/PxStat.Data.Cube_API.ReadDataset"
        format: "json-stat2"

      # Irish language datasets discovered via firecrawl_search
      language_datasets:
        irish_speakers:
          dataset_id: "SAP2022T3T2SA"
          description: "Irish speakers aged 3+ by frequency of speaking"
          geographies: ["County", "Electoral Division", "Gaeltacht"]
          url: "https://data.gov.ie/dataset/sap2022t3t2sa-irish-speakers-aged-3-years-and-over-by-frequency-of-speaking-irish"

        ability_to_speak_irish:
          dataset_id: "SAP2022T3T1SA"
          description: "Ability to speak Irish by age group"

        gaeltacht_areas:
          dataset_id: "GAE2022"
          description: "Gaeltacht-specific language statistics"

      education_datasets:
        educational_attainment:
          dataset_id: "EDU2022"
          description: "Highest education level achieved"

    geographies:
      county:
        description: "26 counties + Dublin regions"
        count: 31
        level: "coarse"
      electoral_division:
        description: "Electoral Divisions"
        count: 3440
        level: "fine"
      small_area:
        description: "Small Areas"
        count: 18641
        level: "finest"
      gaeltacht:
        description: "Gaeltacht regions"
        count: 7
        level: "special"

  crown_dependencies:
    name: "Crown Dependencies Census Data"
    description: "Census data from Isle of Man, Jersey, Guernsey"

    isle_of_man:
      base_url: "https://www.gov.im/categories/planning-and-building-control/planning/census/"
      language: "Manx Gaelic (gv)"
      geographies: ["Parish"]

    jersey:
      base_url: "https://www.gov.je/Government/Census/"
      geographies: ["Parish"]

    guernsey:
      base_url: "https://gov.gg/census"
      geographies: ["Parish"]

# =============================================================================
# SCRAPING STRATEGY
# =============================================================================

scraping_strategy:
  # Sample sizes for initial pipeline testing
  sample_sizes:
    duchas:
      total: 1300
      per_county: 50
      counties: 26
      rationale: "50 stories per county for dialect coverage"

    canuint:
      total: 150
      per_dialect: 50
      dialects: ["munster", "connacht", "ulster"]
      rationale: "50 recordings per major dialect region"

    hidden_heritages:
      total: 200
      ireland: 100
      scotland: 50
      english_tales: 50
      rationale: "Balanced cross-border sample"

  # Rate limiting
  rate_limits:
    duchas:
      requests_per_second: 1
      delay_between_requests: 1000  # ms
    canuint:
      requests_per_second: 0.5
      delay_between_requests: 2000  # ms
    hidden_heritages:
      requests_per_second: 1
      delay_between_requests: 1000  # ms
    census_apis:
      requests_per_second: 5
      delay_between_requests: 200   # ms

  # Tool selection
  tool_mapping:
    duchas:
      xml_api: firecrawl_scrape
      volume_pages: firecrawl_scrape
      discovery: firecrawl_map

    canuint:
      audio_pages: browserbase_stagehand
      transcriptions: browserbase_stagehand_extract
      discovery: firecrawl_map

    hidden_heritages:
      tales: firecrawl_scrape
      discovery: firecrawl_map

    census:
      api_calls: http_client  # Direct API calls
      discovery: firecrawl_search

# =============================================================================
# OUTPUT CONFIGURATION
# =============================================================================

output:
  # Raw data storage
  raw_data:
    format: json
    path: "data/raw/{source}/{date}/"

  # Processed data
  processed:
    duckdb:
      path: "data/processed/celtic_language.duckdb"
      tables:
        - folklore_stories
        - audio_recordings
        - dialect_transcriptions
        - census_language
        - census_education

    geoparquet:
      path: "data/processed/geoparquet/"
      files:
        - celtic_folklore_locations.parquet
        - dialect_boundaries.parquet
        - census_lsoa.parquet
        - census_lad.parquet
      hilbert_ordered: true

    lancedb:
      path: "data/processed/lancedb/"
      tables:
        - folklore_embeddings
        - transcription_embeddings

# =============================================================================
# LITELLM MODEL CONFIGURATION
# =============================================================================
# Models are accessed via LiteLLM gateway at llm.cianfhoghlaim.ie
# See infrastructure/stacks/llama-stack/litellm/litellm_config.yaml
# =============================================================================

litellm:
  api_base: "https://llm.cianfhoghlaim.ie"

  # Model selection by task type
  models:
    # Structured extraction (BAML)
    extraction:
      default: "gemini-2.5-flash"
      high_quality: "claude-sonnet"
      fast: "fast"  # Local Gemma-3n

    # OCR and document processing
    ocr:
      default: "ocr"  # local/ocr/olmocr-mlx with fallbacks
      document: "document"  # granite-docling

    # Vision/multimodal
    vision:
      default: "vision"  # local/vision/qwen3-vl

    # Agent reasoning
    agent:
      default: "gemini-2.5-flash"
      complex: "claude-sonnet"

  # Fallback chains (handled by LiteLLM)
  fallbacks:
    ocr: ["local/ocr/olmocr-mlx", "local/ocr/olmocr-gguf", "gemini-2.0-flash"]
    vision: ["local/vision/qwen3-vl", "local/vision/gemma-27b", "gemini-1.5-flash"]
    extraction: ["gemini-2.5-flash", "gemini-2.0-flash", "deepseek-chat"]
