name: oideachais-dev

services:
  # ---------------------------------------------------------------------------
  # DAGSTER - Pipeline Orchestration
  # ---------------------------------------------------------------------------
  dagster:
    # Development: build from source. Production: use pre-built image.
    # To switch to production: uncomment `image` and comment `build`.
    # image: ghcr.io/cianfhoghlaim/oideachais-dagster:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: oideachais-dagster
    restart: unless-stopped
    ports:
      - "${DAGSTER_PORT:-3335}:3000"
    env_file:
      - path: /run/secrets/locket/secrets.env
        required: false
    environment:
      DAGSTER_HOME: /opt/dagster/home
      USE_DUCKLAKE: "true"
      DUCKLAKE_POSTGRES_HOST: ${DUCKLAKE_POSTGRES_HOST:-lakehouse-postgres}
      DUCKLAKE_POSTGRES_PORT: ${DUCKLAKE_POSTGRES_PORT:-5432}
      DUCKLAKE_POSTGRES_USER: ${DUCKLAKE_POSTGRES_USER:-lakekeeper}
      DUCKLAKE_POSTGRES_PASSWORD: ${DUCKLAKE_POSTGRES_PASSWORD}
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://lakehouse-garage:3900}
      AWS_REGION: ${AWS_REGION:-garage}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      USE_LOCAL_SCRAPES: ${USE_LOCAL_SCRAPES:-true}
    volumes:
      - .:/app
      - ../stedding:/stedding:ro
      - ../../.env:/app/.env:ro
      - /app/.venv
      - ./dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - dagster-storage:/opt/dagster/storage
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    networks:
      - oideachais
      - lakehouse

  # ---------------------------------------------------------------------------
  # API - FastAPI Backend with AG-UI Streaming
  # ---------------------------------------------------------------------------
  api:
    # Development: build from source. Production: use pre-built image.
    # image: ghcr.io/cianfhoghlaim/oideachais-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oideachais-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: /run/secrets/locket/secrets.env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DUCKDB_PATH: ${DUCKDB_PATH:-/app/storage/data/celtic_education.duckdb}
      LANCEDB_URI: ${LANCEDB_URI:-rest://lakehouse-lance-namespace:8182}
      LANCEDB_API_KEY: ${LANCEDB_API_KEY}
      LLM_API_KEY: ${LITELLM_MASTER_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.0-flash}
      HF_HOME: /stedding/huggingface
      HF_HUB_CACHE: /stedding/huggingface/hub
      HF_TOKEN: ${HF_TOKEN}
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_HUB_TOKEN}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - oideachais
      - lakehouse

  # ---------------------------------------------------------------------------
  # FRONTEND - TanStack Start Web Application
  # ---------------------------------------------------------------------------
  frontend:
    # Development: build from source. Production: use pre-built image.
    # image: ghcr.io/cianfhoghlaim/oideachais-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: oideachais-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    env_file:
      - path: /run/secrets/locket/secrets.env
        required: false
    environment:
      NODE_ENV: ${ENVIRONMENT:-development}
      VITE_API_URL: ${API_URL:-http://api:8000}
      VITE_API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - oideachais
      - lakehouse

  # ---------------------------------------------------------------------------
  # AI GATEWAY - LiteLLM
  # ---------------------------------------------------------------------------
  # The local litellm service that previously lived here has been REMOVED.
  # The canonical LLM gateway is in infrastructure/stacks/engineering/litellm
  # and is reachable from this network (oideachais) via the external
  # `lakehouse` bridge that the infra stack publishes.
  #
  # To start the full gateway stack:
  #   cd infrastructure/stacks/engineering/litellm
  #   docker compose -f compose.yaml -f sidecar.yaml up -d
  #
  # Inside this compose, LLM_BASE_URL=http://litellm:4000 resolves through
  # the `lakehouse` external network (see networks section below).

  # ---------------------------------------------------------------------------
  # RESEARCH - Perplexica / Vane
  # ---------------------------------------------------------------------------
  # perplexica:
  #   image: itisshams/perplexica:latest
  #   container_name: oideachais-research
  #   restart: unless-stopped
  #   environment:
  #     OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
  #     OPENAI_API_BASE: http://litellm:4000/v1
  #   networks:
  #     - oideachais
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4G

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  dagster-storage:
  oideachais-data:

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  oideachais:
    driver: bridge
  lakehouse:
    name: lakehouse_lakehouse
    external: true
