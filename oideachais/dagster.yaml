# Dagster Instance Configuration
# Celtic Education Platform - Development & Production settings
#
# Usage: Set DAGSTER_HOME to this directory before running dagster dev
#   export DAGSTER_HOME=$(pwd)
#   dagster dev -m dagster_defs.definitions

# Run coordination - queue runs to prevent resource conflicts
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 3
    dequeue_interval_seconds: 5

# Run retries - automatically retry failed runs
run_retries:
  enabled: true
  max_retries: 2

# Concurrency limits - prevent DuckDB concurrent access issues
concurrency:
  default_op_concurrency_limit: 10

# Run storage - SQLite for local development
storage:
  sqlite:
    base_dir: /opt/dagster/storage

# Compute log storage - capture stdout/stderr
compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/logs

# Local artifact storage
local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/artifacts

# Telemetry - disabled for development
telemetry:
  enabled: false

# Sensors - configuration
sensors:
  use_threads: true
  num_workers: 4

# Schedules - configuration
schedules:
  use_threads: true
  num_workers: 2

# Run launcher - default for local development
run_launcher:
  module: dagster.core.launcher.default_run_launcher
  class: DefaultRunLauncher
