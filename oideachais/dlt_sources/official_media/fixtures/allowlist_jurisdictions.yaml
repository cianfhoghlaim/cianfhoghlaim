# national information accounts. The Instagram-export filter matches
# against this list as the Stage-1 candidate classifier; the BAML
# Stage-2 fallback handles lookalike handles.
#
# Verified via Wikipedia + each body's own home page + the relevant
# Inspectorate (HMICFRS for police, HM Government for defence,
# Met Office for weather, etc.).

