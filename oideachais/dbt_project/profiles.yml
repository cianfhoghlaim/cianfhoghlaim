# dbt-duckdb profile for the `oideachais_dbt` project.
#
# Mirrors `spaces/data-engineering/dbt_project/profiles.yml` — single profile,
# two targets (dev / prod), DuckDB backend for both, MotherDuck URL for prod.
#
# The `path` is read from the `DUCKDB_DATABASE` env var (set by mise/infisical).
# This is the same env-var-swap pattern as the prior-art (A6 from
# `spaces/README.md` §1.1) so the same dbt code runs against either target
# without modification.
oideachais_dbt:
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_DATABASE', 'oideachais_dbt.duckdb') }}"
    prod:
      type: duckdb
      path: "md:oideachais?motherduck_token={{ env_var('MOTHERDUCK_TOKEN', '') }}"
  target: dev
