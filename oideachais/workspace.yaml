# Dagster workspace configuration for Oideachais
#
# The compose bind-mount exposes the host's oideachais/ as
# /app/oideachais. The actual Python source lives at
# oideachais/dagster_defs/, so working_directory is /app/oideachais
# and module_name is `dagster_defs.definitions`.
load_from:
  - python_module:
      module_name: dagster_defs.definitions
      working_directory: /app/oideachais
