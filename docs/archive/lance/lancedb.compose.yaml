
  #===========================================#
  # VECTOR SEARCH: LanceDB with Rclone Mount
  #===========================================#
  # Rclone sidecar for S3/R2 FUSE mount
  lance_s3_mounter:
    image: rclone/rclone:latest
    container_name: lance_s3_mounter
    restart: unless-stopped

    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse

    command: >
      mount r2:${R2_BUCKET:-lance-embeddings} /data/s3
      --allow-other
      --vfs-cache-mode full
      --vfs-cache-max-size 5G
      --daemon-wait 30s

    environment:
      RCLONE_CONFIG_R2_TYPE: ${RCLONE_CONFIG_R2_TYPE:-s3}
      RCLONE_CONFIG_R2_PROVIDER: ${RCLONE_CONFIG_R2_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_R2_ENDPOINT: ${AWS_ENDPOINT_URL}

    volumes:
      - type: bind
        source: ./lance_mount_point
        target: /data/s3
        bind:
          propagation: rshared

    networks:
      - data-fabric

  # LanceDB Viewer
  lancedb_viewer:
    image: lancedb/lancedb-viewer:latest
    container_name: lancedb_viewer
    restart: unless-stopped

    depends_on:
      - lance_s3_mounter

    ports:
      - "${LANCEDB_PORT:-8080}:8080"

    environment:
      LANCE_DATASET_PATH: /data/lance

    volumes:
      # Mount the S3/R2 FUSE mount from sidecar
      - type: bind
        source: ./lance_mount_point
        target: /data/lance
        bind:
          propagation: rslave

    networks:
      - data-fabric

