name: Sync an_scrudu to HF

on:
  push:
    branches: [feat/celtic-data-engineering-artefacts, feat/spaces-patterns-and-marimo, main]
    paths:
      - 'spaces/an_scrudu/**'
      - 'spaces/_common/**'
  workflow_dispatch:

jobs:
  sync:
    uses: ./.github/workflows/spaces-sync.yml
    with:
      space_dir: spaces/an_scrudu
      target_space: cianfhoghlaim/an-scrudu
      hf_token: ${{ secrets.HF_TOKEN }}
      hf_username: ${{ vars.HF_USERNAME }}
      sdk: gradio
