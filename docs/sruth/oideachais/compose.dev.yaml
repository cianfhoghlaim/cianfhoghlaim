# =============================================================================
# OIDEACHAIS - Development Overrides
# =============================================================================
# Extends compose.yaml for local development with hot-reload and debug options.
#
# USAGE:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API - Development Mode with Hot Reload
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Use builder stage for dev
    volumes:
      # Mount source code for hot-reload
      - ./api:/app/api:ro
      - ./storage:/app/storage
      - ./agents:/app/agents:ro
      - ./baml_src:/app/baml_src:ro
      # Persist data locally
      - ./storage/data:/app/storage/data
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      # Local LLM fallback (optional)
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
    command: ["uvicorn", "api.main_simple:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Remove resource limits for dev
    deploy:
      resources: {}

  # ---------------------------------------------------------------------------
  # Frontend - Development Mode with Hot Reload
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev  # Uses dev Dockerfile if available
    volumes:
      # Mount source code for hot-reload
      - ./apps/web/src:/app/src:ro
      - ./apps/web/public:/app/public:ro
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8000
      VITE_API_PUBLIC_URL: http://localhost:8000
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
