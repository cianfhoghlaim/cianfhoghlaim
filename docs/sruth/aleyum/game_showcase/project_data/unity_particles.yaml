# Unity Particle Effects
# "Anam Initiative" meteorological particle simulation

title: "Anam Particle System"
subtitle: "Meteorological Particle Simulation for Unity"
category: unity
order: 3

description: |
  The "Anam Initiative" (Irish: "soul/breath") - a weather-driven particle system
  for Unity using real-time meteorological data. Features Catmull-Rom bicubic
  interpolation for smooth wind field sampling, vector quantization for bandwidth
  optimization, and VFX Graph integration for millions of particles.

technologies:
  - Unity 2022.3 LTS
  - VFX Graph
  - Compute Shaders
  - HLSL
  - SpacetimeDB (data streaming)
  - DuckDB (weather analytics)

features:
  - Real-time weather data integration (Met Office)
  - Catmull-Rom bicubic interpolation (4-tap optimization)
  - Vector quantization (32-bit float → 8-bit RGBA)
  - Texture2DArray for temporal interpolation
  - 1M+ particle support with GPU compute
  - Lagrangian particle tracking physics

technical_details:
  interpolation: "Catmull-Rom bicubic (16→4 texture fetches)"
  compression: "Vector quantization (50% bandwidth reduction)"
  streaming: "SpacetimeDB chunks with Morton code spatial hashing"
  physics: "Lagrangian tracking with wind field sampling"

