code_samples:
  - title: "Bicubic Interpolation (HLSL)"
    language: hlsl
    code: |
      float3 SampleWindFieldBicubic(float2 uv, float time) {
          float2 texSize = float2(256, 256);
          float2 texel = 1.0 / texSize;

          // 4-tap optimization
          float2 f = frac(uv * texSize);
          float2 f2 = f * f;
          float2 f3 = f2 * f;

          // Catmull-Rom weights
          float2 w0 = -0.5*f3 + f2 - 0.5*f;
          float2 w1 =  1.5*f3 - 2.5*f2 + 1.0;
          float2 w2 = -1.5*f3 + 2.0*f2 + 0.5*f;
          float2 w3 =  0.5*f3 - 0.5*f2;

          // Optimized 4-tap sample
          float2 s0 = w0 + w1;
          float2 s1 = w2 + w3;
          float2 t0 = texel * (w1 / s0 - 1.0);
          float2 t1 = texel * (w3 / s1 + 1.0);

          return lerp(
              lerp(Sample(uv + t0.xy), Sample(uv + float2(t1.x, t0.y)), s1.x/s0.x),
              lerp(Sample(uv + float2(t0.x, t1.y)), Sample(uv + t1.xy), s1.x/s0.x),
              s1.y/s0.y
          );
      }

  - title: "VFX Graph Integration"
    language: csharp
    code: |
      public class WeatherParticleDriver : MonoBehaviour {
          [SerializeField] private VisualEffect vfx;
          [SerializeField] private Texture2DArray windFieldArray;

          void Update() {
              // Stream wind data from SpacetimeDB
              var windData = SpacetimeDB.Subscribe<WindChunk>();
              UpdateWindTexture(windData);

              vfx.SetTexture("WindField", windFieldArray);
              vfx.SetFloat("Time", Time.time);
          }
      }

