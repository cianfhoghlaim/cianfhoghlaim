# Aleyum AgentOS Configuration
# Research Agent Runtime

name: Aleyum Research AgentOS
id: aleyum-agent-os
version: "1.0.0"

# Quick prompts for common queries
quick_prompts:
  - name: "Deep Research"
    description: "Comprehensive research on a topic"
    prompt: "Research and provide a comprehensive analysis of"
    icon: "search"

  - name: "Compare Sources"
    description: "Compare multiple sources"
    prompt: "Compare and contrast information about"
    icon: "scale"

  - name: "Literature Review"
    description: "Academic literature review"
    prompt: "Conduct a literature review on"
    icon: "book-open"

  - name: "Fact Check"
    description: "Verify claims and facts"
    prompt: "Verify the accuracy of claims about"
    icon: "check-circle"

  - name: "Trend Analysis"
    description: "Analyze trends over time"
    prompt: "Analyze trends and developments in"
    icon: "trending-up"

# Agent configuration
agents:
  web-researcher:
    enabled: true
    model: gpt-4o
    description: "Performs comprehensive web research with citations"

  analyst:
    enabled: true
    model: claude-sonnet-4-20250514
    description: "Synthesizes research findings into coherent reports"

  integrator:
    enabled: true
    model: gpt-4o
    description: "Integrates data from other flows via A2A"

# Team configuration
teams:
  research-team:
    enabled: true
    model: gpt-4o
    share_member_interactions: true
    description: "Coordinated research with cross-flow integration"

# Session configuration
sessions:
  storage: sqlite
  db_file: ./storage/sessions/research_team.db
  ttl_hours: 24

# A2A configuration
a2a:
  enabled: true
  require_service_auth: false
  allowed_services:
    - oideachais
    - crypteolas
    - browser

# Cross-flow integration
cross_flow:
  oideachais:
    url: "${OIDEACHAIS_AGENT_OS_URL:-http://localhost:7772}"
    agents:
      - curriculum
      - translation
  crypteolas:
    url: "${CRYPTEOLAS_AGENT_OS_URL:-http://localhost:7771}"
    agents:
      - protocol_research
      - defi_analytics
  browser:
    url: "${BROWSER_AGENT_OS_URL:-http://localhost:7773}"
    agents:
      - browser_orchestrator

# Observability
observability:
  langfuse_enabled: true
  trace_level: info
