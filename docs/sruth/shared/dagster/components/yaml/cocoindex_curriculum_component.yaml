# CocoIndex + DSPy Curriculum Extraction Component
# Uses CocoIndex flows with DSPy for structured curriculum extraction

component: sruth.shared.dagster.components.CocoIndexFlowComponent
attributes:
  # Dagster asset configuration
  asset_key: ["curriculum", "structured_extraction"]
  group_name: "curriculum"
  flow_name: "curriculum_extraction_flow"

  # Data source: S3 bucket with curriculum PDFs
  sources:
    - type: "s3"
      bucket: "${CURRICULUM_BUCKET:-curriculum-pdfs}"
      prefix: "${CURRICULUM_PREFIX:-ncca/}"
      included_patterns: ["*.pdf"]
      binary: true

  # Transformations: DSPy extraction
  transformations:
    - type: "dspy"
      module: "sruth.shared.extraction.dspy_modules"
      class_name: "CurriculumExtractor"
      model: "${OPENAI_MODEL:-openai/gpt-4o}"

    - type: "split"
      chunk_size: 1000
      chunk_overlap: 200

    - type: "embed"
      embedding_model: "${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}"
      batch_size: 100
      dimension: 384

  # Export targets
  exports:
    - type: "postgres"
      table: "curriculum_structured"
      namespace: "curriculum"
      primary_key: "id"

    - type: "lancedb"
      namespace: "curriculum_embeddings"
      metric: "cosine"

  # Scheduling
  schedule_cron: "0 2 * * *"  # Daily at 2 AM
  schedule_timezone: "Europe/Dublin"

