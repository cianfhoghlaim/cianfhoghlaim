# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
#
# S3 Source:
#   AWS_ACCESS_KEY_ID     - S3 access key
#   AWS_SECRET_ACCESS_KEY - S3 secret key
#   CURRICULUM_BUCKET      - S3 bucket name
#   CURRICULUM_PREFIX      - S3 prefix/folder
#
# DSPy Extraction:
#   OPENAI_API_KEY         - OpenAI API key (or other LLM provider)
#   OPENAI_MODEL           - Model to use (default: gpt-4o)
#
# Embeddings:
#   EMBEDDING_MODEL        - Sentence transformer model
#
# PostgreSQL Export:
#   PLANETSCALE_HOST       - PostgreSQL host
#   PLANETSCALE_DATABASE   - Database name
#   PLANETSCALE_USER       - Username
#   PLANETSCALE_PASSWORD   - Password
#
# LanceDB Export:
#   LANCEDB_URI            - LanceDB connection string
#   LANCEDB_API_KEY        - LanceDB API key (if using cloud)
#
# ============================================================================
# COMPONENT ARCHITECTURE
# ============================================================================
#
# ┌────────────────────────────────────────────────────────────────────┐
# │                        S3 Source (PDFs)                           │
# │  curriculum-pdfs/ncca/*.pdf                                       │
# └────────────────────────────┬─────────────────────────────────────┘
#                              │
#                              ▼
# ┌────────────────────────────────────────────────────────────────────┐
# │                    DSPy Extraction                               │
# │  CurriculumExtractor -> CurriculumEntity                          │
# │  - title, subject, level, strand                                  │
# │  - learning_outcomes                                               │
# └────────────────────────────┬─────────────────────────────────────┘
#                              │
#                              ▼
# ┌────────────────────────────────────────────────────────────────────┐
# │                    Text Splitting                                 │
# │  SplitRecursively(chunk_size=1000, overlap=200)                   │
# └────────────────────────────┬─────────────────────────────────────┘
#                              │
#                              ▼
# ┌────────────────────────────────────────────────────────────────────┐
# │                    Embedding Generation                          │
# │  SentenceTransformerEmbed(BAAI/bge-small-en-v1.5)                 │
# └────────────────────────────┬─────────────────────────────────────┘
#                              │
#               ┌──────────────┴──────────────┐
#               ▼                             ▼
# ┌──────────────────────────┐    ┌──────────────────────────┐
# │   PostgreSQL Export      │    │    LanceDB Export        │
# │   (PlanetScale)           │    │    (Vector Search)       │
# │   - curriculum_structured │    │    - curriculum_embeddings│
# └──────────────────────────┘    └──────────────────────────┘
#           (OLTP)                          (Vector)
#
# ============================================================================
# DSPy MODULES AVAILABLE
# ============================================================================
#
# From sruth.shared.extraction:
#
# 1. CurriculumExtractor
#    - Extracts curriculum data from documents
#    - Returns: CurriculumEntity with strand, strand_unit, learning_outcomes
#
# 2. ExamExtractor
#    - Extracts exam metadata from SEC papers
#    - Returns: ExamPaper with year, subject, level, questions
#
# 3. StructuredExtractor
#    - Generic extractor with configurable Pydantic schema
#    - Use for custom data models
#
# 4. VisionExtractor
#    - Multi-modal extraction from images/PDFs
#    - Uses vision models for document understanding
#
# ============================================================================
# CUSTOMIZATION
# ============================================================================
#
# To customize for different data sources:
#
# 1. Change source configuration:
