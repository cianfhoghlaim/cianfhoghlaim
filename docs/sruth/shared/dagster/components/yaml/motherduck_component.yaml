# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
#
# MotherDuck:
#   MOTHERDUCK_TOKEN      - Service account token (required)
#   MOTHERDUCK_DATABASE   - Database name (default: sruth_analytics)
#
# PlanetScale (optional - for hybrid OLTP/OLAP):
#   PLANETSCALE_HOST      - Database host (e.g., xxx.us-east-1.psdb.cloud)
#   PLANETSCALE_DATABASE  - Database name
#   PLANETSCALE_USER      - Username
#   PLANETSCALE_PASSWORD  - Password or password token
#
# ============================================================================
# ARCHITECTURE
# ============================================================================
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │                         Dagster Assets                             │
# ├─────────────────────────────────────────────────────────────────────┤
# │  ┌──────────────────┐         ┌──────────────────┐                │
# │  │  OLTP Workloads  │         │  OLAP Workloads  │                │
# │  │  (transactions)  │         │  (analytics)     │                │
# │  └────────┬─────────┘         └────────┬─────────┘                │
# │           │                              │                           │
# │           ▼                              ▼                           │
# │  ┌──────────────────┐         ┌──────────────────┐                │
# │  │   PlanetScale    │────────▶│   MotherDuck     │                │
# │  │   PostgreSQL     │  attach │   DuckDB Cloud  │                │
# │  └──────────────────┘         └──────────────────┘                │
# │            ▲                                                    │   │
# │            │ (sync)                                             │   │
# │            │                                                    │   │
# │  ┌─────────┴─────────┐                                        │   │
# │  │  Transaction Log  │                                        │   │
# │  └───────────────────┘                                        │   │
# └─────────────────────────────────────────────────────────────────────┘
#
# Benefits:
# - PlanetScale: Strong consistency, row-level locking, foreign keys
# - MotherDuck: Columnar storage, vectorized execution, parallel queries
# - Hybrid: Query PlanetScale data from MotherDuck via pg_duckdb
#
# ============================================================================
# HYBRID QUERY PATTERNS
# ============================================================================
#
# 1. Direct PlanetScale query (OLTP):
#    - Use for: single-row lookups, transactions, writes
#    - Connect directly to PlanetScale via PostgreSQL client
#
# 2. Direct MotherDuck query (OLAP):
#    - Use for: aggregations, analytics, large scans
#    - Connect via MotherDuck resource
#
# 3. Hybrid query (JOIN):
#    - Use for: combining transactional + analytical data
#    - Run in MotherDuck, JOIN with pscale.* tables
#
# 4. Sync pattern:
#    - Schedule regular sync from PlanetScale to MotherDuck
#    - Enables fast analytics on recent transactional data
#    - Reduces load on PlanetScale for analytical queries
