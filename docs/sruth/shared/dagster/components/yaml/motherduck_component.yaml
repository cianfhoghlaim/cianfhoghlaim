# MotherDuck + PlanetScale Hybrid Storage Component
# Configures MotherDuck for OLAP analytics with optional PlanetScale attachment for OLTP

component: sruth.shared.dagster.components.MotherDuckComponent
attributes:
  # Resource name
  name: "motherduck_io"

  # MotherDuck configuration
  token: "${MOTHERDUCK_TOKEN}"
  database: "${MOTHERDUCK_DATABASE:-sruth_analytics}"

  # Schemas to create
  schemas:
    - "curriculum"
    - "exam_materials"
    - "embeddings"
    - "analytics"

  # PlanetScale integration for hybrid OLTP/OLAP
  # When attached, you can query PlanetScale tables from MotherDuck using 'pscale.' prefix
  planetscale_host: "${PLANETSCALE_HOST}"
  planetscale_database: "${PLANETSCALE_DATABASE}"
  planetscale_user: "${PLANETSCALE_USER}"
  planetscale_password: "${PLANETSCALE_PASSWORD}"

  # Auto-initialize schemas on component load
  init_schemas: true

