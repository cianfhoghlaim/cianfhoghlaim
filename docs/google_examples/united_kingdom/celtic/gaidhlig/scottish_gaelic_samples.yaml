# =============================================================================
# DICTIONARY SAMPLES (Faclair na Gàidhlig)
# =============================================================================
faclair_samples:
  source: "https://www.faclair.ac.uk/"
  description: "Sample entries from Historical Dictionary of Scottish Gaelic"

  entries:
    - headword: "beatha"
      part_of_speech: "noun, feminine"
      meanings:
        - number: 1
          definition: "life"
          examples:
            - gaelic: "fad do bheatha"
              english: "throughout your life"
        - number: 2
          definition: "livelihood, sustenance"
          examples:
            - gaelic: "a' cosnadh a bheatha"
              english: "earning his living"
      cognates:
        irish: "beatha"
        welsh: "bywyd"

    - headword: "taigh"
      part_of_speech: "noun, masculine"
      meanings:
        - number: 1
          definition: "house, building"
          examples:
            - gaelic: "taigh mòr"
              english: "big house"
            - gaelic: "taigh-òsta"
              english: "hotel, inn"
      genitive: "taighe"
      plural: "taighean"

    - headword: "sgeul"
      part_of_speech: "noun, masculine"
      meanings:
        - number: 1
          definition: "story, tale"
          examples:
            - gaelic: "sgeulachd"
              english: "a story, narrative"
      related:
        - "sgeulachd (story)"
        - "sgeulaiche (storyteller)"

