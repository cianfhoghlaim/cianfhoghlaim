  source: "https://dasg.ac.uk/corpus/"
  description: "Sample texts from Digital Archive of Scottish Gaelic"

  texts:
    - id: "CNG-001"
      title: "Contemporary prose"
      period: "21st century"
      text: "Bha e a' coiseachd tro na sràidean falamh nuair a chunnaic e an solus."
      translation: "He was walking through the empty streets when he saw the light."
      genre: "Fiction"

    - id: "CNG-002"
      title: "Historical text"
      period: "19th century"
      text: "Tha an tìr seo làn de shean eachdraidh agus de sheann sgeulachdan."
      translation: "This land is full of old history and ancient tales."
      genre: "Non-fiction"

    - id: "CNG-003"
      title: "Gairm archive"
      period: "1950s-2000s"
      text: "Tha a' Ghàidhlig beò fhathast, agus bidh i beò fad linntean eile."
      translation: "Gaelic is still alive, and it will live for generations more."
      source: "Gairm magazine"

