[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_RPC_URL}"
base_sepolia = "${BASE_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "arbitrum-sepolia" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "base-sepolia" }
