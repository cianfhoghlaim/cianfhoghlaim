      name: "ABAIR TTS"
      url: "https://www.abair.ie"
      provider: "Trinity College Dublin"
      type: "Text-to-Speech"
      dialects:
        - name: "Connacht"
          voices: ["male", "female"]
        - name: "Munster"
          voices: ["male", "female"]
        - name: "Ulster"
          voices: ["male", "female"]
      features:
        - "High-quality synthesis"
        - "Dialect support"
        - "API access"

    - id: abair_asr
      name: "ABAIR ASR"
      url: "https://www.abair.ie/recognition"
      provider: "Trinity College Dublin"
      type: "Automatic Speech Recognition"
      accuracy: "Varies by dialect/speaker"

  scottish_gaelic:
    - id: eist_asr
      name: "ÈIST ASR"
      url: "https://blogs.ed.ac.uk/garg/2025/06/04/gaelic-in-the-digital-age-inside-the-eist-project/"
      provider: "University of Edinburgh / GARG"
      type: "Automatic Speech Recognition"
      accuracy: "~90% for broadcast content"
      training_data:
        - "BBC ALBA broadcasts"
        - "Radio nan Gàidheal"
        - "Tobar an Dualchais folklore"
      features:
        - "Code-switching (Gaelic-English)"
        - "Subtitle generation"
        - "Multiple speaker types"
      api_status: "Coming Autumn 2025"
      funding:
        - "Scottish Government"
        - "Bòrd na Gàidhlig"
      partners:
        - "NVIDIA"
        - "BBC ALBA"
        - "University of Glasgow"
      pi: "Prof William Lamb"

  welsh:
    - id: macsen_asr
      name: "Macsen ASR"
      url: "https://techiaith.cymru/products/macsen/?lang=en"
      provider: "Techiaith / Bangor University"
      type: "Voice Assistant ASR"
      features:
        - "Local processing"
        - "Open source"

    - id: trawsgrifiwr
      name: "Trawsgrifiwr"
      url: "https://trawsgrifiwr.techiaith.cymru/"
      provider: "Techiaith"
      type: "Speech transcription"

  breton:
    - id: breton_tts
      name: "Breton TTS Corpus Model"
      url: "https://hal.science/hal-03944464"
      provider: "Academic research"
      type: "Text-to-Speech"
      training_data: "20 hours read speech"
      speakers: 2

  manx:
    - id: manx_asr
      name: "Manx ASR (Research)"
      url: "https://arxiv.org/html/2510.04832v1"
      provider: "Academic research"
      type: "ASR research"
      finding: "40 minutes of pronunciation data produces usable ASR"
      significance: "Demonstrates viability of ASR for extremely low-resource languages"

# =============================================================================
# TRANSLATION MODELS
# =============================================================================
translation_models:
  - id: seamless_m4t
    name: "Seamless Communication (Meta)"
    url: "https://ai.meta.com/research/seamless-communication/"
    provider: "Meta AI"
    type: "Multilingual translation + S2T"
    celtic_languages: ["ga", "cy"]
    features:
      - "Speech-to-text"
      - "Text-to-text translation"

  - id: nllb
    name: "NLLB (No Language Left Behind)"
    url: "https://huggingface.co/facebook/nllb-200-distilled-600M"
    provider: "Meta AI"
    celtic_languages: ["ga", "gd", "cy", "br"]
    notes: "200 language translation model"

  - id: intergaelic
    name: "Intergaelic"
    url: "http://www.intergaelic.com/gd-ga/trans/"
    provider: "Kevin Scannell"
    type: "Rule-based + statistical"
    language_pairs:
      - ["ga", "gd"]
      - ["ga", "gv"]
      - ["gd", "gv"]

# =============================================================================
# BENCHMARKS AND DATASETS
# =============================================================================
benchmarks:
  - id: irish_blimp
    name: "Irish-BLiMP"
    description: "Benchmark of Linguistic Minimal Pairs for Irish"
    url: "Research paper"
    size: "1020 minimal pairs"
    features: 11
    categories:
      - "Agreement (subject-verb, noun-adjective)"
      - "Mutation (lenition, eclipsis)"
      - "Case (genitive, dative)"
      - "Definiteness"
    results:
      human_baseline: 90.1
      gpt5: 73.5
      llama3_70b: 67.8
    significance: "Reveals LLMs rely on pattern matching rather than grammatical understanding"

  - id: lc2024
    name: "LC2024"
    description: "First Irish mathematical reasoning benchmark"
    source: "Leaving Certificate exam questions"
    size: 55
    topics:
      - "Algebra"
      - "Geometry"
      - "Trigonometry"
      - "Statistics"
    use: "Evaluating mathematical reasoning in Irish"

  - id: briteval
    name: "BritEval"
    description: "Benchmark for British Isles languages"
    url: "https://llm.org.uk/"
    provider: "BritLLM/UCL"
    languages: ["ga", "gd", "cy", "sco"]
    components:
      - name: "ARC-e"
        type: "Grade-school science (translated)"
      - name: "PIQA"
        type: "Physical commonsense reasoning"
      - name: "XNLI"
        type: "Natural language inference"

datasets:
  - id: culturax_ga
    name: "CulturaX-ga"
    description: "Large-scale Irish web crawl"
    use: "Pre-training Irish LLMs"

  - id: qomhra_30k
    name: "Qomhrá 30K"
    description: "Synthetic Irish instruction pairs"
    size: 30000
    use: "Instruction tuning"

  - id: arcosg
    name: "ARCOSG"
    description: "Annotated Reference Corpus of Scottish Gaelic"
    url: "https://github.com/Gaelic-Algorithmic-Research-Group/ARCOSG"
    format: "CoNLL, XML"
    tokens: "100000+"

  - id: corcencc
    name: "CorCenCC"
    description: "National Corpus of Contemporary Welsh"
    url: "https://corcencc.org/"
    size: "13.5M tokens"
    features: ["Written", "Spoken", "POS-tagged"]

