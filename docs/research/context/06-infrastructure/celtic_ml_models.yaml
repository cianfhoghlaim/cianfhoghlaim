# Celtic Language ML Models Registry
# Generated: 2025-12-17
# Comprehensive catalog of ML models for Celtic languages

metadata:
  title: "Celtic Language ML Models"
  version: "1.0.0"
  generated: "2025-12-17"
  total_models: 25
  languages:
    - ga  # Irish
    - gd  # Scottish Gaelic
    - cy  # Welsh
    - br  # Breton
    - kw  # Cornish
    - gv  # Manx

# =============================================================================
# LARGE LANGUAGE MODELS
# =============================================================================
large_language_models:
  multilingual:
    - id: eurollm_22b
      name: "EuroLLM-22B-Instruct"
      url: "https://huggingface.co/utter-project/EuroLLM-22B-Instruct-2512"
      provider: "UTTER Project (EU)"
      parameters: "22.6B"
      celtic_languages: ["ga"]
      all_languages: ["bg", "hr", "cs", "da", "nl", "en", "et", "fi", "fr", "de", "el", "hu", "ga", "it", "lv", "lt", "mt", "pl", "pt", "ro", "sk", "sl", "es", "sv"]
      training_tokens: "4T"
      architecture:
        type: "Dense Transformer"
        layers: 56
        embedding_size: 6144
        attention: "GQA"
        context_length: 32768
      license: "Apache 2.0"
      use_cases:
        - "Instruction following"
        - "Translation (EU languages)"
        - "Multilingual generation"
      released: "2025-12-14"

    - id: caernarfon_3b
      name: "BritLLM Caernarfon 3B"
      url: "https://huggingface.co/britllm/britllm-3b-v0.1"
      provider: "UCL NLP"
      parameters: "3B"
      celtic_languages: ["ga", "gd", "cy"]
      other_languages: ["en", "sco"]
      training_tokens: "1.4T"
      training_data:
        english: "SlimPajama (627B) + synthetic QA/MC"
        celtic: "Wikipedia + NLLB parallel data (~1B unique tokens)"
      benchmarks:
        briteval_irish:
          mean: 46.2
          arc_e: 40.8
          piqa: 60.1
          xnli: 37.7
        briteval_welsh:
          mean: 55.2
          arc_e: 56.7
          piqa: 65.0
          xnli: 43.9
        briteval_scottish_gaelic:
          mean: 42.1
          arc_e: 32.0
          piqa: 55.9
          xnli: 38.3
      license: "ODC-By 1.0"
      use_cases:
        - "General Celtic language tasks"
        - "British Isles multilingual applications"

  irish_specific:
    - id: uccix_llama2_13b
      name: "UCCIX-Llama2-13B"
      url: "https://huggingface.co/UCC-NLP/UCCIX-Llama2-13B"
      provider: "UCC NLP"
      parameters: "13B"
      base_model: "Llama 2 13B"
      language: "ga"
      training_method: "Continued pre-training + instruction tuning"
      key_features:
        - "Irish-enhanced vocabulary"
        - "Strong Irish generation"
      research_paper: "Reasoning Transfer for Extremely Low-Resource Languages"

    - id: qomhra
      name: "Qomhrá-Mistral-7B"
      url: "https://huggingface.co/Qomhraiche/Qomhra-Mistral-7B"
      provider: "Qomhraiche"
      parameters: "7B"
      base_model: "Mistral 7B"
      language: "ga"
      training_dataset: "Qomhrá 30K (synthetic instruction pairs)"
      training_time: "88 GPU hours (2x H100)"
      use_cases:
        - "Irish conversational AI"
        - "Irish instruction following"

    - id: salamandra_2b_irish
      name: "Salamandra 2B Irish"
      url: "https://huggingface.co/BSC-LT/salamandra-2b"
      provider: "Barcelona Supercomputing Center"
      parameters: "2B"
      celtic_languages: ["ga"]
      notes: "Multilingual model with Irish support"

