version: '3.8'

services:
  # Dragonfly - High-performance Redis alternative
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: data-unified-dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonfly-data:/data
    command:
      - --logtostderr
      - --requirepass=
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Redis (alternative to Dragonfly)
  # Uncomment to use Redis instead
  # redis:
  #   image: redis:7-alpine
  #   container_name: data-unified-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   command: redis-server --appendonly yes
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   restart: unless-stopped

  # PostgreSQL (optional - for persistent storage)
  postgres:
    image: postgres:16-alpine
    container_name: data-unified-postgres
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  dragonfly-data:
    driver: local
  # redis-data:
  #   driver: local
  postgres-data:
    driver: local
