# Crypto Data Sources Configuration
# Adapted from github-intelligence patterns for cryptocurrency analytics
# Version: 2.0

defaults:
  chunk_size: 1000
  chunk_overlap: 200
  min_chunk_size: 300
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  days_back: 30
  rate_limit:
    requests_per_second: 5
    retry_attempts: 3
    retry_backoff: 2.0

databases:
  duckdb:
    path: "./data/crypto_analytics.duckdb"
    dataset_name: "crypto_raw"
  lancedb:
    uri: "./data/crypto_vectors.lancedb"
    table_prefix: "crypto_"
  memgraph:
    host: "localhost"
    port: 7687
    database: "crypto_knowledge"
  falkordb:
    host: "localhost"
    port: 6379
    database: "crypto_temporal"

# =============================================================================
# REST API SOURCES
# =============================================================================
api_sources:
  # ---------------------------------------------------------------------------
  # COINGECKO - Price and Market Data
  # ---------------------------------------------------------------------------
  coingecko:
    name: "CoinGecko"
    base_url: "https://api.coingecko.com/api/v3"
    auth:
      type: "api_key"
      header: "x-cg-demo-api-key"
      secret_key: "sources.coingecko.api_key"
    rate_limit:
      requests_per_minute: 30  # Free tier
    openapi_spec: "https://raw.githubusercontent.com/coingecko/coingecko-api-oas/main/coingecko-public-api-v3.json"

    resources:
      usde_price:
        endpoint: "/coins/ethena-usde/market_chart"
        params:
          vs_currency: "usd"
          days: "max"
        primary_key: ["timestamp"]
        write_disposition: "merge"
        incremental:
          cursor_path: "timestamp"
          initial_value: "2024-01-01T00:00:00Z"
        transform:
          data_selector: "$.prices[*]"
          mappings:
            timestamp: "[0]"
            value: "[1]"
          static_fields:
            metric: "price"
            asset: "USDe"
            protocol: "Ethena"
            units: "USD"
        schedule: "*/5 * * * *"  # Every 5 minutes

      susde_price:
        endpoint: "/coins/ethena-staked-usde/market_chart"
        params:
          vs_currency: "usd"
          days: "max"
        primary_key: ["timestamp"]
        write_disposition: "merge"
        incremental:
          cursor_path: "timestamp"
          initial_value: "2024-01-01T00:00:00Z"
        transform:
          data_selector: "$.prices[*]"
          mappings:
            timestamp: "[0]"
            value: "[1]"
          static_fields:
            metric: "price"
            asset: "sUSDe"
            protocol: "Ethena"
            units: "USD"
        schedule: "*/5 * * * *"

      eth_price:
        endpoint: "/coins/ethereum/market_chart"
        params:
          vs_currency: "usd"
          days: "max"
        primary_key: ["timestamp"]
        write_disposition: "merge"
        transform:
          data_selector: "$.prices[*]"
        schedule: "*/5 * * * *"

  # ---------------------------------------------------------------------------
  # DEFILLAMA - TVL and Yields
  # ---------------------------------------------------------------------------
  defillama:
    name: "DeFiLlama"
    base_url: "https://api.llama.fi"
    auth:
      type: "none"
    rate_limit:
      requests_per_minute: 60

    resources:
      ethena_tvl:
        endpoint: "/protocol/ethena"
        primary_key: ["timestamp", "protocol"]
        write_disposition: "merge"
        transform:
          data_selector: "$.tvl[*]"
          mappings:
            timestamp: "$.date"
            value: "$.totalLiquidityUSD"
          static_fields:
            metric: "TVL"
            protocol: "Ethena"
            units: "USD"
        schedule: "0 * * * *"  # Hourly

      usde_supply:
        endpoint: "/stablecoin/USDe"
        params:
          includeChains: "true"
        primary_key: ["timestamp", "asset"]
        write_disposition: "merge"
        transform:
          data_selector: "$.peggedSeries.usd_mcap[*]"
        schedule: "0 0 * * *"  # Daily

      yields_pools:
        endpoint: "/pools"
        base_url: "https://yields.llama.fi"
        primary_key: ["chain", "project", "symbol", "pool"]
        write_disposition: "merge"
        transform:
          data_selector: "$.data[*]"
        schedule: "*/30 * * * *"  # Every 30 minutes

      susde_yield:
        endpoint: "/chart/66985a81-9c51-46ca-9977-42b4fe7bc6df"
        base_url: "https://yields.llama.fi"
        primary_key: ["timestamp"]
        write_disposition: "merge"
        transform:
          data_selector: "$.data[*]"
          mappings:
            timestamp: "$.timestamp"
            value: "$.apy"
          static_fields:
            metric: "sUSDe_APY"
            asset: "sUSDe"
            protocol: "Ethena"
            units: "percent"
        schedule: "*/30 * * * *"

  # ---------------------------------------------------------------------------
  # BINANCE - Funding Rates
  # ---------------------------------------------------------------------------
  binance:
    name: "Binance Futures"
    base_url: "https://fapi.binance.com"
    auth:
      type: "none"  # Public endpoints
    rate_limit:
      requests_per_minute: 1200

    resources:
      eth_funding_rate:
        endpoint: "/fapi/v1/fundingRate"
        params:
          symbol: "ETHUSDT"
          limit: 1000
        primary_key: ["fundingTime", "symbol"]
        write_disposition: "merge"
        incremental:
          cursor_path: "fundingTime"
          initial_value: 1704067200000  # 2024-01-01 in ms
        transform:
          data_selector: "$[*]"
          mappings:
            timestamp: "$.fundingTime"
            value: "$.fundingRate"
          static_fields:
            metric: "funding_rate_8h"
            asset: "ETH-PERP"
            exchange: "Binance"
            units: "decimal"
        schedule: "0 */8 * * *"  # Every 8 hours

      btc_funding_rate:
        endpoint: "/fapi/v1/fundingRate"
        params:
          symbol: "BTCUSDT"
          limit: 1000
        primary_key: ["fundingTime", "symbol"]
        write_disposition: "merge"
        incremental:
          cursor_path: "fundingTime"
        transform:
          static_fields:
            asset: "BTC-PERP"
            exchange: "Binance"
        schedule: "0 */8 * * *"

  # ---------------------------------------------------------------------------
  # BYBIT - Additional Funding Data
  # ---------------------------------------------------------------------------
  bybit:
    name: "Bybit"
    base_url: "https://api.bybit.com"
    auth:
      type: "none"
    rate_limit:
      requests_per_minute: 120

    resources:
      eth_funding_history:
        endpoint: "/v5/market/history-fund-rate"
        params:
          category: "linear"
          symbol: "ETHUSDT"
        primary_key: ["fundingRateTimestamp", "symbol"]
        write_disposition: "merge"
        transform:
          data_selector: "$.result.list[*]"
          static_fields:
            exchange: "Bybit"
        schedule: "0 */8 * * *"

  # ---------------------------------------------------------------------------
  # OKX - Additional Funding Data
  # ---------------------------------------------------------------------------
  okx:
    name: "OKX"
    base_url: "https://www.okx.com/api/v5"
    auth:
      type: "none"
    rate_limit:
      requests_per_minute: 60

    resources:
      eth_funding_history:
        endpoint: "/public/funding-rate-history"
        params:
          instId: "ETH-USDT-SWAP"
          limit: 100
        primary_key: ["fundingTime", "instId"]
        write_disposition: "merge"
        transform:
          data_selector: "$.data[*]"
          static_fields:
            exchange: "OKX"
        schedule: "0 */8 * * *"

  # ---------------------------------------------------------------------------
  # BEACONCHAIN - Ethereum Staking
  # ---------------------------------------------------------------------------
  beaconchain:
    name: "Beaconcha.in"
    base_url: "https://beaconcha.in/api/v1"
    auth:
      type: "api_key"
      header: "apikey"
      secret_key: "sources.beaconchain.api_key"
    rate_limit:
      requests_per_minute: 10
    openapi_spec: "https://beaconcha.in/api/v1/docs/doc.json"

    resources:
      eth_staking_apr:
        endpoint: "/ethstore/latest"
        primary_key: ["timestamp"]
        write_disposition: "merge"
        transform:
          data_selector: "$"
        schedule: "0 0 * * *"  # Daily

# =============================================================================
# GRAPHQL SUBGRAPH SOURCES
# =============================================================================
subgraph_sources:
  aave_v3_mainnet:
    name: "Aave v3 Mainnet"
    endpoint: "https://api.thegraph.com/subgraphs/name/aave/protocol-v3"

    queries:
      reserves:
        query: |
          query Reserves($lastUpdated: Int!) {
            reserves(
              first: 1000
              orderBy: lastUpdateTimestamp
              orderDirection: asc
              where: { lastUpdateTimestamp_gte: $lastUpdated }
            ) {
              id
              name
              symbol
              lastUpdateTimestamp
              liquidityRate
              variableBorrowRate
              totalATokenSupply
              totalCurrentVariableDebt
              utilizationRate
            }
          }
        variables:
          lastUpdated: "{incremental.start_value}"
        primary_key: ["id"]
        write_disposition: "merge"
        incremental:
          cursor_path: "lastUpdateTimestamp"
          initial_value: 1704067200
        transform:
          data_selector: "$.data.reserves[*]"
          computed_fields:
            supplyAPR: "liquidityRate / 1e27"
            borrowAPR: "variableBorrowRate / 1e27"
            utilization: "totalCurrentVariableDebt / totalATokenSupply"
        schedule: "*/5 * * * *"

  pendle_mainnet:
    name: "Pendle Mainnet"
    endpoint: "https://api.thegraph.com/subgraphs/name/pendle-finance/core-mainnet"

    queries:
      markets:
        query: |
          query Markets($minExpiry: Int!) {
            markets(
              first: 100
              where: { expiry_gt: $minExpiry }
            ) {
              id
              expiry
              pt {
                id
                symbol
                priceUSD
              }
              yt {
                id
                symbol
              }
              sy {
                id
                symbol
              }
              totalPt
              totalSy
              impliedApy
            }
          }
        variables:
          minExpiry: "{current_timestamp}"
        primary_key: ["id"]
        write_disposition: "merge"
        transform:
          data_selector: "$.data.markets[*]"
        schedule: "*/30 * * * *"

# =============================================================================
# DOCUMENTATION SOURCES (for Firecrawl/Crawl4AI scraping)
# =============================================================================
documentation_sources:
  ethena:
    name: "Ethena Documentation"
    base_url: "https://docs.ethena.fi"
    scrape_config:
      tool: "firecrawl"  # or "crawl4ai"
      max_depth: 3
      include_patterns:
        - "*.md"
        - "*.html"
      exclude_patterns:
        - "**/api-reference/**"
        - "**/changelog/**"

    targets:
      whitepaper:
        path: "/"
        doc_type: "whitepaper"
        extraction_goals:
          - "mechanism_overview"
          - "tokenomics"
          - "risk_factors"

      reserve_fund:
        path: "/reserve-fund"
        doc_type: "risk_report"
        extraction_goals:
          - "insurance_fund_size"
          - "stress_scenarios"
          - "liquidity_waterfalls"

      audits:
        path: "/security/audits"
        doc_type: "audit"
        extraction_goals:
          - "audit_scope"
          - "critical_findings"
          - "remediations"
        follow_pdf_links: true

  aave:
    name: "Aave Documentation"
    base_url: "https://docs.aave.com"
    scrape_config:
      tool: "firecrawl"
      max_depth: 2

    targets:
      risk_parameters:
        path: "/risk"
        doc_type: "risk_docs"
        extraction_goals:
          - "LTV"
          - "liquidation_threshold"
          - "emode_params"
          - "rate_model_kinks"

      addresses:
        path: "/developers/deployed-contracts"
        doc_type: "config"
        extraction_goals:
          - "contract_addresses"
          - "chain_deployments"

  pendle:
    name: "Pendle Documentation"
    base_url: "https://docs.pendle.finance"
    scrape_config:
      tool: "firecrawl"
      max_depth: 2

    targets:
      concepts:
        path: "/Introduction"
        doc_type: "whitepaper"
        extraction_goals:
          - "pt_yt_definitions"
          - "amm_math"
          - "yield_tokenization"

      api:
        path: "/Developers"
        doc_type: "api_docs"
        extraction_goals:
          - "endpoints"
          - "rate_limits"

# =============================================================================
# PDF DOCUMENT SOURCES (direct downloads)
# =============================================================================
pdf_sources:
  ethena_audits:
    name: "Ethena Audit Reports"
    documents:
      - name: "Zellic Audit"
        url: "https://docs.ethena.fi/audits/zellic-audit.pdf"
        doc_type: "audit"
