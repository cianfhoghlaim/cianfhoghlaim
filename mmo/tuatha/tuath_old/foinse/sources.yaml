      - name: "Spearbit Audit"
        url: "https://docs.ethena.fi/audits/spearbit-audit.pdf"
        doc_type: "audit"
        protocol: "Ethena"

  research_reports:
    name: "Research Reports"
    documents:
      - name: "21Shares Pendle One-Pager"
        url: "https://21shares.com/research/pendle-onepager.pdf"
        doc_type: "research"
        protocol: "Pendle"

# =============================================================================
# KNOWLEDGE GRAPH SCHEMA
# =============================================================================
knowledge_graph:
  entity_types:
    Token:
      properties:
        - symbol
        - name
        - contract_address
        - blockchain
        - decimals
        - token_type
      temporal_properties:
        - price_usd
        - market_cap
        - daily_volume

    Protocol:
      properties:
        - name
        - category
        - chains
        - governance_token
        - website
      temporal_properties:
        - tvl_usd
        - daily_active_users
        - revenue_24h

    Exchange:
      properties:
        - name
        - type
        - chains
      temporal_properties:
        - daily_volume_usd
        - open_interest_usd

    LiquidityPool:
      properties:
        - address
        - protocol
        - tokens
        - fee_tier
        - pool_type
      temporal_properties:
        - tvl_usd
        - volume_24h
        - apy

    Document:
      properties:
        - title
        - doc_type
        - url
        - published_date
        - protocol
      content_fields:
        - sections
        - extracted_entities
        - risk_factors

    Risk:
      properties:
        - category
        - severity
        - title
        - description
        - mitigation

    MarketEvent:
      properties:
        - event_type
        - title
        - description
        - impact
        - affected_protocols
      temporal: true

  relationship_types:
    DEPLOYED_ON:
      from: Token
      to: Blockchain
      properties: [deploy_block, deploy_date]

    TRADES_ON:
      from: Token
      to: Exchange
      properties: [listing_date, trading_pair, volume_24h]

    GOVERNANCE_FOR:
      from: Token
      to: Protocol
      properties: [voting_power_formula]

    IN_POOL:
      from: Token
      to: LiquidityPool
      properties: [weight, reserve_amount]

    INTEGRATES:
      from: Protocol
      to: Protocol
      properties: [integration_type, dependency_level]

    AUDITED_BY:
      from: Protocol
      to: Document
      properties: [audit_date, scope]

    DESCRIBES:
      from: Document
      to: Protocol
      properties: [coverage_depth]

    IDENTIFIES_RISK:
      from: Document
      to: Risk
      properties: [finding_id, page]

    AFFECTS:
      from: MarketEvent
      to: Protocol
      properties: [impact_severity, duration]
      temporal: true

# =============================================================================
# ENTITY EXTRACTION MAPPING
# =============================================================================
source_to_entity_mapping:
  coingecko_*: [Token]
  defillama_protocol_*: [Protocol]
  defillama_yields_*: [LiquidityPool]
  binance_*: [Exchange, Token]
  bybit_*: [Exchange]
  okx_*: [Exchange]
  aave_v3_*: [Protocol, LiquidityPool]
  pendle_*: [Protocol, LiquidityPool]
  "*_audit*": [Document, Risk]
  "*_whitepaper*": [Document]
  "*_event_*": [MarketEvent]

# =============================================================================
# COMPLIANCE & QUALITY
# =============================================================================
compliance:
  notes:
    - "Honor robots.txt and ToS for every site"
    - "Prefer official APIs over HTML scraping"
    - "Throttle scrapes and cache responses"
    - "Record subgraph deployment IDs"
    - "Normalize timestamps to UTC"
    - "Store APR/APY in decimal format (0.05 = 5%)"

  quality_scoring:
    technical_depth: 0.25
    tokenomics_clarity: 0.20
    governance_detail: 0.25
    risk_disclosure: 0.15
    recency: 0.15
