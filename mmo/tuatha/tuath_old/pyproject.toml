[project]
name = "fibo"
requires-python = ">=3.11,<3.14"
version = "0.1.0"
dependencies = [
    "dagster==1.12.6",
    "dlt[duckdb,ducklake,filesystem,lancedb,pyiceberg,workspace]>=1.20.0",
    "gradio>=6.1.0",
    "ibis-framework[duckdb]>=11.0.0",
    "mlx-vlm>=0.3.9",
    "transformers>=4.57.3",
    # EduVision additional dependencies
    "baml-py>=0.70.0",
    "lancedb>=0.17.0",
    "pdf2image>=1.17.0",
    "sentence-transformers>=3.0.0",
    "diffusers>=0.32.0",
    "mcp>=1.0.0",
    "Pillow>=10.0.0",
    "cocoindex>=0.1.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "fibo"
registry_modules = [
    "fibo.components.*",
]


