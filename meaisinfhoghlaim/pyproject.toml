[project]
# The package name is the ASCII alias `meaisin_fhoghlaim` (uv/PEP 508 require
# ASCII). The display name (with fada) is preserved in `description` and
# the `keywords` field. The directory name `meaisínfhoghlaim/` keeps the
# fada for branding and shell ergonomics.
name = "meaisinfhoghlaim"
version = "0.1.0"
description = "meaisínfhoghlaim (Irish: 'machine learning') — AI/ML quadrant of the Cianfhoghlaim monorepo: specialised agents, OCR/HTR, Celtic-language data, ML pipelines, alignment, RAG evaluation, content quality, model & data catalog. See docs/00-core/CLAUDE.md §QUADRANT_MAP."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BUSL-1.1" }
authors = [
    { name = "Cianfhoghlaim Team" }
]
keywords = [
    "ai-ml",
    "celtic-language",
    "irish-nlp",
    "ocr",
    "htr",
    "rag",
    "agents",
    "dagster",
    "dlt",
    "meaisin-fhoghlaim",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # Core
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    # LLM
    "litellm",
    "baml-py>=0.74.0",
    "anthropic>=0.106.0",
    "openai>=2.0.0",
    # Agents
    "agno>=2.0.0",
    "google-adk>=0.1.0",
    # Data + observability
    "dlt[duckdb,ducklake,s3]>=1.5.0",
    "duckdb>=1.1.0",
    "lancedb>=0.15.0",
    "langfuse>=2.0.0",
    "cognee>=0.1.0",
    "ragas>=0.1.0",
    "datasets>=3.0.0",
    # ML
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "sentence-transformers>=3.0.0",
    "accelerate>=1.0.0",
    # OCR
    "pytesseract>=0.3.13",
    "pillow>=11.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # Observability
    "opentelemetry-sdk>=1.28.0",
    "structlog>=24.0.0",
    "ddtrace>=4.0.0",
    "mlflow>=2.18.0",
    # Async + util
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
all = [
    "meaisinfhoghlaim[dev]",
]

[project.urls]
Homepage = "https://git.cianfhoghlaim.ie/cianfhoghlaim/meaisínfhoghlaim"
Documentation = "https://docs.cianfhoghlaim.ie/meaisínfhoghlaim"
Repository = "https://git.cianfhoghlaim.ie/cianfhoghlaim/meaisínfhoghlaim"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The 8 components per docs/meaisínfhoghlaim/README.md §1.
packages = [
    "agents",
    "ocr",
    "language",
    "pipelines",
    "alignment",
    "evaluation",
    "quality",
    "catalog",
    "scripts",
    "services",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["meaisínfhoghlaim", "oideachais", "tuatha", "codeolas"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── Workspace membership (declared in the root pyproject.toml) ──
# meaisínfhoghlaim is a uv workspace MEMBER (peer of oideachais, tuatha,
# croilar, infrastructure). The root pyproject.toml has:
#   [tool.uv.workspace]
#   members = [ ..., "meaisínfhoghlaim" ]
#   [tool.uv.sources]
#   meaisínfhoghlaim = { workspace = true }
#
# Other packages that want to import from meaisínfhoghlaim add it
# to their [tool.uv.sources] block:
#   meaisínfhoghlaim = { workspace = true }
