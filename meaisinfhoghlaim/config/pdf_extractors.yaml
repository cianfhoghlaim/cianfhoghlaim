# PDF Extractor Configuration
# Based on pdfstract benchmarking patterns

extractors:
  # PyMuPDF4LLM - Fast, reliable for text-heavy docs
  pymupdf4llm:
    enabled: true
    priority: 1  # Lower = higher priority
    description: "Fast extraction for simple PDFs"
    best_for:
      - circular
      - resource
    options:
      include_images: false

  # Marker - ML-based layout analysis
  marker:
    enabled: true
    priority: 2
    description: "ML-based extraction with layout understanding"
    best_for:
      - sec  # Exam papers
      - textbook
    options:
      batch_multiplier: 2
      max_pages: 100

  # Docling - IBM document understanding
  docling:
    enabled: true
    priority: 2
    description: "Deep structure extraction for hierarchical docs"
    best_for:
      - ncca  # Curriculum specs
      - textbook
    options:
      extract_tables: true
      extract_images: true

  # DeepSeek OCR - VLM-based for scanned docs
  deepseekocr:
    enabled: true
    priority: 3
    description: "VLM OCR for scanned documents"
    best_for:
      - scanned
      - historical
    options:
      model: deepseek-vl2
      dpi: 150

  # Unstructured - General purpose fallback
  unstructured:
    enabled: true
    priority: 4
    description: "General purpose extraction"
    best_for:
      - unknown
    options:
      strategy: auto  # auto, fast, hi_res, ocr_only

# Document source to extractor mapping
source_mapping:
  ncca:
    primary: docling
    fallback: [marker, pymupdf4llm]
  sec:
    primary: marker
    fallback: [docling, pymupdf4llm]
  circular:
    primary: pymupdf4llm
    fallback: [docling]
  textbook:
    primary: docling
    fallback: [marker]
  resource:
    primary: pymupdf4llm
    fallback: [docling]
  unknown:
    primary: pymupdf4llm
    fallback: [marker, docling]

# Benchmark settings
benchmark:
  enabled: true
  db_path: storage/data/extraction_metrics.db
  compare_on_unknown: true  # Run all extractors on unknown sources
  track_irish_quality: true  # Track Irish text quality metric
  retention_days: 30
