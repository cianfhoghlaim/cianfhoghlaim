# =============================================================================
# llama-swap configuration — v4 Unsloth-first OCR/VLM models
# =============================================================================
# Source of truth: cianfhoghlaim/meaisinfhoghlaim/models/registry.py
# (24-entry VISION_MODELS dict, Unsloth-first fallback chain)
#
# This file is symlinked from:
#   bonneagar/stacks/llama-swap/config.yaml → ../../ocr/models/llama_swap_config.yaml
#
# Each `models:` entry maps an OpenAI-compatible model alias to a `cmd` +
# `args:` block. The Cmd is the `llama-server` binary shipped inside the
# `ghcr.io/mostlygeek/llama-swap:cpu` container (at /app/llama-server --
# confirmed live via `docker exec llama-swap which llama-server`; the
# `:v166` tag referenced here previously never existed in the GHCR
# registry, and /usr/local/bin/llama-server isn't where this image puts
# the binary).
#
# Per the 2026-08-08-lakehouse-extensive-hydration-v1 change: Args are
# literal values, NOT shell-expanded. llama-swap does a direct fork/exec
# of `cmd` (confirmed live via debug logs: "Executing start command:
# /app/llama-server, env: " -- no shell involved), so ${VAR:-default}
# syntax is never expanded and gets passed to llama-server as a literal
# string, which then fails to parse it (confirmed live: `error while
# handling argument "--port": stoi`). That syntax only works inside an
# actual docker-compose.yaml (interpolated by compose itself before the
# container starts) -- it's meaningless here, where this file is read
# directly by the llama-swap Go binary. Every arg below is now a literal
# value (port matches each model's own `proxy:` field; -ngl is 0 for
# CPU-only, matching compose.yaml's LLAMA_ARG_NGL=0 and the lack of GPU
# passthrough in Docker Desktop on macOS).
#
# 14 GGUF entries registered here:
#   gemma-4-E2B, gemma-4-E4B, gemma-4-12B, gemma-4-26B-A4B
#   qwen3-vl-4b, qwen3-vl-8b, qwen3-vl-30b-a3b
#   qwen3.6-27b-mtp, internvl3-8b
#   llama-3.2-vision-11b, gemma-3-4b
#   paddleocr-vl-1.6, glm-4.6v-flash
#   qwen3-vl-8b appears twice (alias for both llama-swap and mlx-omni routes)
#
# 4 MLX-only entries (run on mlx-omni :10240, NOT here):
#   granite-docling-258M, dots-ocr, deepseek-ocr-2, gemma-4-E2B (MLX)
# =============================================================================

models:
