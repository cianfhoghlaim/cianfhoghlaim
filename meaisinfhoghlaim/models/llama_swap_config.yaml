      --temp 0.0

  # ─── PaddleOCR-VL (Jun 2026) — multilingual OCR specialist ──────────────
  "paddleocr-vl-1.6":
    proxy: "http://localhost:8091"
    cmd: >
      /app/llama-server
      -m /models/gguf/paddleocr-vl-1.6/paddleocr-vl-1.6-q4_k_m.gguf
      --mmproj /models/gguf/paddleocr-vl-1.6/paddleocr-vl-1.6-mmproj-f16.gguf
      --alias paddleocr-vl-1.6
      --port 8091
