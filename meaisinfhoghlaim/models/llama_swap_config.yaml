  # ─── GLM-4.6V Flash (zai-org, Dec 2025) — fast / low-cost ───────────────
  "glm-4.6v-flash":
    proxy: "http://localhost:8090"
    cmd: >
      /app/llama-server
      -m /models/gguf/glm-4.6v-flash/glm-4.6v-flash-q4_k_m.gguf
      --mmproj /models/gguf/glm-4.6v-flash/glm-4.6v-flash-mmproj-f16.gguf
      --alias glm-4.6v-flash
