    cmd: >
      /app/llama-server
      -m /models/gguf/qwen3-vl-30b-a3b/qwen3-vl-30b-a3b-instruct-q4_k_m.gguf
      --mmproj /models/gguf/qwen3-vl-30b-a3b/qwen3-vl-30b-a3b-instruct-mmproj-f16.gguf
      --alias qwen3-vl-30b-a3b
      --port 8087
