    proxy: "http://localhost:8081"
    args:
      - "-m"
      - "/models/gguf/gemma-4-E2B/gemma-4-e2b-it-q4_k_m.gguf"
      - "--alias"
      - "gemma-4-E2B"
      - "--port"
      - "8081"
      - "-ngl"
      - "0"
      - "-c"
      - "32768"
      - "--temp"
      - "0.0"

