      /app/llama-server
      -m /models/gguf/qwen3-vl-8b/qwen3-vl-8b-instruct-q4_k_m.gguf
      --mmproj /models/gguf/qwen3-vl-8b/qwen3-vl-8b-instruct-mmproj-f16.gguf
      --alias qwen3-vl-8b
