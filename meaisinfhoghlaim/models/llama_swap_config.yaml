  # ─── Llama 3.2 Vision (legacy, kept for back-compat) ─────────────────────
  "llama-3.2-vision-11b":
    proxy: "http://localhost:8092"
    cmd: >
      /app/llama-server
      -m /models/gguf/llama-3.2-vision-11b/llama-3.2-11b-vision-instruct-q4_k_m.gguf
      --mmproj /models/gguf/llama-3.2-vision-11b/llama-3.2-11b-vision-instruct-mmproj-f16.gguf
      --alias llama-3.2-vision-11b
      --port 8092
      -ngl 0
      -c 32768
      --temp 0.0

  # ─── Gemma 3 (legacy, kept for back-compat) ─────────────────────────────
  # Per the 2026-08-08-lakehouse-extensive-hydration-v1 change: this entry
  # is temporarily disabled -- it was the first entry (in file order) to
  # trip llama-swap's config validation ("model gemma-3-4b: proxy uses
  # ${PORT} but cmd does not"), which blocked the ENTIRE config (every
  # model, including qwen3-vl-8b) from loading at all. That root cause
  # (missing `proxy:` fields + shell-style ${VAR:-default} args + the
  # split cmd/args schema this llama-swap build ignores) is now fixed for
  # all 12 active entries above -- this one is left disabled not because
  # of that bug anymore, but simply because it hasn't been re-verified
  # live (no GGUF weights downloaded for it yet, unlike qwen3-vl-8b).
  # Re-enabling it (download weights, verify it loads) is flagged as
  # separate follow-up work, not attempted further this pass. Shown below
  # already updated to the correct single-`cmd:`-string schema so it's
  # ready to uncomment once weights exist.
  # "gemma-3-4b":
  #   proxy: "http://localhost:8093"
  #   cmd: >
  #     /app/llama-server
  #     -m /models/gguf/gemma-3-4b/gemma-3-4b-it-q4_k_m.gguf
  #     --alias gemma-3-4b
  #     --port 8093
  #     -ngl 0
  #     -c 32768
  #     --temp 0.0

# =============================================================================
# Health endpoint + OpenAI-compatible proxy configuration
# =============================================================================
# Per the 2026-08-08-lakehouse-extensive-hydration-v1 change: 30s was too
# short for CPU-only model loads on Docker Desktop macOS (no GPU
# passthrough -- see compose.yaml note). Confirmed live: qwen3-vl-8b
# (4.7GB Q4_K_M + 1.1GB F16 mmproj) takes ~81s to load and start serving
# when run directly with the exact same args llama-swap uses. Larger
# models in this config (e.g. qwen3-vl-30b-a3b, qwen3.6-27b-mtp,
# gemma-4-26B-A4B) will take longer still on CPU, so this is set
# generously rather than tuned to the smallest model.
healthCheckTimeout: 300
logLevel: info

# Models that are MLX-only (NOT served here, but documented for reference):
#   - granite-docling-258M (mlx_community/granite-docling-258M-mlx)
#   - dots-ocr (mlx_community/dots.ocr-4bit)
#   - deepseek-ocr-2 (mlx_community/DeepSeek-OCR-bf16)
#   - gemma-4-E2B has both GGUF (above) and MLX (mlx-omni :10240) routes
# These are served via the mlx-omni stack at port 10240 (see
# bonneagar/stacks/mlx-omni/compose.yaml).
