  # ─── Qwen 3-VL (Alibaba, Oct 2025) — PRIMARY WORKHORSE ──────────────────
  "qwen3-vl-4b":
    proxy: "http://localhost:8085"
    cmd: >
      /app/llama-server
      -m /models/gguf/qwen3-vl-4b/qwen3-vl-4b-instruct-q4_k_m.gguf
