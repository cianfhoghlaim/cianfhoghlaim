# =============================================================================
# llama-swap configuration — v4 Unsloth-first OCR/VLM models
# =============================================================================
# Source of truth: cianfhoghlaim/meaisinfhoghlaim/models/registry.py
# (24-entry VISION_MODELS dict, Unsloth-first fallback chain)
#
# This file is symlinked from:
#   bonneagar/stacks/llama-swap/config.yaml → ../../../meaisinfhoghlaim/models/llama_swap_config.yaml
#   (confirmed live via `readlink`; the old ../../ocr/models/... path
#   predates the registry's move back to meaisinfhoghlaim/models/)
#
# Each `models:` entry maps an OpenAI-compatible model alias to a `cmd`
# (the full command line, binary + all flags, as ONE folded string) plus
# a `proxy:` pointing at the static port that command binds to. The
# binary is `llama-server`, shipped inside the `ghcr.io/mostlygeek/
# llama-swap:cpu` container at /app/llama-server (confirmed live via
# `docker exec llama-swap which llama-server`; the `:v166` tag referenced
# here previously never existed in the GHCR registry, and
# /usr/local/bin/llama-server isn't where this image puts the binary).
#
# Per the 2026-08-08-lakehouse-extensive-hydration-v1 change, two real,
# live-confirmed bugs were fixed here:
#
# 1. A split `cmd: /app/llama-server` + separate `args: [...]` list (the
#    shape this file used before) is NOT honored by this llama-swap
#    build -- only `cmd` is used to launch the process; a separate
#    top-level `args:` key is silently ignored. Confirmed live: with the
#    split shape, llama-swap's debug log showed "Executing start command:
#    /app/llama-server, env: " (no args), and the child process
#    immediately failed with "couldn't bind HTTP server socket ... port:
#    8080" (i.e. llama-server started bare, with zero flags, and tried to
#    bind llama-swap's OWN port). The bundled default config baked into
#    the image (`/app/config.yaml`) confirms the expected shape: every
#    entry there embeds the full command line into a single folded `cmd:
#    >` string, never a separate `args:` list -- this file now matches
#    that convention.
#
# 2. Args must be literal values, NOT shell-expanded. llama-swap does a
#    direct fork/exec of `cmd`, so `${VAR:-default}` shell-parameter-
#    expansion syntax (which only means something inside an actual
#    docker-compose.yaml, interpolated by compose itself before the
#    container starts) is never expanded here -- it gets passed through
#    literally and llama-server fails to parse it (confirmed live: `error
#    while handling argument "--port": stoi`). Every value below is now
#    literal (port matches each model's own `proxy:` field; -ngl is 0 for
#    CPU-only, matching compose.yaml's LLAMA_ARG_NGL=0 and the lack of
#    GPU passthrough in Docker Desktop on macOS).
#
# Live-verified end to end after both fixes: qwen3-vl-8b loads (~81s on
# CPU) and serves a real chat completion via llama-swap's own proxy path
# (not just a manual bypass).
#
# 14 GGUF entries registered here:
#   gemma-4-E2B, gemma-4-E4B, gemma-4-12B, gemma-4-26B-A4B
#   qwen3-vl-4b, qwen3-vl-8b, qwen3-vl-30b-a3b
#   qwen3.6-27b-mtp, internvl3-8b
#   llama-3.2-vision-11b, gemma-3-4b
#   paddleocr-vl-1.6, glm-4.6v-flash
#   qwen3-vl-8b appears twice (alias for both llama-swap and mlx-omni routes)
#
# 4 MLX-only entries (run on mlx-omni :10240, NOT here):
#   granite-docling-258M, dots-ocr, deepseek-ocr-2, gemma-4-E2B (MLX)
# =============================================================================

models:
  # ─── Gemma 4 family (Google, 2026) — Tier-1 default family ───────────────
  "gemma-4-E2B":
    proxy: "http://localhost:8081"
    cmd: >
      /app/llama-server
      -m /models/gguf/gemma-4-E2B/gemma-4-e2b-it-q4_k_m.gguf
      --alias gemma-4-E2B
      --port 8081
      -ngl 0
      -c 32768
      --temp 0.0

  "gemma-4-E4B":
    proxy: "http://localhost:8082"
    cmd: >
      /app/llama-server
      -m /models/gguf/gemma-4-E4B/gemma-4-e4b-it-q4_k_m.gguf
      --alias gemma-4-E4B
      --port 8082
      -ngl 0
      -c 32768
      --temp 0.0

  "gemma-4-12B":
