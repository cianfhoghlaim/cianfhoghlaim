# Boring Semantic Layer Configuration for Celtic Curriculum Platform
# Provides Ibis-based semantic access to curriculum data

profile:
  type: duckdb
  database: "data/curriculum.duckdb"
  threads: 1  # Single-threaded (critical constraint)

# Dimension models
dim_nation:
  table: marts.dim_nation
  columns:
    nation_id:
      type: int
      description: "Unique nation identifier"
    nation_code:
      type: str
      description: "Nation code (ireland, england, scotland, wales, northern_ireland)"
    nation_name:
      type: str
      description: "Nation name in English"
    nation_name_native:
      type: str
      description: "Nation name in native language"
    primary_language:
      type: str
      description: "Primary language code"
    education_authority:
      type: str
      description: "Curriculum authority (NCCA, DfE, SQA, etc.)"
    exam_authority:
      type: str
      description: "Examination authority (SEC, AQA, SQA, etc.)"

dim_language:
  table: marts.dim_language
  columns:
    language_id:
      type: int
      description: "Unique language identifier"
    language_code:
      type: str
      description: "ISO 639-1 code (en, ga, cy, gd, gv)"
    language_name:
      type: str
      description: "Language name in English"
    language_name_native:
      type: str
      description: "Language name in native script"
    is_celtic:
      type: bool
      description: "Is this a Celtic language"

dim_subject:
  table: marts.dim_subject
  columns:
    subject_id:
      type: int
      description: "Unique subject identifier"
    subject_code:
      type: str
      description: "Subject code"
    subject_name:
      type: str
      description: "Subject name"
    subject_area:
      type: str
      description: "Subject area grouping (stem, languages, humanities, etc.)"
    is_celtic_subject:
      type: bool
      description: "Is this a Celtic language subject"

dim_level:
  table: marts.dim_level
  columns:
    level_id:
      type: int
      description: "Unique level identifier"
    nation:
      type: str
      description: "Nation this level belongs to"
    level_code:
      type: str
      description: "Level code (ie_junior_cycle, en_ks3, etc.)"
    level_name:
      type: str
      description: "Level name"
    age_range_start:
      type: int
      description: "Age range start"
    age_range_end:
      type: int
      description: "Age range end"

# Fact models
fact_learning_outcome:
  table: marts.fact_learning_outcome
  dimensions:
    outcome_id: _.outcome_id
    nation_id: _.nation_id
    subject_id: _.subject_id
    level_id: _.level_id
    language_id: _.language_id
    title: _.title
    curriculum_level: _.curriculum_level
    is_celtic_medium: _.is_celtic_medium
    source: _.source
  measures:
    outcome_count:
      type: count
      expr: "_.outcome_id.count()"
      description: "Total number of learning outcomes"
    celtic_outcome_count:
      type: sum
      expr: "_.is_celtic_medium.cast('int').sum()"
      description: "Count of Celtic medium outcomes"
    content_length_avg:
      type: average
      expr: "_.content.str.len().mean()"
      description: "Average content length"
  joins:
    nation:
      model: dim_nation
      type: left
      left_on: nation_id
      right_on: nation_id
    subject:
      model: dim_subject
      type: left
      left_on: subject_id
      right_on: subject_id
    level:
      model: dim_level
      type: left
      left_on: level_id
      right_on: level_id
    language:
      model: dim_language
      type: left
      left_on: language_id
      right_on: language_id

fact_outcome_alignment:
  table: marts.fact_outcome_alignment
  dimensions:
    alignment_id: _.alignment_id
    source_outcome_id: _.source_outcome_id
    target_outcome_id: _.target_outcome_id
    source_nation: _.source_nation
    target_nation: _.target_nation
    alignment_type: _.alignment_type
    method: _.method
  measures:
    alignment_count:
      type: count
      expr: "_.alignment_id.count()"
      description: "Total number of alignments"
    avg_confidence:
      type: average
      expr: "_.confidence_score.mean()"
      description: "Average confidence score"
    high_confidence_count:
      type: count
      expr: "_.filter(_.confidence_score > 0.8).count()"
      description: "Alignments with confidence > 0.8"

# Aggregate models
agg_comparison_metrics:
  table: marts.agg_comparison_metrics
  dimensions:
    nation: _.nation
  measures:
    total_outcomes: _.total_outcomes
    celtic_medium_outcomes: _.celtic_medium_outcomes
    unique_subjects: _.unique_subjects
    unique_levels: _.unique_levels
    celtic_medium_percentage: _.celtic_medium_percentage
