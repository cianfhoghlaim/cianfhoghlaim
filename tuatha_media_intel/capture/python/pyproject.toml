[project]
name = "tuatha-capture"
version = "0.1.0"
description = "Python capture shims for the Tuatha media-intel pipeline"
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=3.0.0",
    "structlog>=24.4.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",
    "comicbox>=0.2.0",
]

[project.optional-dependencies]
gba = ["mgba-py>=0.13.0"]
comic-ml = [
    "deeppanel-ml>=0.3.0",
    "scikit-learn>=1.5.0",
]

[project.scripts]
tuatha-capture-python = "tuatha_capture.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tuatha_capture"]
