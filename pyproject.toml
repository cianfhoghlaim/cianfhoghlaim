[project]
name = "cianfhoghlaim"
version = "0.4.0"
description = "Cianfhoghlaim application monorepo — Celtic education platform, AI research laboratory, multi-persona portfolio, AND the GitOps infrastructure fleet (the bonneagar/ subdirectory holds 88 Docker Compose stacks + Komodo resource-syncs + the unified IaC). Companion to cianfhoghlaim/leabharlann (digital library), which is the only remaining separately-managed repo."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BUSL-1.1" }
authors = [{ name = "Cianfhoghlaim Team" }]
keywords = ["monorepo", "uv-workspace", "celtech", "dagster", "dlt", "baml", "irish", "celtic"]

dependencies = [
    "agno>=2.6.11",
    "anthropic>=0.106.0",
    "baml-py>=0.222.0",
    "dagster>=1.13",
    "dagster-components>=1.13",
    "duckdb>=1.4",
    "fastapi>=0.115.0,<0.140",
    "firecrawl>=4.28.2",
    "google-genai>=1.73.1",
    "groq>=1.4.0",
    "httpx>=0.27,<1.0",
    "ibis-framework[duckdb]>=10",
    "lancedb>=0.15",
    "logfire>=4.15.1",
    "marimo>=0.23.10",
    "openai>=2.32.0",
    "pyiceberg>=0.10",
    "pydantic-settings>=2",
    "structlog>=25",
    "tenacity>=8.2,<9.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Wheel packaging — v7 flattened layout
# =============================================================================
# The cianfhoghlaim package root IS the repository root. Hatch packages the
# repo with `packages = ["."]` + a broad `include` pattern (catches all
# sub-packages in the flat layout) + an `exclude` that strips the
# data caches.
[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "*.py",
    "**/*.py",
    "**/__init__.py",
]
exclude = [
    "stedding/**",
    "docs/**",
    ".venv/**",
    "node_modules/**",
    "__pycache__/**",
    "**/*.pyc",
    ".git/**",
    ".gitignore",
    ".DS_Store",
    "dlthub/**",
    ".cocoindex_code/**",
    "instagram_output/**",
    "web/**",
    "spaces/**",
    "**/*.bak",
    "tests/**",
    "**/test_*.py",
    "**/*_test.py",
]

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "cianfhoghlaim/__init__.py"
"__main__.py" = "cianfhoghlaim/__main__.py"
"__deployment__.py" = "cianfhoghlaim/__deployment__.py"
"cli.py" = "cianfhoghlaim/cli.py"
"clio.py" = "cianfhoghlaim/clio.py"
