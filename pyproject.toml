[project]
name = "cianfhoghlaim"
version = "0.0.0"
description = "Cianfhoghlaim polyglot monorepo shell — uv workspace orchestrator. Delegates all real work to workspace members."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BUSL-1.1" }
authors = [
    { name = "Cianfhoghlaim Team" },
]
keywords = [
    "monorepo",
    "uv-workspace",
    "celtech",
    "dagster",
    "dlt",
    "baml",
    "irish",
    "celtic",
]
dependencies = [
    "agno>=2.6.11",
    "anthropic>=0.106.0",
    "baml-py>=0.222.0",
    "fastapi>=0.136.0",
    "firecrawl>=4.28.2",
    "google-genai>=1.73.1",
    "groq>=1.4.0",
    "logfire>=4.15.1",
    "openai>=2.32.0",
]

# This root project deliberately has no [project.dependencies] and no
# [project.scripts] — it is a workspace shell only. Real packages live in
# members and import each other via [tool.uv.sources].

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

# =============================================================================
# UV Workspace — single lockfile for the whole monorepo
# =============================================================================

[tool.uv]
managed = true
package = false
# Reuse the per-member .venv (root stays clean)
# Each member sets [tool.uv] package = true in its own pyproject.toml

[tool.uv.workspace]
members = [
    "oideachais",
    "tuatha",
    "sruth/codeolas",
    "tuatha/apps/crypteolas_demo",
    "croilar",
    "infrastructure/browser",
    "oideachais/mcp/mcpo",
    "meaisinfhoghlaim",
]

[tool.uv.sources]
# Members can depend on each other; uv resolves them via the workspace lockfile.
# Keys are the package names (ASCII); values are the workspace source spec.
codeolas = { workspace = true }
crypteolas = { workspace = true }
crypteolas-demo = { workspace = true }
sruth-browser = { workspace = true }
oideachais = { workspace = true }
tuath = { workspace = true }
croilar = { workspace = true }
# `meaisinfhoghlaim` is the project name (ASCII form; the fada is preserved
# only in the directory branding and docs/READMEs).
meaisinfhoghlaim = { workspace = true }

# =============================================================================
# Shared dev tooling — applied to every workspace member
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".venv",
    "node_modules",
    "docs",
    "stedding",
    ".cocoindex_code",
    "instagram_output",
    "dlthub",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["sruth", "oideachais", "tuatha", "codeolas", "códeolas", "sruth_browser"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "docs/",
    "stedding/",
    "instagram_output/",
    "dlthub/",
    ".venv/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = "test_*"
addopts = "-ra -q"

# =============================================================================
# Workspace-level DAGSTER / DLT defaults (members may override)
# =============================================================================

[tool.dlt]
destination = "duckdb"

[tool.dlt.sources.geospatial]
dataset_name = "geospatial"

[tool.dlt.sources.education]
dataset_name = "education"

[tool.dlt.sources.celtic]
dataset_name = "celtic"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

# =============================================================================
# Coverage
# =============================================================================
# This workspace unifies:
#   sruth/oideachais/            — Irish + British Isles education data platform
#   sruth/tuatha/                — Educational MMO + crypto platform
#   sruth/codeolas/              — Code intelligence library (publishable)
#   infrastructure/browser/      — sruth-browser web crawling utility
#   sruth/oideachais/mcp/mcpo/   — MCPO bridge (optional member)
#
# 6 nations: England, Scotland, Wales, NI, Ireland, Crown Dependencies
# 6 Celtic languages: ga, gd, cy, gv, kw, br
