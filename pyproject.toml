[project]
name = "cianfhoghlaim-monorepo"
version = "0.4.0"
description = "Cianfhoghlaim application monorepo — Celtic education platform, AI research laboratory, and multi-persona portfolio. Companion to cianfhoghlaim/leabharlann (digital library) and cianfhoghlaim/bonneagar (GitOps infrastructure), both consumed as git subtrees."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BUSL-1.1" }
authors = [
    { name = "Cianfhoghlaim Team" },
]
keywords = [
    "monorepo",
    "uv-workspace",
    "celtech",
    "dagster",
    "dlt",
    "baml",
    "irish",
    "celtic",
]
dependencies = [
    "agno>=2.6.11",
    "anthropic>=0.106.0",
    "baml-py>=0.222.0",
    "fastapi>=0.115.0,<0.140",  # upper bound for mlx-omni-server compat; ag-ui-adk pinned separately via [agui] extra
    "firecrawl>=4.28.2",
    "google-genai>=1.73.1",
    "groq>=1.4.0",
    "logfire>=4.15.1",
    "marimo>=0.23.10",
    "openai>=2.32.0",
    "uvicorn>=0.32.0",
]

# This root project deliberately has no [project.dependencies] and no
# [project.scripts] — it is a workspace shell only. Real packages live in
# members and import each other via [tool.uv.sources].

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

# =============================================================================
# UV Workspace — single lockfile for the whole monorepo
# =============================================================================

[tool.uv]
managed = true
package = false
# Reuse the per-member .venv (root stays clean)
# Each member sets [tool.uv] package = true in its own pyproject.toml

[tool.uv.workspace]
# Consolidated single-workspace layout — see
# openspec/changes/2026-06-28-consolidate-sruth-into-cianfhoghlaim-v4
# Web apps are managed by bun (see package.json workspaces); only Python
# packages belong in the uv workspace.
 members = [
    "cianfhoghlaim",
    "cianfhoghlaim/libraries/codeolas",
]

[tool.uv.sources]
# Members can depend on each other; uv resolves them via the workspace lockfile.
# Keys are the package names (ASCII); values are the workspace source spec.
cianfhoghlaim = { workspace = true }
codeolas = { workspace = true }

# =============================================================================
# Shared dev tooling — applied to every workspace member
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".venv",
    "node_modules",
    "docs",
    "stedding",
    ".cocoindex_code",
    "instagram_output",
    "dlthub",
    # marimo notebooks inject globals (`mo`, `result`, ...) via AST transform
    # that ruff can't statically analyse. The existing 11 oideachais notebooks
    # already trip F821; we follow precedent and exclude the whole class.
    "**/notebooks/*.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["sruth", "oideachais", "sruth/tuatha", "codeolas", "códeolas", "sruth_browser"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "docs/",
    "stedding/",
    "instagram_output/",
    "dlthub/",
    ".venv/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = "test_*"
addopts = "-ra -q"

# =============================================================================
# Workspace-level DAGSTER / DLT defaults (members may override)
# =============================================================================

[tool.dlt]
destination = "duckdb"

[tool.dlt.sources.geospatial]
dataset_name = "geospatial"

[tool.dlt.sources.education]
dataset_name = "education"

[tool.dlt.sources.celtic]
dataset_name = "celtic"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

# =============================================================================
# Coverage
# =============================================================================
# This workspace unifies:
#   sruth/oideachais/            — Irish + British Isles education data platform
#   sruth/tuatha/                — Educational MMO + crypto platform
#   sruth/codeolas/              — Code intelligence library (publishable)
#   infrastructure/browser/      — sruth-browser web crawling utility
#
# mcpo bridge is now part of sruth/oideachais/ (was oideachais/mcp/mcpo/ — stale)
#
# 6 nations: England, Scotland, Wales, NI, Ireland, Crown Dependencies
# 6 Celtic languages: ga, gd, cy, gv, kw, br
