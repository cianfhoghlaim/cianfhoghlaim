# =============================================================================
# UV Workspace — single lockfile for the whole monorepo
# =============================================================================
# Post-v7 flattening: the root project IS the cianfhoghlaim package.
# web/ and spaces/ have their own toolchains (bun + own pyproject.toml).
[tool.uv]
managed = true
package = true

[tool.uv.workspace]
members = []

# =============================================================================
# Shared dev tooling
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".venv",
    "node_modules",
    "docs",
    "stedding",
    ".cocoindex_code",
    "instagram_output",
    "dlthub",
    "**/notebooks/*.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cianfhoghlaim"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["docs/", "stedding/", "instagram_output/", "dlthub/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-ra -q"

# =============================================================================
# Workspace-level DAGSTER / DLT defaults
# =============================================================================

# Dagster Components (1.13+) — auto-discover the 5 KCG Components from
# orchestration/components/. Without this section, `dg list components`
# returns 0 (was the failure mode for the entire 5-layer DAG system).
# The canonical home is orchestration.components.* (post-v7 flattened).
[tool.dg]
registry_modules = ["orchestration.components"]

[tool.dlt]
destination = "duckdb"

[tool.dlt.sources.geospatial]
dataset_name = "geospatial"

[tool.dlt.sources.education]
dataset_name = "education"

[tool.dlt.sources.celtic]
dataset_name = "celtic"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
