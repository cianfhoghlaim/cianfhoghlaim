# Crypteolas Repository Configuration
# Defines repositories to index for code search

repositories:
  # Major DeFi Protocols
  defi:
    - owner: Uniswap
      repo: v4-core
      description: Uniswap V4 Core
      languages: [solidity]

    - owner: Uniswap
      repo: v3-core
      description: Uniswap V3 Core
      languages: [solidity]

    - owner: aave
      repo: aave-v3-core
      description: Aave V3 Protocol
      languages: [solidity]

    - owner: compound-finance
      repo: compound-protocol
      description: Compound Protocol
      languages: [solidity]

    - owner: curvefi
      repo: curve-contract
      description: Curve Finance
      languages: [vyper, solidity]

    - owner: makerdao
      repo: dss
      description: MakerDAO DSS
      languages: [solidity]

    - owner: lidofinance
      repo: lido-dao
      description: Lido DAO
      languages: [solidity]

  # L2 / Scaling
  l2:
    - owner: ethereum-optimism
      repo: optimism
      description: Optimism
      languages: [go, solidity]

    - owner: OffchainLabs
      repo: nitro
      description: Arbitrum Nitro
      languages: [go, solidity]

    - owner: base-org
      repo: node
      description: Base Node
      languages: [go]

  # Infrastructure
  infrastructure:
    - owner: ethereum
      repo: go-ethereum
      description: Geth
      languages: [go]

    - owner: foundry-rs
      repo: foundry
      description: Foundry
      languages: [rust]

    - owner: paradigmxyz
      repo: reth
      description: Reth
      languages: [rust]

  # SDKs and Tools
  sdks:
    - owner: ethers-io
      repo: ethers.js
      description: Ethers.js
      languages: [typescript]

    - owner: wevm
      repo: viem
      description: Viem
      languages: [typescript]

    - owner: wagmi-dev
      repo: wagmi
      description: Wagmi
      languages: [typescript]

# Indexing Configuration
indexing:
  # File patterns to index
  include_patterns:
    - "*.sol"
    - "*.vy"
    - "*.ts"
    - "*.js"
    - "*.rs"
    - "*.go"
    - "*.md"

  # Patterns to exclude
  exclude_patterns:
    - "node_modules/**"
    - "vendor/**"
    - "test/**"
    - "tests/**"
    - "**/test*.sol"
    - "**/*.test.ts"

  # Maximum file size (bytes)
  max_file_size: 500000

  # Refresh interval (hours)
  refresh_interval: 24
