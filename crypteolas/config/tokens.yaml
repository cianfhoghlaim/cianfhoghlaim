# Crypteolas Token Configuration
# Defines tokens to track for price and market data

tokens:
  # Major Cryptocurrencies
  major:
    - id: ethereum
      symbol: ETH
      name: Ethereum
      category: L1
      coingecko_id: ethereum

    - id: bitcoin
      symbol: BTC
      name: Bitcoin
      category: L1
      coingecko_id: bitcoin

    - id: solana
      symbol: SOL
      name: Solana
      category: L1
      coingecko_id: solana

  # DeFi Governance Tokens
  defi_governance:
    - id: uniswap
      symbol: UNI
      name: Uniswap
      category: DEX
      coingecko_id: uniswap
      protocol: uniswap

    - id: aave
      symbol: AAVE
      name: Aave
      category: Lending
      coingecko_id: aave
      protocol: aave

    - id: compound
      symbol: COMP
      name: Compound
      category: Lending
      coingecko_id: compound-governance-token
      protocol: compound

    - id: curve
      symbol: CRV
      name: Curve DAO
      category: DEX
      coingecko_id: curve-dao-token
      protocol: curve-dex

    - id: maker
      symbol: MKR
      name: Maker
      category: CDP
      coingecko_id: maker
      protocol: makerdao

    - id: lido
      symbol: LDO
      name: Lido DAO
      category: Liquid Staking
      coingecko_id: lido-dao
      protocol: lido

  # Stablecoins
  stablecoins:
    - id: usdc
      symbol: USDC
      name: USD Coin
      category: Stablecoin
      coingecko_id: usd-coin
      peg: USD

    - id: usdt
      symbol: USDT
      name: Tether
      category: Stablecoin
      coingecko_id: tether
      peg: USD

    - id: dai
      symbol: DAI
      name: Dai
      category: Stablecoin
      coingecko_id: dai
      peg: USD
      protocol: makerdao

  # L2 Tokens
  l2:
    - id: arbitrum
      symbol: ARB
      name: Arbitrum
      category: L2
      coingecko_id: arbitrum

    - id: optimism
      symbol: OP
      name: Optimism
      category: L2
      coingecko_id: optimism

    - id: polygon
      symbol: MATIC
      name: Polygon
      category: L2
      coingecko_id: matic-network

  # Liquid Staking Tokens
  lst:
    - id: steth
      symbol: stETH
      name: Lido Staked ETH
      category: LST
      coingecko_id: staked-ether
      protocol: lido

    - id: reth
      symbol: rETH
      name: Rocket Pool ETH
      category: LST
      coingecko_id: rocket-pool-eth
      protocol: rocket-pool

# Price Tracking Configuration
price_tracking:
  # Update interval (seconds)
  update_interval: 60

  # Price history retention (days)
  history_days: 365

  # Alert thresholds
  alerts:
    price_change_percent: 5
    volume_spike_percent: 100

  # Funding rate tracking
  funding_symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - ARBUSDT
    - OPUSDT
