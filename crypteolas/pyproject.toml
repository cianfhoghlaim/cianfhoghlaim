[project]
name = "crypteolas"
version = "0.1.0"
description = "Crypteolas - GitHub + DeFi protocol data intelligence platform with DLT, CocoIndex, Cognee, and Marimo. Part of the tuath workspace member."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core DLT stack
    "dlt[lancedb,duckdb]>=1.18.2",
    "dlthub>=0.18.0",

    # Semantic indexing
    "cocoindex>=0.3.9",
    "sentence-transformers",
    "lancedb>=0.6.0",

    # Knowledge graphs
    "cognee",
    "neo4j",  # Memgraph uses the same Bolt driver

    # Interactive analysis
    "marimo>=0.17.2",
    "ibis-framework[duckdb]>=11.0.0",

    # Utilities
    "python-dotenv",
    "requests",
    "pyarrow",
    "pendulum",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]
scraping = [
    "crawl4ai",
    "firecrawl-py",
]
dagster = [
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "dagster-embedded-elt>=0.22.0",
]
graphiti = [
    "graphiti-core>=0.3.0",
    "falkordb>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The crypteolas platform is a multi-module package rooted at this directory.
# All sub-packages are at the top level of the project (no src/ layout).
packages = [
    ".",
    "agent_os",
    "agent_os/middleware",
    "agents",
    "agents/adk",
    "agents/agno",
    "agents/callbacks",
    "agents/hitl",
    "agents/mcp_server",
    "agents/tools",
    "api",
    "api/routes",
    "api/services",
    "baml_src",
    "cocoindex_flows",
    "cocoindex_flows/transforms",
    "config",
    "dagster_assets",
    "dagster_assets/components",
    "demo",
    "dlt_sources",
    "dlt_sources/defi",
    "dlt_sources/documentation",
    "dlt_sources/github",
    "dlt_sources/local",
    "dlt_utils",
    "graphiti",
    "knowledge_graph",
    "knowledge_graph/cognee",
    "knowledge_graph/graphiti",
    "mcp_server",
    "notebooks",
    "pipelines",
    "pipelines/dagster",
    "pipelines/dagster/assets",
    "pipelines/dagster/resources",
    "pipelines/defs",
    "pipelines/defs/indexing",
    "pipelines/defs/knowledge",
    "pipelines/cognee",
    "pipelines/cocoindex",
    "pipelines/github_api",
    "storage",
    "tests",
    "transformations",
    "ui",
    "_shims",
    "_shims/agent_os",
    "_shims/agent_os/middleware",
    "_shims/agent_os/config",
    "_shims/agent_os/a2a",
    "_shims/dagster",
    "_shims/dagster/components",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
