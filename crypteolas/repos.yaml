# GitHub repositories to index
# Each entry configures API ingestion, code indexing, and docs knowledge graph

repositories:
  # Primary targets - Modern data stack
  dlt-hub:
    owner: dlt-hub
    repo: dlt
    git_ref: devel

    # Mode flags - enable/disable per repository
    modes:
      api: true          # GitHub REST API ingestion
      code: true         # Code indexing via CocoIndex
      crawl: true        # Website/docs crawling
      files: false       # Local files processing

    # API-mode configuration
    api_config:
      resources:
        - issues
        - pull_requests
        - commits
        - workflow_runs
      incremental:
        cursor_path: updated_at
        days_back: 30

    # Code-mode configuration
    code_config:
      included_patterns:
        - "*.py"
        - "*.md"
        - "*.mdx"
      excluded_patterns:
        - "**/.*"
        - "**/node_modules"
        - "**/__pycache__"
      chunk_size: 1000
      chunk_overlap: 300

    # Crawl-mode configuration
    crawl_config:
      docs_url: "https://dlthub.com/docs"
      provider: firecrawl
      crawl_depth: 3
      max_pages: 100

  cocoindex:
    owner: cocoindex-io
    repo: cocoindex
    git_ref: main
    modes:
      api: true
      code: true
      crawl: false
      files: false
    api_config:
      resources:
        - issues
        - pull_requests
      incremental:
        cursor_path: updated_at
        days_back: 30
    code_config:
      included_patterns:
        - "*.py"
        - "*.rs"
        - "*.md"
        - "*.mdx"
      excluded_patterns:
        - "**/.*"
        - "**/target"
        - "**/node_modules"

  cognee:
    owner: cognee-ai
    repo: cognee
    git_ref: main
    modes:
      api: true
      code: true
      crawl: false
      files: false
    api_config:
      resources:
        - issues
      incremental:
        cursor_path: updated_at
        days_back: 30
    code_config:
      included_patterns:
        - "*.py"
        - "*.md"
      excluded_patterns:
        - "**/.*"
        - "**/__pycache__"

  # Analytics tools
  ibis:
    owner: ibis-project
    repo: ibis
    git_ref: main
    modes:
      api: true
      code: true
      crawl: true
      files: false
    api_config:
      resources:
        - issues
        - pull_requests
      incremental:
        cursor_path: updated_at
        days_back: 30
    code_config:
      included_patterns:
        - "*.py"
        - "*.md"
      excluded_patterns:
        - "**/.*"
        - "**/__pycache__"
    crawl_config:
      docs_url: "https://ibis-project.org/docs"
      provider: firecrawl
      crawl_depth: 2
      max_pages: 50

  marimo:
    owner: marimo-team
    repo: marimo
    git_ref: main
    modes:
      api: true
      code: true
      crawl: true
      files: false
    api_config:
      resources:
        - issues
        - pull_requests
      incremental:
        cursor_path: updated_at
        days_back: 30
    code_config:
      included_patterns:
        - "*.py"
        - "*.md"
      excluded_patterns:
        - "**/.*"
        - "**/node_modules"
    crawl_config:
      docs_url: "https://docs.marimo.io"
      provider: firecrawl
      crawl_depth: 2
      max_pages: 50

# Default settings applied to all repositories
defaults:
  chunk_size: 1000
  min_chunk_size: 300
  chunk_overlap: 300
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  days_back: 30

# Destination configuration
destination:
  mode: local  # local | production
  local:
    type: duckdb
    path: "./data/github_intelligence.duckdb"
  production:
    type: ducklake
    metadata_backend: postgres
    storage_backend: s3
    # Credentials loaded from environment variables:
    # DUCKLAKE_PG_HOST, DUCKLAKE_PG_DATABASE, DUCKLAKE_PG_USER, DUCKLAKE_PG_PASSWORD
    # S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY

# Database connections
databases:
  duckdb:
    path: "./data/github_intelligence.duckdb"
  lancedb:
    uri: "./data/github_intelligence.lancedb"
  memgraph:
    uri: "bolt://localhost:7687"
    user: ""
    password: ""
  falkordb:
    host: "localhost"
    port: 6379
