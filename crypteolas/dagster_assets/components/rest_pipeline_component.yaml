# Crypteolas REST API Pipeline Component
# Ingests data from GitHub and DeFi protocol APIs

component: tuatha.crypteolas._shims.dagster.components.PipelineComponent
attributes:
  # Pipeline metadata
  name: "crypteolas_rest_pipeline"
  description: "GitHub and DeFi protocol data ingestion with code embeddings"
  version: "1.0.0"
  group_name: "crypteolas"

  # ========================================================================
  # PARTITIONS: Multi-dimensional partitioning
  # ========================================================================
  partitions:
    # For GitHub: repository-based partitions
    github:
      type: "dynamic"
      key: "repository"  # owner/repo format
      values: ["anthropics/anthropic-sdk", "dagster-io/dagster", "modal-labs/modal"]

    # For DeFi: protocol-based partitions
    protocol:
      type: "static"
      values: [
        "uniswap", "aave", "compound", "curve", "lido",
        "makerdao", "yearn", "convex", "sushiswap"
      ]

    # For DeFi: chain-based partitions
    chain:
      type: "static"
      values: ["ethereum", "arbitrum", "optimism", "polygon", "base"]

  # ========================================================================
  # SOURCES: REST API configurations
  # ========================================================================
  sources:
    # GitHub API Source
    - name: "github"
      type: "rest"
      base_url: "https://api.github.com"
      auth:
        type: "bearer"
        header: "Authorization"
        token_env: "GITHUB_TOKEN"
      rate_limit:
        requests_per_hour: 5000
        retry_on_limit: true
      endpoints:
        # Repository metadata
        - name: "repos"
          path: "/repos/{owner}/{repo}"
          method: "GET"
          partition_key: "repository"

        # Repository issues
        - name: "issues"
          path: "/repos/{owner}/{repo}/issues"
          method: "GET"
          params:
            state: "all"
            per_page: 100
          paginator:
            type: "link"
            link_header: "next"
          partition_key: "repository"

        # Pull requests
        - name: "pulls"
          path: "/repos/{owner}/{repo}/pulls"
          method: "GET"
          params:
            state: "all"
            per_page: 100
          paginator:
            type: "link"
          partition_key: "repository"

        # Commits
        - name: "commits"
          path: "/repos/{owner}/{repo}/commits"
          method: "GET"
          params:
            per_page: 100
          paginator:
            type: "link"
          partition_key: "repository"

        # Code content
        - name: "code"
          path: "/repos/{owner}/{repo}/git/blobs/{sha}"
          method: "GET"
          partition_key: "repository"

    # DeFiLlama API Source
    - name: "defillama"
      type: "rest"
      base_url: "https://api.llama.fi"
      endpoints:
        # Protocol TVL
        - name: "protocols"
          path: "/protocols"
          method: "GET"
          partition_key: "protocol"

        # Protocol details
        - name: "protocol_details"
          path: "/protocol/{slug}"
          method: "GET"
          partition_key: "protocol"

        # Chain TVL
        - name: "chains"
          path: "/v2/chains"
          method: "GET"
          partition_key: "chain"

        # Yields
        - name: "yields"
          path: "/yields"
          method: "GET"
          partition_key: "protocol"

    # CoinGecko API Source
    - name: "coingecko"
      type: "rest"
      base_url: "https://api.coingecko.com/api/v3"
      rate_limit:
        requests_per_minute: 50
        retry_on_limit: true
      endpoints:
        # Token prices
        - name: "prices"
          path: "/simple/price"
          method: "GET"
          params:
            ids: "bitcoin,ethereum,binancecoin,cardano,solana"
            vs_currencies: "usd,eur"
          partition_key: "token"

        # Market data
        - name: "markets"
          path: "/coins/markets"
          method: "GET"
          params:
            vs_currency: "usd"
            per_page: 250
            page: 1
          paginator:
            type: "param"
            page_param: "page"
          partition_key: "token"

    # Binance API Source
    - name: "binance"
      type: "rest"
      base_url: "https://fapi.binance.com"
      endpoints:
        # Funding rates
        - name: "funding_rates"
          path: "/fapi/v1/fundingRate"
          method: "GET"
          params:
            limit: 1000
          partition_key: "symbol"

        # Open interest
        - name: "open_interest"
          path: "/fapi/v1/openInterest"
          method: "GET"
          partition_key: "symbol"

  # ========================================================================
  # TRANSFORMATIONS: Data processing stages
  # ========================================================================
  transformations:
    # Stage 1: Normalization
    - name: "normalize_rest_data"
      type: "normalize"
      input: "sources"
      output_table: "rest_raw"
      column_mapping:
        source: "source_system"
        timestamp: "ingested_at"

    # Stage 2: Code Analysis (for GitHub)
    - name: "analyze_code"
      type: "dspy"
      input: "github.code"
      module: "tuatha.crypteolas._shims.extraction.dspy_modules"
      class_name: "StructuredExtractor"
      model: "${OPENAI_MODEL:-openai/gpt-4o}"
      schema:
        - function_name
        - complexity
        - description
        - dependencies
        - security_issues
      output_table: "code_analysis"

    # Stage 3: Code Embedding Generation
    - name: "code_embeddings"
      type: "embed"
      input: "analyze_code"
      model: "${CODE_EMBEDDING_MODEL:-microsoft/codebert-base}"
      dimension: 768
      batch_size: 100
      text_column: "code"
      output_table: "code_embeddings"

    # Stage 4: Document Embedding (for non-code content)
    - name: "document_embeddings"
      type: "embed"
      input: "normalize_rest_data"
      model: "${EMBEDDING_MODEL:-BAAI/bge-m3}"
      dimension: 1024
      batch_size: 100
      text_column: "text"
      output_table: "document_embeddings"

    # Stage 5: DeFi Metrics Aggregation
    - name: "aggregate_defi_metrics"
      type: "aggregate"
      input: "defillama"
      window: "1d"
      aggregations:
        - column: "tvl"
          functions: ["avg", "min", "max", "stddev"]
        - column: "volume_24h"
          functions: ["sum", "avg"]
      output_table: "defi_metrics_daily"

  # ========================================================================
  # EXPORTS: Storage destinations
  # ========================================================================
  exports:
    # Export 1: DuckLake (Primary - Production)
    - name: "ducklake_crypteolas"
      type: "ducklake"
      catalog_uri: "${LAKEKEEPER_CATALOG_URI:-http://lakekeeper:8181}"
      warehouse: "${ICEBERG_WAREHOUSE:-s3://garage/warehouse}"
      namespace: "crypteolas"

      tables:
        # GitHub data
        - name: "github_repos"
          format: "parquet"
          compression: "zstd"
          partition_by: ["owner", "repo"]

        - name: "github_issues"
          format: "parquet"
          compression: "zstd"
          partition_by: ["owner", "repo", "state"]

        - name: "github_commits"
          format: "parquet"
          compression: "zstd"
          partition_by: ["owner", "repo", "date"]

        # DeFi data
        - name: "defi_protocols"
          format: "parquet"
          compression: "zstd"
          partition_by: ["protocol", "chain"]

        - name: "defi_tvl_history"
          format: "parquet"
          compression: "zstd"
          partition_by: ["protocol", "date"]

        - name: "token_prices"
          format: "parquet"
          compression: "zstd"
          partition_by: ["token", "date"]

        # Embeddings
        - name: "code_embeddings"
          format: "lance"
          location: "s3://lance/crypteolas/code_embeddings.lance"
          properties:
            table_type: "lance"
            dimension: "768"
            metric: "cosine"

        - name: "document_embeddings"
          format: "lance"
          location: "s3://lance/crypteolas/document_embeddings.lance"
          properties:
            table_type: "lance"
            dimension: "1024"
            metric: "cosine"

    # Export 2: MotherDuck (Analytics)
    - name: "motherduck_analytics"
      type: "motherduck"
      database: "${MOTHERDUCK_DATABASE:-sruth}"
      schemas:
        - "crypteolas_raw"
        - "crypteolas_analytics"
        - "github"
        - "defi"

      # Enable PlanetScale attachment for hybrid OLTP/OLAP
      enable_planetscale_attach: false

    # Export 3: PostgreSQL (Operational queries)
    - name: "postgres_ops"
      type: "postgres"
      connection: "${POSTGRES_URL:-postgresql://postgres:postgres@postgres:5432/crypteolas}"
      tables:
        - name: "repos"
          primary_key: "repo_id"
          upsert: true

        - name: "latest_metrics"
          primary_key: ["protocol", "chain", "date"]
          upsert: true

  # ========================================================================
  # OBSERVABILITY: Monitoring and tracking
  # ========================================================================
  observability:
    # Langfuse for LLM calls (code analysis)
    langfuse:
      enabled: true
      public_key: "${LANGFUSE_PUBLIC_KEY}"
      secret_key: "${LANGFUSE_SECRET_KEY}"
      host: "${LANGFUSE_HOST:-https://cloud.langfuse.com}"

    # MLflow for experiment tracking
    mlflow:
      enabled: true
      tracking_uri: "${MLFLOW_TRACKING_URI:-http://mlflow:5000}"
      experiment_name: "crypteolas_rest_ingestion"

    # Asset checks for data quality
    asset_checks:
      - name: "api_success_rate_check"
        description: "Ensure API success rate >95%"
        severity: "WARN"
        lower_bound: 0.95

      - name: "code_coverage_check"
        description: "Verify code embedding coverage"
        severity: "WARN"
        lower_bound: 0.8

  # ========================================================================
  # SCHEDULING
  # ========================================================================
  schedule:
    # GitHub data: hourly
    github:
      cron: "0 * * * *"  # Every hour
      timezone: "UTC"

    # DeFi data: every 5 minutes
    defi:
      cron: "*/5 * * * *"  # Every 5 minutes
      timezone: "UTC"

    # Token prices: every minute
    prices:
      cron: "* * * * *"  # Every minute
      timezone: "UTC"

  # ========================================================================
  # RESOURCE CONFIGURATION
  # ========================================================================
  resources:
    cpu_limit: "4"
    memory_limit: "16Gi"

    # Concurrency limits (respect rate limits)
    max_concurrent_requests: 10
    max_concurrent_transforms: 5
    max_concurrent_exports: 3

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
#
# GitHub API:
#   GITHUB_TOKEN            - GitHub personal access token
#
# Lakekeeper/Iceberg:
#   LAKEKEEPER_CATALOG_URI  - REST catalog URI
#   ICEBERG_WAREHOUSE       - S3 warehouse location
#
# MotherDuck:
#   MOTHERDUCK_TOKEN        - MotherDuck API token
#   MOTHERDUCK_DATABASE     - Database name (default: sruth)
#
# PostgreSQL:
#   POSTGRES_URL            - PostgreSQL connection string
#
# LanceDB:
#   LANCEDB_URI             - LanceDB connection string
#   LANCEDB_S3_BUCKET       - S3 bucket for Lance data
#
# LLM Code Analysis:
#   OPENAI_API_KEY          - OpenAI API key (or compatible)
#   OPENAI_MODEL            - Model for DSPy extraction
#
# Embeddings:
#   CODE_EMBEDDING_MODEL    - Code embedding model (default: microsoft/codebert-base)
#   EMBEDDING_MODEL         - Text embedding model (default: BAAI/bge-m3)
#   HF_TOKEN                - HuggingFace token
#
# Observability:
#   LANGFUSE_PUBLIC_KEY     - Langfuse public key
#   LANGFUSE_SECRET_KEY     - Langfuse secret key
#   MLFLOW_TRACKING_URI     - MLflow server URI
#
# ============================================================================

# ============================================================================
# PIPELINE ARCHITECTURE
# ============================================================================
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                          SOURCE LAYER                                   │
# │  ┌──────────────┐  ┌──────────────┐  ┌──────────────┐                  │
# │  │ GitHub API   │  │ DeFiLlama    │  │ CoinGecko    │                  │
# │  │ (repos,      │  │ (TVL,        │  │ (prices)     │                  │
# │  │  issues)     │  │  protocols)  │  │              │                  │
# │  └──────┬───────┘  └──────┬───────┘  └──────┬───────┘                  │
# │         │                 │                 │                          │
# │  ┌──────┴───────┐  ┌──────┴───────┐  ┌──────┴───────┐                  │
# │  │ Binance      │  │ Beaconchain  │  │ The Graph    │                  │
# │  │ (funding)    │  │ (staking)    │  │ (subgraphs)  │                  │
# │  └──────────────┘  └──────────────┘  └──────────────┘                  │
# └─────────┼─────────────────┼─────────────────┼──────────────────────────┘
#           │                 │                 │
#           ▼                 ▼                 ▼
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                      NORMALIZATION                                     │
# │  Standardize API responses → rest_raw table                           │
# └─────────────────────────────┬───────────────────────────────────────────┘
#                               │
#               ┌───────────────┼───────────────┐
#               ▼               ▼               ▼
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                    TRANSFORMATIONS                                     │
# │  ┌──────────────┐  ┌──────────────┐  ┌──────────────┐                  │
# │  │ Code Analysis│  │ Embeddings   │  │ DeFi Metrics │                  │
# │  │ (DSPy)       │  │ (CodeBERT)   │  │ (Aggregates) │                  │
# │  └──────────────┘  └──────────────┘  └──────────────┘                  │
# └─────────────────────────────┬───────────────────────────────────────────┘
#                               │
#               ┌───────────────┼───────────────┐
#               ▼               ▼               ▼
# ┌──────────────────┐ ┌──────────────┐ ┌──────────────┐
# │   DuckLake       │ │ MotherDuck   │ │ PostgreSQL   │
# │ (Hot/Warm/Cold)  │ │ (Analytics)  │ │ (Operational)│
# │  + Lakekeeper    │ │              │ │              │
# └──────────────────┘ └──────────────┘ └──────────────┘
#
# ============================================================================
