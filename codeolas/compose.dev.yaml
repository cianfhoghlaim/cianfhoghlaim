# =============================================================================
# CÓDEOLAS - Development Environment
# =============================================================================
# Extends compose.yaml for local code intelligence development with hot-reload.
#
# USAGE:
#   Development:  docker compose -f compose.yaml -f docker-compose.dev.yml up
# =============================================================================
#
# This dev overlay adds:
#   - Source code volume mounts for hot-reload
#   - Development command overrides
#   - Debug logging enabled
#   - Resource limits removed
#   - Connection to shared bonneagar infrastructure
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API - Development Mode with Hot Reload
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Use builder stage for dev
    volumes:
      # Mount source code for hot-reload
      - ./api:/app/api:ro
      - ./storage:/app/storage
      - ./baml_src:/app/baml_src:ro
      - ./tests:/app/tests:ro
      # Persist data locally
      - ./storage/data:/app/storage/data
      - ./storage/chunkhound:/app/storage/chunkhound
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      # Storage paths
      DUCKDB_PATH: /app/storage/data/codeolas.duckdb
      LANCEDB_PATH: /app/storage/data/code_vectors.lance
      # Tree-sitter for parsing
      TREE_SITTER_LANGUAGES: python,typescript,javascript,go,rust,java,cpp,c,php,ruby,swift,kotlin
      # LLM Configuration
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
      # ChunkHound integration
      CHUNKHOUND_INDEX_PATH: /app/storage/chunkhound
      # Observability (connect to shared Langfuse)
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      # Datadog (optional)
      DD_SERVICE: codeolas-api
      DD_ENV: development
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Remove resource limits for dev
    deploy:
      resources: {}

  # ---------------------------------------------------------------------------
  # MCP SERVER - Development Mode
  # ---------------------------------------------------------------------------
  mcp-server:
    environment:
      MCP_TRANSPORT: stdio
      LOG_LEVEL: DEBUG
      LANCEDB_PATH: /app/storage/data/code_vectors.lance
      CHUNKHOUND_INDEX_PATH: /app/storage/chunkhound
    volumes:
      - ./storage/data:/app/storage/data
      - ./storage/chunkhound:/app/storage/chunkhound

  # ---------------------------------------------------------------------------
  # Dagster Webserver - Development Mode
  # ---------------------------------------------------------------------------
  dagster-webserver:
    image: dagster/dagster-webserver:1.9.0
    volumes:
      # Mount source code for hot-reload
      - ./dagster_assets:/opt/dagster/app:ro
      # Persist data locally
      - ./storage/data:/data
      - ./dagster_home:/opt/dagster/dagster_home
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONPATH: /opt/dagster/app
      LOG_LEVEL: DEBUG
      # Storage paths
      DUCKDB_PATH: /data/codeolas.duckdb
      LANCEDB_PATH: /data/code_vectors.lance
      # ChunkHound
      CHUNKHOUND_INDEX_PATH: /data/chunkhound
    # Remove resource limits for dev
    deploy:
      resources: {}

  # ---------------------------------------------------------------------------
  # Dagster Daemon - Development Mode
  # ---------------------------------------------------------------------------
  dagster-daemon:
    image: dagster/dagster-daemon:1.9.0
    volumes:
      # Mount source code for hot-reload
      - ./dagster_assets:/opt/dagster/app:ro
      # Persist Dagster home locally
      - ./dagster_home:/opt/dagster/dagster_home
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      LOG_LEVEL: DEBUG
    # Remove resource limits for dev
    deploy:
      resources: {}

# =============================================================================
# NETWORKS
# =============================================================================
# Connect to bonneagar shared infrastructure network for:
#   - Langfuse (LLM observability at http://langfuse:3000)
#   - FalkorDB (vector+graph hybrid database)
#   - Other sruth services
# =============================================================================
networks:
  codeolas:
    external: true
    name: bonneagar_default

# =============================================================================
# VOLUMES (Development overrides)
# =============================================================================
# All volumes are replaced with bind mounts to local directories for easier access
# =============================================================================

# =============================================================================
# DEVELOPMENT NOTES
# =============================================================================
#
# Shared Infrastructure (via bonneagar_default network):
#   - Langfuse:         http://langfuse:3000 (LLM observability)
#   - FalkorDB:         http://falkordb:6379 (Redis graph+vector)
#   - Lakekeeper:       http://lakekeeper:8181 (Iceberg REST catalog)
#   - Other sruth APIs: See respective PORTS.md mappings
#
# To start shared services:
#   cd bonneagar/storage/falkordb && docker compose up -d
#   cd bonneagar/storage/langfuse && docker compose up -d
#
# Service Endpoints:
#   - API:           localhost:8002
#   - Dagster UI:    localhost:3102
#   - MCP Server:    stdio (for Claude Desktop integration)
#
# Development Workflow:
#   1. Start base services: docker compose -f compose.yaml up -d
#   2. Apply dev overrides: docker compose -f compose.yaml -f docker-compose.dev.yml up -d
#   3. Access API docs at http://localhost:8002/docs
#   4. Access Dagster at http://localhost:3102
#
# Code Analysis Features:
#   - Semantic search via BGE-M3 embeddings
#   - Multi-hop code exploration with ChunkHound
#   - Tree-sitter parsing for 15+ languages
#   - BAML schema validation for LLM extraction
#
# Testing:
#   - Run tests: uv run pytest tests/
#   - Watch mode: uv run pytest tests/ -f
#   - Coverage: uv run pytest tests/ --cov=api
#
