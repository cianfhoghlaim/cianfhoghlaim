# MotherDuck Flight registry for Cianfhoghlaim.
#
# Every flight registered here is published to the
# `cianfhoghlaim.motherduck.flights` namespace and is callable via
# the MotherDuck Flight service.

flights:
  - name: eu_official_daily_sync_flight
    module: cianfhoghlaim.motherduck.flights.eu_official_daily_sync_flight
    callable: build_eu_official_daily_sync_flight
    cron: "0 5 * * *"
    timezone: UTC
    description: "Daily BAML backfill for the EU institutional pipeline"
    tags:
      - european_union
      - multilingual
      - daily_sync
  - name: eu_nation_daily_sync_flight
    module: cianfhoghlaim.motherduck.flights.eu_nation_daily_sync_flight
    callable: build_eu_nation_daily_sync_flight
    cron: "0 6 * * *"
    timezone: UTC
    description: "Daily BAML backfill for the EU nations + Ukraine pipeline"
    tags:
      - european_nations
      - ukr
      - fra
      - deu
      - pol
      - esp
      - ita
      - daily_sync
  - name: commonwealth_daily_sync_flight
    module: cianfhoghlaim.motherduck.flights.commonwealth_daily_sync_flight
    callable: build_commonwealth_daily_sync_flight
    cron: "0 6 * * *"
    timezone: UTC
    description: "Daily BAML backfill for the Commonwealth pipeline"
    tags:
      - commonwealth
      - aus
      - can
      - nzl
      - ind
      - zaf
      - daily_sync
  - name: americas_daily_sync_flight
    module: cianfhoghlaim.motherduck.flights.americas_daily_sync_flight
    callable: build_americas_daily_sync_flight
    cron: "0 6 * * *"
    timezone: UTC
    description: "Daily BAML backfill for the Americas regional pipeline"
    tags:
      - americas
      - us_us_ca
      - bra
      - mex
      - ven
      - daily_sync
  - name: british_isles_daily_sync_flight
    module: cianfhoghlaim.motherduck.flights.british_isles_daily_sync_flight
    callable: build_british_isles_daily_sync_flight
    cron: "0 5 * * *"
    timezone: UTC
    description: "Daily BAML backfill for the British Isles parity layer (Scotland / Wales / England / Northern Ireland + 3 Crown Dependencies)"
    tags:
      - biep
      - parity
      - sct
      - wls
      - en
      - ni
      - isle_of_man
      - jersey
      - guernsey
      - daily_sync
  - name: canada_daily_sync_flight
    module: cianfhoghlaim.motherduck.flights.canada_daily_sync_flight
    callable: build_canada_daily_sync_flight
    cron: "0 6 * * *"
    timezone: UTC
    description: "Daily BAML backfill for the Canada provinces + Quebec/Montreal pipeline"
    tags:
      - commonwealth
      - canada
      - daily_sync
      - bilingual
  - name: nigeria_daily_sync_flight
    module: cianfhoghlaim.motherduck.flights.nigeria_daily_sync_flight
    callable: build_nigeria_daily_sync_flight
    cron: "0 6 * * *"
    timezone: UTC
    description: "Daily BAML backfill for the Nigerian federal + state pipeline"
    tags:
      - commonwealth
      - nigeria
      - nga
      - daily_sync
  - name: eu_multilingual_daily_sync_flight
    module: cianfhoghlaim.motherduck.flights.eu_multilingual_daily_sync_flight
    callable: build_eu_multilingual_daily_sync_flight
    cron: "0 5 * * *"
    timezone: UTC
    description: "Daily BAML backfill for the EU multilingual (en + ga) alignment pipeline"
    tags:
      - european_union
      - multilingual
      - alignment
      - en
      - ga
      - irish
      - daily_sync

