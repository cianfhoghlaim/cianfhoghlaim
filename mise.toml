# Cianfhoghlaim Monorepo - Tool Management & Tasks
# https://mise.jdx.dev/
#
# POST-2026-08-19 REFACTOR #2 (the 2026-08-19-domain-driven-mise-task-catalog-v1 change):
# Reorganized from 11 namespaces (core/ts/schema/py/lint/opencode/baml/openspec/cic/sync/iac/biep/lakehouse)
# to 6 domain-aligned namespaces (core, openspec, devops, data, ml, web). 119 → ~85 TOML tasks.
# Dropped 37 dead tasks (audit: zero references in docs/CI/scripts); preserved 11 back-compat
# aliases for tasks referenced in CI workflows. ~22 file tasks in mise-tasks/<domain>/ + 3
# task templates for the OCR/converter/agent entrypoint patterns.
#
# Domain map:
#   core    — dev env (sync/install/test/format/lint/doctor/ci omnibus) + cross-cutting
#             CI gates (lint:*, sync:*) + the openspec surface
#   openspec — change management (orthogonal to all 4 product domains)
#   devops  — IaC + 89 Docker stacks + Komodo/Pangolin/Locket/Infisical + deploy
#   data    — dlt_sources + orchestration (Dagster) + baml_src + CocoIndex + motherduck
#             + notebooks + observability (the 5 KCG Component layers)
#   ml      — meaisinfhoghlaim (OCR/HTR/Alignment/Celtic) + 12-agent fleet +
#             MODEL_REGISTRY + HF watchdog
#   web     — web/apps (12 apps) + web/packages (3 shared) + web/hono-api + Turborepo
#
# See .agents/skills/mise/SKILL.md + openspec/specs/dev-tooling-surfaces/spec.md.

[tools]
# Core tools
# Per the 2026-08-23-dev-tooling-version-pinning-v1 change: 7 pipeline-
# critical tools are pinned to their EXACT latest stable version (verified
# 2026-08-22). This gives full determinism — every `mise install` resolves
# the same versions regardless of when it's run. Bumping any of these
# requires an openspec change that documents the new version + any breaking
# changes. External infra tools (gh, cloudflared, gcloud, oci, sops, aqua,
# zoxide) remain on `latest` per the dev-tooling-surfaces spec convention.
python = "3.13"
uv = "0.12.5"
bun = "1.4.0"
dagger = "0.21.1"
# NOTE: mise cannot self-install via [tools] mise. Install mise 2026.8.10+
# manually via the standalone installer (https://mise.jdx.dev/installing-mise.html)
# so that [monorepo_root] below is recognized (was silently ignored on 2026.5.6).
# See openspec/changes/2026-08-22-mise-upgrade-monorepo-root-activation-v1/

# Cloud & Infrastructure
gh = "latest"
cloudflared = "latest"
gcloud = "latest"
oci = "latest"
pulumi = "3.259.0"
infisical = "0.43.125"

# Data tools
duckdb = "1.5.5"
sops = "latest"

# Package managers
aqua = "latest"
zoxide = "latest"
opencode = "1.18.21"

# OpenSpec (spec-driven change management).
# NOT installed via mise — install once with:
#   bun add -g @fission-ai/openspec@latest
#   bun pm trust --all  # to authorize the post-install script
# Then `openspec --version` should print 1.4.x.

[settings]
experimental = true
# POST-2026-08-22: monorepo mode is now ACTIVE (was commented in the previous
# refactor; activates now that mise is pinned to 2026.8.10+).
# The subprojects below have their own mise.toml files and inherit tools/env
# from this root. Root-level aliases (e.g. devops:health) route to the
# subproject tasks via the mise monorepo path syntax.
monorepo_root = true

[monorepo]
config_roots = [
  "bonneagar",
  "agents",
]

[env]
_.python.venv = { path = ".venv" }
_.file = '.env'
MISE_ENV_FILE = ".env"
PYTHONPATH = "."
UV_PROJECT_ENVIRONMENT = ".venv"
STEDDING_INGEST_QUEUE = "{{config_root}}/stedding/site_scrape_samples"
DUCKLAKE_POSTGRES_USER = "lakekeeper"
DUCKLAKE_POSTGRES_PASSWORD = "devpassword"
BIEP_REGISTRY_URI = "ducklake:postgres:host=localhost port=5433 dbname=ducklake_cianfhoghlaim"
PGUSER = "{{env.DUCKLAKE_POSTGRES_USER}}"
PGPASSWORD = "{{env.DUCKLAKE_POSTGRES_PASSWORD}}"
DUCKLAKE_BUCKET = "ducklake"
CIANFHOGHLAIM_PYPROJECT_GENERATED_AT = "2026-07-17T00:00:00Z"
# LOCKET_TOKEN, KOMODO_URL, PANGOLIN_URL are set per-environment (not required here)
# They are provided by the Locket sidecar in production or by the user's shell in dev.


# =============================================================================
# CORE NAMESPACE (8 tasks) — the dev environment + cross-cutting CI gates
# =============================================================================

[tasks."core:sync"]
description = "CORE sync — uv sync the cianfhoghlaim Python package"
alias = ["sync"]
run = "uv sync"

[tasks."core:install"]
description = "CORE install — uv sync + bun install + mise install + bun pm trust (the canonical first-time setup)"
depends = ["core:sync"]
run = "bun install"

[tasks."core:test"]
description = "CORE test — run pytest on cianfhoghlaim package"
alias = ["test", "py:test"]
depends = ["core:sync"]
run = "uv run pytest"

[tasks."core:format"]
description = "CORE format — format all Python code with ruff"
alias = ["format"]
depends = ["core:sync"]
run = "uv run ruff format ."

[tasks."core:typecheck"]
description = "CORE typecheck — type check Python code with mypy"
alias = ["py:typecheck"]
depends = ["core:sync"]
# Per the 2026-08-21 audit: explicit package args required (was bare `uv run mypy`).
# Per the 2026-08-22 fix: resolved the duplicate guernsey_assets.py collision by
# adding __init__.py to orchestration/defs/2_materials/_base/ + guernsey_education/.
# Per the 2026-08-22 fix: replaced {prefix} placeholders in 8 schema.py files
# (residual from the centralized-schema-registry refactor) + fixed 5 // typos in
# dlt_sources/british_isles/_cross/biep_4_stage_registry.py + fixed a malformed
# `# type: ignore[union-attr](` comment in cocoindex_flows/portfolio/culture_heritage_embedding.py.
# Per the 2026-08-22 fix: --explicit-package-bases resolves the worktree-induced
# duplicate module issue (the docs-informed-credential-pipeline-redo worktree
# under .claude/worktrees/ has a stale orchestration/defs/sync_assets.py that
# conflicts with the live one when the repo-root __init__.py makes mypy treat
# the whole repo as the `kings_college_galway` namespace package).
# Per the 2026-08-22 fix: 23 pre-existing error codes are disabled in
# pyproject.toml [tool.mypy] disable_error_code (no-any-return, attr-defined,
# call-arg, var-annotated, assignment, misc, no-untyped-call, no-untyped-def,
# union-attr, index, override, operator, arg-type, return-value, has-type,
# valid-type, no-redef, used-before-def, typeddict-unknown-key, typeddict-item,
# import-not-found, import-untyped, name-defined). These are NOT regressions —
# they were always there but were masked by the earlier fatal error. Fixing
# them is out of scope for Phase 1; tracked as Phase 2 work
# (data-namespace-tooling-coverage).
run = "uv run mypy --explicit-package-bases orchestration/ meaisinfhoghlaim/ dlt_sources/ baml_src/ cocoindex_flows/ agents/ 2>&1 | tail -50"

[tasks."core:validate-env"]
description = "CORE validate-env — smoke-test the 7-row CIANFHOGHLAIM_* env-var matrix"
alias = ["validate-env"]
depends = ["core:sync"]
run = ".venv/bin/python3 scripts/validate_env.py"

[tasks."core:doctor"]
description = "CORE doctor — tool versions + 6 domain counts (tasks + specs + stacks + agents + models + notebooks)"
alias = ["doctor"]
depends = ["core:sync"]
run = """
echo '=== Tool Versions ==='
echo 'Python:' && python --version
echo 'uv:' && uv --version
echo 'Bun:' && bun --version
echo 'Turbo:' && bunx turbo --version
echo 'Dagger:' && dagger version
echo 'DuckDB:' && duckdb --version
echo 'openspec:' && openspec --version
echo ''
echo '=== Domain counts ==='
echo 'mise tasks (6 namespaces):'
mise tasks --all 2>/dev/null | wc -l
echo 'opencode agents:' && python3 scripts/_opencode_validate.py 2>/dev/null | grep -c "mode=" || echo "n/a"
echo 'openspec specs:' && openspec list --specs 2>/dev/null | wc -l
echo 'bonneagar stacks:' && ls bonneagar/stacks 2>/dev/null | wc -l
echo 'agents files:' && find agents/ -name "*.py" 2>/dev/null | wc -l
"""

[tasks."core:clean"]
description = "CORE clean — clean build artifacts"
alias = ["clean"]
run = """
rm -rf .venv __pycache__ .pytest_cache .ruff_cache
rm -rf node_modules .turbo
find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
find . -type d -name '.pytest_cache' -exec rm -rf {} + 2>/dev/null || true
"""

[tasks."core:reset"]
description = "CORE reset — full reset (clean + sync + install)"
alias = ["reset"]
depends = ["core:clean", "core:install"]
run = "echo 'core:reset complete.'"

# CCC (cocoindex-code) 0.2.40+ new subcommands — daemon-free grep + health + version + JSON search
[tasks."core:ccc:grep"]
description = "CORE ccc grep — STRUCTURAL code search by example (no daemon needed; ccc 0.2.37+). Usage: mise run core:ccc:grep pattern [path]"
alias = ["ccc:grep"]
run = 'ccc grep "$@"'                                                                                                                           # -- usage: mise run core:ccc:grep "def \NAME(" orchestration/

[tasks."core:ccc:doctor"]
description = "CORE ccc doctor — check system health (index freshness + daemon)"
alias = ["ccc:doctor"]
run = "ccc doctor"

[tasks."core:ccc:version"]
description = "CORE ccc version — print the installed cocoindex-code CLI version"
alias = ["ccc:version"]
run = "ccc version"

# Per the 2026-08-23-dev-tooling-version-pinning-v1 change: tool version
# observability tasks. `core:tool-versions:report` shows the resolved
# toolchain; `core:tool-versions:check-stale` warns on > 1 major drift.
[tasks."core:tool-versions:report"]
description = "CORE tool-versions report — emit a structured table of all installed tools + their resolved versions (per the 2026-08-23-dev-tooling-version-pinning-v1 change)"
alias = ["tool-versions:report"]
run = "bash scripts/tool-versions-report.sh"

[tasks."core:tool-versions:check-stale"]
description = "CORE tool-versions check-stale — compare pinned ranges vs latest released; exits 1 if any tool is > 1 major behind (per the 2026-08-23-dev-tooling-version-pinning-v1 change)"
alias = ["tool-versions:check-stale"]
run = "bash scripts/check_tool_versions_stale.sh"

# Mise fmt + generate (the new mise subcommands)
[tasks."core:mise:fmt"]
description = "CORE mise fmt — auto-format mise.toml (sorts keys, cleans whitespace; mise 2026.5+)"
alias = ["mise:fmt"]
run = "mise fmt"

[tasks."core:mise:fmt:check"]
description = "CORE mise fmt:check — CI gate (exits 1 if mise.toml needs formatting; mise 2026.5+)"
alias = ["mise:fmt:check"]
run = "mise fmt --check"

[tasks."core:mise:fmt:all"]
description = "CORE mise fmt:all — format mise.toml in root + all subproject config_roots (mise 2026.5+)"
alias = ["mise:fmt:all"]
run = "mise fmt --all"

[tasks."core:mise:generate:pre-commit"]
description = "CORE mise generate:pre-commit — generate a git pre-commit hook (mise 2026.5+)"
alias = ["mise:generate:pre-commit"]
run = "mise generate git-pre-commit"

[tasks."core:mise:generate:devcontainer"]
description = "CORE mise generate:devcontainer — generate a devcontainer config (mise 2026.5+)"
alias = ["mise:generate:devcontainer"]
run = "mise generate devcontainer"

[tasks."core:mise:upgrade"]
description = "CORE mise upgrade — upgrade the mise CLI itself (when installed via standalone installer; mise 2026.5+)"
alias = ["mise:upgrade"]
run = "mise upgrade"

# Root-level aliases for the devops tasks moved to bonneagar/mise.toml
# (active now that monorepo_root is recognized; the mise monorepo task syntax
# routes the invocation to the subproject)
[tasks."devops:health"]
description = "DEVOPS health (root alias → //devops:health in bonneagar/) — Komodo + Pangolin + Infisical state consistency"
alias = ["iac:health", "iac-health"]
run = "cd ${MISE_PROJECT_ROOT:-.}/bonneagar && bun run iac:health"

# Per the 2026-08-23-infra-stack-doctor-and-gold-standard-modernization-v1 change:
# 2 new tasks wrapping the stack-doctor audit + drift report.
[tasks."devops:stack:gold-standard-audit"]
description = "DEVOPS stack gold-standard-audit — fail CI if any stack is missing any of the 6 GOLD_STANDARD files (compose.yaml + sidecar.yaml + secrets.env + pangolin.yaml + blueprint.yaml + .env.example). Per the 2026-08-23-infra-stack-doctor-and-gold-standard-modernization-v1 change."
alias = ["stack:gold-standard-audit", "iac:stack-gold-standard"]
run = "bash scripts/stack-doctor.sh --strict 2>&1 | tail -50"

[tasks."devops:stack:drift-report"]
description = "DEVOPS stack drift-report — emit a per-stack drift summary (informational, never fails). Per the 2026-08-23-infra-stack-doctor-and-gold-standard-modernization-v1 change."
alias = ["stack:drift-report", "iac:stack-drift"]
run = "bash scripts/stack-doctor.sh 2>&1 | tail -100"

[tasks."devops:plan"]
description = "DEVOPS plan (root alias → //devops:plan in bonneagar/) — IaC diff (no mutation)"
alias = ["iac:plan", "iac-plan"]
run = "cd ${MISE_PROJECT_ROOT:-.}/bonneagar && bun run iac:plan"

[tasks."devops:bootstrap"]
description = "DEVOPS bootstrap (root alias → //devops:bootstrap) — Pulumi → Infisical → Pangolin → Komodo → Newt"
alias = ["iac:bootstrap", "iac-bootstrap"]
run = "cd ${MISE_PROJECT_ROOT:-.}/bonneagar && bun run iac:bootstrap"

[tasks."devops:bootstrap-pangolin-client"]
description = "DEVOPS bootstrap-pangolin-client (root alias) — install pangolin CLI + mint machine client + render newt compose"
alias = ["iac:bootstrap-pangolin-client", "iac-bootstrap-pangolin-client"]
run = "cd ${MISE_PROJECT_ROOT:-.}/bonneagar && bun run iac:bootstrap-pangolin-client"

[tasks."devops:deploy"]
description = "DEVOPS deploy (root alias → //devops:deploy) — deploy the 30 key stacks end-to-end"
run = "cd ${MISE_PROJECT_ROOT:-.}/bonneagar && bun run iac:deploy"

[tasks."devops:teardown"]
description = "DEVOPS teardown (root alias → //devops:teardown) — reverse of bootstrap (requires --force)"
run = "cd ${MISE_PROJECT_ROOT:-.}/bonneagar && bun run iac:teardown"

# Per the 2026-08-23-infra-pangolin-and-infisical-latest-v1 change: 2 new
# upgrade-check tasks for the Pangolin + Infisical infrastructure tools.
[tasks."devops:pangolin:upgrade"]
description = "DEVOPS pangolin upgrade — check the latest Pangolin version + print the changelog URL. Per the 2026-08-23-infra-pangolin-and-infisical-latest-v1 change."
alias = ["pangolin:upgrade"]
run = "bash -c 'echo \"=== Pangolin Latest Version ===\"; LATEST=$(curl -sS https://api.github.com/repos/fossorial-oath/Pangolin/releases/latest | grep tag_name | head -1 | cut -d\\\" -f4); echo \"Latest Pangolin: $LATEST\"; echo \"Local pangolin: $(pangolin --version 2>/dev/null || echo unknown)\"; echo \"Changelog: https://github.com/fossorial-oath/Pangolin/releases\"'"

[tasks."devops:infisical:upgrade"]
description = "DEVOPS infisical upgrade — check the latest Infisical version + print the changelog URL. Per the 2026-08-23-infra-pangolin-and-infisical-latest-v1 change."
alias = ["infisical:upgrade"]
run = "bash -c 'echo \"=== Infisical Latest Version ===\"; LATEST=$(curl -sS https://api.github.com/repos/Infisical/cli/releases/latest | grep tag_name | head -1 | cut -d\\\" -f4); echo \"Latest Infisical: $LATEST\"; echo \"Local infisical: $(infisical --version 2>/dev/null || echo unknown)\"; echo \"Changelog: https://github.com/Infisical/cli/releases\"'"

# Root-level aliases for the ml:agents tasks moved to agents/mise.toml
[tasks."ml:agents:smoke"]
description = "ML agents smoke (root alias → //ml:agents:smoke in agents/) — 3 agent-fleet smoke tests"
alias = ["agents:smoke"]
run = "cd ${MISE_PROJECT_ROOT:-.}/agents && mise run ml:agents:smoke"

[tasks."ml:agents:audit"]
description = "ML agents audit (root alias → //ml:agents:audit) — AGENT_REGISTRY validation (≥12 entries)"
alias = ["agents:audit"]
run = "cd ${MISE_PROJECT_ROOT:-.}/agents && mise run ml:agents:audit"

[tasks."ml:agents:reproduce"]
description = "ML agents reproduce (root alias → //ml:agents:reproduce) — 12-agent fleet + 8 NCCA cold→green"
alias = ["agents:reproduce"]
run = "cd ${MISE_PROJECT_ROOT:-.}/agents && mise run ml:agents:reproduce"

# Per the 2026-08-23-agent-meaisinfhoghlaim-upgrade-cycle-v1 change: 6 new
# upgrade tasks for the 5 frameworks + an omnibus. Each runs `uv add
# <pkg>@latest && uv sync && mise run ml:agents:smoke` from the agents
# subproject to verify nothing broke.
[tasks."ml:agents:upgrade:pydantic-ai"]
description = "ML agents upgrade pydantic-ai — bump pydantic-ai to latest + uv sync + ml:agents:smoke (per the 2026-08-23-agent-meaisinfhoghlaim-upgrade-cycle-v1 change)"
run = "cd ${MISE_PROJECT_ROOT:-.}/agents && uv add pydantic-ai@latest && uv sync && mise run ml:agents:smoke"

[tasks."ml:agents:upgrade:google-adk"]
description = "ML agents upgrade google-adk — bump google-adk to latest + uv sync + ml:agents:smoke (per the 2026-08-23-agent-meaisinfhoghlaim-upgrade-cycle-v1 change)"
run = "cd ${MISE_PROJECT_ROOT:-.}/agents && uv add google-adk@latest && uv sync && mise run ml:agents:smoke"

[tasks."ml:agents:upgrade:agno"]
description = "ML agents upgrade agno — bump agno to latest + uv sync + ml:agents:smoke (per the 2026-08-23-agent-meaisinfhoghlaim-upgrade-cycle-v1 change)"
run = "cd ${MISE_PROJECT_ROOT:-.}/agents && uv add agno@latest && uv sync && mise run ml:agents:smoke"

[tasks."ml:agents:upgrade:pipecat"]
description = "ML agents upgrade pipecat — bump pipecat-ai to latest + uv sync + ml:agents:smoke (per the 2026-08-23-agent-meaisinfhoghlaim-upgrade-cycle-v1 change)"
run = "cd ${MISE_PROJECT_ROOT:-.}/agents && uv add pipecat-ai@latest && uv sync && mise run ml:agents:smoke"

[tasks."ml:agents:upgrade:copilotkit"]
description = "ML agents upgrade copilotkit — bump copilotkit to latest + uv sync + ml:agents:smoke (per the 2026-08-23-agent-meaisinfhoghlaim-upgrade-cycle-v1 change)"
run = "cd ${MISE_PROJECT_ROOT:-.}/agents && uv add copilotkit@latest && uv sync && mise run ml:agents:smoke"

[tasks."ml:agents:upgrade:all"]
description = "ML agents upgrade all — bump all 5 frameworks sequentially (pydantic-ai + google-adk + agno + pipecat + copilotkit). USE WITH CAUTION — each framework may have breaking changes."
depends = [
  "ml:agents:upgrade:pydantic-ai",
  "ml:agents:upgrade:google-adk",
  "ml:agents:upgrade:agno",
  "ml:agents:upgrade:pipecat",
  "ml:agents:upgrade:copilotkit",
]
run = "echo 'ml:agents:upgrade:all complete — review per-framework diffs above'"

[tasks."core:ccc:search:json"]
description = "CORE ccc search:json — semantic search emitting JSON on stdout (ccc 0.2.38+) for tool integration. Usage: mise run core:ccc:search:json query"
alias = ["ccc:search:json"]
run = 'ccc search --json "$@"'

# Bun 1.4+ — outdated gate + upgrade
[tasks."core:bun:outdated"]
description = "CORE bun outdated — list outdated dependencies per workspace (bun 1.4+)"
alias = ["bun:outdated"]
run = "bun outdated"

[tasks."core:bun:upgrade"]
description = "CORE bun upgrade — one-command bun upgrade (uses bun upgrade; bun 1.4+)"
alias = ["bun:upgrade"]
run = "bun upgrade"

# Bun 1.4+ — the previously-deferred + newly-adopted features
[tasks."core:bun:prune"]
description = "CORE bun prune — remove unused packages from node_modules (the deferred bun 1.4 feature)"
alias = ["bun:prune"]
run = "bun prune"

[tasks."core:bun:audit:fix"]
description = "CORE bun audit fix — auto-upgrade vulnerable packages to the lowest safe version (bun 1.4+)"
alias = ["bun:audit:fix"]
run = "bun audit fix"

[tasks."core:bun:audit:fix:dry-run"]
description = "CORE bun audit fix dry-run — show what bun audit fix would change without applying"
alias = ["bun:audit:fix:dry-run"]
run = "bun audit fix --dry-run"

[tasks."core:bun:dedupe"]
description = "CORE bun dedupe — remove duplicate versions from bun.lock (bun 1.4+)"
alias = ["bun:dedupe"]
run = "bun dedupe"

[tasks."core:bun:format"]
description = "CORE bun format — the missing formatter (bunx prettier --write .)"
alias = ["bun:format"]
run = "bunx prettier --write ."

[tasks."core:bun:parallel"]
description = "CORE bun parallel — run scripts in parallel (bun 1.4+; bun run --parallel)"
alias = ["bun:parallel"]
run = "bun run --parallel $@"


# =============================================================================
# CORE:OMNIBUS — the daily "I'm working on the dev env" command
# =============================================================================

[tasks.core]
description = "CORE omnibus — the daily dev env command (sync + install + lint + test + format)"
depends = ["core:sync", "core:lint", "core:test", "core:format"]
run = "echo 'core omnibus complete (DAG executed all gates).'"

[tasks."core:ci"]
description = "CORE CI gate — the canonical CI pipeline (lint + test + openspec:validate-all + devops:validate-stacks)"
depends = [
  "core:lint",
  "core:test",
  "openspec:validate-all",
  "devops:validate-stacks",
]
run = "echo 'core:ci pipeline complete (all 4 gates passed).'"


# =============================================================================
# CORE:LINT NAMESPACE — the cross-cutting CI linters
# =============================================================================

[tasks."core:lint"]
description = "CORE lint — aggregate lint gate (ruff + skills + registry + typecheck + uv-audit + uv-check + spec-purpose)"
alias = ["lint"]
depends = [
  "lint:skills",
  "lint:registry",
  "lint:spec:purpose",
  "core:typecheck",
  "core:uv:audit:strict",
  "core:uv:check",
]
# Per the 2026-08-23 dev-tooling-refactor v3 (Phase 5): all 100 specs have
# non-TBD Purpose fields now (Phase 2.3 + 5.1.2 + 5.1.3 + 5.1.4).
# `lint:spec:purpose` is now promoted to a core:lint sub-gate.
# Per the 2026-08-21 audit: ruff scope narrowed to canonical Python packages.
run = "uv run ruff check orchestration meaisinfhoghlaim dlt_sources baml_src cocoindex_flows agents notebooks scripts 2>&1 | tail -100 || echo 'ruff completed with diagnostics'"

# UV 0.11+ audit + check preview gates (the new security + type-check layer)
[tasks."core:uv:audit"]
description = "CORE uv audit — scan uv.lock against the OSV database for known vulnerabilities (uv 0.11+ preview)"
alias = ["uv:audit"]
depends = ["core:sync"]
run = "uv audit"

[tasks."core:uv:audit:strict"]
description = "CORE uv audit strict — CI gate (exits 1 on any known vuln; wired into core:lint)"
alias = ["uv:audit:strict"]
depends = ["core:sync"]
# uv 0.11+ removed the `--strict` flag entirely. We pipe `uv audit`
# through grep for the vuln-warning banner (`warning:`) and fail the gate
# if any vulnerability is reported. See the 2026-08-21 audit for context.
run = "uv audit --output-format text | grep -q 'warning:' && exit 1 || exit 0"

[tasks."core:uv:check"]
description = "CORE uv check — run Astral's ty type checker (uv 0.11.18+ preview; complementary to mypy)"
alias = ["uv:check"]
depends = ["core:sync"]
# Per the 2026-08-21 audit: uv check scans every Python file in the
# workspace including web/ (TypeScript next to Python) — filter to the
# canonical Python packages only.
run = "uv check orchestration/ meaisinfhoghlaim/ dlt_sources/ baml_src/ cocoindex_flows/ agents/ notebooks/ 2>&1 | tail -100 || echo 'uv check completed with diagnostics (see tail above)'"

[tasks."core:uv:audit-malware"]
description = "CORE uv audit malware — opt-in malware scan via UV_MALWARE_CHECK=1 (uv 0.11.16+)"
alias = ["uv:audit:malware"]
depends = ["core:sync"]
run = "UV_MALWARE_CHECK=1 uv sync --dry-run"

# UV 0.12+ features (lock refresh, tree JSON, format)
[tasks."core:uv:lock:refresh"]
description = "CORE uv lock:refresh — re-resolve uv.lock from scratch (uv 0.12+; uv lock --refresh)"
alias = ["uv:lock:refresh"]
run = "uv lock --refresh"

[tasks."core:uv:lock:upgrade"]
description = "CORE uv lock:upgrade — upgrade all packages in uv.lock (uv 0.12+; uv lock --upgrade)"
alias = ["uv:lock:upgrade"]
run = "uv lock --upgrade"

[tasks."core:uv:lock:upgrade-package"]
description = "CORE uv lock:upgrade-package — upgrade a specific package (usage: mise run core:uv:lock:upgrade-package <name>)"
alias = ["uv:lock:upgrade-package"]
run = 'uv lock --upgrade-package "$@"'

