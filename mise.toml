# =============================================================================
# DATA NAMESPACE (12 tasks) — the lakehouse + BIEP + Dagster
# =============================================================================

[tasks.data]
description = "DATA omnibus — the daily data plane command (setup + status + marimo-wasm-export + cocoindex-conformance)"
depends = [
  "data:setup",
  "data:status",
  "data:marimo:wasm:export",
  "data:cocoindex:conformance",
]
run = "echo 'data omnibus complete (4 data gates passed).'"

[tasks."data:up"]
description = "Bring up the unified 16-service lakehouse stack (11 data plane + 5 graph DB)"
alias = ["lakehouse:up"]
depends = ["sync"]
run = "bash scripts/lakehouse_unified_up.sh ${@:-}"

[tasks."data:down"]
description = "Teardown the unified 16-service lakehouse stack"
alias = ["lakehouse:down"]
depends = ["sync"]
run = "bash scripts/lakehouse_unified_down.sh ${@:-}"

# 2026-08-25-lakehouse-observability-and-cross-stack-integration-v1 (PR #4)
# The lakehouse:all:up / lakehouse:all:down tasks bring up the COMPLETE data plane
# in dependency order: lakehouse → logfire → langfuse → mlflow → dagster.
[tasks."data:all:up"]
description = "Bring up the complete data plane: lakehouse + logfire + langfuse + mlflow + dagster (in dependency order). Per the 2026-08-25-lakehouse-observability-and-cross-stack-integration-v1 change."
alias = ["lakehouse:all:up"]
depends = ["data:up"]
run = """
bash scripts/lakehouse_unified_up.sh &&
(cd ../bonneagar/stacks/logfire && docker compose -f compose.yaml -f sidecar.yaml up -d) &&
(cd ../bonneagar/stacks/langfuse && docker compose -f compose.yaml -f sidecar.yaml up -d) &&
(cd ../bonneagar/stacks/mlflow && docker compose -f compose.yaml -f sidecar.yaml up -d) &&
sleep 30 && mise run lakehouse:preflight
echo 'Complete data plane is up.'
"""

[tasks."data:all:down"]
description = "Teardown the complete data plane (in reverse dependency order: dagster → mlflow → langfuse → logfire → lakehouse). Per the 2026-08-25-lakehouse-observability-and-cross-stack-integration-v1 change."
alias = ["lakehouse:all:down"]
run = """
(cd ../bonneagar/stacks/dagster && docker compose -f compose.yaml down) &&
(cd ../bonneagar/stacks/mlflow && docker compose -f compose.yaml down) &&
(cd ../bonneagar/stacks/langfuse && docker compose -f compose.yaml down) &&
(cd ../bonneagar/stacks/logfire && docker compose -f compose.yaml down) &&
bash scripts/lakehouse_unified_down.sh
echo 'Complete data plane is down.'
"""

[tasks."data:stack-doctor"]
description = "Lint the unified lakehouse stack — 17 services + 14 DBs + 10 private-resources + 5 routes + 58 infisical URIs + image pinning + no hardcoded absolute paths. Per the 2026-08-24-lakehouse-stack-doctor-and-env-var-cleanup-v1 change."
alias = ["lakehouse:stack-doctor"]
run = "bash scripts/lakehouse-stack-doctor.sh"

[tasks."data:setup"]
description = "BIEP v3 full setup — Docker + lakehouse + BAML codegen + registry seed + lance namespace + openspec + lint:skills"
alias = ["biep:v3:setup"]
depends = ["sync"]
run = ".venv/bin/python3 scripts/biiep_v3_setup.py"

[tasks."data:status"]
description = "BIEP v3 full status — lakehouse health + registry count + BAML codegen + asset count + MotherDuck Dive + Flight status"
alias = ["biep:v3:status"]
depends = ["sync"]
run = ".venv/bin/python3 scripts/biiep_v3_status.py"

[tasks."data:dagster:up"]
description = "Launch Dagster UI on :3335 (the consolidated cianfhoghlaim code-location)"
alias = ["dagster:dev", "dagster:oideachais", "cic:dagster:dev"]
depends = ["sync"]
run = "uv run dagster dev -m orchestration.definitions ${@:-}"

[tasks."data:schema:generate"]
description = "Regenerate the BIEP v1 lineage registry + Zod/TanStack DB collection schemas (committed artifacts)"
alias = ["schema:generate", "baml:generate"]
depends = ["ts:install"]
run = "bun run schema:generate"

[tasks."data:schema:validate"]
description = "CI drift gate for the generated Zod schemas (regenerate in-memory + byte-diff against committed bi-ep.gen.ts)"
alias = ["schema:validate", "baml:test"]
depends = ["ts:install"]
run = "bun run schema:validate"

[tasks."data:biep:milestone"]
description = "BIEP v3 milestone runner (M0 through M10) — usage: mise run data:biep:milestone -- <n>"
alias = [
  "biep:v3:m",
  "biep:v3:m0",
  "biep:v3:m1",
  "biep:v3:m2",
  "biep:v3:m3",
  "biep:v3:m4",
  "biep:v3:m5",
  "biep:v3:m6",
  "biep:v3:m7",
  "biep:v3:m8",
  "biep:v3:m9",
  "biep:v3:m10",
]
depends = ["sync"]
usage = 'arg "<n>" help="Milestone number 0-10" default="0"'
run = '''
N="{{arg(n)}}"
SCRIPT="scripts/m${N}_*.py"
shopt -s nullglob
CANDIDATES=($SCRIPT)
shopt -u nullglob
if [ ${#CANDIDATES[@]} -eq 0 ]; then
  echo "ERROR: no script matching $SCRIPT found" >&2
  exit 1
fi
.venv/bin/python3 "${CANDIDATES[0]}"
'''

[tasks."data:biep:gate"]
description = "BIEP v3 milestone gate — verify the active milestone's 3 asset checks pass"
alias = ["biep:v3:gate"]
depends = ["sync"]
run = ".venv/bin/python3 scripts/milestone_gate.py"

