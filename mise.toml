# code-location. Phase-1 manifest consolidation (2026-06-30) made
# `dagster:dev` the canonical name.
#
# Per the 2026-07-14 foundation refactor (`openspec/changes/2026-07-14-fix-foundation-v7-flattening-and-baml-drift-v1`),
# the canonical code-location module is `orchestration.definitions` (the
# v7 flattened package layout puts the package root at the repo root, NOT
