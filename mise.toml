# =============================================================================
# ML NAMESPACE (10 tasks + 3 task templates) — OCR + agents + models
# =============================================================================

[tasks.ml]
description = "ML omnibus — the daily ML command (registry-audit + agents-smoke + litellm-regenerate)"
depends = ["ml:registry:audit", "ml:agents:smoke", "ml:litellm:regenerate"]
run = "echo 'ml omnibus complete (3 ML gates passed).'"

[tasks."ml:registry:list"]
description = "List every MODEL_REGISTRY entry (the unified model registry; 52 entries / 7 families)"
alias = ["models:list"]
depends = ["sync"]
run = ".venv/bin/python3 -c \"from meaisinfhoghlaim.models import MODEL_REGISTRY; [print(f'  {e.family:12s} {e.role:18s} {e.key:40s} {e.display_name}') for e in MODEL_REGISTRY.entries()]; s = MODEL_REGISTRY.summary(); print(f'\\nTotal: {s[\\\"total\\\"]} entries ({s[\\\"available\\\"]} available, {s[\\\"deprecated\\\"]} deprecated)')\""

[tasks."ml:registry:audit"]
description = "Verify all v4 VISION_MODELS (24 entries) are live on HF Hub"
alias = ["cic:ocr:registry-lint", "hf:verify-ocr-registry"]
depends = ["sync"]
run = ".venv/bin/python3 scripts/verify_hf_hub_audit.py --strict"

[tasks."ml:litellm:regenerate"]
description = "Regenerate litellm/config/config.yaml from the v4 VISION_MODELS registry"
alias = ["cic:meaisin:litellm-regenerate", "litellm:regenerate"]
depends = ["sync"]
run = "PYTHONPATH=. python scripts/generate_litellm_config.py > bonneagar/stacks/litellm/config/config.yaml"

# Per the 2026-08-23-integration-litellm-1-97-features-v1 change: 2 new
# tasks wrapping LiteLLM v1.97+ features (MCP Gateway GA + OAuth 2.0 v2).
[tasks."data:litellm:mcp:gateway"]
description = "DATA litellm mcp:gateway — boot the LiteLLM MCP Gateway daemon (v1.97+ GA). Per the 2026-08-23-integration-litellm-1-97-features-v1 change."
alias = ["litellm:mcp:gateway", "litellm:mcp-gateway"]
depends = ["sync"]
run = "bash -c 'echo \"=== LiteLLM MCP Gateway ===\"; echo \"Configured MCP servers:\"; grep -E \"^mcp_servers:|^[[:space:]]+[a-z_-]+:\" bonneagar/stacks/litellm/config/config.yaml 2>/dev/null | head -20 || echo \"(none configured yet)\"; echo; echo \"To boot the gateway: docker compose -f bonneagar/stacks/litellm/compose.yaml up litellm\"'"

[tasks."data:litellm:oauth:v2"]
description = "DATA litellm oauth:v2 — enable OAuth 2.0 v2 (DCR) + show the dynamic client registration endpoint. Per the 2026-08-23-integration-litellm-1-97-features-v1 change."
alias = ["litellm:oauth:v2", "litellm:oauth-v2"]
depends = ["sync"]
run = "bash -c 'echo \"=== LiteLLM OAuth 2.0 v2 (DCR) ===\"; echo \"Enable in config: litellm.settings.enable_oauth2_v2 = true\"; echo \"DCR endpoint: POST /oauth2/v2/register\"; echo \"Token endpoint: POST /oauth2/v2/token\"; echo \"Introspection: POST /oauth2/v2/introspect\"'"

# NOTE: ml:agents:smoke, ml:agents:audit, ml:agents:reproduce have moved to
# agents/mise.toml (subproject). The old names are no longer accessible from
# the root mise.toml — use `cd agents && mise run ml:agents:audit` instead.
# (Full monorepo_root integration requires mise >= 2026.7.17; we run 2026.5.6.)


# =============================================================================
# WEB NAMESPACE (7 tasks) — web/apps + web/packages + Turborepo
# =============================================================================

[tasks.web]
description = "WEB omnibus — the daily web command (install + build + typecheck + lint + format)"
depends = [
  "web:install",
  "web:build",
  "web:typecheck",
  "web:lint",
  "web:format",
]
run = "echo 'web omnibus complete (5 web gates passed).'"

[tasks."web:install"]
description = "Install all TypeScript dependencies for the web workspaces (bun workspaces)"
alias = ["ts:install"]
run = "bun install"

# Per the 2026-08-23-integration-copilotkit-v2-and-ag-ui-protocol-v1 change:
# targeted install tasks for the 2 canonical agentic-frontend deps.
[tasks."web:install:copilotkit"]
description = "WEB install copilotkit — install the 2 canonical CopilotKit v2 deps (react-core + react-ui). Per the 2026-08-23-integration-copilotkit-v2-and-ag-ui-protocol-v1 change."
alias = ["ts:install:copilotkit"]
run = "bun add @copilotkit/react-core @copilotkit/react-ui"

[tasks."web:install:ag-ui"]
description = "WEB install ag-ui — install the AG-UI protocol types (per the 2026-08-23-integration-copilotkit-v2-and-ag-ui-protocol-v1 change)."
alias = ["ts:install:ag-ui"]
run = "bun add @ag-ui/core"

[tasks."web:build"]
description = "Build all web packages via Turborepo"
alias = ["ts:build"]
depends = ["web:install"]
run = "bunx turbo run build"

[tasks."web:typecheck"]
description = "Type-check all web packages via Turborepo"
alias = ["ts:typecheck"]
depends = ["web:install"]
run = "bunx turbo run typecheck"

[tasks."web:lint"]
description = "Lint all web packages via Turborepo"
alias = ["ts:lint"]
depends = ["web:install"]
run = "bunx turbo run lint"

[tasks."web:format"]
description = "Format all web packages via Prettier"
depends = ["web:install"]
run = "bunx prettier --write ."

[tasks."web:test:parallel"]
description = "WEB test parallel — run all web tests in parallel (turbo --parallel; bun 1.4+)"
alias = ["web:test:parallel"]
depends = ["web:install"]
run = "bunx turbo run test --parallel"

[tasks."web:dev"]
description = "Run a per-app dev server — usage: mise run web:dev <app> (e.g. cianfhoghlaim-web, tuatha-ui, croilar-web)"
depends = ["web:install"]
usage = 'arg "<app>" help="App name from web/apps/* (e.g. cianfhoghlaim-web, tuatha-ui, croilar-web)"'
run = 'bunx turbo run dev --filter={{arg(app)}}'


# =============================================================================
# [task_templates] — Repeating patterns (replacing 50+ per-instance wrappers)
# =============================================================================

[task_templates."ml:ocr:test"]
description = "Run meaisinfhoghlaim OCR entrypoint for {{arg(name=model)}}"
usage = 'arg "<model>" help="OCR model key (e.g. qwen3-vl-8b, deepseek-ocr-2)"'
depends = ["sync"]
run = '''
SAFE_NAME=$(echo "{{arg(model)}}" | tr '.-' '__')
uv run python "scripts/meaisin_ocr_htr_tests/ocr_model_${SAFE_NAME}_extract.py" "$@"
'''

[task_templates."ml:converter:test"]
description = "Run meaisinfhoghlaim converter entrypoint for {{arg(name=converter)}}"
usage = 'arg "<converter>" help="Converter key (e.g. docling, marker, unstructured)"'
depends = ["sync"]
run = '''
uv run python "scripts/meaisin_ocr_htr_tests/converter_{{arg(converter)}}_extract.py" "$@"
'''

[task_templates."ml:agent:test"]
description = "Run meaisinfhoghlaim Agent entrypoint for {{arg(name=agent)}}"
usage = 'arg "<agent>" help="Agent key (e.g. root, curriculum, translation)"'
depends = ["sync"]
run = '''
uv run python "scripts/meaisin_ocr_htr_tests/agent_{{arg(agent)}}_extract.py" "$@"
'''


# =============================================================================
# tuatha-media-intel — capture → VLM → ANAM pipeline
# =============================================================================

[tasks."tuatha-media-intel:baml:codegen"]
description = "Generate BAML clients (Python + TS) from baml_src/tuatha_media_intel.baml"
run = '''
uv run baml-cli generate
'''

[tasks."tuatha-media-intel:baml:test"]
description = "Run the BAML tests for the tuatha_media_intel.baml schema"
depends = ["tuatha-media-intel:baml:codegen"]
run = '''
uv run baml-cli test baml_src/tuatha_media_intel.baml
'''

[tasks."tuatha-media-intel:cocoindex:update:hades"]
description = "Run the tuatha_hades_boons CocoIndex v1 App (Lance fat table ciánfhoghlaim.tuatha.hades.boons)"
depends = ["tuatha-media-intel:baml:codegen"]
run = '''
cd cocoindex_flows/tuatha_media_intel/ingestors && uv run python hades_boons.py
'''

[tasks."tuatha-media-intel:cocoindex:update:comic"]
description = "Run the tuatha_comic_particles CocoIndex v1 App"
depends = ["tuatha-media-intel:baml:codegen"]
run = '''
cd cocoindex_flows/tuatha_media_intel/ingestors && uv run python comic_particles.py
'''

[tasks."tuatha-media-intel:cocoindex:update:gba"]
description = "Run the tuatha_gba_magic CocoIndex v1 App"
depends = ["tuatha-media-intel:baml:codegen"]
run = '''
cd cocoindex_flows/tuatha_media_intel/ingestors && uv run python gba_magic.py
'''

[tasks."tuatha-media-intel:cocoindex:update:anam"]
description = "Run the tuatha_anam_particles CocoIndex v1 App (the cross-source join)"
depends = [
  "tuatha-media-intel:cocoindex:update:hades",
  "tuatha-media-intel:cocoindex:update:comic",
  "tuatha-media-intel:cocoindex:update:gba",
]
run = '''
cd cocoindex_flows/tuatha_media_intel/ingestors && uv run python anam_particles.py
'''

[tasks."tuatha-media-intel:capture:doctor"]
description = "Run the Swift capture daemon doctor (verify Screen Recording + HEVC encoder + write a test frame)"
run = '''
cd tuatha_media_intel/capture/tuatha-capture && swift build -c release && ./.build/release/tuatha-capture doctor
'''

[tasks."tuatha-media-intel:capture:build"]
description = "Build the Swift capture daemon to ~/.tuatha/bin/tuatha-capture"
run = '''
cd tuatha_media_intel/capture/tuatha-capture
swift build -c release
mkdir -p $HOME/.tuatha/bin
cp .build/release/tuatha-capture $HOME/.tuatha/bin/
'''

[tasks."tuatha-media-intel:capture:install-agent"]
description = "Install the tuatha-capture LaunchAgent and load it via launchctl"
depends = ["tuatha-media-intel:capture:build"]
run = '''
cp tuatha_media_intel/capture/LaunchAgent/com.ci.tuatha.capture.plist $HOME/Library/LaunchAgents/
launchctl load -w $HOME/Library/LaunchAgents/com.ci.tuatha.capture.plist
launchctl start com.ci.tuatha.capture
'''

[tasks."tuatha-media-intel:capture:install-shims"]
description = "Install the Python capture shims (tuatha-capture-python) for GBA + Comic flows"
run = '''
cd tuatha_media_intel/capture/python
uv pip install -e ".[gba,comic-ml]"
'''

[tasks."tuatha-media-intel:stack:up"]
description = "Bring up the tuatha-media-intel Docker Compose stack"
run = '''
cd bonneagar/stacks/tuatha-media-intel
docker compose --env-file .env up -d
'''

[tasks."tuatha-media-intel:stack:logs"]
description = "Tail the logs for the tuatha-media-intel stack"
run = '''
cd bonneagar/stacks/tuatha-media-intel
docker compose logs -f
'''

[tasks."tuatha-media-intel:stack:down"]
description = "Tear down the tuatha-media-intel stack"
run = '''
cd bonneagar/stacks/tuatha-media-intel
docker compose down -v
'''

[tasks."tuatha-media-intel:smoke"]
description = "End-to-end smoke test: BAML codegen + CocoIndex flows + RAGAS asset_check"
depends = [
  "tuatha-media-intel:baml:codegen",
  "tuatha-media-intel:baml:test",
  "tuatha-media-intel:cocoindex:update:hades",
  "tuatha-media-intel:cocoindex:update:comic",
  "tuatha-media-intel:cocoindex:update:gba",
  "tuatha-media-intel:cocoindex:update:anam",
]
run = '''
mise run lint:registry --strict
mise run dagster:check ragas_anam_color_anchor
'''

[tasks."tuatha-media-intel:notebook"]
description = "Open the Tuatha ANAM Dashboard marimo notebook (4-tab design surface)"
run = '''
marimo edit notebooks/tuatha_anam_dashboard.py
'''

