# `cianfhoghlaim.dagster.definitions` path no longer exists.
# See openspec/changes/2026-06-30-consolidate-cianfhoghlaim-pyproject-and-8-dirs/

[tasks."dagster:dev"]
description = "Run Dagster for the consolidated cianfhoghlaim code-location (Ireland + leabharlann + 12-agent fleet). Loads orchestration.definitions. The live asset + asset_check + job + sensor counts are emitted by `mise run sync:dagster` (Layer 6 — the canonical AST-walk count). Per the 2026-07-30-drift-remediation-everything-bagel-v1 change (the description no longer hardcodes a count)."
