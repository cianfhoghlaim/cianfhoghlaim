# (per openspec/changes/2026-08-15-knowledge-sync-loop-v1)
#
# Layer 1 = path drift, Layer 2 = CCC index, Layer 3 = Cognee graph,
# Layer 4 = skills, Layer 5 = MCP health. The orchestrator (sync:all)
# runs 1-5 in sequence + writes a unified report.
