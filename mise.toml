[tasks."drift-audit"]
description = "Audit for pre-v7 path drift across all subdirectories"
run = """
echo "=== Pre-v7 path drift audit ==="
for pattern in 'cianfhoghlaim/dlt/' 'cianfhoghlaim/baml/' 'infrastructure/stacks/' 'infrastructure/komodo/' 'sruth/cianfhoghlaim/'; do
  count=$(grep -rE "$pattern" . --include='*.md' --include='*.py' --include='*.ts' --include='*.toml' --include='*.yaml' --include='*.baml' 2>/dev/null | grep -v node_modules | grep -v .venv | grep -v .turbo | grep -v __pycache__ | wc -l)
  echo "$pattern: $count occurrences"
done
echo "=== v7 flat 'cianfhoghlaim.X.Y' in Python imports (should be 0 outside docs) ==="
grep -rE "from cianfhoghlaim\\.[a-z]+\\." --include='*.py' . 2>/dev/null | grep -v node_modules | grep -v .venv | grep -v .cocoindex_code | grep -v __pycache__ | wc -l
"""

