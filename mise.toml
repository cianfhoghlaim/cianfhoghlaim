run = "cd bonneagar/pulumi/${1} && pulumi preview"

# =============================================================================
# Secret management (Infisical + Locket + Komodo + Pangolin)
# =============================================================================

[tasks."secrets:env"]
description = "Create the dev-baile environment in Infisical"
run = "bun run scripts/create-env.ts"

[tasks."secrets:init"]
description = "Sync .env secrets into Infisical vault"
run = "bun run scripts/init-vault.ts"

[tasks."sops:encrypt"]
description = "Encrypt .env with SOPS + age key for git-safe backup"
run = "sops encrypt --age age1ucuy60fykra7p49x8qx9lha9qsv444fy4vkckupv8nupat0jg5nscdgnkr .env > .env.enc"

[tasks."sops:decrypt"]
description = "Decrypt .env.enc back to .env"
run = "sops decrypt --age-key-file ~/.ssh/croilar-sops-key.txt .env.enc > .env"

[tasks."sops:edit"]
description = "Edit .env.enc in place"
run = "sops .env.enc"

[tasks."secrets:sync"]
description = "Re-sync the Infisical vault (alias of secrets:init)"
run = "bun run scripts/init-vault.ts"

[tasks."locket:exec"]
description = "Inject secrets via Locket sidecar and run a command"
run = "locket exec -- ${@}"

[tasks."komodo:sync"]
description = "Trigger Komodo to re-sync all stacks from Forgejo"
run = "komodo sync || echo 'komodo CLI not in PATH; trigger via Komodo UI.'"

[tasks."pangolin:check"]
description = "Verify Pangolin tunnel health"
run = "pangolin health-check || echo 'pangolin CLI not in PATH; check via Pangolin UI.'"

[tasks."preflight-arm-oci"]
description = "Pre-flight gate (Pangolin + Komodo + Infisical health + namespace isolation) before any arm-oci stack deploy"
run = "bun run scripts/preflight-arm-oci.ts ${@:-}"

[tasks."iac-bootstrap"]
