[tasks."openspec:spec"]
description = "OPENSPEC spec — manage and view OpenSpec specifications (openspec 1.4+; interactive)"
alias = ["openspec:spec:cmd"]
run = "openspec spec --help"

[tasks."openspec:config"]
description = "OPENSPEC config — view and modify global OpenSpec configuration (openspec 1.4+)"
alias = ["openspec:cfg"]
run = "openspec config"

[tasks."openspec:workspace"]
description = "OPENSPEC workspace — set up and inspect coordination workspaces (openspec 1.4+)"
alias = ["openspec:ws"]
run = "openspec workspace --help"

[tasks."openspec:context-store"]
description = "OPENSPEC context-store — set up and inspect local context stores (openspec 1.4+)"
alias = ["openspec:ctx"]
run = "openspec context-store --help"

[tasks."openspec:initiative"]
