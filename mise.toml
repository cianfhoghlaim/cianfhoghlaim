# =============================================================================

[tasks.devops]
description = "DEVOPS omnibus — the daily IaC command (health + bootstrap-pangolin-client + validate-stacks + validate-stacks:strict)"
depends = [
  "devops:health",
  "devops:bootstrap-pangolin-client",
  "devops:validate-stacks",
  "devops:validate-stacks:strict",
]
run = "echo 'devops omnibus complete (4 IaC gates passed).'"

# NOTE: devops:health, devops:plan, devops:bootstrap, devops:bootstrap-pangolin-client,
# devops:deploy, devops:teardown have moved to bonneagar/mise.toml (subproject).
# The old names are no longer accessible from the root mise.toml — use
# `cd bonneagar && mise run devops:health` instead. (Full monorepo_root
# integration requires mise >= 2026.7.17; we run 2026.5.6.)

[tasks."devops:validate-stacks"]
description = "Validate all 89 Docker Compose stacks under bonneagar/stacks/ against the 6-file GOLD_STANDARD pattern (the canonical CI gate)"
alias = ["cic:stack-doctor", "stack-doctor", "validate-stacks"]
depends = ["sync"]
run = "bash scripts/stack-doctor.sh ${@:-}"

[tasks."devops:validate-stacks:strict"]
description = "CI gate: stack-doctor --strict + --check-grammar (fails on missing infisical:// refs OR mixed bare/Jinja grammar in any secrets.env)"
alias = ["stack-doctor:strict"]
depends = ["sync"]
run = "bash scripts/stack-doctor.sh --strict --check-grammar"

[tasks."devops:teardown-stack:from-root"]
description = "DEVOPS teardown-stack (root alias) — per-host selective teardown of the 14-stack core 24/7 (per the 2026-08-21 openspec change)"
alias = ["devops:teardown-stack", "iac:teardown-stack", "iac-teardown-stack"]
run = "bun run --cwd bonneagar iac:teardown-stack ${@:-}"

[tasks."devops:secrets:env"]
description = "Create the dev-baile environment in Infisical"
alias = ["secrets:env"]
run = "bun run scripts/create-env.ts"

[tasks."devops:secrets:init"]
description = "Sync .env secrets into Infisical vault (canonical; alias of the old secrets:sync)"
alias = ["secrets:init", "secrets:sync"]
run = "bun run scripts/init-vault.ts"

[tasks."devops:locket:exec"]
description = "Inject secrets via Locket sidecar and run a command"
alias = ["locket:exec"]
run = "locket exec -- ${@}"

# Per the 2026-08-23-infra-locket-shim-v0-3-and-sidecar-pattern-v1 change:
# 2 new tasks wrapping Locket v0.3+ features (rotation + audit).
[tasks."devops:locket:rotate"]
description = "DEVOPS locket rotate — trigger a secret rotation via the Locket sidecar /rotate endpoint (Locket v0.3+ feature). Per the 2026-08-23-infra-locket-shim-v0-3-and-sidecar-pattern-v1 change."
alias = ["locket:rotate"]
run = "bash -c 'echo \"=== Locket Secret Rotation ===\"; curl -sS -X POST -H \"Authorization: Bearer ${LOCKET_TOKEN}\" http://locket:7777/rotate 2>/dev/null | head -20 || echo \"Locket sidecar not reachable — run on the host that has the sidecar\"'"

[tasks."devops:locket:audit"]
description = "DEVOPS locket audit — query the locket_audit.scrapes DuckLake table and emit the last 100 secret fetches per service. Per the 2026-08-23-infra-locket-shim-v0-3-and-sidecar-pattern-v1 change."
alias = ["locket:audit"]
run = "bash -c 'echo \"=== Locket Audit (last 100 fetches per service) ===\"; uv run python -c \"from duckdb import connect; conn = connect(\\\"md:cianfhoghlaim\\\"); print(conn.execute(\\\"SELECT service, COUNT(*) AS fetches, MAX(fetched_at) AS last_fetch FROM cianfhoghlaim.locket_audit.scrapes WHERE fetched_at > now() - INTERVAL \\x27 7 days\\x27 GROUP BY service ORDER BY fetches DESC LIMIT 20\\\").fetchdf().to_string())\" 2>/dev/null || echo \"(locket_audit.scrapes table not yet provisioned — schema is per the v0.3 migration)\"'"

[tasks."devops:stack"]
description = "Per-stack lifecycle (up | down | logs) — usage: mise run devops:stack <name> <action>"
alias = ["stack"]
run = "bash mise-tasks/devops/stack -- ${@:?Usage: mise run devops:stack <name> <up|down|logs>}"

[tasks."devops:preflight:arm-oci"]
description = "Pre-flight gate before any arm-oci stack deploy (Pangolin + Komodo + Infisical health + namespace isolation)"
alias = ["preflight:arm-oci", "preflight-arm-oci"]
run = "bun run scripts/preflight-arm-oci.ts ${@:-}"

[tasks."devops:bring-up:smoke-test"]
description = "5-step bring-up smoke test for a fresh operator"
alias = ["bring-up:smoke-test"]
depends = ["sync"]
run = "bash scripts/bring-up-smoke-test.sh"

[tasks."devops:deploy:full"]
description = "Full-stack deploy orchestrator (7-phase state machine with resumable checkpoints)"
alias = ["deploy:full"]
depends = ["sync", "devops:preflight:arm-oci"]
run = "bash scripts/deploy-full.sh ${@:-}"


# =============================================================================
# DATA NAMESPACE (12 tasks) — the lakehouse + BIEP + Dagster
# =============================================================================

[tasks.data]
description = "DATA omnibus — the daily data plane command (setup + status + marimo-wasm-export + cocoindex-conformance)"
depends = [
  "data:setup",
  "data:status",
  "data:marimo:wasm:export",
  "data:cocoindex:conformance",
]
run = "echo 'data omnibus complete (4 data gates passed).'"

[tasks."data:up"]
description = "Bring up the unified 16-service lakehouse stack (11 data plane + 5 graph DB)"
alias = ["lakehouse:up"]
depends = ["sync"]
run = "bash scripts/lakehouse_unified_up.sh ${@:-}"

[tasks."data:down"]
description = "Teardown the unified 16-service lakehouse stack"
alias = ["lakehouse:down"]
depends = ["sync"]
run = "bash scripts/lakehouse_unified_down.sh ${@:-}"

# 2026-08-25-lakehouse-observability-and-cross-stack-integration-v1 (PR #4)
# The lakehouse:all:up / lakehouse:all:down tasks bring up the COMPLETE data plane
# in dependency order: lakehouse → logfire → langfuse → mlflow → dagster.
[tasks."data:all:up"]
description = "Bring up the complete data plane: lakehouse + logfire + langfuse + mlflow + dagster (in dependency order). Per the 2026-08-25-lakehouse-observability-and-cross-stack-integration-v1 change."
alias = ["lakehouse:all:up"]
depends = ["data:up"]
run = """
bash scripts/lakehouse_unified_up.sh &&
(cd ../bonneagar/stacks/logfire && docker compose -f compose.yaml -f sidecar.yaml up -d) &&
(cd ../bonneagar/stacks/langfuse && docker compose -f compose.yaml -f sidecar.yaml up -d) &&
(cd ../bonneagar/stacks/mlflow && docker compose -f compose.yaml -f sidecar.yaml up -d) &&
sleep 30 && mise run lakehouse:preflight
echo 'Complete data plane is up.'
"""

[tasks."data:all:down"]
description = "Teardown the complete data plane (in reverse dependency order: dagster → mlflow → langfuse → logfire → lakehouse). Per the 2026-08-25-lakehouse-observability-and-cross-stack-integration-v1 change."
alias = ["lakehouse:all:down"]
run = """
(cd ../bonneagar/stacks/dagster && docker compose -f compose.yaml down) &&
(cd ../bonneagar/stacks/mlflow && docker compose -f compose.yaml down) &&
(cd ../bonneagar/stacks/langfuse && docker compose -f compose.yaml down) &&
(cd ../bonneagar/stacks/logfire && docker compose -f compose.yaml down) &&
bash scripts/lakehouse_unified_down.sh
echo 'Complete data plane is down.'
"""

[tasks."data:stack-doctor"]
description = "Lint the unified lakehouse stack — 17 services + 14 DBs + 10 private-resources + 5 routes + 58 infisical URIs + image pinning + no hardcoded absolute paths. Per the 2026-08-24-lakehouse-stack-doctor-and-env-var-cleanup-v1 change."
alias = ["lakehouse:stack-doctor"]
run = "bash scripts/lakehouse-stack-doctor.sh"

[tasks."data:setup"]
description = "BIEP v3 full setup — Docker + lakehouse + BAML codegen + registry seed + lance namespace + openspec + lint:skills"
alias = ["biep:v3:setup"]
depends = ["sync"]
run = ".venv/bin/python3 scripts/biiep_v3_setup.py"

[tasks."data:status"]
description = "BIEP v3 full status — lakehouse health + registry count + BAML codegen + asset count + MotherDuck Dive + Flight status"
alias = ["biep:v3:status"]
depends = ["sync"]
run = ".venv/bin/python3 scripts/biiep_v3_status.py"

[tasks."data:dagster:up"]
description = "Launch Dagster UI on :3335 (the consolidated cianfhoghlaim code-location)"
alias = ["dagster:dev", "dagster:oideachais", "cic:dagster:dev"]
depends = ["sync"]
run = "uv run dagster dev -m orchestration.definitions ${@:-}"

# Per the 2026-08-23-data-dagster-1-13-features-v1 change: 3 new tasks
# wrapping the Dagster 1.13+ `dg` CLI surface.
[tasks."data:dagster:list-assets"]
description = "DATA dagster list-assets — emit a JSON dump of all Dagster assets (key + group + kinds + description). Per the 2026-08-23-data-dagster-1-13-features-v1 change."
alias = ["dagster:list-assets"]
depends = ["sync"]
run = "uv run dagster asset list --output json 2>/dev/null | head -200 || uv run python -c 'import json; from orchestration.definitions import defs; print(json.dumps([{\"key\": a.key.to_user_string(), \"group\": a.group_names, \"description\": a.description} for a in defs.get_asset_graph().assets_defs_by_key.values()][:200], indent=2))'"

[tasks."data:dagster:materialize"]
description = "DATA dagster materialize — materialize a named asset via the dg CLI (e.g., mise run data:dagster:materialize -- lc5_mathematics_ingested). Per the 2026-08-23-data-dagster-1-13-features-v1 change."
usage = 'asset_key "<key>" help="The asset key to materialize (e.g. lc5_mathematics_ingested)"'
alias = ["dagster:materialize"]
depends = ["sync"]
run = "uv run dagster asset materialize --asset-key ${1:-lc5_mathematics_ingested} 2>&1 | tail -30"

[tasks."data:dagster:cli-info"]
description = "DATA dagster cli-info — emit the 5 KCG component paths (YAML output). Per the 2026-08-23-data-dagster-1-13-features-v1 change."
alias = ["dagster:cli-info"]
depends = ["sync"]
run = "bash -c 'cat <<EOF\nkcg-components:\n  L1_ingestion: orchestration/components/layer1_ingestion.py\n  L2_materials: orchestration/components/layer2_materials.py\n  L3_model_lifecycle: orchestration/components/layer3_model_lifecycle.py\n  L4_asset_generation: orchestration/components/layer4_asset_generation.py\n  L5_agent_ops: orchestration/components/layer5_agent_ops.py\nEOF'"

[tasks."data:schema:generate"]
description = "Regenerate the BIEP v1 lineage registry + Zod/TanStack DB collection schemas (committed artifacts)"
alias = ["schema:generate", "baml:generate"]
depends = ["ts:install"]
run = "bun run schema:generate"

# Per the 2026-08-23-data-dlt-1-30-features-v1 change: 3 new tasks
# wrapping the DLT 1.30+ `refresh` + `dlt[hub]` features.
[tasks."data:dlt:refresh"]
description = "DATA dlt refresh — trigger an incremental refresh of a named pipeline (supplants `replace`; DLT 1.30+). Usage: mise run data:dlt:refresh -- <pipeline_name>. Per the 2026-08-23-data-dlt-1-30-features-v1 change."
usage = 'pipeline "<name>" help="The DLT pipeline to refresh"'
alias = ["dlt:refresh"]
run = "uv run python -m dlt_sources.cli refresh ${1:-ireland_jurisdiction_pipeline}"

[tasks."data:dlt:hub:install"]
description = "DATA dlt hub install — add the dlthub plugin (DLT 1.30+; for deployment workflows). Per the 2026-08-23-data-dlt-1-30-features-v1 change."
alias = ["dlt:hub:install"]
run = "uv add dlt[hub] 2>&1 | tail -5"

[tasks."data:dlt:hub:deploy"]
description = "DATA dlt hub deploy — scaffold a deployment manifest for a named pipeline (DLT 1.30+; supports github_actions / airflow / kubernetes). Usage: mise run data:dlt:hub:deploy -- <pipeline> <destination>. Per the 2026-08-23-data-dlt-1-30-features-v1 change."
usage = 'args "<pipeline> <destination>" help="The pipeline + destination (github_actions/airflow/kubernetes)"'
alias = ["dlt:hub:deploy"]
run = "uv run dlt deploy ${1:-ireland_jurisdiction_pipeline} ${2:-github_actions} 2>&1 | tail -20"

# Per the 2026-08-24-dlt-sources-to-multi-repo-scaffold-v1 change (Phase 0.1):
# 2 new tasks wrapping the `tests/dlt/test_imports.py` smoke test that walks
# every top-level sub-tree of `dlt_sources/` and records the import result.
# The smoke test is READ-ONLY on `dlt_sources/` — it does not fix anything;
# it surfaces the per-subtree ImportError list to the multi-repo scaffold plan.
[tasks."dlt:smoke-all"]
description = "DLT smoke-all — walk every top-level sub-tree of `dlt_sources/` via `importlib.import_module`, record ImportError vs success, and persist a JSON summary to `stedding/sync-reports/dlt-smoke-run-<timestamp>.json`. Per the 2026-08-24-dlt-sources-to-multi-repo-scaffold-v1 change (Phase 0.1 + Phase 2.5 — also wires the nightly 02:30 UTC mirror-merge gate)."
alias = ["dlt:smoke"]
depends = ["core:sync", "dlt:mirror-merge:nightly"]
run = "uv run pytest tests/dlt/test_imports.py -q"

# Per the 2026-08-24-dlt-sources-to-multi-repo-scaffold-v1 change Phase 2.5:
# The nightly mirror-merge gate — invoked at 02:30 UTC nightly via the
# Dagster sensor `dlt_nightly_mirror_merge_sensor` (at
# orchestration/defs/2_materials/dlt_nightly_mirror_merge.py). This mise
# task is the operator-facing CLI wrapper that POSTs the sensor tick
# (the actual canonical execution is via Dagster).
[tasks."dlt:mirror-merge:nightly"]
description = "Nightly mirror-merge tick — invokes the `dlt_nightly_mirror_merge_sensor` against the accumulated `dlt_sources/_sister_refs/<repo>/...` diff. Per Phase 2.5 (cron 02:30 UTC)."
alias = ["dlt:mirror-merge"]
run = "python3 -c 'import ast; ast.parse(open(\"orchestration/defs/2_materials/dlt_nightly_mirror_merge.py\").read()); print(\"OK: dlt_nightly_mirror_merge.py parses\")' && echo 'Cron: 30 2 * * * UTC (per tasks.md §17.3); canonical execution via Dagster sensor (sensor name: dlt_nightly_mirror_merge_sensor, default_status=STOPPED).'"

[tasks."dlt:smoke-all-dev"]
description = "DLT smoke-all-dev — same as `dlt:smoke-all` but with `-v --no-header` for human inspection (shows per-test status + the inline [dlt:smoke-all] summary line). Per the 2026-08-24-dlt-sources-to-multi-repo-scaffold-v1 change (Phase 0.1)."
alias = ["dlt:smoke:dev"]
depends = ["core:sync"]
run = "uv run pytest tests/dlt/test_imports.py -v --no-header"

[tasks."data:schema:validate"]
description = "CI drift gate for the generated Zod schemas (regenerate in-memory + byte-diff against committed bi-ep.gen.ts)"
alias = ["schema:validate", "baml:test"]
depends = ["ts:install"]
run = "bun run schema:validate"

[tasks."data:biep:milestone"]
description = "BIEP v3 milestone runner (M0 through M10) — usage: mise run data:biep:milestone -- <n>"
alias = [
  "biep:v3:m",
  "biep:v3:m0",
  "biep:v3:m1",
  "biep:v3:m2",
  "biep:v3:m3",
  "biep:v3:m4",
  "biep:v3:m5",
  "biep:v3:m6",
  "biep:v3:m7",
  "biep:v3:m8",
  "biep:v3:m9",
  "biep:v3:m10",
]
depends = ["sync"]
usage = 'arg "<n>" help="Milestone number 0-10" default="0"'
run = '''
N="{{arg(n)}}"
SCRIPT="scripts/m${N}_*.py"
shopt -s nullglob
CANDIDATES=($SCRIPT)
shopt -u nullglob
if [ ${#CANDIDATES[@]} -eq 0 ]; then
  echo "ERROR: no script matching $SCRIPT found" >&2
  exit 1
fi
.venv/bin/python3 "${CANDIDATES[0]}"
'''

[tasks."data:biep:gate"]
description = "BIEP v3 milestone gate — verify the active milestone's 3 asset checks pass"
alias = ["biep:v3:gate"]
depends = ["sync"]
run = ".venv/bin/python3 scripts/milestone_gate.py"

[tasks."data:marimo:wasm:export"]
description = "Export all 7 BIEP v3 jurisdiction dashboards to WebAssembly bundles + manifest"
alias = ["biep:v3:marimo:wasm:export"]
depends = ["sync"]
run = ".venv/bin/python3 scripts/marimo_wasm_export.py"

[tasks."data:cocoindex:conformance"]
description = "Run the cocoindex_v1_conformance App to lint all 14 v1 Apps against the 4-rule conformance contract"
alias = [
  "cic:cocoindex:conformance",
  "upstream:conformance",
  "cocoindex:conformance",
]
depends = ["sync"]
run = ".venv/bin/python3 -c 'import asyncio; from cocoindex_flows.infrastructure.cocoindex_v1_conformance import run_conformance_check; report = asyncio.run(run_conformance_check()); print(report.summary())'"


# =============================================================================
# DATA: MEDIA-INTEL NAMESPACE (5 tasks)
# Per the 2026-08-23-tuatha-media-intel-gameplay-capture-research-v1
# change. The 5-class source registry (comics / prose /
# animation / games / official) + the 7-axis MediaDescriptor
# pipeline. Plan A keyless Firecrawl default. Local-capture
# only for Class D (Hades + WoW + Golden Sun + Pokémon).
# =============================================================================

[tasks."data:media-intel:comics-hickman"]
description = "Class A — Ingest the Jonathan Hickman Marvel run (FF 570-611 → Krakoa crossovers) via the marvel_hickman_panel_descriptors DLT resource. Plan A keyless Firecrawl (Wikipedia + Marvel wiki transcripts). Routes through ExtractComicDescriptor BAML (qwen3-vl-8b default via MODEL_REGISTRY)."
depends = ["sync"]
run = "USE_LOCAL_SCRAPES=true .venv/bin/python3 -c 'from dlt_sources.media.comics.hickman_marvel.scrape import marvel_hickman_panel_descriptors; rows = list(marvel_hickman_panel_descriptors()); print(f\"marvel_hickman_panel_descriptors: {len(rows)} rows\")'"

[tasks."data:media-intel:prose-wot"]
description = "Class B — Ingest The Wheel of Time passages (the 0-pixel control group) via the wheel_of_time_passage_descriptors DLT resource. Plan A keyless Firecrawl (Wikisource + Wikipedia). Routes through ExtractProseDescriptor BAML (qwen3.6-27b-mtp default via MODEL_REGISTRY). vfx_vocabulary.particle_class defaults to 'ink' for prose-as-medium."
depends = ["sync"]
run = "USE_LOCAL_SCRAPES=true .venv/bin/python3 -c 'from dlt_sources.media.prose.wheel_of_time.scrape import wheel_of_time_passage_descriptors; rows = list(wheel_of_time_passage_descriptors()); print(f\"wheel_of_time_passage_descriptors: {len(rows)} rows\")'"

[tasks."data:media-intel:animation-atla"]
description = "Class C — Ingest Avatar: The Last Airbender + The Legend of Korra + the Aang-film continuity frames via the avatar_frame_descriptors DLT resource. Plan A keyless Firecrawl (Wikipedia + Avatar wiki concept-art thumbs). Routes through ExtractAnimationDescriptor BAML (molmo2-8b default via MODEL_REGISTRY). The 4+1 element vocabulary (air / water / fire / earth / spirit) is captured via the power_event.element field."
depends = ["sync"]
run = "USE_LOCAL_SCRAPES=true .venv/bin/python3 -c 'from dlt_sources.media.animation.atla_korra_aang_film.scrape import avatar_frame_descriptors; rows = list(avatar_frame_descriptors()); print(f\"avatar_frame_descriptors: {len(rows)} rows\")'"

[tasks."data:media-intel:games-capture"]
description = "Class D — Local-capture only (no Firecrawl). Ingests the deterministic libretro headless capture for Golden Sun + the sunshine stream capture for Hades 1/2 + WoW + the libretro gambatte capture for Pokémon. Stored in stedding/ingest_queue/retro/ per the retro-game-design-catalogue spec. Routes through ExtractGameplayDescriptor BAML (qwen3-vl-8b default via MODEL_REGISTRY). The descriptor is description-only — no copyrighted game screenshots in the shippable asset output."
depends = ["sync"]
run = ".venv/bin/python3 -c 'from dlt_sources.media.games.hades_wow_golden_sun_pokemon.capture import gameplay_capture_descriptors; rows = list(gameplay_capture_descriptors()); print(f\"gameplay_capture_descriptors: {len(rows)} rows\")'"

[tasks."data:media-intel:educational-bodies"]
description = "Class E (educational body sub-bucket) — Ingest the 2 NCCA research PDFs (leaving_certificate/the-potential-of-online-learning-environments_en.pdf + leaving_certificate/key-competencies-in-senior-cycle_en.pdf) + the 12 NCCA Leaving Certificate syllabus PDFs (en + ga parity) via the ncca_sec_dfe_sqa_wjec_desc_source DLT resource. Plan A keyless Firecrawl (firecrawl_parse). Routes through ExtractOfficialDocumentDescriptor BAML (olmocr-2-7b default via MODEL_REGISTRY). The 2 user-named NCCA research PDFs at the root of leaving_certificate/ are the canonical sources for what NCCA says about certificates and online learning. The 12 Wikipedia entries were MOVED to dlt_sources/media/celtic_history_research/ (gated for the downstream theming change)."
depends = ["sync"]
run = "USE_LOCAL_SCRAPES=true .venv/bin/python3 -c 'from dlt_sources.media.official.ncca_sec_celt_duchas_wikipedia.scrape import ncca_sec_dfe_sqa_wjec_desc_source; src = ncca_sec_dfe_sqa_wjec_desc_source(); rows = [r for s in src for r in s]; print(f\"ncca_sec_dfe_sqa_wjec_desc: {len(rows)} rows\")'"

[tasks."data:media-intel:uk-government"]
description = "Class E (UK government sub-bucket) — Ingest the UK police (Met + BTP + PSNI) + UK defence (MoD + British Army + Royal Navy + RAF) + UK Home Office + FCDO + MoJ + DoH + 7 UK Acts + Treaties via the uk_government_source DLT resource. Plan A keyless Firecrawl (firecrawl_scrape + firecrawl_parse). OGL v3.0. Routes through ExtractOfficialDocumentDescriptor BAML (olmocr-2-7b default via MODEL_REGISTRY). The 18 records emit across 3 @dlt.resource (uk_police_defence_army_pages + uk_departments_pages + uk_acts_treaties_pages)."
depends = ["sync"]
run = "USE_LOCAL_SCRAPES=true .venv/bin/python3 -c 'from dlt_sources.media.official.government.uk.scrape import uk_government_source; src = uk_government_source(); rows = [r for s in src for r in s]; print(f\"uk_government: {len(rows)} rows\")'"

[tasks."data:media-intel:ie-government"]
description = "Class E (Éire government sub-bucket) — Ingest An Garda Síochána + Irish Defence Forces + Naval + Air Corps + DoD + DoJ + DFA + Oireachtas + Office of the President + 6 Acts + Treaties via the ie_government_source DLT resource. Plan A keyless Firecrawl (firecrawl_scrape + firecrawl_parse). PSI (or OGL-3.0 for the Acts). Routes through ExtractOfficialDocumentDescriptor BAML (olmocr-2-7b default via MODEL_REGISTRY). The 15 records emit across 3 @dlt.resource (ie_police_defence_pages + ie_departments_pages + ie_acts_treaties_pages)."
depends = ["sync"]
run = "USE_LOCAL_SCRAPES=true .venv/bin/python3 -c 'from dlt_sources.media.official.government.ie.scrape import ie_government_source; src = ie_government_source(); rows = [r for s in src for r in s]; print(f\"ie_government: {len(rows)} rows\")'"

[tasks."data:media-intel:crown-deps-government"]
description = "Class E (Crown Dependencies government sub-bucket) — Ingest Isle of Man Government + IoM Constabulary + Tynwald + IoM Courts + States of Jersey + States of Jersey Police + States of Guernsey + Guernsey Police via the crown_dependencies_government_source DLT resource. Plan A keyless Firecrawl (firecrawl_scrape). OGL-3.0. The 3 British Crown Dependencies (IoM + Jersey + Guernsey) are self-governing Crown Dependencies of the UK Crown."
depends = ["sync"]
run = "USE_LOCAL_SCRAPES=true .venv/bin/python3 -c 'from dlt_sources.media.official.government.crown_dependencies.scrape import crown_dependencies_government_source; src = crown_dependencies_government_source(); rows = [r for s in src for r in s]; print(f\"crown_dependencies_government: {len(rows)} rows\")'"

[tasks."data:media-intel:uk-departments"]
description = "Class E (UK departments sub-bucket) — Ingest NHS England + DWP + Transport + Education + DEFRA via the uk_departments_source DLT resource. Plan A keyless Firecrawl (firecrawl_scrape). OGL-3.0. The non-police / non-defence departmental surface; the police + defence + MoD + Home Office + FCDO + MoJ + DoH surface lives at data:media-intel:uk-government."
depends = ["sync"]
run = "USE_LOCAL_SCRAPES=true .venv/bin/python3 -c 'from dlt_sources.media.official.departments.uk.scrape import uk_departments_source; src = uk_departments_source(); rows = [r for s in src for r in s]; print(f\"uk_departments: {len(rows)} rows\")'"

[tasks."data:media-intel:ie-departments"]
