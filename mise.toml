run = "bash scripts/week4-smoke-test.sh"

[tasks."drift-audit"]
description = "Audit for pre-v7 path drift across all subdirectories (scoped to source files only — docs are intentionally excluded since they reference historical layouts)"
run = """
echo "=== Pre-v7 path drift audit (source files only) ==="
# The drift audit scans the 8 target subdirectories + the canonical
# IaC root + the root pyproject.toml. Docs (.md) are excluded since
# they legitimately reference pre-v7 layouts as historical notes.
for pattern in 'cianfhoghlaim/dlt/' 'cianfhoghlaim/baml/' 'infrastructure/stacks/' 'infrastructure/komodo/' 'sruth/cianfhoghlaim/'; do
  count=$(grep -rE "$pattern" \
    --include='*.py' \
    --include='*.ts' \
    --include='*.toml' \
    --include='*.yaml' \
    --include='*.baml' \
    --include='*.tsx' \
    --include='*.json' \
    bonneagar/ dlt_sources/ orchestration/ baml_src/ cocoindex/ motherduck/ meaisinfhoghlaim/ agents/ observability/ \
    pyproject.toml mise.toml turbo.json package.json tsconfig.json \
    2>/dev/null | wc -l)
  echo "$pattern: $count source occurrences"
done
echo "=== v7 flat 'cianfhoghlaim.X.Y' in Python imports (should be 0 outside docs) ==="
grep -rE "from cianfhoghlaim\\.[a-z]+\\." --include='*.py' \
  bonneagar/ dlt_sources/ orchestration/ baml_src/ cocoindex/ motherduck/ meaisinfhoghlaim/ agents/ observability/ \
  2>/dev/null | wc -l
echo "=== Total ==="
echo "Done. Pass criterion: all counts should be 0 in active source."
"""

