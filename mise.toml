run = "uv run notebooks/32_onboarding_02_first_unsloth_chat.py"

[tasks."tutorial:03-walkthrough"]
description = "Walk through Hermes + OpenClaw + OpenChamber + Unsloth Studio (10 min)"
run = "uv run notebooks/33_onboarding_03_4_stack_walkthrough.py"

