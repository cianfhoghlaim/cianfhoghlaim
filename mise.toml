[tasks."biep:v3:lint"]
description = "BIEP v3 ibis-first contract lint — verify no raw duckdb.connect() in BIEP v3 paths (the BIEP v3 spec mandates ibis-first per the lakehouse_pipeline contract; raw duckdb.connect() is a violation)"
run = """
# Scan the BIEP v3 Ireland + England paths for raw duckdb.connect() calls
# (the BIEP v3 contract is ibis-first per british-isles-education-pipeline-v3/spec.md).
#
# 2026-08-08 fix (per issue #153): the previous regex `duckdb[.]connect[(]`
# matched the substring inside docstring mentions of `ibis.duckdb.connect()`,
# producing 10 false positives. The new regex `(^|[^a-zA-Z_.])duckdb[.]connect[(]`
# requires a non-identifier prefix before `duckdb.connect(`, which excludes
# `ibis.duckdb.connect(`, `my_ibis.duckdb.connect(`, and similar. The
# `(^|[...])` alternation is needed because grep -E doesn't support
# lookbehind.
VIOLATIONS=$(grep -rE "(^|[^a-zA-Z_.])duckdb[.]connect[(]" \
  orchestration/defs/2_materials/ireland_education/ \
  orchestration/defs/2_materials/england_education/ \
  2>/dev/null | wc -l)

if [ "$VIOLATIONS" -gt 0 ]; then
  echo "ERROR: $VIOLATIONS ibis-first violations found in BIEP v3 Ireland/England paths"
  echo "       (raw duckdb.connect() instead of ibis.duckdb.connect())"
  exit 1
fi

echo "OK: 0 ibis-first violations in BIEP v3 Ireland/England paths"
"""
