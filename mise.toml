# =============================================================================
# CORE:SYNC NAMESPACE — the 14-layer knowledge sync architecture
# =============================================================================

[tasks."sync:all"]
description = "CORE sync orchestrator — runs all 14 sync layers in topological order"
depends = [
  "sync:paths",
  "sync:ccc",
  "sync:cognee",
  "sync:skills",
  "sync:mcp",
  "sync:dagster",
  "sync:drift-docs",
  "sync:spec-agents",
  "sync:baml",
  "sync:stacks",
  "sync:dlt",
  "sync:agents",
  "sync:notebooks",
  "sync:firecrawl",
]
run = "bash scripts/sync/all.sh"

[tasks."sync:paths"]
description = "Layer 1: detect pre-v7 path drift in source files"
run = "bash scripts/sync/paths.sh"

[tasks."sync:ccc"]
description = "Layer 2: refresh CCC index + append the canonical concept guides"
run = "bash scripts/sync/ccc.sh"

[tasks."sync:cognee"]
# Per the 2026-08-24-dlt-sources-to-multi-repo-scaffold-v1 change Phase 0.8:
# Layer 3 + 6 + 7 + 8 + 9 + 10 + 11 orchestrator -- ingests the 8
# cianfhoghlaim-scope Cognee clusters (openspec_changes + baml_schemas +
# dagster_assets + agents + dlt_sources + notebooks + stacks +
# firecrawl_concepts) + the 12 sister-scope twin clusters (per Phase 2.4:
# ciandlithe_* + cianchosaint_* x 6 surfaces) + the legacy
# docs/openspec/skills clusters.
description = "Layer 3: ingest 8 cianfhoghlaim-scope Cognee clusters + 12 sister-scope twins + docs/openspec/skills/baml/stacks/agents/notebooks/dlt/dagster/firecrawl_clusters"
depends = [
  "sync:cognee:openspec_changes",
  "sync:cognee:baml_schemas",
  "sync:cognee:dagster_assets",
  "sync:cognee:agents",
  "sync:cognee:dlt_sources",
  "sync:cognee:notebooks",
  "sync:cognee:stacks",
  "sync:cognee:firecrawl_concepts",
  "sync:cognee:sister_twins",
]
run = "bash scripts/sync/cognee.sh"

# Per the 2026-08-24-dlt-sources-to-multi-repo-scaffold-v1 change Phase 2.4:
# Sister-scope Cognee twin clusters — diff-sync the 12 sister-scope
# clusters (ciandlithe_* + cianchosaint_* x 6 surfaces) against their
# cianfhoghlaim-scope masters. The CREATE-ON-DEPLOY intent list is at
# orchestration/sister_repo_cognee_intent.py (12 clusters total).
[tasks."sync:cognee:sister_twins"]
description = "Sister-scope twin clusters (per Phase 2.4): diff-sync the 12 ciandlithe_* + cianchosaint_* Cognee clusters against their cianfhoghlaim-scope masters"
run = "python3 orchestration/sister_repo_cognee_intent.py 2>&1 | tail -20 || python3 -c 'import sys; sys.path.insert(0, \"orchestration\"); from sister_repo_cognee_intent import SISTER_TWIN_CLUSTERS, cluster_pairs; print(f\"{len(SISTER_TWIN_CLUSTERS)} twin clusters\"); [print(f\"  {m} -> {t}\") for m, t in cluster_pairs()]'"

# Per the 2026-08-24-dlt-sources-to-multi-repo-scaffold-v1 change Phase 0.8:
# 8 per-cluster sub-tasks (the canonical 8 cianfhoghlaim-scope clusters).
# Each sub-task delegates to scripts/cognee_ingest_<cluster>.py (or
# scripts/sync_dagster_assets_to_cognee.py for the dagster_assets cluster).
# cognee is loaded via `uv run --with cognee` since the project pyproject.toml
# does not (yet) declare cognee as a direct dep; the canonical ingestion
# path is the standalone cognee 1.5.3 CLI / Python API.
[tasks."sync:cognee:openspec_changes"]
description = "Cluster 1/8: ingest 78 cianfhoghlaim + 4 cwd openspec/changes/*/proposal.md into the openspec_changes Cognee cluster"
run = "uv run --with cognee python scripts/cognee_ingest_openspec.py"

[tasks."sync:cognee:baml_schemas"]
description = "Cluster 2/8: ingest 334 baml_src/**/*.baml into the baml_schemas Cognee cluster"
run = "uv run --with cognee python scripts/cognee_ingest_baml_schemas.py"

[tasks."sync:cognee:dagster_assets"]
description = "Cluster 3/8: ingest 89 orchestration/defs/**/*.py (the 5-layer defs/ tree) into the dagster_assets Cognee cluster"
run = "uv run --with cognee python scripts/sync_dagster_assets_to_cognee.py"

[tasks."sync:cognee:agents"]
description = "Cluster 4/8: ingest 168 agents/**/*.py (the 12-agent fleet + per-agent sub-modules) into the agents Cognee cluster"
run = "uv run --with cognee python scripts/cognee_ingest_agent_definitions.py"

[tasks."sync:cognee:dlt_sources"]
description = "Cluster 5/8: ingest 2173 dlt_sources/**/*.py (the per-nation @dlt.source + @dlt.resource) into the dlt_sources Cognee cluster"
run = "uv run --with cognee python scripts/cognee_ingest_dlt_sources.py"

[tasks."sync:cognee:notebooks"]
description = "Cluster 6/8: ingest 245 notebooks/**/*.{py,ipynb,md} into the notebooks Cognee cluster"
run = "uv run --with cognee python scripts/cognee_ingest_notebooks.py"

[tasks."sync:cognee:stacks"]
description = "Cluster 7/8: ingest 109 bonneagar/stacks/**/compose.yaml + the 6-file GOLD_STANDARD pattern components into the stacks Cognee cluster"
run = "uv run --with cognee python scripts/cognee_ingest_stacks_catalog.py"

[tasks."sync:cognee:firecrawl_concepts"]
description = "Cluster 8/8: ingest the 35 concept guides from .cocoindex_code/guides.yml into the firecrawl_concepts Cognee cluster"
run = "uv run --with cognee --with pyyaml python scripts/cognee_ingest_firecrawl_concepts.py"

[tasks."sync:skills"]
description = "Layer 4: validate 65 agent skills (frontmatter + path references)"
run = "bash scripts/sync/skills.sh"

[tasks."sync:mcp"]
description = "Layer 5: ping all 14 MCP servers with 5s timeout"
run = "bash scripts/sync/mcp.sh"

[tasks."sync:dagster"]
description = "Layer 6: validate Dagster definitions via AST parsing + per-group breakdown"
run = "bash scripts/sync/dagster.sh"

[tasks."sync:drift-docs"]
description = "Layer 7: validate AGENTS.md count claims + append to unified sync report"
run = "bash scripts/sync/drift_docs.sh"

[tasks."sync:spec-agents"]
description = "Layer 8: regenerate the per-spec AGENTS.md files (97 siblings of openspec/specs/<name>/spec.md)"
run = "bash scripts/sync/spec_agents.sh ${@:-}"

[tasks."sync:baml"]
description = "Layer 9: BAML schema sync orchestrator (drift + ccc + cognee + test + lint)"
run = "bash scripts/sync/baml.sh"

[tasks."sync:stacks"]
description = "Layer 10: stacks sync orchestrator (drift + ccc + cognee + validate + health)"
run = "bash scripts/sync/stacks.sh"

[tasks."sync:dlt"]
description = "Layer 11: DLT source sync orchestrator (drift + ccc + cognee + test + lint)"
run = "bash scripts/sync/dlt.sh"

# Per the 2026-08-23-data-cocoindex-v1-0-14-features-v1 change: 2 new tasks
# wrapping the CocoIndex v1.0.14+ App/flow surface.
[tasks."data:cocoindex:apps:list"]
description = "DATA cocoindex apps-list — enumerate all BIEP v1 Apps (6 LC subjects + government_circulars). Per the 2026-08-23-data-cocoindex-v1-0-14-features-v1 change."
alias = ["cocoindex:apps:list", "cocoindex:list"]
run = "bash -c 'ls cocoindex_flows/biep_parity/ 2>/dev/null && echo \"---\" && ls cocoindex_flows/ 2>/dev/null | head -20'"

[tasks."data:cocoindex:flows:status"]
description = "DATA cocoindex flows-status — check the freshness + last-run timestamp of a named v1 App. Usage: mise run data:cocoindex:flows:status -- <app_name>. Per the 2026-08-23-data-cocoindex-v1-0-14-features-v1 change."
usage = 'app_name "<name>" help="The BIEP v1 App name (e.g. ireland_lc_mathematics)"'
alias = ["cocoindex:flows:status"]
run = "bash -c 'APP=${1:-ireland_lc_mathematics}; echo \"=== CocoIndex Flow Status: $APP ===\"; echo \"Last refresh: $(stat -f %Sm cocoindex_flows/biep_parity/${APP}* 2>/dev/null | head -1)\"; echo \"File count: $(ls cocoindex_flows/biep_parity/${APP}* 2>/dev/null | wc -l)\"'"

[tasks."sync:agents"]
description = "Layer 12: agent definitions sync orchestrator (drift + ccc + cognee + test + lint)"
run = "bash scripts/sync/agents.sh"

[tasks."sync:notebooks"]
description = "Layer 13: notebook sync orchestrator (drift + ccc + cognee + test + lint)"
run = "bash scripts/sync/notebooks.sh"

[tasks."sync:firecrawl"]
description = "Layer 14: Firecrawl dual-search sync (the CCC concept guides + index refresh)"
run = "bash scripts/sync/firecrawl-ccc.sh"

# =============================================================================
# TG4 + FOGHLAIM MEDIA CORPUS (tg4-foghlaim-corpus-v1, 2026-08-25)
# =============================================================================
# 3 tasks for the new multimodal Irish-language media corpus:
#   - sync:tg4-player     : DLT ingestion of the TG4 on-demand player catalog
#   - sync:tg4-foghlaim   : DLT ingestion of the Foghlaim Nuxt.js lessons
#   - sync:tg4-all        : chain both + refresh the v1 App

[tasks."sync:tg4-player"]
description = "DLT ingestion: TG4.ie on-demand player catalog (8 genres + Bailiúcháin) via Brightcove Playback API"
run = "uv run python -m dlt_sources.cli run-pipeline tg4_player_shows"

[tasks."sync:tg4-foghlaim"]
description = "DLT ingestion: Foghlaim.tg4.ie lesson catalog (3 levels × 11+ subjects) via Firecrawl + Brightcove + yt-dlp"
run = "uv run python -m dlt_sources.cli run-pipeline foghlaim_lessons"

[tasks."sync:tg4-all"]
description = "Chain the TG4 player + Foghlaim DLT ingestions + refresh the v1 App"
depends = [
  "sync:tg4-player",
  "sync:tg4-foghlaim",
]
run = "bash scripts/sync/tg4_all.sh"

# Phase C additions (the data-plane functional subagent task).
#  - data:tg4_foghlaim:m1   : run the BIEP v3 M1 milestone (the TG4 ingestion leg)
#  - data:tg4_foghlaim:lint : aggregate lint sweep (drift-docs + BAML + cocoindex conformance)
[tasks."data:tg4_foghlaim:m1"]
description = "Phase C M1 milestone — run the BIEP v3 milestone script gated through the TG4 + Foghlaim corpus (m1.py + DLT ingestions on stedding cache)"
alias = ["tg4:foghlaim:m1"]
depends = ["sync:tg4-all"]
run = '''
echo "[data:tg4_foghlaim:m1] resolving the BIEP m1 milestone script"
SCRIPT="$(ls -1 scripts/m1_*.py 2>/dev/null | head -1 || true)"
if [ -z "${SCRIPT}" ]; then
  echo "WARN: no scripts/m1_*.py found; falling back to sync:tg4-all" >&2
  mise run sync:tg4-all
else
  USE_LOCAL_SCRAPES=true .venv/bin/python3 "${SCRIPT}"
fi
'''

[tasks."data:tg4_foghlaim:lint"]
description = "Phase C aggregate lint — drift-docs + BAML stub-prompt + cocoindex v1 conformance + dlt-nested-hints (the 4 linters that touch the TG4 + Foghlaim surface)"
alias = ["tg4:foghlaim:lint"]
depends = ["core:install"]
run = '''
set -e
echo "[data:tg4_foghlaim:lint] drift-docs …"
mise run lint:drift-docs
echo "[data:tg4_foghlaim:lint] BAML stub-prompt lint …"
mise run lint:baml-stub-prompts
echo "[data:tg4_foghlaim:lint] CocoIndex v1 conformance (covers tg4_foghlaim_embedding) …"
mise run data:cocoindex:conformance
echo "[data:tg4_foghlaim:lint] dlt nested-hints lint …"
mise run lint:dlt:nested-hints
echo "[data:tg4_foghlaim:lint] ALL GREEN"
'''


