[tasks."openspec:feedback"]
description = "OPENSPEC feedback — submit feedback to OpenSpec maintainers (openspec 1.4+)"
alias = ["openspec:fb"]
run = "openspec feedback --help"

[tasks."openspec:instructions"]
description = "OPENSPEC instructions — emit enriched template for an artifact (openspec 1.4+). Usage: mise run openspec:instructions --change <id> [artifact]"
