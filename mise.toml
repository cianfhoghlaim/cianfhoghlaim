[tasks."mcp:smoke:cognee"]
description = "Smoke test: cognee MCP (port 8100 reachable)"
run = "bash scripts/mcp_smoke.sh cognee"

[tasks."mcp:smoke:graphiti"]
description = "Smoke test: graphiti MCP (port 8000 reachable)"
run = "bash scripts/mcp_smoke.sh graphiti"

[tasks."mcp:smoke:design-system"]
description = "Smoke test: design-system MCP (design-system-server.py exists)"
