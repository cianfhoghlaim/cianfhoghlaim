description = "Run the sruth-browser pytest suite (4 test files + 1 conformant __init__)"
run = "uv run pytest bonneagar/stacks/browser/tests/"

[tasks."cic:stack-doctor"]
description = "Validate all 89 Docker Compose stacks under bonneagar/stacks/ against the 6-file GOLD_STANDARD pattern (the canonical CI gate; was 'cic:stack-doctor:validate 94 stacks' pre-v7)"
