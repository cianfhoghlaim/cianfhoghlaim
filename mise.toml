# =============================================================================
# Cianfhoghlaim Consolidated Tasks (post-Phase-1 2026-06-30)
# =============================================================================
# The `cic:` namespace wraps the consolidated cianfhoghlaim CLI surface:
#   cic:               top-level (sync, lint, test, typecheck, build)
#   cic:ocr:           OCR/VLM registry, evaluation harness, adapters
#   cic:baml:          BAML extraction + client regeneration
#   cic:cocoindex:     14 v1 CocoIndex Apps + conformance
#   cic:dagster:       DAG orchestration (alias of dagster:dev)
#   cic:dlt:           DLT pipelines (dev / staging / prod targets)
#   cic:meaisin:       Meaisínfhoghlaim registry + HF watchdog + LiteLLM regen
#   cic:browser:       sruth-browser stack (Bonneagar)
# All `cic:*` tasks delegate to the consolidated `cianfhoghlaim` CLI entry-points.

[tasks.cic]
description = "Top-level cianfhoghlaim consolidated tasks"
run = "uv run cianfhoghlaim --help"

[tasks."cic:sync"]
description = "Sync the consolidated cianfhoghlaim workspace (uv sync --all-extras)"
run = "uv sync --all-extras"

[tasks."cic:lint"]
description = "Lint cianfhoghlaim Python code with ruff"
run = "uv run ruff check ."

[tasks."cic:test"]
description = "Run pytest on the consolidated cianfhoghlaim package"
run = "uv run pytest tests/"

[tasks."cic:typecheck"]
description = "Type-check cianfhoghlaim Python code with mypy"
run = "uv run mypy ."

[tasks."cic:build"]
description = "Build the consolidated cianfhoghlaim wheel"
run = "uv build --package cianfhoghlaim"

[tasks."cic:ocr:test"]
description = "Run pytest on the OCR evaluation harness"
run = "uv run pytest tests/_meaisinfhoghlaim/test_ocr_vlm_registry.py"

[tasks."cic:ocr:eval"]
description = "Run the Celtic OCR evaluation harness (multi-backend comparison)"
run = "uv run python -m cianfhoghlaim.ocr.cli eval --backend mlx"

[tasks."cic:ocr:registry-lint"]
description = "Verify all v4 VISION_MODELS are live on HF Hub"
run = "uv run python scripts/verify_hf_hub_audit.py --strict"

[tasks."cic:baml:generate"]
description = "Regenerate the baml_client/ Python module from baml_src/ (alias of baml:generate)"
run = "uv run baml-cli generate"

[tasks."cic:baml:test"]
description = "Run baml-cli test (alias of baml:test)"
run = "mise run baml:test"

[tasks."cic:baml:lint"]
description = "Lint all 56+ .baml schema files for consistency"
run = "uv run python -c 'import pathlib; [print(p) for p in pathlib.Path(\"baml\").glob(\"*.baml\")]' | wc -l"

[tasks."cic:cocoindex:index"]
description = "Build the codebase_chunks LanceDB index via the v1 CocoIndex App (alias of ccc:v1:index)"
run = "uv run cocoindex update cianfhoghlaim.core.cocoindex.codebase_indexing:CodebaseIndex"

[tasks."cic:cocoindex:conformance"]
description = "Run the cocoindex_v1_conformance App to lint all 14 v1 Apps against the 4-rule conformance contract (R1-R4)"
run = "uv run python -c 'import asyncio; from cianfhoghlaim.cocoindex.cocoindex_v1_conformance import run_conformance_check; report = asyncio.run(run_conformance_check()); print(report.summary())'"

[tasks."cocoindex:conformance"]
description = "Run the cocoindex_v1_migrate.py audit (R1-R4). Exits 1 on any violation. This is the CI gate (faster than the v1 App itself)."
run = "uv run python dlt/common/cocoindex_v1_migrate.py --check-only"

[tasks."cic:cocoindex:leabharlann-books"]
description = "Index the leabharlann books corpus via the v1 leabharlann_books_embedding App"
