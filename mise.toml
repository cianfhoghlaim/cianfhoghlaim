# Per the 2026-08-22-agent-skill-refresh-and-dedup-v1 change: fail CI if any
# DEPRECATED skill (marked in frontmatter description) is > 50 lines.
# DEPRECATED skills must be redirect-only stubs (≤ 10 lines).
[tasks."lint-skill:deprecated-cleanup"]
description = "Validate that DEPRECATED skill files are redirect-only stubs (≤ 50 lines; per the 2026-08-22-agent-skill-refresh-and-dedup-v1 change)"
alias = ["lint:skill-deprecated", "lint:deprecated"]
run = "bash -c 'FAIL=0; for f in $(grep -rl \"DEPRECATED\" .agents/skills/*/SKILL.md 2>/dev/null); do lines=$(wc -l < \"$f\" 2>/dev/null); if [ \"$lines\" -gt 50 ]; then echo \"FAIL: $f has $lines lines (max 50 for redirect-only stubs)\"; FAIL=1; fi; done; if [ \"$FAIL\" -eq 1 ]; then exit 1; else echo \"OK: all DEPRECATED skill files are ≤ 50 lines\"; exit 0; fi'"

[tasks."lint:registry"]
description = "Audit agents/, baml_src/, notebooks/, web/, orchestration/, spaces/, meaisinfhoghlaim/ for hardcoded model strings not routed through MODEL_REGISTRY"
depends = ["sync"]
run = ".venv/bin/python3 scripts/registry_audit.py --strict"

# Per the 2026-08-23-dev-tooling-tbd-purpose-refresh-batch-data-specs-v1 change:
# fail CI if any spec under openspec/specs/*/spec.md still has a TBD Purpose field.
[tasks."lint:spec:purpose"]
description = "Validate that every openspec has a non-TBD Purpose section (per the 2026-08-23-dev-tooling-tbd-purpose-refresh-batch-data-specs-v1 change)"
alias = ["lint:spec-purpose"]
run = "bash -c 'TBD_FILES=$(grep -rl \"^## Purpose\" openspec/specs/*/spec.md 2>/dev/null | xargs grep -l \"TBD - created by archiving change\" 2>/dev/null); TOTAL=$(grep -rl \"^## Purpose\" openspec/specs/*/spec.md 2>/dev/null | wc -l); FILLED=$((TOTAL - $(echo \"$TBD_FILES\" | grep -c .))); if [ -n \"$TBD_FILES\" ]; then echo \"FAIL: $((TOTAL - FILLED)) specs still have TBD Purpose:\"; echo \"$TBD_FILES\"; exit 1; else echo \"OK: all $TOTAL specs have non-TBD Purpose\"; exit 0; fi'"

[tasks."lint:guides-yml"]
description = "Validate every path in .cocoindex_code/guides.yml resolves on disk"
run = "uv run python scripts/lint_guides_yml.py"

[tasks."lint:guides-yml:dry-run"]
