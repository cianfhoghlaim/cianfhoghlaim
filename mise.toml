# Cianfhoghlaim Monorepo - Tool Management & Tasks
# https://mise.jdx.dev/

[tools]
# Core tools
python = "3.13"
uv = "latest"
bun = "latest"
dagger = "latest"

# Cloud & Infrastructure
gh = "latest"
cloudflared = "latest"
gcloud = "latest"
oci = "latest"
pulumi = "latest"
infisical = "latest"

# Data tools
duckdb = "latest"
sops = "latest"

# Package managers
pnpm = "latest"
aqua = "latest"
zoxide = "latest"
opencode = "latest"

# OpenSpec (spec-driven change management).
# NOT installed via mise — install once with:
#   bun add -g @fission-ai/openspec@latest
#   bun pm trust --all  # to authorize the post-install script
# Then `openspec --version` should print 1.4.x.

[settings]
experimental = true

[env]
_.python.venv = { path = ".venv" }
_.file = '.env'
MISE_ENV_FILE = ".env"
PYTHONPATH = "."
UV_PROJECT_ENVIRONMENT = ".venv"
# Ireland education local-scrape-cache root. Several dlt_sources/british_isles/ireland
# sources default this to the non-existent absolute path /stedding/ingest_queue; the
# real, populated cache (~15,800 files: ncca.ie, examinations.ie, curriculumonline.ie,
# oide.ie) lives at stedding/site_scrape_samples/ — this makes that the default so
# USE_LOCAL_SCRAPES=true sources find it without per-file edits.
STEDDING_INGEST_QUEUE = "{{config_root}}/stedding/site_scrape_samples"
# dlt_sources/common/destinations_cianfhoghlaim.py's local DuckLake path
# (get_dlt_destination(use_ducklake=True)) reads DUCKLAKE_POSTGRES_USER /
# DUCKLAKE_POSTGRES_PASSWORD, defaulting to a hardcoded "lakekeeper"/
# "devpassword" that doesn't match the running lakehouse Postgres
# container's real credentials (which come from POSTGRES_USER /
# POSTGRES_PASSWORD in .env). Aliased here rather than baking a value in —
# never read the password itself, just point the differently-named var at
# the one the lakehouse compose stack already sets.
DUCKLAKE_POSTGRES_USER = "{{env.POSTGRES_USER}}"
DUCKLAKE_POSTGRES_PASSWORD = "{{env.POSTGRES_PASSWORD}}"
# registry_api.py / registry_loader.py's BIEP_REGISTRY_URI defaults to
# "md:cianfhoghlaim" (MotherDuck cloud — confirmed elsewhere in this repo
# to be an empty account, unusable locally). This string carries NO
# credentials — host/port/dbname only. Auth comes from the standard libpq
# PGUSER/PGPASSWORD env vars below, which DuckDB's postgres extension
# reads automatically; duckdb.connect() on a credential-free string never
# has a secret to echo back through SHOW DATABASES/current_catalog(),
# unlike embedding user=...password=... directly in the connection string
# (confirmed unsafe earlier this session — see the
# kcg-ducklake-connstring-password-exposure memory note).
BIEP_REGISTRY_URI = "ducklake:postgres:host=localhost port=5433 dbname=ducklake_cianfhoghlaim"
PGUSER = "{{env.DUCKLAKE_POSTGRES_USER}}"
PGPASSWORD = "{{env.DUCKLAKE_POSTGRES_PASSWORD}}"
# destinations_cianfhoghlaim.py's _build_local_destination() defaults
# DUCKLAKE_BUCKET to "ducklake-cianfhoghlaim", but the already-seeded local
# DuckLake catalog (Postgres, ~1,990 registry rows from a prior session)
# was actually initialized against bucket "ducklake" (namespace as a path
# prefix inside it, not baked into the bucket name) — confirmed via a real
# DuckLake "DATA_PATH parameter does not match existing data path in the
# catalog" error. Matching the existing catalog here rather than risking a
# second, orphaned bucket/catalog split.
DUCKLAKE_BUCKET = "ducklake"
# Post-Phase-1 (2026-06-30): the consolidated pyproject.toml lived at
# cianfhoghlaim/pyproject.toml. Post-v7 (2026-07-17): the package is the
# repo itself, so pyproject.toml is at the root. The stamp is bumped to
# the v7 release date so `mise run cic:version` reflects the new shape.
CIANFHOGHLAIM_PYPROJECT_GENERATED_AT = "2026-07-17T00:00:00Z"
# LOCKET_TOKEN, KOMODO_URL, PANGOLIN_URL are set per-environment (not required here)
# They are provided by the Locket sidecar in production or by the user's shell in dev.


# =============================================================================
# Python Tasks
# =============================================================================

[tasks.sync]
description = "Sync all Python workspace packages (single cianfhoghlaim workspace member)"
run = "uv sync"

[tasks.test]
description = "Run pytest on cianfhoghlaim package"
run = "uv run pytest"

[tasks."validate-env"]
description = "Smoke-test the 7-row CIANFHOGHLAIM_* env-var matrix + all code-side consumers (introduced by pick-7-align-env)"
run = ".venv/bin/python3 scripts/validate_env.py"

[tasks.lint]
description = "Aggregate lint gate — runs the canonical Python + skills-metadata + centralized-registry linters"
run = """
mise run lint:skills
mise run lint:registry
uv run ruff check .
"""

[tasks."lint:skills"]
description = "Validate the .agents/skills/ metadata (frontmatter, name match, description length, line count) for every skill"
run = "bash .agents/skills/lint-skills.sh"

[tasks."lint:registry"]
description = "Audit agents/, baml_src/, notebooks/, web/, orchestration/, spaces/, meaisinfhoghlaim/ for hardcoded model strings not routed through MODEL_REGISTRY. Part of the `centralized-model-registry` capability — see openspec/changes/2026-08-15-centralized-model-schema-registry-and-deployment-control-panel-v1/"
run = ".venv/bin/python3 scripts/registry_audit.py --strict"

[tasks."pre-commit-install"]
description = "Install the centralized-registry pre-commit hook"
run = "pre-commit install && pre-commit run --all-files"

[tasks."pre-commit-run"]
description = "Run the centralized-registry pre-commit hook on all files"
run = "pre-commit run --all-files"

[tasks."lint:drift-docs"]
description = "Validate every AGENTS.md number claim (specs/skills/stacks/models/notebooks) against ground truth. Exits 1 on any mismatch; writes JSON + MD report to stedding/sync-reports/docs-drift-{date}.{json,md}. Per the 2026-07-29-repo-hygiene-agent-routing-and-sync-wiring-v1 change (the `centralize-cross-cutting-docs` spec)."
run = ".venv/bin/python3 scripts/lint_drift_docs.py"

[tasks."lint:drift-docs:dry-run"]
description = "Same as lint:drift-docs but exits 0 always (prints the report)"
run = ".venv/bin/python3 scripts/lint_drift_docs.py --dry-run"

[tasks."agents:smoke"]
description = "Run the 3 agent-fleet smoke tests (test_agent_fleet_smoke.py + test_agent_wiring_audit.py + test_agent_registry_smoke.py)"
run = "uv run pytest tests/test_agent_fleet_smoke.py tests/test_agent_wiring_audit.py tests/test_agent_registry_smoke.py -v"

[tasks."agents:audit"]
description = "Direct-import audit + AGENT_REGISTRY validation for the 12-agent fleet"
run = ".venv/bin/python3 -c \"import os; os.environ['AGENT_FLEET_DISABLE_WIRE']='1'; os.environ['AGENT_FLEET_DISABLE_MEMORY']='1'; from cianfhoghlaim.agents.agent_registry import AGENT_REGISTRY; assert len(AGENT_REGISTRY) >= 12, f'AGENT_REGISTRY has {len(AGENT_REGISTRY)} entries'; print(f'AGENT_REGISTRY: {len(AGENT_REGISTRY)} entries OK')\""

[tasks."agents:reproduce"]
description = "Operator's one-shot: reproduce the 12-agent fleet + 8 NCCA subject specialists + 3 educational agents from cold to green"
run = "bash scripts/reproducers/agents-fleet-reproducer.sh"

[tasks."pipelines:parity"]
description = "Per-jurisdiction matrix across baml_src/, dlt/, orchestration/, cocoindex/. Set PIPELINE_PARITY_STRICT=1 for non-zero exit on missing layers."
run = "python3 scripts/check_pipeline_parity.py"

[tasks.format]
description = "Format all Python code with ruff"
run = "uv run ruff format ."

[tasks."py:typecheck"]
description = "Type check Python code with mypy"
run = "uv run mypy"

# =============================================================================
# TypeScript Tasks (delegated to turbo)
# =============================================================================

[tasks."ts:install"]
description = "Install all TypeScript dependencies (bun workspaces)"
run = "bun install"

[tasks."ts:build"]
description = "Build all TypeScript packages via turbo"
run = "bunx turbo run build"

[tasks."ts:typecheck"]
description = "Type check TypeScript code via turbo"
run = "bunx turbo run typecheck"

[tasks."ts:lint"]
description = "Lint TypeScript code via turbo"
run = "bunx turbo run lint"

[tasks."schema:generate"]
description = "Generate the BIEP v1 lineage registry + Zod/TanStack DB collection schemas (committed artifacts). Per openspec R27 + R30."
run = "bun run schema:generate"

[tasks."schema:validate"]
description = "CI drift gate for the generated Zod schemas (regenerate in-memory + byte-diff against committed bi-ep.gen.ts). Per openspec R30."
run = "bun run schema:validate"

[tasks."lineage:validate"]
description = "CI drift gate for the PDF lineage registry (filesystem walk vs committed registry). Per openspec R27."
run = "bun run lineage:validate"

[tasks."lineage:smoke"]
description = "Playwright WASM smoke test for the BIEP v1 lineage viewer. Per openspec R33."
run = "bun run lineage:smoke"

# =============================================================================
# Turborepo shortcut
# =============================================================================

[tasks.turbo]
description = "Run any turbo task (e.g. 'mise turbo dev')"
run = "bunx turbo run ${@}"

# =============================================================================
# Rust Tasks
# =============================================================================
