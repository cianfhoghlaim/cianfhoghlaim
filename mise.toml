# Cianfhoghlaim Monorepo - Tool Management & Tasks
# https://mise.jdx.dev/

[tools]
# Core tools
python = "3.13"
uv = "latest"
bun = "latest"
dagger = "latest"

# Cloud & Infrastructure
gh = "latest"
cloudflared = "latest"
gcloud = "latest"
oci = "latest"
pulumi = "latest"
infisical = "latest"

# Data tools
duckdb = "latest"
sops = "latest"

# Package managers
pnpm = "latest"
aqua = "latest"
zoxide = "latest"
opencode = "latest"

# OpenSpec (spec-driven change management).
# NOT installed via mise — install once with:
#   bun add -g @fission-ai/openspec@latest
#   bun pm trust --all  # to authorize the post-install script
# Then `openspec --version` should print 1.4.x.

[settings]
experimental = true

[env]
_.python.venv = { path = ".venv" }
_.file = '.env'
MISE_ENV_FILE = ".env"
PYTHONPATH = "."
UV_PROJECT_ENVIRONMENT = ".venv"
# Post-Phase-1 (2026-06-30): the consolidated pyproject.toml lives at
# cianfhoghlaim/pyproject.toml. This stamp lets `mise run cic:version` print
# "cianfhoghlaim 0.5.0 (manifest generated YYYY-MM-DDTHH:MM:SSZ)".
CIANFHOGHLAIM_PYPROJECT_GENERATED_AT = "2026-06-30T00:00:00Z"
# LOCKET_TOKEN, KOMODO_URL, PANGOLIN_URL are set per-environment (not required here)
# They are provided by the Locket sidecar in production or by the user's shell in dev.


# =============================================================================
# Python Tasks
# =============================================================================

[tasks.sync]
description = "Sync all Python workspace packages (single cianfhoghlaim workspace member)"
run = "uv sync"

[tasks.test]
description = "Run pytest on cianfhoghlaim package"
run = "uv run pytest"

[tasks.lint]
description = "Lint all Python code with ruff"
run = "uv run ruff check ."

[tasks."lint:skills"]
description = "Validate the .agents/skills/ metadata (frontmatter, name match, description length, line count) for every skill"
run = "bash .agents/skills/lint-skills.sh"

[tasks.format]
description = "Format all Python code with ruff"
run = "uv run ruff format ."

[tasks."py:typecheck"]
description = "Type check Python code with mypy"
run = "uv run mypy"

# =============================================================================
# TypeScript Tasks (delegated to turbo)
# =============================================================================

[tasks."ts:install"]
description = "Install all TypeScript dependencies (bun workspaces)"
run = "bun install"

[tasks."ts:build"]
description = "Build all TypeScript packages via turbo"
run = "bunx turbo run build"

[tasks."ts:typecheck"]
description = "Type check TypeScript code via turbo"
run = "bunx turbo run typecheck"

[tasks."ts:lint"]
description = "Lint TypeScript code via turbo"
run = "bunx turbo run lint"

# =============================================================================
# Turborepo shortcut
# =============================================================================

[tasks.turbo]
description = "Run any turbo task (e.g. 'mise turbo dev')"
run = "bunx turbo run ${@}"

# =============================================================================
# Rust Tasks
# =============================================================================

[tasks."rs:build"]
description = "Build Locket (Rust)"
run = "cd infrastructure/locket && cargo build"

[tasks."rs:test"]
description = "Test Locket (Rust)"
run = "cd infrastructure/locket && cargo test"

[tasks."rs:clippy"]
description = "Run clippy on Locket"
run = "cd infrastructure/locket && cargo clippy"

# =============================================================================
# Dagster Tasks (post-v4 + post-Phase-1 consolidation: single canonical alias)
# =============================================================================
# The 5 stale aliases (dagster:tuatha, dagster:croilar, dagster:meaisin,
# dagster:crypteolas, and the old dagster:oideachais) have been collapsed
# into the single canonical `dagster:dev` alias. The v4 consolidation
# (2026-06-28) merged all 5 former code-locations into a single Dagster
# code-location at `cianfhoghlaim.dagster.definitions`. Phase-1 manifest
# consolidation (2026-06-30) made `dagster:dev` the canonical name.
# See openspec/changes/2026-06-30-consolidate-cianfhoghlaim-pyproject-and-8-dirs/

[tasks."dagster:dev"]
description = "Run Dagster for the consolidated cianfhoghlaim code-location (Ireland + leabharlann + 12-agent fleet). Loads cianfhoghlaim.dagster.definitions: 199 assets + 31 jobs + 6 schedules + 16 sensors + 22 asset checks."
run = "uv run dagster dev -m cianfhoghlaim.dagster.definitions"

# =============================================================================
# Cianfhoghlaim Consolidated Tasks (post-Phase-1 2026-06-30)
# =============================================================================
# The `cic:` namespace wraps the consolidated cianfhoghlaim CLI surface:
#   cic:               top-level (sync, lint, test, typecheck, build)
#   cic:ocr:           OCR/VLM registry, evaluation harness, adapters
#   cic:baml:          BAML extraction + client regeneration
#   cic:cocoindex:     14 v1 CocoIndex Apps + conformance
#   cic:dagster:       DAG orchestration (alias of dagster:dev)
#   cic:dlt:           DLT pipelines (dev / staging / prod targets)
#   cic:meaisin:       Meaisínfhoghlaim registry + HF watchdog + LiteLLM regen
#   cic:browser:       sruth-browser stack (Bonneagar)
# All `cic:*` tasks delegate to the consolidated `cianfhoghlaim` CLI entry-points.

[tasks.cic]
description = "Top-level cianfhoghlaim consolidated tasks"
run = "uv run cianfhoghlaim --help"

[tasks."cic:sync"]
description = "Sync the consolidated cianfhoghlaim workspace (uv sync --all-extras)"
run = "uv sync --all-extras"

[tasks."cic:lint"]
description = "Lint cianfhoghlaim Python code with ruff"
run = "uv run ruff check cianfhoghlaim/"

[tasks."cic:test"]
description = "Run pytest on the consolidated cianfhoghlaim package"
run = "uv run pytest cianfhoghlaim/tests/"

[tasks."cic:typecheck"]
description = "Type-check cianfhoghlaim Python code with mypy"
run = "uv run mypy cianfhoghlaim/"

[tasks."cic:build"]
description = "Build the consolidated cianfhoghlaim wheel"
run = "uv build --package cianfhoghlaim"

[tasks."cic:ocr:test"]
description = "Run pytest on the OCR evaluation harness"
run = "uv run pytest cianfhoghlaim/tests/_meaisinfhoghlaim/test_ocr_vlm_registry.py"

[tasks."cic:ocr:eval"]
description = "Run the Celtic OCR evaluation harness (multi-backend comparison)"
run = "uv run python -m cianfhoghlaim.ocr.cli eval --backend mlx"

[tasks."cic:ocr:registry-lint"]
description = "Verify all v4 VISION_MODELS are live on HF Hub"
run = "uv run python scripts/verify_hf_hub_audit.py --strict"

[tasks."cic:baml:generate"]
description = "Regenerate the baml_client/ Python module from baml_src/ (alias of baml:generate)"
run = "uv run baml-cli generate"

[tasks."cic:baml:test"]
description = "Run baml-cli test"
run = "uv run python -m cianfhoghlaim.baml.cli test"

[tasks."cic:baml:lint"]
description = "Lint all 56+ .baml schema files for consistency"
run = "uv run python -c 'import pathlib; [print(p) for p in pathlib.Path(\"cianfhoghlaim/baml\").glob(\"*.baml\")]' | wc -l"

[tasks."cic:cocoindex:index"]
description = "Build the codebase_chunks LanceDB index via the v1 CocoIndex App (alias of ccc:v1:index)"
run = "uv run cocoindex update cianfhoghlaim.core.cocoindex.codebase_indexing:CodebaseIndex"

[tasks."cic:cocoindex:conformance"]
description = "Run the cocoindex_v1_conformance App to lint all 14 v1 Apps against the 4-rule conformance contract (R1-R4)"
run = "uv run python -c 'import asyncio; from cianfhoghlaim.cocoindex.cocoindex_v1_conformance import run_conformance_check; report = asyncio.run(run_conformance_check()); print(report.summary())'"

[tasks."cic:cocoindex:leabharlann-books"]
description = "Index the leabharlann books corpus via the v1 leabharlann_books_embedding App"
run = "uv run cocoindex update cianfhoghlaim.cocoindex.leabharlann_books_embedding:LeabharlannBooksEmbedding"

[tasks."cic:cocoindex:leabharlann-zotero"]
description = "Index the leabharlann zotero corpus via the v1 leabharlann_zotero_embedding App"
run = "uv run cocoindex update cianfhoghlaim.cocoindex.leabharlann_zotero_embedding:LeabharlannZoteroEmbedding"

[tasks."cic:cocoindex:leabharlann-takeout"]
description = "Index the leabharlann takeout corpus via the v1 leabharlann_takeout_embedding App"
run = "uv run cocoindex update cianfhoghlaim.cocoindex.leabharlann_takeout_embedding:LeabharlannTakeoutEmbedding"

[tasks."cic:dagster:dev"]
description = "Launch Dagster UI on :3000 (alias of dagster:dev)"
run = "mise run dagster:dev"

[tasks."cic:dagster:list-assets"]
description = "List all 199 Dagster assets"
run = "uv run python -m cianfhoghlaim.dagster.cli list-assets"

[tasks."cic:dagster:materialise-leabharlann"]
description = "Materialise the 19 leabharlann Dagster assets (books + zotero + takeout + cognify + inbox + demos)"
run = "uv run python -m cianfhoghlaim.dagster.cli materialise-leabharlann"

[tasks."cic:dlt:dev-pipeline"]
description = "Run an author-archive dlt pipeline against the local DuckDB target (DEV)"
run = "uv run python -m cianfhoghlaim.dlt.cli run-pipeline --target dev"

[tasks."cic:dlt:staging-pipeline"]
description = "Run an author-archive dlt pipeline against the MotherDuck staging target"
run = "uv run python -m cianfhoghlaim.dlt.cli run-pipeline --target staging"

[tasks."cic:dlt:prod-pipeline"]
description = "Run an author-archive dlt pipeline against the Garage S3 + Lakekeeper prod target"
run = "uv run python -m cianfhoghlaim.dlt.cli run-pipeline --target prod"

[tasks."cic:meaisin:registry-audit"]
description = "One-shot HF Hub liveness check on all 24 v4 VISION_MODELS (alias of hf:verify-ocr-registry)"
run = "mise run hf:verify-ocr-registry"

[tasks."cic:meaisin:hf-watchdog"]
description = "Start the daily HF Hub liveness watchdog (cron-style)"
run = "mise run hf:watchdog:up"

[tasks."cic:meaisin:litellm-regenerate"]
description = "Regenerate litellm/config/config.yaml from the v4 VISION_MODELS registry"
run = "mise run litellm:regenerate"

[tasks."cic:browser:up"]
description = "Start the sruth-browser stack (Bonneagar; serves 5 backends at the canonical ports)"
run = "docker compose -f bonneagar/stacks/browser/compose.yaml up -d"

[tasks."cic:browser:down"]
description = "Stop the sruth-browser stack"
run = "docker compose -f bonneagar/stacks/browser/compose.yaml down"

[tasks."cic:browser:tests"]
description = "Run the sruth-browser pytest suite (4 test files + 1 conformant __init__)"
run = "uv run pytest bonneagar/stacks/browser/tests/"

[tasks."cic:stack-doctor"]
description = "Validate all 94 Docker Compose stacks under bonneagar/stacks/ against the GOLD_STANDARD pattern"
run = "uv run python -m cianfhoghlaim.stacks.cli check oideachais"

# Per-package test runners
[tasks."test:codeolas"]
description = "Run pytest on the códeolas library"
run = "uv run pytest cianfhoghlaim/libraries/codeolas/tests/"

[tasks."test:ocr"]
description = "Run pytest on the OCR evaluation harness (11 vision × 4 classical)"
run = "uv run pytest cianfhoghlaim/ocr/evaluation/"

# =============================================================================
# llama-swap Tasks (v4 OCR/VLM registry)
# =============================================================================
# Per openspec/changes/2026-06-29-fix-ocr-vlm-registry-with-unsloth-priority
# The llama-swap service serves the v4 Unsloth GGUFs at :8080.
# Use these tasks to manage the stack locally.

[tasks."llama-swap:up"]
description = "Start the llama-swap service (serves v4 Unsloth GGUFs at :8080)"
run = "docker compose -f bonneagar/stacks/llama-swap/compose.yaml up -d"

[tasks."llama-swap:down"]
description = "Stop the llama-swap service"
run = "docker compose -f bonneagar/stacks/llama-swap/compose.yaml down"

[tasks."llama-swap:logs"]
description = "Tail the llama-swap service logs"
run = "docker logs -f llama-swap"

[tasks."llama-swap:download-models"]
description = "Download all v4 Unsloth GGUFs to stedding/huggingface/gguf/ (5-50 GB; run once per machine)"
run = "python scripts/download_unsloth_models.py"

# NEW in 2026-07-03: download the 4 MLX-only checkpoints (served by mlx-omni :10240)
[tasks."llama-swap:download-mlx"]
description = "Download the 4 v4 MLX-only checkpoints to stedding/huggingface/mlx-community/ (granite-docling, dots-ocr, deepseek-ocr-2, gemma-4-E2B)"
run = "python scripts/download_mlx_models.py"

# NEW in 2026-07-03: dry-run variant (CI-friendly; prints the 14 Unsloth + 4 MLX targets without downloading)
[tasks."llama-swap:download-models:dry-run"]
description = "List the 13 v4 Unsloth + 4 MLX targets without actually downloading"
run = "python scripts/download_unsloth_models.py --dry-run && python scripts/download_mlx_models.py --dry-run"

[tasks."llama-swap:health"]
description = "Healthcheck the llama-swap service (curl http://localhost:8080/v1/models)"
run = "curl -s http://localhost:8080/v1/models | python -m json.tool"

# =============================================================================
# HF Watchdog Tasks (v4 OCR/VLM registry liveness check)
# =============================================================================
# Per openspec/changes/2026-06-29-fix-ocr-vlm-registry-with-unsloth-priority
# Verifies all 26 VISION_MODELS IDs are live on the HF Hub.

[tasks."hf:verify-ocr-registry"]
description = "One-shot HF Hub liveness check on all 26 v4 VISION_MODELS (CI-friendly)"
run = "python scripts/verify_hf_hub_audit.py --strict"

[tasks."hf:watchdog:up"]
description = "Start the daily HF Hub liveness watchdog (cron-style)"
run = "docker compose -f infrastructure/stacks/ci/hf-watchdog/compose.yaml up -d"

[tasks."hf:watchdog:down"]
description = "Stop the HF Hub liveness watchdog"
run = "docker compose -f infrastructure/stacks/ci/hf-watchdog/compose.yaml down"

[tasks."litellm:regenerate"]
description = "Regenerate the litellm/config/config.yaml from the v4 VISION_MODELS registry (Phase 2 of the deployment plan)"
run = "PYTHONPATH=cianfhoghlaim:. python scripts/generate_litellm_config.py > cianfhoghlaim/stacks/litellm/config/config.yaml"

[tasks."litellm:validate"]
description = "Validate the litellm/config/config.yaml structure (count models, check aliases)"
run = "python scripts/validate_litellm_config.py"

# =============================================================================
# Dagger CI/CD Tasks
# =============================================================================
# Reference: openspec/changes/dagger-monorepo-integration/
# The dagger module at infrastructure/dagger/ exposes 8 callable functions
# (test_all, build_images, deploy, rollback × 3 pipelines) via the
# `cianchoghlaim:UnifiedPipeline` entry point. The 4 pre-existing broken
# task aliases are rewritten to use the new function names; a 5th
# (`dagger:build-images`) is added.

[tasks."dagger:ci"]
description = "Run the full Dagger test pipeline (lint + typecheck + unit across all 3 pipelines)"
run = """
cd infrastructure/dagger
dagger call test-all --source ../..
"""

[tasks."dagger:test-python"]
description = "Run Dagger test pipeline scoped to the Python uv workspace"
run = """
cd infrastructure/dagger
dagger call test-all --source ../.. 2>&1 | grep -E "ruff|mypy|pytest|DataPipeline"
"""

[tasks."dagger:test-typescript"]
description = "Run Dagger test pipeline scoped to the bun workspaces"
run = """
cd infrastructure/dagger
dagger call test-all --source ../.. 2>&1 | grep -E "bun|turbo|eslint|tsc|WebPipeline"
"""

[tasks."dagger:build-images"]
description = "Build + publish the 3 pipeline images to ghcr.io/cianfhoghlaim"
run = """
cd infrastructure/dagger
dagger call build-images --source ../.. \
  --registry=ghcr.io/cianfhoghlaim \
  --tag=$(git rev-parse --short HEAD)
"""

[tasks."dagger:deploy-cloudflare"]
description = "Build + deploy the web pipeline to staging (Cloudflare Pages + Komodo)"
run = """
cd infrastructure/dagger
dagger call deploy --source ../.. --environment=staging
"""

# =============================================================================
# Documentation Tasks
# =============================================================================

[tasks."docs:dev"]
description = "Start Docusaurus dev server (if present)"
run = "if [ -d docs-site ]; then bun --cwd docs-site run start; else echo 'No docs-site/ present — skipping.'; fi"

[tasks."docs:build"]
description = "Build Docusaurus site (if present)"
run = "if [ -d docs-site ]; then bun --cwd docs-site run build; else echo 'No docs-site/ present — skipping.'; fi"

[tasks."docs:serve"]
description = "Serve built Docusaurus site (if present)"
run = "if [ -d docs-site ]; then bun --cwd docs-site run serve; else echo 'No docs-site/ present — skipping.'; fi"

# =============================================================================
# Infrastructure Tasks
# =============================================================================

[tasks."stack:up"]
description = "Start a Docker stack"
run = "cd infrastructure && ./scripts/stack.sh ${1} up -d"

[tasks."stack:down"]
description = "Stop a Docker stack"
run = "cd infrastructure && ./scripts/stack.sh ${1} down"

[tasks."stack:logs"]
description = "View Docker stack logs"
run = "cd infrastructure && ./scripts/stack.sh ${1} logs -f"

[tasks."pulumi:up"]
description = "Deploy with Pulumi"
run = "cd infrastructure/pulumi/${1} && pulumi up"

[tasks."pulumi:preview"]
description = "Preview Pulumi changes"
run = "cd infrastructure/pulumi/${1} && pulumi preview"

# =============================================================================
# Secret management (Infisical + Locket + Komodo + Pangolin)
# =============================================================================

[tasks."secrets:env"]
description = "Create the dev-baile environment in Infisical"
run = "bun run scripts/create-env.ts"

[tasks."secrets:init"]
description = "Sync .env secrets into Infisical vault"
run = "bun run scripts/init-vault.ts"

[tasks."sops:encrypt"]
description = "Encrypt .env with SOPS + age key for git-safe backup"
run = "sops encrypt --age age1ucuy60fykra7p49x8qx9lha9qsv444fy4vkckupv8nupat0jg5nscdgnkr .env > .env.enc"

[tasks."sops:decrypt"]
description = "Decrypt .env.enc back to .env"
run = "sops decrypt --age-key-file ~/.ssh/croilar-sops-key.txt .env.enc > .env"

[tasks."sops:edit"]
description = "Edit .env.enc in place"
run = "sops .env.enc"

[tasks."secrets:sync"]
description = "Re-sync the Infisical vault (alias of secrets:init)"
run = "bun run scripts/init-vault.ts"

[tasks."locket:exec"]
description = "Inject secrets via Locket sidecar and run a command"
run = "locket exec -- ${@}"

[tasks."komodo:sync"]
description = "Trigger Komodo to re-sync all stacks from Forgejo"
run = "komodo sync || echo 'komodo CLI not in PATH; trigger via Komodo UI.'"

[tasks."pangolin:check"]
description = "Verify Pangolin tunnel health"
run = "pangolin health-check || echo 'pangolin CLI not in PATH; check via Pangolin UI.'"

# =============================================================================
# Codebase indexing (ccc / cocoindex-code) and OpenSpec
# =============================================================================

[tasks."ccc:init"]
description = "Initialise ccc (cocoindex-code) for this project"
run = "ccc init || true"

[tasks."ccc:index"]
description = "Build the cocoindex-code semantic index (v1 app; legacy ccc kept as fallback until 2026-07-15)"
run = "uv run cocoindex update cianfhoghlaim.core.cocoindex.codebase_indexing:CodebaseIndex"

[tasks."ccc:search"]
description = "[DEPRECATED — use ccc:v1:search] Semantic search via the legacy ccc CLI; emits a deprecation warning to stderr (hard removal: 2026-07-15)"
run = "bun run scripts/_ccc-deprecation-banner.ts && ccc search ${@}"

[tasks."ccc:v1:index"]
description = "Build the codebase_chunks LanceDB index via the v1 CocoIndex App (replacement for the legacy ccc CLI)"
run = "uv run cocoindex update cianfhoghlaim.core.cocoindex.codebase_indexing:CodebaseIndex"

[tasks."ccc:v1:search"]
description = "Semantic search the codebase_chunks LanceDB table via the v1 app (Python helper)"
run = "uv run python -c 'import asyncio, sys; from cianfhoghlaim.core.cocoindex.codebase_indexing import search_codebase; rows = asyncio.run(search_codebase(sys.argv[1])); [print(f\"{r.get(\\\"score\\\", 0):.3f}\t{r.get(\\\"path\\\")}:{r.get(\\\"chunk_start\\\")}-{r.get(\\\"chunk_end\\\")}\t{(r.get(\\\"chunk_text\\\") or \\\"\\\").splitlines()[0][:120]}\") for r in rows]' \"${1:-}\""

[tasks."validate-ccc-freshness"]
description = "CI gate: exit 1 if CCC (CocoIndex Code) index is >7d old on main or >24h on feature branches"
run = "bun run scripts/validate-ccc-freshness.ts"

[tasks."hooks:install"]
description = "Idempotent installer for project git hooks (copies scripts/templates/* into .git/hooks/)"
run = "bash scripts/install-hooks.sh"

[tasks."docs:consolidate"]
description = "Run the docs_skills_consolidation CocoIndex v1 App (batch / catch-up mode)"
run = "uv run cocoindex update cianfhoghlaim.core.cocoindex.docs_skills_consolidation:DocsSkillsConsolidation"

[tasks."docs:consolidate:live"]
description = "Run the docs_skills_consolidation CocoIndex v1 App in live mode (-L)"
run = "uv run cocoindex update -L cianfhoghlaim.core.cocoindex.docs_skills_consolidation:DocsSkillsConsolidation"

# ---------------------------------------------------------------------------
# Upstream package monitoring (Firecrawl monitors for motherduck / dlthub /
# lancedb / cocoindex blogs → DLT incremental source → 3 v1 CocoIndex Apps +
# 4-rule conformance linter). See
# openspec/changes/upstream-package-monitoring/proposal.md.
# ---------------------------------------------------------------------------

[tasks."upstream:blog"]
description = "Run the upstream_blog_monitor v1 CocoIndex App (reprocess all n8n-written Firecrawl payloads)"
run = "uv run cocoindex update cianfhoghlaim.core.cocoindex.upstream_blog_monitor:UpstreamBlogMonitor"

[tasks."upstream:blog:live"]
description = "Run the upstream_blog_monitor v1 CocoIndex App in live mode (-L) — picks up new payloads as they arrive in S3"
run = "uv run cocoindex update -L cianfhoghlaim.core.cocoindex.upstream_blog_monitor:UpstreamBlogMonitor"

[tasks."upstream:conformance"]
description = "Run the cocoindex_v1_conformance App to lint all 14 v1 Apps against the 4-rule conformance contract"
run = "uv run python -c 'import asyncio; from cianfhoghlaim.core.cocoindex.cocoindex_v1_conformance import run_conformance_check; report = asyncio.run(run_conformance_check()); print(report.summary()); import sys; sys.exit(0 if report.all_passed else 1)'"

[tasks."upstream:api-surface"]
description = "Run the upstream_api_surface v1 CocoIndex App (walks 5 cocoindex docs URLs + llms-full.txt)"
run = "uv run cocoindex update cianfhoghlaim.core.cocoindex.upstream_api_surface:UpstreamApiSurface"

[tasks."baml:generate"]
description = "Regenerate the baml_client/ Python module from baml_src/ (required after editing any *.baml file)"
run = "uv run baml-cli generate"

[tasks."docs:cognee"]
description = "Ingest canonical docs/ into the Cognee knowledge graph (requires COGNEE_API_URL + LLM_API_KEY)"
run = "uv run python infrastructure/scripts/cognee-ingest-docs.py --all"

[tasks."docs:cognee:domain"]
description = "Ingest a single canonical domain into the Cognee knowledge graph"
run = "uv run python infrastructure/scripts/cognee-ingest-docs.py --domain ${@}"

[tasks."docs:cognee:summary"]
description = "Print the per-domain Cognee ingestion plan without executing"
run = "uv run python infrastructure/scripts/cognee-ingest-docs.py --all --summary"

[tasks."openspec:list"]
description = "List OpenSpec specs and changes"
run = "openspec list"

[tasks."openspec:validate"]
description = "Validate an OpenSpec change (pass change-id as first arg)"
run = "openspec validate ${1} --strict"

[tasks."openspec:archive"]
description = "Archive a deployed OpenSpec change"
run = "openspec archive ${1} --yes"

# =============================================================================
# Utility Tasks
# =============================================================================

[tasks.doctor]
description = "Check all tool versions"
run = """
echo '=== Tool Versions ==='
echo 'Python:' && python --version
echo 'uv:' && uv --version
echo 'Bun:' && bun --version
echo 'Turbo:' && bunx turbo --version
echo 'Dagger:' && dagger version
echo 'Rust:' && rustc --version
echo 'DuckDB:' && duckdb --version
echo ''
echo '=== Workspace Status ==='
echo 'UV workspace members:' && uv workspace list 2>/dev/null || echo 'n/a'
echo 'Bun workspaces:' && bun pm ls 2>/dev/null | head -20 || echo 'n/a'
"""

[tasks.clean]
description = "Clean build artifacts"
run = """
rm -rf .venv __pycache__ .pytest_cache .ruff_cache
rm -rf node_modules .turbo
find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
find . -type d -name '.pytest_cache' -exec rm -rf {} + 2>/dev/null || true
"""

[tasks.reset]
description = "Full reset - clean and reinstall"
depends = ["clean"]
run = """
uv sync
bun install
"""

[tasks."index:chunkhound"]
description = "Index codebase with ChunkHound"
run = "uvx --from chunkhound chunkhound index --path ."

[tasks."search:chunkhound"]
description = "Search codebase with ChunkHound"
run = "uvx --from chunkhound chunkhound search '${1}'"

# =============================================================================
# Oideachais dev & deploy
# =============================================================================

[tasks."dev:oideachais"]
description = "One-command oideachais dev bring-up (Docker + Vite + Dagster)"
run = "bash infrastructure/scripts/dev.sh"

[tasks."dev:oideachais:web"]
description = "Oideachais Vite dev server only (no Docker)"
run = "bash infrastructure/scripts/dev.sh --web-only"

[tasks."dev:oideachais:docker"]
description = "Oideachais Docker Compose only (no Vite)"
run = "bash infrastructure/scripts/dev.sh --docker-only"

[tasks."dev:oideachais:status"]
description = "Check what's running in the oideachais dev environment"
run = "bash infrastructure/scripts/dev.sh --status"

[tasks."deploy:cf"]
description = "Deploy oideachais + croilar to Cloudflare Pages"
run = "bash infrastructure/scripts/deploy-cf.sh --all"

[tasks."deploy:cf:oideachais"]
description = "Deploy oideachais to Cloudflare Pages"
run = "bash infrastructure/scripts/deploy-cf.sh --oideachais"

[tasks."deploy:cf:croilar"]
description = "Deploy croilar to Cloudflare Pages"
run = "bash infrastructure/scripts/deploy-cf.sh --croilar"

[tasks."deploy:cf:preview"]
description = "Deploy both to Cloudflare Pages preview (staging)"
run = "bash infrastructure/scripts/deploy-cf.sh --all --preview"

# =============================================================================
# Author-Archive v1 — multi-target deployment
# =============================================================================
# Stage 4 of author-archive-v1. The 3 deployment targets (dev / staging
# / prod) are wrapped by the make_target.sh CLI helper. The mise tasks
# forward to that helper with the right env vars pre-set.
#
# Usage:
#   mise run author-archive:dev                     # default; local DuckDB
#   mise run author-archive:dev "python my_pipeline.py"
#   mise run author-archive:staging
#   mise run author-archive:prod

[tasks."author-archive:dev"]
description = "Author-archive v1 pipeline against the local dev target (DuckDB)"
run = "bash cianfhoghlaim/scripts/oideachais/make_target.sh dev ${@}"

[tasks."author-archive:staging"]
description = "Author-archive v1 pipeline against the MotherDuck staging target"
run = "bash cianfhoghlaim/scripts/oideachais/make_target.sh staging ${@}"

[tasks."author-archive:prod"]
description = "Author-archive v1 pipeline against the Garage S3 + Lakekeeper prod target"
run = "bash cianfhoghlaim/scripts/oideachais/make_target.sh prod ${@}"

[tasks."author-archive:cps:hero"]
description = "Run the CPS.gov.uk hero example (4-stage pipeline: pre-research + bulk_scrape + condense + UI identification)"
run = "bash cianfhoghlaim/scripts/oideachais/make_target.sh dev python cianfhoghlaim/scripts/oideachais/pre_research_cps_gov_uk.py"
