[tasks."mcp:smoke:infisical"]
description = "Smoke test: infisical MCP (port 8081 reachable)"
run = "bash scripts/mcp_smoke.sh infisical"


# =============================================================================
# CORE:SYNC NAMESPACE — the 14-layer knowledge sync architecture
# =============================================================================

[tasks."sync:all"]
description = "CORE sync orchestrator — runs all 14 sync layers in topological order"
depends = [
  "sync:paths",
  "sync:ccc",
  "sync:cognee",
  "sync:skills",
  "sync:mcp",
  "sync:dagster",
  "sync:drift-docs",
  "sync:spec-agents",
  "sync:baml",
  "sync:stacks",
  "sync:dlt",
  "sync:agents",
  "sync:notebooks",
  "sync:firecrawl",
]
run = "bash scripts/sync/all.sh"

[tasks."sync:paths"]
description = "Layer 1: detect pre-v7 path drift in source files"
run = "bash scripts/sync/paths.sh"

[tasks."sync:ccc"]
