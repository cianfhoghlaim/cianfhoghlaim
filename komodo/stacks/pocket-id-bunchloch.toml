[[stack]]
name = "pocket-id-bunchloch"
description = "Pocket ID v2.9.0 OIDC identity provider on bunchloch — the 5th cross-cutting prerequisite (Pangolin + Komodo + Infisical + Locket + Pocket ID + Tinyauth + Newt + per-host syncs)"
tags = [
  "host:bunchloch",
  "tier:control-plane",
  "type:oidc-idp",
  "type:auth",
]

[stack.config]
server_id = "bunchloch"
run_directory = "/etc/komodo/pocket-id"
file_paths = [
  "bonneagar/stacks/pocket-id/compose.yaml",
  "bonneagar/stacks/pocket-id/sidecar.yaml",
  "bonneagar/stacks/pocket-id/secrets.env",
  "bonneagar/stacks/pocket-id/pangolin.yaml",
  "bonneagar/stacks/pocket-id/blueprint.yaml",
]

[stack.config.environment]
POCKETID_ENCRYPTION_KEY = "${POCKETID_ENCRYPTION_KEY}"
POCKETID_URL = "https://auth.cianfhoghlaim.ie"
APP_URL = "https://auth.cianfhoghlaim.ie"

# Stack stats: limit CPU + memory to prevent runaway
[stack.stats]
cpu_usage = 0.5    # half a CPU
memory_usage = 256 # 256 MB
