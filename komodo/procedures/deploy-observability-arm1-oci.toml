# =============================================================================
# DEPLOY OBSERVABILITY-ARM1-OCI PROCEDURE
# =============================================================================
# Deploys the foundation observability stack (logfire + dozzle + beszel) to
# arm1-oci. The omnibus deploy-agent-platform-cluster-arm1-oci calls this
# procedure as Stage 1 (the control-plane foundation).
#
# Architecture:
#   arm1-oci — logfire-otel (Python OTel collector)
#              dozzle (Docker log UI)
#              beszel (host monitoring)
#
# Usage:
#   km run procedure deploy-observability-arm1-oci
# =============================================================================

[[procedure.config]]
name = "deploy-observability-arm1-oci"
description = "Deploy foundation observability (logfire + dozzle + beszel) to arm1-oci — preflight → DeployStack observability + logfire + dozzle + beszel → health"

[[procedure.config.stages]]
name = "preflight"

[[procedure.config.stages.executions]]
execution = { type = "RunShellCommand", params = { command = "bun run preflight:arm-oci --strict", timeout_s = 60, description = "4-check preflight gate" } }

[[procedure.config.stages]]
name = "observability-stack"

[[procedure.config.stages.executions]]
execution = { type = "DeployStack", params = { stack = "observability" } }

[[procedure.config.stages.executions]]
execution = { type = "DeployStack", params = { stack = "logfire" } }

[[procedure.config.stages.executions]]
execution = { type = "DeployStack", params = { stack = "dozzle" } }

[[procedure.config.stages.executions]]
execution = { type = "DeployStack", params = { stack = "beszel" } }

[[procedure.config.stages]]
name = "health-checks"

[[procedure.config.stages.executions]]
execution = { type = "HttpCheck", params = { url = "https://logfire.cianfhoghlaim.ie/health", expected_status = 200, timeout_s = 30, name = "logfire-health" } }
