version: "3.8"

services:
  # Marimo notebook server
  marimo:
    build:
      context: ./container
      dockerfile: Dockerfile.marimo
    ports:
      - "8080:8080"
    environment:
      - MARIMO_SKIP_UPDATE_CHECK=1
    networks:
      - dashboard-network

  # Dagster services
  dagster-postgresql:
    image: postgres:15
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  dagster-user-code:
    build:
      context: ./container
      dockerfile: Dockerfile.dagster-user-code
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_CURRENT_IMAGE: dagster-user-code
    networks:
      - dashboard-network

  dagster-webserver:
    build:
      context: ./container
      dockerfile: Dockerfile.dagster
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    ports:
      - "3001:3000"
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
    depends_on:
      dagster-postgresql:
        condition: service_healthy
      dagster-user-code:
        condition: service_started
    networks:
      - dashboard-network

  dagster-daemon:
    build:
      context: ./container
      dockerfile: Dockerfile.dagster
    entrypoint:
      - dagster-daemon
      - run
    restart: on-failure
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
    depends_on:
      dagster-postgresql:
        condition: service_healthy
      dagster-user-code:
        condition: service_started
    networks:
      - dashboard-network

networks:
  dashboard-network:
    driver: bridge
