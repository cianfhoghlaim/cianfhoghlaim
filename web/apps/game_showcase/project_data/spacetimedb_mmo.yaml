# SpacetimeDB MMO Backend
# Real-time multiplayer infrastructure for Celtic MMO

title: "Tuath Celtic MMO Backend"
subtitle: "SpacetimeDB Real-Time Multiplayer Infrastructure"
category: spacetimedb
order: 1

description: |
  Real-time multiplayer backend for the Tuath Celtic MMO, built on SpacetimeDB.
  Handles player state, inventory, clans, quests, NPCs, and zone management with
  sub-millisecond latency. Written entirely in Rust with type-safe reducers and
  real-time subscriptions.

technologies:
  - SpacetimeDB
  - Rust
  - WebSocket
  - TypeScript SDK
  - PostgreSQL (SpacetimeDB storage)

features:
  - 12 database tables with relational integrity
  - 25+ reducers for game state mutations
  - Real-time subscriptions for position sync
  - Built-in identity and authentication
  - Zone-based world partitioning
  - Celtic language NPC dialogue system
  - Vocabulary learning integration

