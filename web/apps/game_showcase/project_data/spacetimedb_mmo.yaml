code_samples:
  - title: "Player Table Definition"
    language: rust
    code: |
      #[spacetimedb::table(public)]
      pub struct Player {
          #[primary_key]
          pub identity: Identity,
          pub username: String,
          pub level: u32,
          pub experience: u64,
          pub clan_id: Option<u64>,
          pub wallet_address: Option<String>,
          pub created_at: Timestamp,
      }

  - title: "Position Reducer"
    language: rust
    code: |
      #[spacetimedb::reducer]
      pub fn update_position(
          ctx: &ReducerContext,
          x: f32, y: f32, z: f32,
          zone: GameZone
      ) -> Result<(), String> {
          let identity = ctx.sender;
          if let Some(mut pos) = EntityPosition::find_by_identity(&identity) {
              pos.x = x;
              pos.y = y;
              pos.z = z;
              pos.zone = zone;
              pos.last_updated = ctx.timestamp;
              EntityPosition::update_by_identity(&identity, pos);
              Ok(())
          } else {
              Err("Player not found".into())
          }
      }

