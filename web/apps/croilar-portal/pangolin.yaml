# Pangolin auto-discovery labels for Aleyum Portal
# Include with: docker compose -f compose.yaml -f pangolin.yaml up -d
#
# Public access - authentication handled by Better Auth + PocketID OIDC internally
# No TinyAuth middleware needed as the app handles its own authentication
services:
  aleyum-portal:
    labels:
      - "pangolin.public-resources.aleyum.name=Aleyum Portal"
      - "pangolin.public-resources.aleyum.full-domain=aleyum.cianfhoghlaim.ie"
      - "pangolin.public-resources.aleyum.protocol=http"
      - "pangolin.public-resources.aleyum.targets[0].method=http"
      - "pangolin.public-resources.aleyum.targets[0].port=3000"
