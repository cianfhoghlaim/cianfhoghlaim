# cianfhoghlaim API Cloudflare Worker config
# Per openspec/changes/cianfhoghlaim-website-rewrite/proposal.md R5
# Wrangler 3.x deploy target for the Hono + oRPC + CopilotKit AG-UI runtime.

name = "cianfhoghlaim-api"
main = "src/index.ts"
compatibility_date = "2026-07-02"
compatibility_flags = ["nodejs_compat"]

# Worker bindings — the production environment
[env.production]
vars = {
  CONVEX_DEPLOYMENT = "prod:conic-leaving-cert",
  COPILOTKIT_RUNTIME_URL = "https://api.cianfhoghlaim.ie/api/copilotkit",
  CIANFHLOGHLAIM_BUILD = "production",
  DASHBOARD_PUBLIC_URL = "https://cianfhoghlaim.ie",
  PORTAL_PUBLIC_URL = "https://cianfhoghlaim.ie",
  # Worker routes
  ROUTER = "https://api.cianfhoghlaim.ie",
}

# Cloudflare R2 bucket bindings
# - R2_BUCKET_5_NCCA_PDFS — the 5 NCCA root-level programme PDFs
# - R2_BUCKET_8_SUBJECT_PDFS — the 8 NCCA subject PDF folders
[[r2_buckets]]
binding = "R2_BUCKET_5_NCCA_PDFS"
bucket_name = "cianfhoghlaim-5-ncca-pdfs"
preview_bucket_name = "cianfhoghlaim-5-ncca-pdfs-preview"

[[r2_buckets]]
binding = "R2_BUCKET_8_SUBJECT_PDFS"
bucket_name = "cianfhoghlaim-8-subject-pdfs"
preview_bucket_name = "cianfhoghlaim-8-subject-pdfs-preview"

# Better-auth v1.4 secrets
[[env.production.vars]]
BETTER_AUTH_SECRET = "${BETTER_AUTH_SECRET}"
POCKET_ID_OIDC_DISCOVERY = "${POCKET_ID_OIDC_DISCOVERY}"

# Routes
[[env.production.routes]]
pattern = "api.cianfhoghlaim.ie/*"
zone_name = "cianfhoghlaim.ie"

# Staging environment
[[env.staging]]
vars = {
  CONVEX_DEPLOYMENT = "staging:conic-leaving-cert",
  COPILOTKIT_RUNTIME_URL = "https://api.staging.cianfhoghlaim.ie/api/copilotkit",
  CIANFHLOGHLAIM_BUILD = "staging",
}

# Custom domain routes
[env.production]
[[env.production.routes]]
pattern = "leaving-cert.cianfhoghlaim.ie/*"
zone_name = "cianfhoghlaim.ie"
custom_domain = true

[[env.staging.routes]]
pattern = "staging-leaving-cert.cianfhoghlaim.ie/*"
zone_name = "cianfhoghlaim.ie"
custom_domain = true