services:
  llama-swap:
    image: ghcr.io/mmoehring/llama-swap:latest
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - MODELS_DIR=/models
    volumes:
      - ./models:/models
    deploy:
      resources:
        limits:
          memory: 32G
          cpus: '8'
