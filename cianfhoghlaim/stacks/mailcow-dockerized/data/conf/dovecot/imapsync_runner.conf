# =============================================================================
# dovecot_imapsync_runner configuration
# =============================================================================
# Each mapping polls an external IMAP account every minute (driven by
# the ofelia job `dovecot_imapsync_runner` in compose.yaml on the
# dovecot-mailcow service) and syncs new mail into a Mailcow mailbox
# inbox-<account>@cianfhoghlaim.ie.
#
# The user / password tokens are resolved at container start by the
# Locket sidecar from infisical://dev-baile/mailcow/imap_credentials/...
# (see secrets.env).
#
# Setup guide for the per-account App Passwords:
#   docs/email-inbox/account_credentials_setup.md
# =============================================================================

# dkit_ie — Microsoft 365
{account = "inbox-dkit_ie@cianfhoghlaim.ie", remote_host = "imap.outlook.com", remote_port = 993, remote_user = "${IMAP_USER_DKIT_IE}", remote_password = "${IMAP_PASS_DKIT_IE}", use_ssl = "yes", max_size = "0",}

# gmail_personal — Gmail
{account = "inbox-gmail_personal@cianfhoghlaim.ie", remote_host = "imap.gmail.com", remote_port = 993, remote_user = "${IMAP_USER_GMAIL_PERSONAL}", remote_password = "${IMAP_PASS_GMAIL_PERSONAL}", use_ssl = "yes", max_size = "0",}

# gmail_academic — Gmail
{account = "inbox-gmail_academic@cianfhoghlaim.ie", remote_host = "imap.gmail.com", remote_port = 993, remote_user = "${IMAP_USER_GMAIL_ACADEMIC}", remote_password = "${IMAP_PASS_GMAIL_ACADEMIC}", use_ssl = "yes", max_size = "0",}

# hotmail_legacy — Hotmail/Outlook
{account = "inbox-hotmail_legacy@cianfhoghlaim.ie", remote_host = "outlook.office365.com", remote_port = 993, remote_user = "${IMAP_USER_HOTMAIL_LEGACY}", remote_password = "${IMAP_PASS_HOTMAIL_LEGACY}", use_ssl = "yes", max_size = "0",}
