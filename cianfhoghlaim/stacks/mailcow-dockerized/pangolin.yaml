# =============================================================================
# Mailcow-dockerized — Pangolin private-resource routes (v4 6-label form)
# =============================================================================
# v4 consolidation move: this file lives at
#   cianfhoghlaim/stacks/mailcow-dockerized/pangolin.yaml
# (moved from bonneagar/stacks/mailcow-dockerized/ on 2026-06-29
#  per the leabharlann-email-inbox-pipeline change).
#
# Routes:
#   mail.cianfhoghlaim.ie   → port 443  (webmail/IMAPS) — TinyAuth + Member
#   imap.cianfhoghlaim.ie  → port 993  (internal)      — TinyAuth + SDP-MFA
#   smtp.cianfhoghlaim.ie  → port 587  (internal)      — TinyAuth + SDP-MFA
#
# The two internal-only routes (imap, smtp) are bound to 127.0.0.1 only —
# the IMAP/SMTP clients are the Mailcow-side dovecot_imapsync_runner +
# the mailcow-export companion, both of which connect from inside the
# mailcow-network bridge. No external relay. (v1 is receive-only.)
# =============================================================================

pangolin:
  private-resources:
    mailcow-webmail:
      name: mailcow-webmail
      mode: http
      full-domain: mail.cianfhoghlaim.ie
      destination-port: 443
      protocol: http
      roles[0]: tinyauth@file

    mailcow-imap:
      name: mailcow-imap
      mode: tcp
      full-domain: imap.cianfhoghlaim.ie
      destination-port: 993
      protocol: tcp
      roles[0]: tinyauth@file
      roles[1]: sdp-mfa@file

    mailcow-smtp:
      name: mailcow-smtp
      mode: tcp
      full-domain: smtp.cianfhoghlaim.ie
      destination-port: 587
      protocol: tcp
      roles[0]: tinyauth@file
      roles[1]: sdp-mfa@file
