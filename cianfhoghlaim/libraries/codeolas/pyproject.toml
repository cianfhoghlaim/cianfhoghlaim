[project]
name = "codeolas"
version = "0.1.0"
description = "Códeolas — code intelligence library (publishable sub-package of cianfhoghlaim). Semantic chunking, embedding, graph analysis."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BUSL-1.1" }
authors = [
    { name = "Cianfhoghlaim Team" },
]
keywords = [
    "code-intelligence",
    "semantic-chunking",
    "tree-sitter",
    "embedding",
    "graph-analysis",
    "irish",
]

dependencies = [
    "lancedb>=0.10.0",
    "pyarrow>=18.0.0",
    "tree-sitter>=0.21.0",
    # NOTE: tree-sitter-languages has no cp313 wheels (latest 1.10.2 supports
    # up to cp312). Tree-sitter per-language grammars are lazy-loaded from
    # chunking/parser.py; do not pin tree-sitter-languages here.
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.scripts]
codeolas = "codeolas.cli:main"
codeolas-chunk = "codeolas.chunking.cli:main"
codeolas-graph = "codeolas.graph.cli:main"
codeolas-search = "codeolas.search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "chunking", "search", "graph", "generators", "mcp_server", "storage"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["demo", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"