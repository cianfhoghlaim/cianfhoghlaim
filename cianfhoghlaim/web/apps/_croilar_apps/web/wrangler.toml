# Cloudflare Pages Configuration for Aleyum Portfolio
name = "aleyum"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# R2 bucket bindings for audio/image assets
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "aleyum-assets"

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "aleyum-data"

# Environment variables
[vars]
SITE_URL = "https://aleyum.pages.dev"

# Development environment
[env.preview]
vars = { SITE_URL = "https://preview.aleyum.pages.dev" }

# Production environment
[env.production]
vars = { SITE_URL = "https://aleyum.com" }
