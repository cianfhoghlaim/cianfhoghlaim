# Babylon.js Web Client
# Browser-based Celtic MMO client with WebGPU

title: "Celtic MMO Web Client"
subtitle: "Babylon.js 7 WebGPU Browser Game"
category: babylon
order: 5

description: |
  Browser-based game client for the Tuath Celtic MMO, built with Babylon.js 7
  and WebGPU. Features automatic fallback to WebGL2, lazy asset loading,
  zone-based world streaming, and full SpacetimeDB integration. Runs on any
  modern browser without installation.

technologies:
  - Babylon.js 7
  - WebGPU / WebGL2
  - TypeScript
  - SpacetimeDB TypeScript SDK
  - TanStack Router
  - Vite

features:
  - WebGPU rendering with WebGL2 fallback
  - Zone-based lazy asset loading
  - Real-time multiplayer via SpacetimeDB
  - Celtic shader effects (WGSL)
  - Mobile-responsive touch controls
  - PWA offline support

