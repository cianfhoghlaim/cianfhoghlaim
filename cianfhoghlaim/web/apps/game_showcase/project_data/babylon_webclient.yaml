code_samples:
  - title: "WebGPU Scene Setup"
    language: typescript
    code: |
      import { Engine, Scene, WebGPUEngine } from "@babylonjs/core";

      async function createScene(canvas: HTMLCanvasElement) {
        // Try WebGPU, fall back to WebGL2
        let engine: Engine;
        if (await WebGPUEngine.IsSupportedAsync) {
          engine = new WebGPUEngine(canvas);
          await engine.initAsync();
        } else {
          engine = new Engine(canvas, true);
        }

        const scene = new Scene(engine);

        // Load Celtic zone
        await loadZone(scene, "connemara");

        // Connect to SpacetimeDB
        const client = await SpacetimeDBClient.connect();
        client.subscribe("Player", "EntityPosition", "ZonePresence");

        return { engine, scene, client };
      }

  - title: "Zone Streaming"
    language: typescript
    code: |
      interface ZoneAssets {
        terrain: Mesh;
        props: Mesh[];
        npcs: TransformNode[];
      }

      async function loadZone(
        scene: Scene,
        zoneId: string
      ): Promise<ZoneAssets> {
        const manifest = await fetch(`/zones/${zoneId}/manifest.json`);
        const { terrain, props, npcs } = await manifest.json();

        // Lazy load assets
        const assets = await Promise.all([
          SceneLoader.ImportMeshAsync("", `/zones/${zoneId}/`, terrain),
          ...props.map(p => SceneLoader.ImportMeshAsync("", `/zones/${zoneId}/`, p)),
        ]);

        return { terrain: assets[0], props: assets.slice(1), npcs: [] };
      }

