<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cianfhoghlaim OS — Aes Sedai — servants of all</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Dev-only: ensure the Vite React Refresh preamble is installed
      // (the index.html is served from /public, not the project root,
      //  so Vite's automatic preamble injection does not apply).
      if (import.meta.env && import.meta.env.DEV) {
        const { default: RefreshRuntime } = await import('/@react-refresh');
        RefreshRuntime.injectIntoGlobalHook(window);
        window.$RefreshReg$ = window.$RefreshReg$ || (() => {});
        window.$RefreshSig$ = window.$RefreshSig$ || (() => (type) => type);
        window.__vite_plugin_react_preamble_installed__ = true;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
