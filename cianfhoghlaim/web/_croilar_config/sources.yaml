# Croílár Stream Registry
#
# Each top-level `streams:` entry is a domain-driven Stream. The `id` is the
# data-layer key; the `owner` is the historical persona alias preserved for
# UI branding continuity. The two are intentionally decoupled.
#
# Adding a new source type to a stream requires:
#   1. A new entry in `croilar/_shared/streams.py::StreamSourceType`
#   2. A `pipelines/<type>/` module
#   3. (If structured extraction is needed) a BAML schema
#   4. (If the source is a new kind of asset) wiring in `dagster_assets/dlt_assets.py`
#
# `local_only: true` on a source means: no R2 uploads, write only to
# `./data/local/`. Use it for sensitive corpora (CV PDFs, identity documents).

streams:
  music:
    id: music
    owner: aleyum
    owner_display_name: "Aleyum"
    r2_prefix: music/
    duckdb_dataset: music_data
    agent_port: 7774
    sources:
      - type: spotify
        config:
          artist_id: "2vLlk2CcC4NnN7yoNSTmX2"
          artist_name: "Aleyum"
          market: "IE"
        resources:
          - artist
          - albums
          - top_tracks
          - audio_features
      - type: soundcloud
        config:
          username: "aleyummusic"
          profile_url: "https://soundcloud.com/aleyummusic"
        resources:
          - tracks
          - playlists
          - reposts
          - followers
          - comments
      - type: labels
        config:
          artist_slug: "aleyum"
        labels:
          - name: "Lemongrass Music"
            url: "https://lemongrassmusic.de/artists/Aleyum/"
            country: "Germany"
          - name: "Monstercat"
            url: "https://www.monstercat.com/artist/aleyum"
            country: "Canada"
          - name: "Fokuz Recordings"
            url: "https://fokuzrecordings.com"
            genre: "Drum & Bass"
          - name: "Immersed Records"
            url: "https://immersedrec.com"
            genre: "Electronic"
          - name: "Offworld Recordings"
            url: "https://offworldrecordings.com"
            genre: "Drum & Bass"
          - name: "Soul Deep Recordings"
            url: "https://souldeeprecordings.com"
            genre: "Liquid Funk"
      - type: artwork
        config: {}

  teaching:
    id: teaching
    owner: cianfhoghlaim
    owner_display_name: "Cian Mac an Déisigh Uí Liatháin"
    r2_prefix: teaching/
    duckdb_dataset: teaching_data
    agent_port: 7775
    sources:
      - type: github
        config:
          username: "cianfhoghlaim"
          repositories_url: "https://github.com/cianfhoghlaim?tab=repositories"
        resources:
          - repositories
          - commits
          - languages
          - readme
      - type: linkedin
        config:
          # Cian Mac an Déisigh Uí Liatháin — consolidated author profile.
          # Replace with the canonical LinkedIn URL when known.
          profile_url: "https://www.linkedin.com/in/cianfhoghlaim/"
      - type: researchgate
        config:
          # Cian Mac an Déisigh Uí Liatháin — ResearchGate profile.
          # Replace with the canonical ResearchGate URL when known.
          profile_url: "https://www.researchgate.net/profile/Cian_Mac_An_Deisigh"

  cv:
    id: cv
    owner: cianfhoghlaim
    owner_display_name: "Cian Mac an Déisigh Uí Liatháin"
    r2_prefix: cv/
    duckdb_dataset: cv_data
    agent_port: 7776
    sources:
      - type: cv
        config: {}
      # Local-only filesystem ingest of the author's personal documents.
      # Excludes the `zotero/` subdirectory (deferred to a future
      # `zotero_sql` source). `local_only: true` gates R2 uploads.
      - type: filesystem
        local_only: true
        config:
          path_env: "CROILAR_AUTHOR_ROOT"
          path_default: "author_cian_deacy_lyons_mac_an_déisigh_uí_liatháin"
          exclude:
            - "zotero/"
          subresources:
            - achievement
            - catharnacht
            - deacy
            - disability
            - gemini_deep_research
            - identity
            - politics
            - teaching
            - university_of_galway
            - vetting

  research:
    id: research
    owner: cianfhoghlaim
    owner_display_name: "Cian Mac an Déisigh Uí Liatháin"
    r2_prefix: research/
    duckdb_dataset: research_data
    agent_port: 7777
    sources: []
    # The research stream is reserved for future DLT sources (e.g. arXiv,
    # OpenAlex, Zenodo). It exists as a placeholder so the registry and
    # i18n bundle can render the route before the data pipeline lands.
