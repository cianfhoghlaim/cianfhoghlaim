# llama-swap configuration for the 24-entry VISION_MODELS registry
# (post-2026-06-29 audit, per the openspec change
# 2026-06-29-fix-ocr-vlm-registry-with-unsloth-priority).
#
# This file is consumed by the llama-swap service at
# infrastructure/stacks/llama-swap/config.yaml and configures 24 model
# profiles, each pointing at the optimal Unsloth GGUF (or mlx-community
# variant). llama-swap auto-detects the model from the request URL and
# swaps the right GGUF into VRAM.
#
# Per the v4 spec, the registry is Unsloth-only (no OpenAI / Anthropic /
# cloud-API models). The 24 profiles below cover all VISION_MODELS.

# Global settings
healthCheckTimeout: 30
logLevel: info

# Model profiles — one per VISION_MODELS entry that has an Unsloth GGUF
# or mlx-community variant. Models without a local inference path
# (e.g. UCCIX-Mistral-24B, Molmo2-8B) are NOT in llama-swap; they are
# served via the transformers backend.

models:
  # ─── Gemma 4 (5 sizes) ───
  - name: "gemma-4-E2B"
    src: "unsloth/gemma-4-E2B-it-GGUF"
    mmproj: "unsloth/gemma-4-E2B-it-GGUF/mmproj-F16.gguf"  # multimodal projector
    cacheDir: "/models/unsloth/gemma-4-E2B-it-GGUF"
    quantization: "q4_k_m"
    role: "tier3_light"
    vram_gb: 3
    contextSize: 32768
  - name: "gemma-4-E4B"
    src: "unsloth/gemma-4-E4B-it-GGUF"
    mmproj: "unsloth/gemma-4-E4B-it-GGUF/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/gemma-4-E4B-it-GGUF"
    quantization: "q4_k_m"
    role: "tier3_light"
    vram_gb: 5
    contextSize: 32768
  - name: "gemma-4-12B"
    src: "unsloth/gemma-4-12b-it-GGUF"
    mmproj: "unsloth/gemma-4-12b-it-GGUF/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/gemma-4-12b-it-GGUF"
    quantization: "q4_k_m"
    role: "tier2_medium"
    vram_gb: 7
    contextSize: 262144
  - name: "gemma-4-26B-A4B"
    src: "unsloth/gemma-4-26B-A4B-it-GGUF"
    mmproj: "unsloth/gemma-4-26B-A4B-it-GGUF/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/gemma-4-26B-A4B-it-GGUF"
    quantization: "q4_k_m"
    role: "tier2_medium"  # M4 Max default
    vram_gb: 14
    contextSize: 262144
  - name: "gemma-4-31B"
    src: "unsloth/gemma-4-31B-it-GGUF"
    mmproj: "unsloth/gemma-4-31B-it-GGUF/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/gemma-4-31B-it-GGUF"
    quantization: "q4_k_m"
    role: "tier1_heavy"
    vram_gb: 19
    contextSize: 262144

  # ─── GLM-4.6V (2 sizes) ───
  - name: "glm-4.6v-flash"
    src: "unsloth/GLM-4.6V-Flash-GGUF"
    mmproj: "unsloth/GLM-4.6V-Flash-GGUF/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/GLM-4.6V-Flash-GGUF"
    quantization: "q4_k_m"
    role: "tier2_medium"
    vram_gb: 6
    contextSize: 128000
  # glm-4.6v-full is 107B MoE — only on arm1-oci, not in this llama-swap config.

  # ─── Qwen 3-VL (4 sizes) ───
  - name: "qwen3-vl-4b"
    src: "unsloth/Qwen3-VL-4B-Instruct-GGUF"
    mmproj: "unsloth/Qwen3-VL-4B-Instruct-GGUF/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/Qwen3-VL-4B-Instruct-GGUF"
    quantization: "q4_k_m"
    role: "tier3_light"
    vram_gb: 3
    contextSize: 256000
  - name: "qwen3-vl-8b"
    src: "unsloth/Qwen3-VL-8B-Instruct-GGUF"
    mmproj: "unsloth/Qwen3-VL-8B-Instruct-GGUF/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/Qwen3-VL-8B-Instruct-GGUF"
    quantization: "q4_k_m"
    role: "tier2_medium"  # Workhorse for PDF processing
    vram_gb: 5
    contextSize: 256000
  - name: "qwen3-vl-30b-a3b"
    src: "unsloth/Qwen3-VL-30B-A3B-Instruct-GGUF"
    mmproj: "unsloth/Qwen3-VL-30B-A3B-Instruct-GGUF/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/Qwen3-VL-30B-A3B-Instruct-GGUF"
    quantization: "q4_k_m"
    role: "tier1_heavy"
    vram_gb: 18
    contextSize: 256000
  # qwen3-vl-235b-a22b is 235B MoE — only on arm1-oci, not in this config.

  # ─── Qwen 3.6 (2 sizes with MTP speculative decoding) ───
  - name: "qwen3.6-27b-mtp"
    src: "unsloth/Qwen3.6-27B-MTP-GGUF"
    cacheDir: "/models/unsloth/Qwen3.6-27B-MTP-GGUF"
    quantization: "q4_k_m"
    role: "tier1_heavy"
    vram_gb: 16
    contextSize: 32768
    mtp: true  # Multi-Token Prediction speculative decoding
  - name: "qwen3.6-35b-a3b-mtp"
    src: "unsloth/Qwen3.6-35B-A3B-MTP-GGUF"
    cacheDir: "/models/unsloth/Qwen3.6-35B-A3B-MTP-GGUF"
    quantization: "q4_k_m"
    role: "tier1_heavy"
    vram_gb: 22
    contextSize: 32768
    mtp: true

  # ─── InternVL3_5-8B (document understanding) ───
  - name: "internvl3-8b"
    src: "unsloth/InternVL3-8B-GGUF"
    mmproj: "unsloth/InternVL3-8B-GGUF/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/InternVL3-8B-GGUF"
    quantization: "q4_k_m"
    role: "tier2_medium"
    vram_gb: 5
    contextSize: 32768

  # ─── Llama 3.2 Vision 11B (legacy, Dynamic 2.0 GGUF) ───
  - name: "llama-3.2-vision-11b"
    src: "unsloth/Llama-3.2-11B-Vision-Instruct-unsloth-bnb-4bit"
    mmproj: "unsloth/Llama-3.2-11B-Vision-Instruct-unsloth-bnb-4bit/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/Llama-3.2-11B-Vision-Instruct-unsloth-bnb-4bit"
    quantization: "bnb-4bit"
    role: "legacy"
    vram_gb: 7
    contextSize: 32768
    dynamic_2_0: true  # Unsloth Dynamic 2.0 GGUF

  # ─── Gemma 3 4B (legacy Celtic languages) ───
  - name: "gemma-3-4b"
    src: "unsloth/gemma-3-4b-it-GGUF"
    mmproj: "unsloth/gemma-3-4b-it-GGUF/mmproj-F16.gguf"
    cacheDir: "/models/unsloth/gemma-3-4b-it-GGUF"
    quantization: "q4_k_m"
    role: "legacy"
    vram_gb: 4
    contextSize: 32768

  # ─── PaddleOCR-VL 1.6 (multilingual OCR specialist, first-party GGUF) ───
  - name: "paddleocr-vl-1.6"
    src: "PaddlePaddle/PaddleOCR-VL-1.6-GGUF"
    cacheDir: "/models/PaddlePaddle/PaddleOCR-VL-1.6-GGUF"
    quantization: "q4_k_m"
    role: "specialist"
    vram_gb: 2
    contextSize: 8192
