# defs/2_materials/academic_history_validation/defs.yaml
#
# L2 CelticMaterialsComponent for the deterministic validation
# findings on the UoG math/statistics artefacts. Calls the
# `validate_*` helpers from
# `cianfhoghlaim/baml/education/university/math_validation.py`.
#
# Per openspec/changes/2026-07-11-uog-math-statistics-academic-history-v1/
type: cianfhoghlaim.orchestration.components.CelticMaterialsComponent
attributes:
  baml_function: cianfhoghlaim.baml.education.university.math_validation.validate_formula_record
  source_asset: 2_materials/baml_extraction/uog_math_coursework
  partition_strategy: by_subject
  asset_check_kind: validation_findings
  subject: academic_history_validation
  language: en
  automation_cron: "0 7 * * *"
  validators:
    - validate_formula_record
    - validate_statistical_procedure_record
    - validate_numerical_method_record
    - validate_worked_solution
    - validate_student_answer_script
  output_table: oideachais_academic_history.validation_findings