# defs/1_ingestion/marking/computer_science.yaml
#
# L1 ingestion for the BIEP v1 Computer Science marking-scheme
# filesystem (per-subject extension of the canonical examinations
# crawling path).
#
# Source: filesystem.marking.computer_science
# Per-subject partitions: (year, paper)
# Cron: weekly (marking schemes update rarely)
#
# Per the openspec change
# 2026-07-16-biiep-v1-lc-per-subject-marking-grading-v1.
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_id: filesystem.marking.computer_science
  domain: marking
  nation: ie
  subject: computer_science
  subject_label: Computer Science (LC Marking Scheme)
  automation: on_cron
  automation_cron: "0 4 * * 0"  # weekly Sunday 04:00 UTC
  state_backed: true
  state_refresh_interval: monthly
  asset_check: marking_computer_science_partition_count_min
  asset_check_min_rows: 1
  tags:
    - biep
    - lc6
    - computer_science
    - marking
  metadata:
    openspec_change: 2026-07-16-biiep-v1-lc-per-subject-marking-grading-v1
    spec: british-isles-education-pipeline
    lc_code: LC201
    baml_functions:
      - b.ExtractMarkingSchemeGuideline
      - b.ExtractComputerScienceMarkingScheme
    partitions:
      - year: 2020..2026
      - paper: ["paper-1", "paper-2"]
      - level: ["hl", "ol"]
      - language: ["en"]
