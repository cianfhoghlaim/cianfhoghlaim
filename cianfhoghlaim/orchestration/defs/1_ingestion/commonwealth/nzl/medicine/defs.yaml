# defs/1_ingestion/commonwealth/nzl/medicine/defs.yaml
#
# L1 ingestion for the New Zealand medicine DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/commonwealth/nzl/medicine/medsafe.py`` with
# ``source_id="commonwealth.nzl.medicine.medsafe"`` and lands in
# the DuckLake table ``oideachais.medicine.commonwealth.nzl``.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_name: commonwealth_nzl_medicine
  module: cianfhoghlaim.dlt.commonwealth.nzl.medicine.medsafe
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["commonwealth"]
    - country:
        values: ["nzl"]
    - language:
        values: ["en"]
  use_local_scrapes: true
  asset_check: commonwealth_nzl_medicine_partition_min
  asset_check_min_rows: 1
  tags:
    - commonwealth
    - nzl
    - medicine
    - ingestion
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
