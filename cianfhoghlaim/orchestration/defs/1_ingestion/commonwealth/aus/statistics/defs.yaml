# defs/1_ingestion/commonwealth/aus/statistics/defs.yaml
#
# L1 ingestion for the Australia statistics DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/commonwealth/aus/statistics/abs.py`` with
# ``source_id="commonwealth.aus.statistics.abs"`` and lands in
# the DuckLake table ``oideachais.statistics.commonwealth.aus``.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_name: commonwealth_aus_statistics
  module: cianfhoghlaim.dlt.commonwealth.aus.statistics.abs
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["commonwealth"]
    - country:
        values: ["aus"]
    - language:
        values: ["en"]
  use_local_scrapes: true
  asset_check: commonwealth_aus_statistics_partition_min
  asset_check_min_rows: 1
  tags:
    - commonwealth
    - aus
    - statistics
    - ingestion
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
