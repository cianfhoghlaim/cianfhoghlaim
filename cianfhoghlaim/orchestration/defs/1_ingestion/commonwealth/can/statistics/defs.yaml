# defs/1_ingestion/commonwealth/can/statistics/defs.yaml
#
# L1 ingestion for the Canada statistics DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/commonwealth/can/statistics/statcan.py`` with
# ``source_id="commonwealth.can.statistics.statcan"`` and lands in
# the DuckLake table ``oideachais.statistics.commonwealth.can``.
#
# Reference: openspec/changes/2026-07-11-commonwealth-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_name: commonwealth_can_statistics
  module: cianfhoghlaim.dlt.commonwealth.can.statistics.statcan
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["commonwealth"]
    - country:
        values: ["can"]
    - language:
        values: ["en", "fr"]
  use_local_scrapes: true
  asset_check: commonwealth_can_statistics_partition_min
  asset_check_min_rows: 1
  tags:
    - commonwealth
    - can
    - statistics
    - ingestion
  metadata:
    openspec_change: 2026-07-11-commonwealth-pipeline-v1
    spec: commonwealth-pipeline
