# defs/1_ingestion/european_nations/ukr/statistics/defs.yaml
#
# L1 ingestion for the Ukraine statistics DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/european_nations/ukr/statistics/ukrstat.py`` with
# ``source_id="european_nations.ukr.statistics.ukrstat"`` and lands in
# the DuckLake table ``oideachais.statistics.european_nations.ukr``.
#
# Reference: openspec/changes/2026-07-11-european-nations-ukraine-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_name: european_nations_ukr_statistics
  module: cianfhoghlaim.dlt.european_nations.ukr.statistics.ukrstat
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["european_nations"]
    - country:
        values: ["ukr"]
    - language:
        values: ["uk"]
  use_local_scrapes: true
  asset_check: european_nations_ukr_statistics_partition_min
  asset_check_min_rows: 1
  tags:
    - european_nations
    - ukr
    - statistics
    - ingestion
  metadata:
    openspec_change: 2026-07-11-european-nations-ukraine-pipeline-v1
    spec: european-nations-ukraine-pipeline
