# defs/1_ingestion/americas/us/us_ca/statistics/defs.yaml
#
# L1 ingestion for the California statistics DLT source.
#
# Per the canonical cross-region path contract this source lives at
# ``dlt/americas/us/us_ca/statistics/data_ca_gov.py`` with
# ``source_id="americas.California.statistics.data_ca_gov"`` and lands in the
# DuckLake table ``oideachais.statistics.americas.California``.
#
# Reference: openspec/changes/2026-07-11-americas-california-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticIngestionComponent
attributes:
  source_name: americas_us_us_ca_statistics
  module: cianfhoghlaim.dlt.americas.us/us_ca.statistics.data_ca_gov
  schedule:
    cron: "0 4 * * *"
    timezone: UTC
  partitions:
    - region:
        values: ["americas"]
    - jurisdiction:
        values: ["California"]
    - language:
        values: ["en"]
  use_local_scrapes: true
  asset_check: americas_us_us_ca_statistics_partition_min
  asset_check_min_rows: 1
  tags:
    - americas
    - California
    - statistics
    - ingestion
  metadata:
    openspec_change: 2026-07-11-americas-california-pipeline-v1
    spec: americas-california-pipeline
