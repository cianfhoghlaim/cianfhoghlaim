# defs/5_agent_ops/adk/translation_agent/defs.yaml
#
# L5 CelticAgentOpsComponent for the translation_agent (adk) agent.
# The Component emits 5 Dagster assets:
# - agent_health_translation_agent
# - agent_routing_translation_agent
# - agent_memory_translation_agent
# - agent_event_translation_agent
# - agent_trace_translation_agent
type: cianfhoghlaim.orchestration.components.CelticAgentOpsComponent
attributes:
  agent_name: translation_agent
  framework: adk
  tools: ['translate_text_tool', 'detect_language_tool']
  memory_backend: letta
  event_stream: risingwave
  event_stream_endpoint: risingwave.cianfhoghlaim.ie:4566
  langfuse_trace_tag: agent.translation
  langfuse_drop_smoke_spans: true
  routing_keywords: ['translate', 'gaeilge', 'irish', 'scottish gaelic', 'welsh', 'cymraeg', 'brezhoneg', 'cornish', 'manx']
