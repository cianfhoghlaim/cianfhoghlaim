# defs/3_model_lifecycle/cocoindex_v1/isle_of_man_education/defs.yaml
#
# L3 CocoIndex v1 App for the Isle of Man Government education pipeline.
# Embeds every Isle of Man Government per-subject education row into
# the shared `oideachais.lc.isle_of_man.education_chunks` LanceDB table.
#
# Reference: openspec/changes/2026-07-12-british-isles-parity-pipeline-v1/
type: cianfhoghlaim.orchestration.components.CelticModelLifecycleComponent
attributes:
  app_group: isle_of_man_education
  embedding_model: BAAI/bge-m3
  hnsw_index: true
  conformance_required: true
  apps:
    - app_name: IsleofManGovernmentEducationEmbedding
      module: cianfhoghlaim.cocoindex.biep_parity.isle_of_man_education_embedding
      source: british_isles
      lance_table: oideachais.lc.isle_of_man.education_chunks
  schedule:
    cron: "0 5 * * *"
    timezone: UTC
  tags:
    - biep
    - parity
    - isle_of_man
    - cocoindex-v1
    - embedding
  metadata:
    openspec_change: 2026-07-12-british-isles-parity-pipeline-v1
    spec: british-isles-education-pipeline
