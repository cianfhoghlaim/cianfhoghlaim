# defs/1_ingestion/curriculum/lc5/defs.yaml
#
# L1 CelticIngestionComponent for the LC5 (Leaving Certificate 5-subject)
# filesystem source. Discovers 41 PDFs + 2 JPGs across chemistry /
# computer_science / gaeilge / geography / mathematics, classifies each
# by language + kind (exam paper / syllabus / marking scheme), and
# routes them through `select_ocr_backend()` for downstream VLM/OCR.
#
# Per openspec/changes/2026-07-03-leaving-cert-5-subject-pipeline-with-diagrams/
type: cianfhoghlaim.dagster.components.CelticIngestionComponent
attributes:
  source_id: cianfhoghlaim.filesystem.leaving_cert
  domain: curriculum
  nation: ie
  automation: on_cron
  automation_cron: "0 5 * * *"
  state_backed: true
  state_refresh_interval: monthly
