# defs/5_agent_ops/adk/statistics_agent/defs.yaml
#
# L5 CelticAgentOpsComponent for the statistics_agent (adk) agent.
# The Component emits 5 Dagster assets:
# - agent_health_statistics_agent
# - agent_routing_statistics_agent
# - agent_memory_statistics_agent
# - agent_event_statistics_agent
# - agent_trace_statistics_agent
type: cianfhoghlaim.dagster.components.CelticAgentOpsComponent
attributes:
  agent_name: statistics_agent
  framework: adk
  tools: ['education_metric_tool', 'benchmark_tool', 'kpi_query_tool']
  memory_backend: letta
  event_stream: risingwave
  event_stream_endpoint: risingwave.cianfhoghlaim.ie:4566
  langfuse_trace_tag: agent.statistics
  langfuse_drop_smoke_spans: true
  routing_keywords: ['statistics', 'metric', 'benchmark', 'performance', 'kpi']
