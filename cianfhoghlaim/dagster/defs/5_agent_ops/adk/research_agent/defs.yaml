# defs/5_agent_ops/adk/research_agent/defs.yaml
#
# L5 CelticAgentOpsComponent for the research_agent (adk) agent.
# The Component emits 5 Dagster assets:
# - agent_health_research_agent
# - agent_routing_research_agent
# - agent_memory_research_agent
# - agent_event_research_agent
# - agent_trace_research_agent
type: cianfhoghlaim.dagster.components.CelticAgentOpsComponent
attributes:
  agent_name: research_agent
  framework: adk
  tools: ['search_arxiv_tool', 'search_doi_tool', 'cite_paper_tool']
  memory_backend: letta
  event_stream: risingwave
  event_stream_endpoint: risingwave.cianfhoghlaim.ie:4566
  langfuse_trace_tag: agent.research
  langfuse_drop_smoke_spans: true
  routing_keywords: ['research', 'paper', 'cite', 'doi', 'arxiv']
