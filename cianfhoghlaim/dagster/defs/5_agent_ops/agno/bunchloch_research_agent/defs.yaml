# - agent_memory_bunchloch_research_agent
# - agent_event_bunchloch_research_agent
# - agent_trace_bunchloch_research_agent
type: cianfhoghlaim.dagster.components.CelticAgentOpsComponent
attributes:
  agent_name: bunchloch_research_agent
  framework: agno
  tools: ['local_model_query_tool', 'federated_search_tool']
