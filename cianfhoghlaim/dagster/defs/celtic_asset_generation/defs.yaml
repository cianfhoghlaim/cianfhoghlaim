# celtic_asset_generation — the per-domain Dagster Component defs.
#
# Implements Domain 1 of the per-domain Dagster Component migration
# (see docs/audit/dagster-component-migration-plan.md).
# Uses the upstream `DltLoadCollectionComponent` to wrap the 24
# Celtic-nation education DLT sources defined in `loads.py`.
#
# Plus 2 of the 3 KCG-specific Components (the cocoindex_v1
# HNSW build is wired here; the CocoIndex v1 App update is
# wired in `defs/leabharlann_cocoindex/defs.yaml` because the
# CocoIndex App itself lives in the leabharlann embeddings
# module, not the celtic corpus).
#
# Per openspec/specs/celtic-asset-generation/spec.md (5-stage pipeline).
---
type: dagster_dlt.DltLoadCollectionComponent
attributes:
  loads:
    - source: .loads.celtic_education_source
      pipeline: .loads.celtic_asset_generation_pipeline
      translation:
        group_name: celtic_asset_generation
        metadata:
          domain: celtic_asset_generation
          stage: "1_baml_extraction"
          pipeline_version: "v4_2026-06-29"
