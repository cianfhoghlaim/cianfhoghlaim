[project]
name = "tuath"
version = "0.1.0"
description = "Celtic Educational MMO + Crypto Platform - Language learning, mythology, Babylon.js game engine, x402 micropayments"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BUSL-1.1" }

dependencies = [
    # Data Loading
    "dlt[duckdb,parquet,lancedb,ducklake]>=1.0.0",
    "dlthub>=0.18.0",
    "firecrawl-py>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",

    # Orchestration
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "dagster-dlt>=0.26.0",
    "dagster-embedded-elt>=0.22.0",

    # Embeddings & Vector Search
    "cocoindex>=0.3.9",
    "sentence-transformers>=3.0.0",
    "lancedb>=0.15.0",

    # Code analysis (for the consolidated códeolas library)
    "tree-sitter>=0.21.0",
    "tree-sitter-languages>=1.10.0; python_version < '3.13'",
    "tiktoken>=0.5.0",

    # Geospatial
    "geopandas>=1.0.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.1.0",
    "h3>=4.0.0",
    "shapely>=2.0.0",

    # Knowledge Graphs
    "cognee>=0.1.0",
    "neo4j>=5.0.0",
    "graphiti-core>=0.3.0",
    "falkordb>=1.0.0",

    # AI/ML - Celtic Language Support
    "google-adk>=0.1.0",
    "google-genai>=1.0.0",
    "baml-py>=0.74.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",

    # Interactive Analysis
    "marimo>=0.17.2",
    "ibis-framework[duckdb]>=11.0.0",

    # Observability
    "langfuse>=3.11.2",
    "ddtrace>=4.1.1",

    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sse-starlette>=2.0.0",

    # Authentication & Payments
    "siwe>=4.0.0",
    "eth-account>=0.11.0",
    "web3>=6.0.0",

    # MCP Server
    "mcp>=1.0.0",

    # Utilities
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
ui = [
    # UI dependencies managed via package.json in ui/
]
game = [
    # Game client dependencies managed via package.json in game/client/
]

[project.scripts]
tuath-dagster = "dagster:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ============================================================================
# UV Workspace — this package is a member of the root cianfhoghlaim workspace.
# ============================================================================
[tool.uv]
package = true

[tool.uv.sources]
codeolas = { workspace = true }
sruth-browser = { workspace = true }
oideachais = { workspace = true }
tuath = { workspace = true }
crypteolas = { workspace = true }
crypteolas-demo = { workspace = true }

[tool.hatch.build.targets.wheel]
# Round 11 Phase 11 (tuatha Phase 3): declare the project root (`.`)
# so hatch auto-detects sub-packages that have an `__init__.py`.
# Previously this was an explicit sub-packages list (12 entries).
# The fix mirrors the croilar packaging fix from commit
# `e9e0fc7d2` ("fix(croilar): close issue #17 — packaging fix
# for the dagster code-location"). It makes `tuath` itself a
# real Python package (importable as `from tuath.X import Y`),
# unblocking `sruth/tuatha/tests/conftest.py:8: from tuath.api.main import app`.
# Note: codeolas, crypteolas, and crypteolas_demo are loaded as separate
# workspace members and are NOT included in the tuath wheel.
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
