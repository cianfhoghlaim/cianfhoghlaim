# browser — the per-domain browser Dagster Component defs.
#
# Implements Phase A.1 of the per-domain browser + Crawl4AI refactor
# (see openspec/changes/2026-06-29-browser-stack-crawl4ai-refactor).
# Uses the upstream `DltLoadCollectionComponent` to wire 3 browser
# DLT sources (search + bulk_crawl + bulk_scrape) into a single
# `browser` group.
#
# Per openspec/specs/agentic-frontend-frameworks/spec.md
# (browser capability) and openspec/specs/infrastructure-stacks/spec.md
# (stack inventory + 3 entry points: browser-tools + 2 Firecrawl).
---
type: dagster_dlt.DltLoadCollectionComponent
attributes:
  loads:
    - source: .loads.browser_search_source
      pipeline: .loads.browser_pipeline
      translation:
        group_name: browser
        metadata:
          domain: browser
          stage: "1_search"
          backends: "crawl4ai,firecrawl,playwright_cdp"
          pipeline_version: "v4_2026-06-29"
    - source: .loads.browser_bulk_crawl_source
      pipeline: .loads.browser_pipeline
      translation:
        group_name: browser
        metadata:
          domain: browser
          stage: "2_bulk_crawl"
          backends: "crawl4ai"
          pipeline_version: "v4_2026-06-29"
    - source: .loads.browser_bulk_scrape_source
      pipeline: .loads.browser_pipeline
      translation:
        group_name: browser
        metadata:
          domain: browser
          stage: "3_bulk_scrape"
          backends: "firecrawl,crawl4ai"
          pipeline_version: "v4_2026-06-29"
