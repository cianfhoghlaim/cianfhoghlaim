# Crypteolas AgentOS Configuration
# =================================
# DeFi protocol analysis agents with x402 payment support

service:
  name: crypteolas
  port: 7771
  description: "DeFi Protocol Analysis AgentOS"

# Quick prompts for common queries
quick_prompts:
  - title: "Uniswap V3 Overview"
    prompt: "Explain how Uniswap V3 concentrated liquidity works"
  - title: "Compare DEXes"
    prompt: "Compare Uniswap and Curve in terms of architecture and use cases"
  - title: "Aave Security"
    prompt: "What are the key security features of Aave V3?"
  - title: "Bridge Risks"
    prompt: "What are the risks of cross-chain bridges like Across and Stargate?"

# Agent definitions (for reference)
agents:
  - name: documentation-agent
    description: "Protocol documentation search"
    model: gpt-4o
    free: true

  - name: code-analysis-agent
    description: "Smart contract analysis"
    model: claude-sonnet-4
    price_usd: 0.02
    free_tier: 3

  - name: graph-agent
    description: "Knowledge graph queries"
    model: gpt-4o
    price_usd: 0.005
    free_tier: 20

  - name: analytics-agent
    description: "DeFi metrics and analytics"
    model: gpt-4o
    price_usd: 0.01
    free_tier: 5

teams:
  - name: protocol-team
    description: "Full protocol analysis team"
    price_usd: 0.05
    free_tier: 2

# x402 Payment configuration
x402:
  enabled: true
  network: base
  asset: USDC
  # pay_to_address set via X402_PAY_TO_ADDRESS env var

# Session storage
storage:
  type: sqlite
  path: ./storage/sessions

# Observability
observability:
  langfuse:
    enabled: true
    # Keys set via LANGFUSE_* env vars
  debug: false
