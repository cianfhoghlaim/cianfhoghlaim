# Dagster dg project configuration
#
# Per the 2026-08-24 master refactor (Wave 0 + Wave 2 follow-up): the prior
# workspace shape pointed at a single project at "." and the pyproject.toml
# carried the [tool.dg] block as the project config. The dg 1.13.x discovery
# rule "presence of dg.toml causes pyproject.toml to be ignored for dg config"
# meant the [tool.dg] block in pyproject.toml was never actually read — the
# only file DG consulted was this one. We have therefore flattened the shape
# to a project-mode dg.toml; the per-pipeline Components from
# orchestration.components.* land in Wave 2 of the master refactor plan.
#
# Module path: orchestration.definitions (the canonical code location, per
# the 2026-07-14 foundation refactor — supersedes assets.definitions and
# the blocked cianfhoghlaim.assets/cianfhoghlaim.dagster aliases).

directory_type = "project"

[project]
root_module = "cianfhoghlaim"
code_location_target_module = "orchestration.definitions"
