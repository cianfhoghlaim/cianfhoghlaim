# Dagster dg workspace configuration
# Single consolidated code-location — see
# openspec/changes/2026-06-28-consolidate-sruth-into-cianfhoghlaim-v4
# All 5 former code-locations (oideachais, meaisinfhoghlaim, tuatha, croilar,
# crypteolas + browser) are now assets in cianfhoghlaim/assets/ and registered
# via cianfhoghlaim/assets/definitions.py.

directory_type = "workspace"

[workspace]

# Single consolidated code-location: the entire cianfhoghlaim package.
# Module: cianfhoghlaim.assets.definitions exposes:
#   - Ireland education assets (Plan 1 active)
#   - UK nation education + domain assets (Plan 2/3 stubs)
#   - Legacy Crown Dependencies assets (Jersey, Guernsey)
#   - leabharlann assets (6 subdirs: aigne, gaeilge, gemini_deep_research,
#     mata, ollscoil_na_gaillimhe, zotero)
#   - 4 asset gen pipelines (official_documents, subject_assets,
#     language_assets, exporters)
#   - OCR evaluation harness asset (11 vision × 4 classical × ~220 evals)
#   - 12-agent fleet asset (root, curriculum, translation, corpus, research,
#     education_research, bunchloch_research, geospatial, statistics,
#     curriculum_comparison, agui_curriculum, mcp_curriculum)
[[workspace.locations]]
path = "cianfhoghlaim"
code_location_name = "cianfhoghlaim"
module_name = "cianfhoghlaim.assets.definitions"