# Dagster dg workspace configuration
# Single consolidated code-location — see
# openspec/changes/2026-06-28-consolidate-sruth-into-cianfhoghlaim-v4
# All 5 former code-locations (oideachais, meaisinfhoghlaim, tuatha, croilar,
# crypteolas + browser) are now assets in assets/ and registered
# via assets/definitions.py. Post-v7 (2026-07-17), the package is the
# repo itself, so the location is at the repo root.

directory_type = "workspace"

[workspace]

# Single consolidated code-location: the entire cianfhoghlaim package.
# Per the 2026-07-14 foundation refactor
# (openspec/changes/2026-07-14-fix-foundation-v7-flattening-and-baml-drift-v1),
# the canonical module path is `orchestration.definitions` (the file
# `orchestration/definitions.py` at repo root). The historical paths
# `assets.definitions` (which never existed on disk) and
# `cianchoghlaim.assets.definitions` and `cianchoghlaim.dagster.definitions`
# (both blocked by the missing cianfhoghlaim/ Python package) are superseded.
[[workspace.locations]]
path = "."
code_location_name = "cianchoghlaim"
module_name = "orchestration.definitions"
