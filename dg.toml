# Dagster dg workspace configuration
# Single consolidated code-location — see
# openspec/changes/2026-06-28-consolidate-sruth-into-cianfhoghlaim-v4
# All 5 former code-locations (oideachais, meaisinfhoghlaim, tuatha, croilar,
# crypteolas + browser) are now assets in cianfhoghlaim/assets/ and registered
# via cianfhoghlaim/assets/definitions.py.

directory_type = "workspace"

[workspace]

# Single consolidated code-location: the entire cianfhoghlaim package.
# Module: cianfhoghlaim.dagster.definitions exposes (post-Phase-1 fix 2026-06-30):
#   - 199 assets across Ireland education (5 cycles × EN/GA), leabharlann,
#     OCR/HTR, geospatial, model conversion, ML training, mythology
#   - 31 jobs, 6 schedules, 16 sensors, 22 asset checks
#   - 12-agent fleet (root, curriculum, translation, corpus, research, …)
#   - DLT source wrappers, dbt-duckdb project, CocoIndex v1 Apps
# Note: prior versions referenced `cianfhoghlaim.assets.definitions` which
# never existed on disk — that path was a v4-consolidation wiring bug.
# See openspec/changes/2026-06-30-consolidate-cianfhoghlaim-pyproject-and-8-dirs/
# (Phase 1, T1.7).
[[workspace.locations]]
path = "cianfhoghlaim"
code_location_name = "cianfhoghlaim"
module_name = "cianfhoghlaim.dagster.definitions"